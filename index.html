<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pharmacology Study App · Chapters 1–33</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--ink:#1d1d1b;--mut:#6b6a65;--line:#e4e2db;--acc:#2f5d8a;--acc2:#e8eff7;--ok:#2e7d4f;--okb:#e5f3ea;--bad:#b3392f;--badb:#fbe9e7;--warn:#9a6b00;--warnb:#fdf4dc}
@media(prefers-color-scheme:dark){:root{--bg:#161615;--card:#21211f;--ink:#ecebe6;--mut:#a09f98;--line:#363532;--acc:#7fb0e0;--acc2:#1f2d3b;--ok:#6fcf97;--okb:#1d3326;--bad:#f08a80;--badb:#3a2220;--warn:#e8c062;--warnb:#3a3020}}
*{box-sizing:border-box}body{margin:0;font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top{max-width:1100px;margin:0 auto;padding:12px 16px 0;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
h1{font-size:18px;margin:0;flex:1}.prog{font-size:13px;color:var(--mut)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;width:160px}.bar i{display:block;height:100%;background:var(--ok);transition:width .3s}
nav{max-width:1100px;margin:0 auto;padding:8px 16px;display:flex;gap:6px;overflow-x:auto}
nav button{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 14px;border-radius:20px;cursor:pointer;font-size:14px;white-space:nowrap}
nav button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
main{max-width:1100px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.muted{color:var(--mut)}.sm{font-size:13px}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:9px 16px;border-radius:8px;cursor:pointer;font-size:14px}
.btn.p{background:var(--acc);border-color:var(--acc);color:#fff}.btn.g{background:var(--ok);border-color:var(--ok);color:#fff}.btn.r{background:var(--bad);border-color:var(--bad);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:16px;padding:5px 11px;font-size:13px;cursor:pointer}
.chip.on{background:var(--acc2);border-color:var(--acc);color:var(--acc);font-weight:600}.chip.done::after{content:" ✓";color:var(--ok)}
/* plan */
.blk{display:grid;grid-template-columns:120px 1fr;gap:12px;align-items:start;padding:10px 0;border-bottom:1px dashed var(--line)}
.blk:last-child{border:0}.blk .tm{font-weight:600;font-variant-numeric:tabular-nums}.blk.brk .tm,.blk.brk .tt{color:var(--mut)}
.chrow{display:flex;align-items:center;gap:8px;margin:4px 0}.chrow input{width:18px;height:18px}
.chrow a{color:var(--acc);cursor:pointer;text-decoration:underline}
/* learn */
.layout{display:grid;grid-template-columns:230px 1fr;gap:16px}
@media(max-width:760px){.layout{grid-template-columns:1fr}.side{display:flex;overflow-x:auto;gap:6px}.side button{white-space:nowrap}}
.side button{display:block;width:100%;text-align:left;border:0;background:none;color:var(--ink);padding:7px 10px;border-radius:8px;cursor:pointer;font-size:14px}
.side button.on{background:var(--acc2);color:var(--acc);font-weight:600}.side button .d{color:var(--ok)}
.big{background:var(--acc2);border-left:4px solid var(--acc);padding:12px 14px;border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:13.5px}th,td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}
th{background:var(--bg);position:sticky;top:0;font-weight:600}td:first-child{font-weight:600;min-width:130px}td:nth-child(2){min-width:340px;line-height:1.6}
.tw{overflow-x:auto;max-height:none}
.traps{background:var(--warnb);border-radius:8px;padding:10px 14px}.traps li{margin:4px 0}
.mem{background:var(--okb);border-radius:8px;padding:10px 14px}.mem li{margin:4px 0}
h2{margin:0 0 6px;font-size:20px}h3{margin:16px 0 8px;font-size:15px}
.kc{border-bottom:2px dotted var(--acc);cursor:help;background:color-mix(in srgb,var(--acc2) 70%,transparent);border-radius:3px;padding:0 1px}
.kcg{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}.kcc{border:1px solid var(--line);border-left:4px solid var(--warn);border-radius:8px;padding:10px 12px;font-size:13.5px;background:var(--card)}
.kct{font-weight:700;margin-bottom:4px}.kcx{margin-top:6px;font-size:12.5px;color:var(--mut)}
#kcpop{position:fixed;z-index:50;display:none;background:var(--card);border:1px solid var(--line);box-shadow:0 6px 24px rgba(0,0,0,.18);border-radius:10px;padding:10px 12px;font-size:13.5px;max-width:340px}
.akn{color:#2f6fd6;font-weight:700}.akl{color:#c0392b;font-weight:700}.akr{color:#2e8b57;font-weight:700}
.akcard{max-width:760px;margin:0 auto 14px}.akfront{font-size:24px;font-weight:700;text-align:center;margin:22px 0 14px}
.akback{border-top:1px solid var(--line);padding-top:12px;font-size:16px;line-height:1.65}.akback p{margin:0 0 10px}.akback b{color:var(--acc)}
.akhook{background:var(--okb);border-radius:8px;padding:9px 12px;font-size:14px;margin-top:8px}
.akbtns{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}.akb{padding:10px 4px;color:#fff;border:0;font-weight:600}
.akb.r{background:#c0392b}.akb.h{background:#d68910}.akb.g{background:#2e8b57}.akb.e{background:#2f6fd6}
.an{margin-top:8px;padding:7px 9px;border-radius:7px;background:var(--acc2);border-left:3px solid var(--acc);font-size:12.5px}
.sh{font-weight:600;color:var(--acc);margin-bottom:6px}.dt{border-top:1px dashed var(--line);padding-top:6px}.m-short .dt,.m-det .sh{display:none}.m-det .dt{border:0;padding:0}
.hide-col td:nth-child(n+2){filter:blur(5px);cursor:pointer;transition:filter .2s}.hide-col td.rev{filter:none}
/* flashcards */
.fc{perspective:1200px;height:280px;cursor:pointer;margin:10px 0}
.fci{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.fc.flip .fci{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:14px;border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;font-size:18px;background:var(--card)}
.back{transform:rotateY(180deg);background:var(--acc2)}.face .lab{position:absolute;top:10px;left:14px;font-size:12px;color:var(--mut)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
/* quiz */
.opt{display:block;width:100%;text-align:left;margin:6px 0;padding:11px 14px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);cursor:pointer;font-size:15px}
.opt:hover{border-color:var(--acc)}.opt.ok{background:var(--okb);border-color:var(--ok)}.opt.no{background:var(--badb);border-color:var(--bad)}
.exp{margin-top:8px;padding:10px 12px;border-radius:8px;background:var(--bg)}
kbd{border:1px solid var(--line);border-radius:4px;padding:0 5px;font-size:12px;background:var(--bg)}
</style></head><body>

<footer style="max-width:1100px;margin:0 auto;padding:8px 16px 30px;font-size:12px;color:var(--mut)">Based on pharmacology study notes by Anđela V. (Katzung, <i>Basic &amp; Clinical Pharmacology</i>, 14th ed.). For study purposes only – not medical advice.</footer>
<script>
const CH=[{"id":1,"t":"Introduction (PK & PD basics)","p":4,"big":"<b>Pharmacodynamics</b> = what the drug does to the body (receptors, effects). <b>Pharmacokinetics</b> = what the body does to the drug (absorption, distribution, elimination).<br>Most drugs have MW 100–1000 (<100 not selective, >1000 poorly absorbed). To work, a drug must cross barriers – by <b>aqueous diffusion</b>, <b>lipid diffusion</b>, <b>special carriers</b> or <b>endocytosis</b>. pH decides how much of a weak acid/base is ionised (Henderson–Hasselbalch).","tbl":[["Drug–receptor bonds","Covalent (strong, irreversible) > electrostatic > hydrogen, van der Waals, hydrophobic (weak)","Phenoxybenzamine binds covalently → acts 48 h","Enantiomers differ in receptor affinity and metabolism","<b>①</b> Covalent bonds share electrons → practically irreversible<br><b>②</b> Electrostatic bonds attract cations to anions → moderate strength<br><b>③</b> Hydrogen bonds, van der Waals and hydrophobic forces are weak but very selective (need a precise fit)"],["Inert binding sites","Binding to non-regulatory molecules (e.g. albumin) with no effect","Regulates the FREE drug concentration in plasma","Only free drug acts and is eliminated","<b>①</b> Drug binds to albumin or other carriers that are not receptors<br><b>②</b> Bound drug can't leave the vessel or reach receptors<br><b>③</b> Acts as a reservoir: as free drug is removed, bound drug is released"],["Aqueous diffusion","Passive diffusion through water-filled pores (Fick's law)","Capillary pores allow small molecules out of blood","Brain and testis capillaries LACK pores","<b>①</b> Small water-soluble molecules pass through aqueous pores between endothelial cells<br><b>②</b> Driven by the concentration gradient (passive, Fick's law)<br><b>③</b> Polar/charged molecules are water-soluble (water dipoles form a shell around them)"],["Lipid diffusion","Passive diffusion through membranes (Fick's law) – needs the UNIONISED form","Most drugs cross membranes this way","Lipid solubility ∝ 1/charge","<b>①</b> The drug dissolves in the lipid bilayer and moves down its gradient<br><b>②</b> Only the uncharged (non-ionised) form dissolves in lipid<br><b>③</b> pH and pKa decide what fraction is uncharged"],["Special carriers","Transporters for endogenous substances; NOT Fick's law; saturable (capacity-limited)","Na⁺/K⁺-ATPase, NET, SERT, DAT, glucose, amino acids","Antidepressants work by INHIBITING amine transporters","<b>①</b> Drug resembles a natural substrate → carried by its transporter<br><b>②</b> Transport can be saturated → maximum rate<br><b>③</b> Transporters are also drug targets (e.g. SSRIs block SERT)"],["Endocytosis / pinocytosis","Membrane invaginates around the bound molecule → vesicle","Large/lipophobic molecules: proteins, vitamin B12","Highly selective; exocytosis is the reverse","<b>①</b> Molecule binds a specialised membrane region<br><b>②</b> Membrane folds inward → intracellular vesicle<br><b>③</b> Vesicle ruptures → substance released into cytoplasm"],["Fick's law","Flux = (C1 – C2) × Area × Permeability / Thickness","Small intestine (large area) > stomach; lungs (thin) > skin (thick)","Concentration gradient = main driver","<b>①</b> Bigger gradient → faster flux<br><b>②</b> Bigger surface area → faster flux<br><b>③</b> Higher permeability coefficient (lipid solubility) → faster<br><b>④</b> Thicker barrier → slower"],["Henderson–Hasselbalch","log (protonated / unprotonated) = pKa – pH","Ion trapping: alkalinise urine for aspirin; acidify for methamphetamine","Weak BASE protonated = charged; weak ACID protonated = uncharged","<b>①</b> Weak acid (RCOOH) is uncharged when protonated → lipid-soluble → reabsorbed<br><b>②</b> In ALKALINE urine it loses H⁺ → RCOO⁻ (charged) → trapped in tubule → excreted (bicarbonate for aspirin overdose)<br><b>③</b> Weak base (RNH₃⁺) is charged when protonated → ACIDIFY urine (NH₄Cl) to trap and excrete methamphetamine"],["First-order elimination","Rate ∝ concentration → constant half-life; exponential fall","Most drugs","Concentration falls 50% each t½","<b>①</b> More drug present → more eliminated per hour<br><b>②</b> So a constant FRACTION is removed per unit time<br><b>③</b> Plasma level falls exponentially; t½ is constant regardless of dose"],["Zero-order elimination","Constant AMOUNT per time; elimination saturated; linear fall","Ethanol, phenytoin, aspirin at toxic doses","No constant t½ – small dose increase → big level rise","<b>①</b> Elimination enzymes are saturated at clinical concentrations<br><b>②</b> A fixed amount is removed per hour, no matter how high the level<br><b>③</b> Plasma concentration falls in a straight line"]],"traps":["Elimination ≠ excretion: a drug can be eliminated (metabolised) long before its metabolites are excreted.","Prodrugs (levodopa, minoxidil) need metabolism to work; lithium isn't metabolised at all.","Irreversible binders (phenoxybenzamine) leave the blood in <1 h but act for 48 h.","Well-perfused organs (brain, heart, kidney) fill first; fat and bone slowly. Blood flow affects RATE, not amount at equilibrium.","Warfarin binds albumin (stays in plasma); chloroquine binds tissues (low plasma level, huge Vd)."],"mem":["\"Weak acids – keep them <b>Alkaline</b> to excrete; weak <b>B</b>ases – keep them acidic\" → acids <b>A</b>way in <b>A</b>lkaline urine.","PK = <b>K</b>inetics = what the body <b>K</b>icks the drug around with; PD = <b>D</b>ynamics = what the <b>D</b>rug does."],"cards":[["Define pharmacokinetics vs pharmacodynamics.","PK = effect of the body on the drug (absorption, distribution, elimination). PD = effect of the drug on the body (mechanism, therapeutic & toxic effects)."],["Why do most drugs have MW 100–1000?","<100 → not selective enough; >1000 → poorly absorbed and poorly distributed."],["List the 4 ways drugs cross barriers.","Aqueous diffusion, lipid diffusion (both Fick's law), special carriers (saturable), endocytosis/pinocytosis."],["Write Fick's law.","Flux = (C1 – C2) × Area × Permeability coefficient / Thickness."],["Write the Henderson–Hasselbalch equation.","log (protonated / unprotonated) = pKa – pH."],["How do you speed excretion of an aspirin overdose?","Alkalinise the urine (bicarbonate) → aspirin ionised → trapped in tubule."],["How do you speed excretion of methamphetamine?","Acidify the urine (ammonium chloride) → weak base protonated/charged → trapped."],["Define bioavailability.","Amount of drug absorbed into the systemic circulation ÷ amount given (IV = 100%)."],["Which routes avoid first-pass metabolism?","IV, IM, SC, sublingual/buccal, inhalation, transdermal; rectal largely (upper rectum partly portal)."],["Why can't heparin be given IM?","It causes bleeding (haematoma) into the muscle; give SC or IV."],["First-order vs zero-order elimination?","First-order: rate ∝ concentration, constant t½, exponential fall. Zero-order: constant amount/time, linear fall (ethanol, phenytoin, toxic aspirin)."],["Why does phenoxybenzamine act 48 h despite short t½?","Binds the α-receptor covalently (irreversibly)."]],"quiz":[["A weak acid overdose is best excreted by:",["Acidifying urine","Alkalinising urine","Giving more fluid only","Haemodialysis only"],1,"Alkaline urine ionises the acid → trapped in tubule."],["According to Fick's law, absorption is fastest across:",["Thick skin","Stomach","Small intestine","Bone"],2,"Largest surface area."],["Zero-order elimination is typical of:",["Most drugs","Ethanol","Penicillin","Lithium"],1,"Also phenytoin and toxic aspirin."],["Carrier-mediated transport differs from diffusion because it is:",["Described by Fick's law","Saturable","Only for gases","Unselective"],1,"Capacity-limited."],["Brain capillaries lack:",["Endothelium","Aqueous pores","Blood flow","Albumin"],1,"So polar drugs reach the brain poorly."]],"kc":[{"t":"Bioavailability","a":["bioavailability"],"d":"Fraction (F) of an administered dose that reaches the systemic circulation unchanged. IV = 100%.","x":"Low oral F usually means poor absorption or a big first-pass effect."},{"t":"First-pass elimination","a":["first-pass","first pass"],"d":"Metabolism of an oral drug in the gut wall, portal blood and liver BEFORE it reaches the systemic circulation.","x":"Avoided by IV, IM, SC, sublingual, inhalation, transdermal and (mostly) rectal routes."},{"t":"Ion trapping","a":["ion trapping","trapped"],"d":"A weak acid/base becomes charged in a compartment with the 'wrong' pH, can't diffuse back across the membrane and accumulates there.","x":"Alkalinise urine for aspirin (weak acid); acidify urine for methamphetamine (weak base)."},{"t":"pKa","a":["pKa"],"d":"The pH at which 50% of a weak acid or base is ionised.","x":"If pH < pKa, weak bases are mostly ionised; if pH > pKa, weak acids are mostly ionised."},{"t":"Prodrug","a":["prodrug","Prodrugs"],"d":"Inactive drug that must be metabolised to become active (e.g. levodopa, minoxidil, codeine).","x":""}]},{"id":2,"t":"Pharmacodynamics","p":9,"big":"Drugs act on <b>receptors</b> → <b>effectors</b> (e.g. adenylyl cyclase) translate this into a cell response. Concentration–effect curves give <b>efficacy (Emax)</b> and <b>potency (EC50)</b>; binding curves give <b>affinity (Kd)</b>. Antagonists come in several flavours: competitive, irreversible, noncompetitive, physiological, chemical.","tbl":[["Efficacy (Emax)","Maximal effect a drug can produce","Partial agonists have lower Emax than full agonists","Efficacy ≠ potency","<b>①</b> Raise the dose until the response stops increasing<br><b>②</b> That plateau = Emax<br><b>③</b> Depends on the drug, receptor AND tissue system"],["Potency (EC50 / ED50)","Dose needed for 50% of max effect – smaller EC50 = more potent","Graded curve → EC50; quantal curve → ED50, TD50, LD50","Determined by affinity + receptor number","<b>①</b> Plot effect vs log dose → sigmoid curve<br><b>②</b> Find the concentration giving half the maximum<br><b>③</b> Curve further LEFT = more potent"],["Affinity (Kd)","Concentration that occupies 50% of receptors – smaller Kd = higher affinity","Binding curves; Bmax = total receptors","","<b>①</b> Plot % receptors bound vs log concentration<br><b>②</b> Kd = concentration at 50% occupancy<br><b>③</b> Bmax gives total receptor number"],["Spare receptors","Emax reached before all receptors are occupied → EC50 < Kd","Increase sensitivity to agonist","Irreversible antagonist shifts curve right only if spare receptors exist","<b>①</b> Effector activation outlasts the drug–receptor interaction, OR<br><b>②</b> There are more receptors than effector molecules<br><b>③</b> So only a fraction of receptors needs to be occupied for full effect"],["Full / partial / inverse agonist","Full: drives all receptors to active state. Partial: lower max (binds both states). Inverse: prefers inactive state → ↓ constitutive activity","Partial agonist acts as ANTAGONIST in presence of full agonist","Neutral antagonist binds Ra and Ri equally","<b>①</b> Receptors exist in active (Ra) and inactive (Ri) states in equilibrium<br><b>②</b> Full agonist binds Ra strongly → shifts all to active<br><b>③</b> Partial agonist binds both, favouring Ra → submaximal<br><b>④</b> Inverse agonist binds Ri → suppresses spontaneous (constitutive) activity"],["Competitive antagonist","Reversible, same site → curve shifts RIGHT, Emax unchanged","Overcome by more agonist","↑ ED50","<b>①</b> Binds the agonist site without activating it<br><b>②</b> Agonist and antagonist compete → enough agonist displaces it<br><b>③</b> Higher dose needed (right shift) but same maximum"],["Irreversible antagonist","Covalent → Emax REDUCED; no right shift unless spare receptors","Phenoxybenzamine","Can't be overcome by agonist","<b>①</b> Binds permanently, removing receptors from the pool<br><b>②</b> Fewer receptors → maximum response falls<br><b>③</b> Recovery needs new receptor synthesis"],["Noncompetitive (allosteric) antagonist","Binds a different (allosteric) site","Reversible or irreversible","","<b>①</b> Binds away from the agonist site<br><b>②</b> Changes receptor shape so agonist can't activate it<br><b>③</b> More agonist doesn't help"],["Physiological antagonist","Different receptor, opposite effect","Adrenaline (β2) vs histamine bronchoconstriction; glucagon for propranolol overdose","","<b>①</b> Acts on its OWN receptor<br><b>②</b> Produces the opposite physiological effect<br><b>③</b> Cancels the first drug's effect without touching its receptor"],["Chemical antagonist","Binds the drug itself, removing it","Dimercaprol (lead/metals), pralidoxime (organophosphate)","Doesn't involve receptors","<b>①</b> Reacts directly with the drug or toxin<br><b>②</b> Drug is neutralised before it can bind its receptor"],["Therapeutic index / window","TI = TD50 / ED50. Window = min effective → min toxic dose","Window is clinically more useful","TI can't ethically be measured in humans","<b>①</b> High TI = big gap between toxic and effective dose = safer<br><b>②</b> The window gives the practical dosing range for patients"],["5 transmembrane signalling mechanisms","Intracellular receptor · receptor-enzyme · receptor + separate tyrosine kinase (JAK-STAT) · ion channel · G protein","Steroids/NO · insulin · cytokines · nicotinic ACh/GABA_A · sympathomimetics","","<b>①</b> Lipid-soluble drugs (steroids, NO) cross the membrane → intracellular receptor<br><b>②</b> Insulin activates a receptor that is itself a tyrosine kinase<br><b>③</b> Cytokines → receptor activates JAK → phosphorylates STAT → nucleus<br><b>④</b> ACh opens nicotinic channel; BZDs modify GABA_A channel<br><b>⑤</b> Receptor → G protein → effector (e.g. adenylyl cyclase → cAMP)"]],"traps":["Quantal ED50 is NOT the same as graded EC50; quantal curves can't give Emax but show population variability (steep = little variation).","Tachyphylaxis mechanisms: β-arrestin blocks Gs coupling; receptor internalisation (recycled – opioid; degraded – β, EGF); substrate depletion (thiols → nitroglycerin tolerance).","Some receptors are also effectors: insulin receptor tyrosine kinase, nicotinic receptor channel."],"mem":["<b>P</b>otency = <b>P</b>osition (left/right); <b>E</b>fficacy = <b>E</b>levation (height).","<b>C</b>ompetitive = <b>C</b>an be overcome (right shift); <b>I</b>rreversible = <b>I</b>nsurmountable (↓ max)."],"cards":[["Define receptor and effector.","Receptor: specific molecule the drug binds to start its effect. Effector: translates binding into cell activity (e.g. adenylyl cyclase)."],["Efficacy vs potency?","Efficacy = maximal effect (Emax). Potency = dose for a given effect (EC50); smaller EC50 = more potent."],["What does Kd measure?","Affinity – concentration occupying 50% of receptors; smaller Kd = higher affinity."],["What are spare receptors and how are they shown?","Emax reached before all receptors are occupied; EC50 < Kd."],["Partial agonist in the presence of a full agonist?","Acts as an antagonist (lower intrinsic efficacy competes for receptors)."],["What is an inverse agonist?","Higher affinity for the inactive state → reduces constitutive receptor activity."],["Effect of a competitive antagonist on the curve?","Shifts right (↑ EC50), Emax unchanged; surmountable."],["Effect of an irreversible antagonist?","↓ Emax; right shift only if spare receptors exist; not surmountable."],["Example of physiological antagonism?","Adrenaline (β2) reversing histamine bronchoconstriction; glucagon reversing propranolol overdose."],["Examples of chemical antagonists?","Dimercaprol (chelates lead), pralidoxime (binds organophosphate phosphorus)."],["Therapeutic index vs therapeutic window?","TI = TD50/ED50 (animal data). Window = min effective to min toxic dose (clinical)."],["Three mechanisms of tachyphylaxis?","β-arrestin blocking G-protein coupling; receptor internalisation; depletion of a substrate (thiols → nitrate tolerance)."],["How does the JAK-STAT pathway work?","Cytokine binds receptor → JAK kinase activated → phosphorylates STAT → STAT goes to nucleus → transcription."]],"quiz":[["Drug A has EC50 1 nM, drug B 100 nM, same Emax. Drug A is:",["More efficacious","More potent","Less potent","A partial agonist"],1,"Lower EC50 = higher potency."],["Agonist curve shifts right with the same maximum. The antagonist is:",["Irreversible","Competitive","Physiological","Chemical"],1,"Surmountable."],["Glucagon treating propranolol overdose is an example of:",["Chemical antagonism","Physiological antagonism","Competitive antagonism","Inverse agonism"],1,"Different receptor, opposite effect."],["EC50 < Kd indicates:",["Partial agonism","Spare receptors","Irreversible binding","Tachyphylaxis"],1,"Full effect with partial occupancy."],["Insulin acts via:",["G protein","Intracellular receptor","Receptor tyrosine kinase","Ion channel"],2,"Receptor is itself an enzyme."]],"kc":[{"t":"Efficacy","a":["efficacy","Emax"],"d":"The maximal effect a drug can produce, however high the dose.","x":"Height of the dose–response curve. Partial agonists have lower efficacy."},{"t":"Potency","a":["potency","EC50","ED50"],"d":"Amount of drug needed for a given effect – usually the EC50 (50% of max). Lower EC50 = more potent.","x":"Position of the curve on the x-axis; potency says nothing about maximal effect."},{"t":"Affinity (Kd)","a":["affinity","Kd"],"d":"How strongly a drug binds its receptor; Kd = concentration occupying 50% of receptors. Lower Kd = higher affinity.","x":""},{"t":"Spare receptors","a":["spare receptors"],"d":"Maximal effect is reached when only part of the receptors are occupied (EC50 < Kd).","x":"Explains why irreversible antagonists may shift the curve right before they lower the maximum."},{"t":"Constitutive activity","a":["constitutive activity"],"d":"Activity a receptor shows with no ligand bound, because some receptors sit in the active state.","x":"Inverse agonists suppress it; neutral antagonists don't change it."},{"t":"Tachyphylaxis","a":["tachyphylaxis"],"d":"Rapid loss of response with repeated or continuous exposure (minutes–hours).","x":"Mechanisms: β-arrestin uncoupling, receptor internalisation, substrate depletion (nitrates)."},{"t":"Therapeutic index","a":["therapeutic index","TD50"],"d":"TD50 / ED50 from quantal dose–response curves; a rough measure of safety.","x":"The therapeutic window (min effective → min toxic dose) is more useful clinically."}]},{"id":3,"t":"Pharmacokinetics","p":13,"big":"Two primary parameters describe any drug: <b>Vd</b> (how widely it spreads) and <b>CL</b> (how fast it's removed). From them: <b>t½ = 0.693 × Vd / CL</b>. <b>Loading dose</b> fills the Vd; <b>maintenance dose</b> replaces what CL removes.","tbl":[["Volume of distribution (Vd)","Vd = amount in body / plasma concentration","Plasma-only drug ≈ 4% of body weight; tissue-bound drug can exceed body volume","'Apparent' – not a real volume","<b>①</b> Measure how much drug is in the body and its plasma level<br><b>②</b> If drug stays in plasma → small Vd<br><b>③</b> If it binds tissues strongly → plasma level low → huge Vd (can exceed body volume)"],["Clearance (CL)","CL = rate of elimination / plasma concentration","Constant for first-order drugs; organ CL = extraction ratio × blood flow","Not constant for zero-order drugs","<b>①</b> Volume of plasma cleared of drug per unit time<br><b>②</b> For high-extraction drugs CL is flow-limited → changes in blood flow matter more than organ disease<br><b>③</b> Determines the MAINTENANCE dose"],["Half-life (t½)","t½ = 0.693 × Vd / CL","3–4 t½ to reach ~90% steady state (and to wash out)","If Vd and CL fall together (lidocaine in HF) t½ unchanged","<b>①</b> Derived from Vd and CL<br><b>②</b> ↑ Vd or ↓ CL → longer t½<br><b>③</b> Sets how fast levels rise during infusion and fall after stopping"],["Bioavailability (F)","Fraction of dose reaching systemic circulation (IV = 100%)","Measured as AUC (area under concentration–time curve)","High hepatic extraction → low oral F","<b>①</b> Oral drug must be absorbed and survive gut wall + liver (first pass)<br><b>②</b> F = AUC oral / AUC IV"],["Extraction ratio","Fraction removed by an organ in one pass","High hepatic extraction → extensive first-pass","","<b>①</b> Blood carrying drug passes the liver<br><b>②</b> A fraction is removed each pass<br><b>③</b> High fraction → oral bioavailability low"],["Maintenance dose","Dosing rate = CL × target Cp / F","Keeps steady state (input = output)","Vd NOT in the formula","<b>①</b> At steady state dosing rate = elimination rate<br><b>②</b> Elimination rate = CL × Cp<br><b>③</b> Correct for bioavailability (÷ F)"],["Loading dose","Loading dose = Vd × target Cp / F","Reach target level quickly (large Vd)","CL NOT in the formula; give slowly if huge","<b>①</b> Fill the whole volume of distribution at once<br><b>②</b> Amount needed = Vd × desired concentration<br><b>③</b> ÷ F for non-IV routes"],["Therapeutic window","Range between minimum effective and minimum toxic concentration","Theophylline 8–20 mg/L (8–15 in some patients)","Narrow window → smaller, more frequent doses","<b>①</b> Trough must stay above minimum effective level<br><b>②</b> Peak must stay below minimum toxic level<br><b>③</b> Dose interval chosen accordingly (e.g. every half-life)"]],"traps":["Disease and age change CL more than Vd.","Vd of protein-bound drugs changes in liver/kidney disease.","Steady state is reached after 3–4 half-lives regardless of dose."],"mem":["<b>L</b>oading ↔ <b>V</b>olume (\"Load the Van\"); <b>M</b>aintenance ↔ <b>C</b>learance (\"Maintain by Clearing\")."],"cards":[["Formula for Vd?","Vd = amount of drug in body / plasma concentration."],["Formula for clearance?","CL = rate of elimination / plasma concentration."],["Formula for half-life?","t½ = 0.693 × Vd / CL."],["How many half-lives to reach steady state?","3–4 half-lives (≈87–90%)."],["Maintenance dose formula?","Dosing rate = CL × target Cp / F (no Vd)."],["Loading dose formula?","Loading dose = Vd × target Cp / F (no CL)."],["What does a Vd much larger than body volume mean?","Drug is strongly bound to tissues → low plasma concentration."],["What is flow-limited clearance?","For highly extracted drugs, clearance depends on organ blood flow more than organ function."],["What is bioavailability and how is it measured?","Fraction reaching systemic circulation; from the AUC."],["Why might t½ stay the same in heart failure with lidocaine?","Both Vd and CL fall proportionally."],["Theophylline therapeutic window?","8–20 mg/L (may be 8–15 if toxic >15 in a given patient)."]],"quiz":[["Which parameter determines the loading dose?",["Clearance","Volume of distribution","Half-life","Extraction ratio"],1,"Loading dose = Vd × Cp / F."],["Which parameter determines the maintenance dose?",["Vd","Clearance","pKa","MW"],1,"Dosing rate = CL × Cp / F."],["Vd = 50 L, CL = 5 L/h. t½ ≈",["0.7 h","7 h","10 h","35 h"],1,"0.693 × 50 / 5 ≈ 6.9 h."],["Steady state is reached after about:",["1 half-life","3–4 half-lives","10 half-lives","Depends on dose"],1,"Independent of dose."],["A drug with high hepatic extraction ratio has:",["High oral bioavailability","Low oral bioavailability","No first pass","Zero-order kinetics"],1,"Extensive first-pass."]],"kc":[{"t":"Volume of distribution (Vd)","a":["volume of distribution","Vd"],"d":"Apparent volume needed to contain the total amount of drug at the plasma concentration: Vd = amount / Cp.","x":"Big Vd (tissue binding) → large loading dose; small Vd (plasma protein binding) → stays in blood."},{"t":"Clearance (CL)","a":["clearance","CL"],"d":"Volume of plasma cleared of drug per unit time: CL = rate of elimination / Cp.","x":"Determines the maintenance dose. Organ CL = blood flow × extraction ratio."},{"t":"Half-life (t½)","a":["half-life","t½"],"d":"Time for plasma concentration to fall by 50%: t½ = 0.693 × Vd / CL.","x":"Steady state (and wash-out) take 3–4 half-lives."},{"t":"Steady state","a":["steady state","steady-state"],"d":"Rate of drug input = rate of elimination, so average plasma levels stay constant.","x":"Reached after 3–4 half-lives regardless of dose."},{"t":"Loading dose","a":["loading dose"],"d":"A large initial dose that 'fills' the Vd to reach target concentration quickly: Vd × Cp / F.","x":""},{"t":"Extraction ratio","a":["extraction ratio"],"d":"Fraction of drug removed by an organ during one pass of blood.","x":"High hepatic extraction → flow-limited clearance and large first-pass effect."}]},{"id":4,"t":"Drug Metabolism","p":16,"big":"Metabolism turns lipid-soluble drugs into polar products that the kidney can't reabsorb. <b>Phase I</b> (oxidation by CYP450, reduction, deamination, hydrolysis) adds/unmasks groups; <b>Phase II</b> (conjugation: glucuronide, sulfate, acetyl, glutathione, glycine, methyl) makes them polar. Liver is main site. 75% of CYP-metabolised drugs go through <b>CYP3A4 or CYP2D6</b>.","tbl":[["Phase I","Oxidation (CYP450, smooth ER), reduction, deamination, hydrolysis","Most drugs","Not very selective; enantiomers may differ","<b>①</b> Introduce or unmask a functional group (–OH, –NH₂, –SH)<br><b>②</b> Mainly CYP450 mixed-function oxidases in liver smooth ER<br><b>③</b> Product may be inactive, active or toxic"],["Phase II","Conjugation with glucuronic acid, sulfate, acetate, glutathione, glycine, methyl","Makes products polar → excreted","Usually after phase I (sometimes first)","<b>①</b> Endogenous molecule is attached to a functional group<br><b>②</b> Conjugate is polar and less lipid-soluble<br><b>③</b> Not reabsorbed in tubules → excreted"],["Ester hydrolysis – succinylcholine","Plasma butyrylcholinesterase → normally ~5 min","1 in 2500 have atypical enzyme","Paralysis lasts HOURS","<b>①</b> Ester is rapidly split in plasma<br><b>②</b> Abnormal enzyme variant hydrolyses it very slowly<br><b>③</b> Single dose → prolonged apnoea","Atypical plasma cholinesterase → succinylcholine apnoea lasting hours: keep the patient sedated and ventilated until the block wears off.","Muscle relaxation"],["N-acetylation – isoniazid, hydralazine, procainamide","Phase II acetylation","Slow acetylators (~50% of whites, autosomal recessive)","Toxicity at normal doses (e.g. lupus)","<b>①</b> N-acetyltransferase inactivates these amines<br><b>②</b> Slow acetylators make less enzyme activity<br><b>③</b> Drug accumulates → toxic responses"],["Enzyme inducers","Carbamazepine, phenobarbital, rifampicin (+ smoking, ethanol)","↓ levels of other drugs","Takes DAYS to develop and to reverse","<b>①</b> Activate cytoplasmic receptors that switch on CYP genes<br><b>②</b> More CYP enzyme (and haem) synthesised<br><b>③</b> Drugs metabolised faster → lower levels"],["Enzyme inhibitors","Amiodarone, cimetidine, grapefruit juice, azole antifungals, ritonavir","↑ levels of other drugs → toxicity","Suicide inhibitors: ethinyl oestradiol, norethindrone, spironolactone, secobarbital, allopurinol","<b>①</b> Compete for or block CYP enzymes<br><b>②</b> Suicide inhibitors are converted to products that irreversibly destroy the enzyme<br><b>③</b> Propranolol also ↓ hepatic blood flow (pharmacodynamic)"],["Paracetamol toxicity","Overdose saturates phase II → CYP makes NAPQI → depletes glutathione → hepatocyte death","Antidote: ACETYLCYSTEINE (SH donor)","Ethanol (inducer) and liver disease ↑ risk","<b>①</b> Normal dose: glucuronide + sulfate conjugation → safe<br><b>②</b> Overdose: these saturate → more goes via CYP450 → NAPQI<br><b>③</b> NAPQI is detoxified by glutathione until glutathione runs out<br><b>④</b> Free NAPQI binds SH groups on liver proteins → necrosis; acetylcysteine replaces SH"]],"traps":["P-glycoprotein in gut/lung epithelium pumps drugs back out after absorption.","Sex matters for few drugs (first-pass metabolism of alcohol greater in men).","Metabolism ≠ inactivation – some metabolites are active or toxic."],"mem":["Inducers: \"<b>C</b>ar<b>b</b> <b>P</b>hen <b>R</b>ides\" – Carbamazepine, Phenobarbital, Rifampicin.","Inhibitors: \"<b>A</b><b>C</b>id <b>G</b>rape <b>A</b>zole <b>R</b>ap\" – Amiodarone, Cimetidine, Grapefruit, Azoles, Ritonavir."],"cards":[["Why are drugs metabolised?","To make lipid-soluble drugs polar so they aren't reabsorbed in the tubules and can be excreted (and to terminate action)."],["Phase I reactions?","Oxidation (CYP450), reduction, deamination, hydrolysis."],["Phase II reactions?","Conjugation with glucuronic acid, sulfate, acetate, glutathione, glycine, methyl groups."],["Which CYPs handle 75% of CYP-metabolised drugs?","CYP3A4 and CYP2D6."],["Atypical plasma cholinesterase consequence?","Succinylcholine paralysis lasts hours instead of ~5 min (1 in 2500 people)."],["What are slow acetylators?","People (≈50% of whites, autosomal recessive) who acetylate isoniazid, hydralazine, procainamide slowly → toxicity."],["Strong enzyme inducers?","Carbamazepine, phenobarbital, rifampicin (also smoking, ethanol)."],["Important enzyme inhibitors?","Amiodarone, cimetidine, grapefruit juice, azole antifungals, ritonavir."],["What are suicide inhibitors?","Drugs converted into products that irreversibly inhibit the enzyme (ethinyl oestradiol, spironolactone, allopurinol, secobarbital…)."],["Mechanism of paracetamol hepatotoxicity?","Phase II saturates → CYP forms NAPQI → glutathione depleted → NAPQI binds liver proteins → necrosis."],["Antidote for paracetamol overdose?","Acetylcysteine (sulfhydryl donor)."],["Why does ethanol increase paracetamol toxicity?","Induces phase I more than phase II → more NAPQI."]],"quiz":[["Antidote for paracetamol overdose:",["Naloxone","Acetylcysteine","Flumazenil","Deferoxamine"],1,"Replenishes SH groups/glutathione."],["Which is a strong enzyme inducer?",["Cimetidine","Rifampicin","Grapefruit juice","Ritonavir"],1,"Also carbamazepine, phenobarbital."],["Prolonged apnoea after succinylcholine suggests:",["Slow acetylation","Atypical plasma cholinesterase","CYP2D6 poor metaboliser","Enzyme induction"],1,"1 in 2500."],["Drug-induced lupus with hydralazine is more likely in:",["Fast acetylators","Slow acetylators","Smokers","Children"],1,"Slow N-acetylation."],["Phase II reactions mainly:",["Oxidise drugs","Conjugate drugs to make them polar","Occur in the lungs","Are highly selective"],1,"Conjugation."]],"kc":[{"t":"Phase I vs phase II","a":["Phase I","Phase II"],"d":"Phase I: oxidation (CYP450), reduction, hydrolysis – adds/unmasks a group. Phase II: conjugation (glucuronide, sulfate, acetyl, glutathione) – makes it polar.","x":"Phase II products are usually inactive and readily excreted."},{"t":"Enzyme induction","a":["induction","inducers","inducer"],"d":"↑ synthesis of CYP enzymes (takes days) → faster metabolism of other drugs → lower levels.","x":"Classic inducers: carbamazepine, phenobarbital, rifampicin (also smoking, ethanol)."},{"t":"Enzyme inhibition","a":["inhibitors","inhibition"],"d":"Block of CYP enzymes → slower metabolism → higher levels and toxicity of other drugs.","x":"Amiodarone, cimetidine, grapefruit juice, azoles, ritonavir."},{"t":"Suicide inhibitor","a":["suicide inhibitors","Suicide inhibitors"],"d":"A drug metabolised into a product that irreversibly destroys the metabolising enzyme.","x":""},{"t":"Slow acetylator","a":["slow acetylators","Slow acetylators"],"d":"Inherited low N-acetyltransferase activity (~50% of whites) → isoniazid, hydralazine, procainamide accumulate.","x":"Higher risk of drug-induced lupus and neuropathy."},{"t":"NAPQI","a":["NAPQI"],"d":"Reactive paracetamol metabolite made by CYP450; normally neutralised by glutathione.","x":"Overdose → glutathione depleted → liver necrosis; antidote acetylcysteine."}]},{"id":6,"t":"Introduction to Autonomic Pharmacology","p":19,"big":"ANS = parasympathetic (cranial III, VII, IX, X + sacral S2–S4; long pre-, short postganglionic) + sympathetic (T1–L5; short pre-, long postganglionic) + enteric nervous system.<br><b>ACh</b>: all ganglia, parasympathetic postganglionic, neuromuscular junction, sympathetic sweat glands. <b>NA</b>: most sympathetic postganglionic.","tbl":[["ACh synthesis","Acetyl-CoA + choline → ACh by choline acetyltransferase (ChAT)","Hemicholinium blocks choline uptake (rate-limiting step)","","<b>①</b> Choline is transported into the terminal (rate-limiting; blocked by hemicholinium)<br><b>②</b> ChAT joins it with mitochondrial acetyl-CoA<br><b>③</b> ACh is pumped into vesicles by VAT (blocked by vesamicol)"],["ACh release","Ca²⁺ entry → SNARE proteins (synaptobrevin, SNAP-25, syntaxin) → vesicle fusion","Botulinum toxin cleaves synaptobrevin → no release","Botox works locally (large, diffuses slowly)","<b>①</b> Action potential opens Ca²⁺ channels<br><b>②</b> v-SNAREs (synaptobrevin) on vesicle bind t-SNAREs (SNAP-25, syntaxin) on membrane<br><b>③</b> Vesicle fuses → ACh released into cleft"],["ACh termination","Acetylcholinesterase → acetate + choline","Target of cholinesterase inhibitors","","<b>①</b> AChE in the cleft hydrolyses ACh within milliseconds<br><b>②</b> Choline is recycled back into the terminal"],["NA synthesis & storage","Tyrosine → DOPA (tyrosine hydroxylase) → dopamine → NA; stored in vesicles","Metyrosine blocks tyrosine hydroxylase; reserpine blocks vesicular transporter","MAO in mitochondria destroys cytoplasmic NA","<b>①</b> Tyrosine hydroxylase (rate-limiting, metyrosine) makes DOPA<br><b>②</b> DOPA → dopamine → pumped into vesicle → converted to NA<br><b>③</b> Cytoplasmic amines are degraded by MAO (MAOIs ↑ stores)"],["NA termination","Mainly REUPTAKE (NET, DAT) + diffusion; then MAO and COMT","Urinary metanephrines & VMA → phaeochromocytoma","Cocaine/TCAs block NET","<b>①</b> NA is pumped back into the terminal by NET<br><b>②</b> Outside the cleft MAO and COMT metabolise it<br><b>③</b> Metabolites (metanephrines, VMA) are excreted in urine"],["Muscarinic receptors","G-protein coupled; effector cells (heart, smooth muscle, glands, endothelium)","Effects like parasympathetic stimulation","Endothelial muscarinic receptors are NOT innervated","<b>①</b> ACh binds a 7-transmembrane receptor<br><b>②</b> Activates G proteins (Gq or Gi) → second messengers<br><b>③</b> Slower, modulatory responses"],["Nicotinic receptors","Ligand-gated ion channels; NN (ganglia), NM (neuromuscular junction)","Fast transmission","","<b>①</b> ACh binds → channel opens directly<br><b>②</b> Na⁺ rushes in → fast depolarisation"],["Adrenoceptors","α (vessels, presynaptic, platelets, fat, brain); β (heart, smooth muscle, fat) – all β use Gs; D1 renal vessels, D2 presynaptic","","","<b>①</b> α1 → Gq; α2 → Gi; β1,2,3 → Gs<br><b>②</b> D1 → Gs (renal vasodilation); D2 → Gi"],["Presynaptic α2 autoreceptors","NA inhibits its own release (negative feedback)","Basis of clonidine, mirtazapine actions","Heteroreceptors respond to other transmitters","<b>①</b> Released NA binds α2 on the same terminal<br><b>②</b> Gi → less Ca²⁺ entry → less further NA release"],["Baroreceptor reflex","↓ BP → ↑ sympathetic outflow + renin → ↑ HR, contractility, resistance, salt retention","Explains reflex tachycardia with vasodilators","Can override drug effects","<b>①</b> Stretch receptors sense BP fall<br><b>②</b> Vasomotor centre ↑ sympathetic, ↓ vagal tone<br><b>③</b> Kidney releases renin → Ang II → aldosterone → volume ↑"],["Eye","Pupil: dilator (α, sympathetic) vs sphincter (M, parasympathetic); ciliary muscle (M) → accommodation; ciliary epithelium (β) → aqueous humour","Glaucoma & mydriatic drugs","","<b>①</b> α1 agonists contract dilator → mydriasis<br><b>②</b> Muscarinic agonists contract sphincter → miosis and ciliary muscle → accommodation<br><b>③</b> β-blockers ↓ aqueous production → ↓ IOP"]],"traps":["Dominant tone: pupil and SA node are parasympathetic-dominated → ganglion block causes mydriasis + tachycardia (intrinsic SA rate 100–110/min).","Exceptions: sympathetic fibres to sweat glands release ACh; dopamine dilates renal vessels.","Cotransmitters: ATP, enkephalins, VIP, NPY, substance P, neurotensin, somatostatin. NANC neurons use purines or peptides."],"mem":["Parasympathetic outflow: \"<b>3, 7, 9, 10</b> and <b>S2–4</b>\" (craniosacral). Sympathetic: thoracolumbar.","<b>H</b>emicholinium – <b>H</b>alts choline uptake; <b>V</b>esamicol – <b>V</b>esicle; <b>B</b>otulinum – <b>B</b>locks release."],"cards":[["Where do parasympathetic and sympathetic fibres leave the CNS?","Parasympathetic: cranial nerves III, VII, IX, X + S2–S4. Sympathetic: T1–L5."],["Rate-limiting step in ACh synthesis and its blocker?","Choline transport into the terminal – hemicholinium."],["What does vesamicol block?","Vesicle-associated transporter (VAT) that loads ACh into vesicles."],["How does botulinum toxin act?","Cleaves synaptobrevin (SNARE) → no ACh release."],["Main way NA's action ends?","Reuptake by NET (and diffusion); then MAO/COMT."],["Which drugs block tyrosine hydroxylase and vesicular NA storage?","Metyrosine and reserpine respectively."],["How is phaeochromocytoma diagnosed biochemically?","24-h urinary metanephrines and VMA."],["Exceptions where sympathetic fibres release ACh?","Thermoregulatory sweat glands, probably skeletal muscle vasodilator fibres."],["Muscarinic vs nicotinic receptor type?","Muscarinic = G-protein coupled; nicotinic = ligand-gated ion channel."],["What happens to pupil and heart rate after ganglion blockade?","Mydriasis and tachycardia (both are parasympathetic-dominant)."],["What is an autoreceptor?","Presynaptic receptor binding the terminal's own transmitter to regulate its release (α2 for NA)."],["Autonomic control of the eye?","Dilator α (sympathetic), sphincter M (parasympathetic), ciliary muscle M (accommodation), ciliary epithelium β (aqueous secretion)."]],"quiz":[["Ganglionic blockade produces:",["Miosis and bradycardia","Mydriasis and tachycardia","Miosis and tachycardia","No change"],1,"Removes dominant parasympathetic tone."],["The main mechanism terminating noradrenaline action is:",["Acetylcholinesterase","Reuptake via NET","COMT in the cleft","Renal excretion"],1,"Reuptake and diffusion."],["Botulinum toxin prevents:",["ACh synthesis","Vesicular storage","ACh release","ACh breakdown"],2,"Cleaves synaptobrevin."],["Sympathetic fibres to sweat glands release:",["NA","Adrenaline","ACh","Dopamine"],2,"Sympathetic cholinergic."],["β-receptors on the ciliary epithelium mediate:",["Miosis","Accommodation","Aqueous humour secretion","Mydriasis"],2,"Hence β-blockers in glaucoma."]],"kc":[{"t":"Autoreceptor","a":["autoreceptor","autoreceptors"],"d":"Presynaptic receptor activated by the terminal's OWN transmitter, usually inhibiting further release (α2 for noradrenaline).","x":""},{"t":"Heteroreceptor","a":["heteroreceptor","heteroreceptors"],"d":"Presynaptic receptor for a DIFFERENT transmitter (ACh, histamine, 5-HT, prostaglandins) that modulates release.","x":""},{"t":"Dominant tone","a":["dominant tone","Dominant tone"],"d":"The division of the ANS that normally controls an organ at rest (parasympathetic for pupil, SA node, gut; sympathetic for most vessels).","x":"Ganglion block removes the dominant tone → mydriasis, tachycardia, vasodilation."},{"t":"Baroreceptor reflex","a":["baroreceptor reflex","baroreflex"],"d":"Negative feedback: ↓ BP → ↑ sympathetic + ↓ vagal tone → ↑ HR, contractility, vascular tone (and renin).","x":"Causes reflex tachycardia with vasodilators and reflex bradycardia with α1 agonists."},{"t":"Cotransmitter","a":["cotransmitters","Cotransmitters"],"d":"Additional substance released with the main transmitter (ATP, NPY, VIP, enkephalins) to modulate transmission.","x":""},{"t":"NANC neurons","a":["NANC"],"d":"Non-adrenergic, non-cholinergic neurons releasing purines (ATP) or peptides (substance P).","x":""}]},{"id":7,"t":"Cholinomimetics & Cholinesterase Inhibitors","p":24,"big":"<b>Direct-acting</b>: bind cholinoceptors (choline esters: ACh, carbachol, bethanechol; alkaloids: muscarine, pilocarpine, nicotine, lobeline). <b>Indirect-acting</b>: inhibit acetylcholinesterase (carbamates – neostigmine; organophosphates – parathion; edrophonium).","tbl":[["Muscarinic agonists (bethanechol, carbachol, pilocarpine, muscarine)","M1/M3 → Gq → PLC → IP₃ + DAG → Ca²⁺ → contraction. M2 → Gi → ↓ cAMP; βγ opens cardiac K⁺ channels","Glaucoma (pilocarpine), Sjögren's, atonic bowel/bladder","Vasodilation via endothelial NO → REFLEX TACHYCARDIA","<b>①</b> Bind muscarinic receptors non-selectively<br><b>②</b> M3 on smooth muscle/glands → Gq → IP₃ releases Ca²⁺ → contraction, secretion<br><b>③</b> M2 in heart → Gi + K⁺ channel opening → slower heart<br><b>④</b> Endothelial M3 (non-innervated) → NO → vasodilation → BP falls → baroreflex tachycardia","Bethanechol can treat postoperative urinary retention and paralytic ileus (non-obstructive).","Postoperative care"],["Nicotinic agonists (nicotine, varenicline)","Open Na⁺/K⁺ channel → depolarisation (EPSP → AP). NN ganglia, NM end plate","Smoking cessation (varenicline partial agonist)","Prolonged activation → depolarising paralysis","<b>①</b> ACh/nicotine binds the channel receptor<br><b>②</b> Na⁺ influx → EPSP → action potential<br><b>③</b> Ganglia: effect depends on dominant innervation (vessels constrict – sympathetic; gut ↑ motility – parasympathetic)<br><b>④</b> End plate: fasciculations → persistent depolarisation → paralysis"],["Carbamates (neostigmine, physostigmine, pyridostigmine, rivastigmine)","Bind & are hydrolysed by AChE; carbamate released over 2–8 h → enzyme blocked","Myasthenia gravis, reverse NM block, Alzheimer's (rivastigmine)","","<b>①</b> Drug binds AChE's active site like ACh<br><b>②</b> Enzyme splits off the alcohol part quickly<br><b>③</b> Carbamylated enzyme recovers slowly (2–8 h) → ACh can't be broken down<br><b>④</b> More ACh at all innervated synapses (muscarinic + nicotinic)","Neostigmine (or pyridostigmine) IV reverses non-depolarising neuromuscular block at the end of surgery – always given together with atropine (or glycopyrrolate) to block the muscarinic side effects (bradycardia, secretions). Physostigmine crosses the BBB → treats postoperative central anticholinergic syndrome.","Reversal"],["Organophosphates (parathion, nerve agents)","Phosphorylate AChE → very stable complex; recovery days–weeks (new enzyme)","Insecticides, chemical warfare","'Ageing' makes binding permanent","<b>①</b> Phosphate group binds AChE covalently<br><b>②</b> Complex is extremely stable → enzyme inactive for days–weeks<br><b>③</b> Over time the bond 'ages' → pralidoxime can no longer remove it"],["Edrophonium","Short-acting alcohol, reversible AChE inhibitor (minutes)","Diagnose myasthenia; distinguish myasthenic vs cholinergic crisis; reverse NM block","Myasthenic crisis improves; cholinergic crisis worsens","<b>①</b> Briefly occupies AChE → quick rise in ACh<br><b>②</b> Myasthenic (too little ACh effect) → strength improves<br><b>③</b> Cholinergic (too much ACh) → weakness worsens","Very short-acting – rapid reversal of non-depolarising block and testing whether residual weakness is myasthenic or cholinergic.","Reversal"],["Organophosphate poisoning treatment","Support + ATROPINE (muscarinic) + PRALIDOXIME (regenerates AChE before ageing)","DUMBBELSS","Atropine doesn't fix nicotinic signs","<b>①</b> Atropine blocks muscarinic effects (secretions, bronchospasm, bradycardia)<br><b>②</b> Pralidoxime's oxime binds the phosphorus and pulls it off AChE<br><b>③</b> Restores enzyme → reverses nicotinic and muscarinic signs (if not aged)"]],"traps":["Cholinesterase inhibitors don't act on non-innervated receptors (endothelium) → vasodilation is later and less common; bradycardia common.","Small doses of direct muscarinic agonists → tachycardia (reflex), vagal stimulation → bradycardia.","Muscarine mushroom poisoning: short-lived nausea, vomiting, diarrhoea.","CNS: organophosphates cause convulsions then respiratory/CV depression."],"mem":["Organophosphate poisoning <b>DUMBBELSS</b>: Diarrhoea, Urination, Miosis, Bronchoconstriction, Bradycardia, Excitation (muscle/CNS), Lacrimation, Salivation, Sweating."],"cards":[["Direct vs indirect cholinomimetics?","Direct: bind cholinoceptors (bethanechol, pilocarpine, nicotine). Indirect: inhibit AChE (neostigmine, parathion, edrophonium)."],["Second messengers of M1/M3 vs M2?","M1/M3: Gq → PLC → IP₃ + DAG. M2: Gi → ↓ cAMP; βγ opens cardiac K⁺ channels."],["Why do direct muscarinic agonists cause tachycardia at small doses?","Endothelial M receptors → NO → vasodilation → ↓ BP → baroreflex tachycardia."],["Nicotinic receptor mechanism?","Ligand-gated Na⁺/K⁺ channel → depolarisation (EPSP). NN in ganglia, NM at end plate."],["Carbamates vs organophosphates – duration?","Carbamates: enzyme recovers in 2–8 h. Organophosphates: days–weeks (stable complex, needs new enzyme)."],["Uses of carbamates?","Myasthenia gravis, reversal of non-depolarising block, Alzheimer's (rivastigmine)."],["Uses of edrophonium?","Diagnose myasthenia, distinguish myasthenic vs cholinergic crisis, reverse NM block."],["Signs of organophosphate poisoning?","DUMBBELSS: diarrhoea, urination, miosis, bronchoconstriction, bradycardia, excitation, lacrimation, salivation, sweating."],["Treatment of organophosphate poisoning?","Support + atropine (muscarinic) + pralidoxime (regenerates AChE before ageing)."],["What is 'ageing'?","Phosphate–enzyme bond becomes permanent → pralidoxime no longer works."],["Clinical uses of cholinomimetics?","Glaucoma, Sjögren's, atonic bowel/bladder; varenicline for smoking cessation."]],"quiz":[["Farmer with miosis, salivation, bronchorrhoea, bradycardia and fasciculations. Best combination:",["Atropine alone","Atropine + pralidoxime","Neostigmine","Physostigmine"],1,"Atropine for muscarinic, pralidoxime for nicotinic."],["Edrophonium makes a myasthenic patient weaker. This indicates:",["Myasthenic crisis","Cholinergic crisis","Lambert–Eaton","Drug allergy"],1,"Too much ACh already."],["Drug for Alzheimer's disease:",["Neostigmine","Rivastigmine","Parathion","Bethanechol"],1,"Carbamate."],["M3 receptors signal through:",["Gs","Gi","Gq → IP₃/DAG","Ion channel"],2,"Ca²⁺ release → contraction."],["Pralidoxime fails if:",["Given with atropine","The enzyme has aged","Poison is a carbamate only","Patient is young"],1,"Bond becomes permanent."]],"kc":[{"t":"DUMBBELSS","a":["DUMBBELSS"],"d":"Cholinergic excess: Diarrhoea, Urination, Miosis, Bronchoconstriction, Bradycardia, Excitation, Lacrimation, Salivation, Sweating.","x":"Typical of organophosphate poisoning."},{"t":"Ageing","a":["ageing","aged","Ageing"],"d":"Over time the phosphate–cholinesterase bond becomes permanent (loses a group) → pralidoxime can no longer regenerate the enzyme.","x":"Give pralidoxime early."},{"t":"Myasthenic vs cholinergic crisis","a":["myasthenic crisis","cholinergic crisis"],"d":"Myasthenic = too little ACh effect; cholinergic = too much (overdose of cholinesterase inhibitor). Both cause weakness.","x":"Edrophonium improves a myasthenic crisis and worsens a cholinergic one."},{"t":"EDRF (NO)","a":["EDRF","endothelial NO","endothelium-derived"],"d":"Endothelium-derived relaxing factor = nitric oxide, released when endothelial (non-innervated) muscarinic receptors are activated.","x":"Why direct muscarinic agonists cause vasodilation."}]},{"id":8,"t":"Cholinoceptor Blockers","p":27,"big":"<b>Muscarinic blockers</b> (atropine prototype) are competitive antagonists. Tertiary amines (atropine, scopolamine) cross into CNS and eye; <b>quaternary</b> amines (ipratropium, trospium) don't. <b>Cholinesterase regenerators</b> (pralidoxime) are chemical antagonists.","tbl":[["Atropine","Non-selective competitive muscarinic blocker; tertiary amine; t½ 2 h, action 4–8 h (eye ≥72 h)","Reduce airway secretions in anaesthesia; organophosphate poisoning; mydriasis","Low dose: initial bradycardia (central/presynaptic), then tachycardia","<b>①</b> Occupies muscarinic receptors without activating them<br><b>②</b> Overcome by high agonist concentrations (competitive)<br><b>③</b> Lipid-soluble → crosses BBB and cornea → CNS and eye effects","Antisialagogue premedication (dries airway secretions); treats bradycardia under anaesthesia (vagal reflexes, succinylcholine, surgical traction); given with neostigmine during reversal. Glycopyrrolate (quaternary) is a common alternative with no CNS effects.","Premedication & haemodynamics"],["Scopolamine","CNS-penetrating muscarinic blocker","MOTION SICKNESS (also transdermal patch)","Sedation","<b>①</b> Blocks muscarinic receptors in vestibular/vomiting pathways<br><b>②</b> Very effective against motion sickness","Premedication for sedation, amnesia and drying secretions; transdermal patch prevents postoperative nausea and vomiting (PONV).","Premedication & PONV"],["Benztropine, biperiden, trihexyphenidyl","Central muscarinic block","Parkinson's; acute antipsychotic dystonia (benztropine IV)","","<b>①</b> Block striatal muscarinic receptors → restore DA/ACh balance"],["Mydriatics: atropine 72 h, homatropine 24 h, cyclopentolate 2–12 h, tropicamide 0.5–4 h","Block sphincter (mydriasis) + ciliary muscle (cycloplegia)","Eye examination","Risk of angle-closure glaucoma","<b>①</b> Block M receptors on iris sphincter → unopposed dilator → mydriasis<br><b>②</b> Block ciliary muscle → paralysis of accommodation (cycloplegia)"],["Ipratropium, tiotropium","Quaternary; inhaled; poorly absorbed","Asthma, COPD","Less tachycardia/arrhythmia than β-agonists","<b>①</b> Block airway M3 receptors → prevent vagal bronchoconstriction<br><b>②</b> Charged → not absorbed → few systemic effects","Bronchospasm in intubated / ventilated patients (nebuliser or in-line inhaler).","Airway"],["Oxybutynin, tolterodine, darifenacin, solifenacin, fesoterodine, trospium","Bladder muscarinic block","Urge incontinence, bladder spasm, mild cystitis","","<b>①</b> Block M3 on detrusor muscle → bladder relaxes → less urgency"],["Pralidoxime","Chemical antagonist: oxime binds organophosphate phosphorus","Organophosphate/nerve agent poisoning","Only before 'ageing'","<b>①</b> Oxime has higher affinity for phosphorus than the enzyme does<br><b>②</b> Pulls the organophosphate off AChE<br><b>③</b> Active enzyme regenerated"]],"traps":["Atropine toxicity: \"Dry as a bone, red as a beet, mad as a hatter\" (+ hot – atropine fever, most dangerous in infants).","Elderly: angle-closure glaucoma, urinary retention (prostatic hyperplasia). Constipation, blurred vision in all.","Very high doses: intraventricular conduction block (not muscarinic), atropine flush.","Contraindications: infants (hyperthermia), angle-closure glaucoma, prostatic hyperplasia.","M1-selective drugs are selective for the GI tract."],"mem":["Atropine toxicity: <b>Dry</b> as a bone, <b>Red</b> as a beet, <b>Mad</b> as a hatter, <b>Hot</b> as a hare, <b>Blind</b> as a bat.","Quaternary = 'Quarantined' – can't enter brain or eye."],"cards":[["Why do quaternary antimuscarinics have few CNS effects?","Permanent charge → can't cross the blood–brain barrier or cornea."],["Atropine pharmacokinetics?","Tertiary amine, crosses BBB; t½ 2 h, action 4–8 h, in the eye ≥72 h."],["Atropine's biphasic effect on heart rate?","Low dose → initial bradycardia (central/presynaptic); higher → tachycardia, faster AV conduction."],["Standard drug for motion sickness?","Scopolamine (also transdermal)."],["Duration of mydriatics?","Atropine 72 h, homatropine 24 h, cyclopentolate 2–12 h, tropicamide 0.5–4 h."],["Advantage of ipratropium over β-agonists?","Less tachycardia and arrhythmia; tiotropium is long-acting."],["Drugs for urge incontinence?","Oxybutynin, tolterodine, darifenacin, solifenacin, fesoterodine, trospium."],["Signs of atropine poisoning?","Dry, hot (atropine fever), flushed, delirium/hallucinations, mydriasis, tachycardia, urinary retention, constipation."],["Most dangerous antimuscarinic effect in infants?","Hyperthermia (blocked sweating)."],["Contraindications to antimuscarinics?","Infants, angle-closure glaucoma, prostatic hyperplasia."],["How does pralidoxime work?","Oxime binds organophosphate phosphorus with higher affinity than AChE → regenerates the enzyme."]],"quiz":[["A child with hot, dry, flushed skin, dilated pupils and delirium after eating berries. Likely:",["Organophosphate","Atropine-like poisoning","Opioid","Nicotine"],1,"Belladonna alkaloids."],["Shortest-acting mydriatic:",["Atropine","Homatropine","Cyclopentolate","Tropicamide"],3,"0.5–4 h."],["Antimuscarinics are contraindicated in:",["Open-angle glaucoma only","Angle-closure glaucoma and prostatic hyperplasia","Motion sickness","COPD"],1,"Plus infants."],["Ipratropium has few systemic effects because it is:",["Tertiary amine","Quaternary amine, poorly absorbed","Rapidly cleared by kidney","Selective M2"],1,"Charged."],["Best for motion sickness:",["Atropine","Scopolamine","Ipratropium","Oxybutynin"],1,"Standard therapy."]],"kc":[{"t":"Mydriasis","a":["mydriasis","Mydriasis"],"d":"Pupil dilation (block of sphincter M receptors or α1 stimulation of the dilator).","x":""},{"t":"Cycloplegia","a":["cycloplegia","Cycloplegia"],"d":"Paralysis of the ciliary muscle → loss of accommodation (can't focus near).","x":"Antimuscarinics cause it; α1 agonists (phenylephrine) don't."},{"t":"Quaternary amine","a":["quaternary","Quaternary"],"d":"Permanently charged nitrogen → doesn't cross the blood–brain barrier or cornea; poorly absorbed orally.","x":"Ipratropium, glycopyrrolate, neostigmine, neuromuscular blockers."},{"t":"Atropine fever","a":["atropine fever","hyperthermia"],"d":"Hyperthermia from blocked thermoregulatory sweating in antimuscarinic poisoning.","x":"Most dangerous antimuscarinic effect in infants."}]},{"id":9,"t":"Sympathomimetics","p":30,"big":"<b>Direct</b> agonists bind adrenoceptors; <b>indirect</b> ones release NA (amphetamine, tyramine) or block reuptake (cocaine, TCAs). Catecholamines (adrenaline, NA, dopamine, isoproterenol) are destroyed by COMT/MAO → parenteral, short, no CNS. Amphetamines resist MAO/COMT → oral, long, CNS.","tbl":[["α1 receptor","Gq → PLC → IP₃ + DAG → ↑ Ca²⁺ → smooth muscle contraction","Vasoconstriction, mydriasis, sphincter contraction","","<b>①</b> Agonist activates Gq<br><b>②</b> PLC splits PIP₂ → IP₃ (releases Ca²⁺) + DAG (PKC)<br><b>③</b> Ca²⁺ → vascular/iris/sphincter contraction"],["α2 receptor","Gi → ↓ adenylyl cyclase → ↓ cAMP","Presynaptic ↓ NA release; ↓ aqueous humour; ↓ intestinal secretion","","<b>①</b> Activates Gi<br><b>②</b> Inhibits adenylyl cyclase → less cAMP<br><b>③</b> Presynaptic: less transmitter release; centrally: ↓ sympathetic outflow"],["β1, β2, β3","Gs → ↑ adenylyl cyclase → ↑ cAMP","β1 heart & renin; β2 bronchi/vessels/uterus/liver; β3 lipolysis","","<b>①</b> Activates Gs → more cAMP → protein kinase A<br><b>②</b> Heart (β1/β2): ↑ rate, AV conduction, force<br><b>③</b> Smooth muscle (β2): relaxation; β3: lipolysis"],["D1 / D2","D1 Gs (↑ cAMP) – renal/splanchnic vasodilation; D2 Gi – presynaptic, brain","Dopamine in shock with renal failure","","<b>①</b> D1 on renal vessels → cAMP → vasodilation<br><b>②</b> Dopamine dose ladder: low D1 → moderate β1 → high α1"],["Adrenaline","α + β (all)","DRUG OF CHOICE in ANAPHYLAXIS; local haemostasis; with local anaesthetics","Arrhythmias, stroke","<b>①</b> α1 → vasoconstriction (↑ BP, ↓ oedema)<br><b>②</b> β1 → ↑ cardiac output<br><b>③</b> β2 → bronchodilation; physiological antagonist of anaphylaxis mediators","Drug of choice for anaphylaxis during anaesthesia; cardiac arrest; added to local anaesthetics (1:200,000) to prolong the block, reduce bleeding and lower systemic toxicity.","Emergencies"],["Noradrenaline","α + β1 (no β2)","Shock (incl. spinal shock)","Reflex BRADYCARDIA","<b>①</b> α1 → strong vasoconstriction → ↑ BP<br><b>②</b> Baroreflex → ↑ vagal tone → bradycardia that overrides β1<br><b>③</b> If reflex is blocked → tachycardia","Infusion for persistent hypotension / vasoplegia (e.g. septic patients) in theatre and ICU.","Haemodynamics"],["Phenylephrine, midodrine","Selective α1 agonist","Nasal decongestant, mydriasis without cycloplegia, orthostatic hypotension (midodrine)","Reflex bradycardia","<b>①</b> Constricts skin/splanchnic vessels → ↑ resistance<br><b>②</b> BP rise → reflex slowing of heart","IV bolus or infusion for hypotension after induction or spinal anaesthesia (vasodilation) – useful when heart rate is normal or high (causes reflex bradycardia).","Haemodynamics"],["Isoproterenol","β1 + β2 agonist; not taken up by nerves","","Always ↑ heart rate","<b>①</b> β1 → ↑ rate, force<br><b>②</b> β2 → vasodilation → ↓ diastolic BP"],["Dobutamine, dopamine","β1 → ↑ contractility","Acute heart failure, cardiogenic shock","Arrhythmias limit dose","<b>①</b> Stimulate cardiac β1 → Gs → ↑ cAMP → ↑ Ca²⁺ entry<br><b>②</b> Stronger contraction → ↑ cardiac output and tissue perfusion","Low cardiac output during or after cardiac surgery.","Haemodynamics"],["Salbutamol (albuterol), terbutaline, salmeterol","β2 agonists","Asthma (SABA acute; LABA + steroid prophylaxis)","Tremor, tachycardia","<b>①</b> Stimulate β2 on bronchial smooth muscle → Gs → ↑ cAMP<br><b>②</b> Smooth muscle relaxes → bronchodilation; also dilate skeletal muscle arterioles","Bronchospasm during anaesthesia (in-line inhaler / nebuliser).","Airway"],["Clonidine, apraclonidine, brimonidine","α2 agonists","Hypertension (oral, central); glaucoma (↓ aqueous production)","IV/topical → vasoconstriction","<b>①</b> Stimulate α2 → Gi → ↓ cAMP<br><b>②</b> Orally clonidine accumulates in the CNS → ↓ sympathetic outflow → ↓ BP<br><b>③</b> In the eye ↓ aqueous humour synthesis → ↓ IOP; IV/topically they constrict vessels (α2 on smooth muscle)","Premedication sedation, reduces anaesthetic and opioid requirement, blunts the sympathetic response; added to local anaesthetic blocks to prolong them. Don't stop it before surgery (rebound hypertension).","Adjuncts"],["Amphetamine","Indirect: releases stored catecholamines (DA in CNS); orally active, MAO-resistant","Narcolepsy, ADHD, weight reduction","Abuse, tolerance, paranoia, seizures","<b>①</b> Enters nerve terminals via transporters<br><b>②</b> Displaces NA/DA from vesicles → released<br><b>③</b> CNS dopamine release → alertness, euphoria, anorexia"],["Ephedrine","Long-acting oral sympathomimetic","Orthostatic hypotension, urinary incontinence, enuresis","","<b>①</b> Mixed action: releases stored NA and directly stimulates receptors<br><b>②</b> Orally active, long-acting<br><b>③</b> α in bladder trigone/prostate → ↑ sphincter tone (incontinence, enuresis)","First-line IV bolus for hypotension after spinal anaesthesia or induction, especially with a low heart rate (raises BP and HR). Avoid in patients on MAOIs (indirect action).","Haemodynamics"],["Cocaine, TCAs","Indirect: block NET/DAT reuptake","","Cocaine: arrhythmias, MI, seizures – most deadly","<b>①</b> Block NET (and DAT) reuptake transporters<br><b>②</b> Released NA stays longer in the synapse → enhanced sympathetic effects"]],"traps":["Pulse pressure ← stroke volume (β1); diastolic ← resistance (α, β2) + heart rate.","β2 → hyperglycaemia despite ↑ insulin; early hyperkalaemia then hypokalaemia (K⁺ into muscle). β1 → ↑ renin. β3 → lipolysis.","β2 tocolytics (ritodrine, terbutaline) replaced by NSAIDs, CCBs, Mg²⁺ for premature labour.","MAO inhibition ↑ stores → potentiates indirect sympathomimetics (tyramine)."],"mem":["Receptor G-proteins: \"<b>QISS</b>\" – α1 Gq, α2 Gi, β1 Gs, β2 Gs (and M1 Gq, M2 Gi, M3 Gq: \"<b>QIQ</b>\").","Dopamine dose ladder: \"<b>D</b>-<b>B</b>-<b>A</b>\" – low Dopamine (renal), mid Beta (heart), high Alpha (vessels)."],"cards":[["Direct vs indirect sympathomimetics?","Direct bind receptors (adrenaline, phenylephrine). Indirect release NA (amphetamine, tyramine) or block reuptake (cocaine, TCAs)."],["Why are catecholamines given parenterally?","Rapidly destroyed by COMT and MAO (inactive orally); short-acting; don't enter CNS."],["G-proteins of α1, α2, β receptors?","α1 Gq (IP₃/DAG), α2 Gi (↓ cAMP), β1–3 Gs (↑ cAMP)."],["Dopamine effects by dose?","Low: D1 renal/splanchnic vasodilation; moderate: β1 cardiac; high: α vasoconstriction."],["Why does noradrenaline infusion cause bradycardia?","↑ BP → baroreceptor reflex → ↑ vagal tone overrides β1 stimulation."],["Drug of choice for anaphylaxis and why?","Adrenaline – physiological antagonist of anaphylaxis mediators (α vasoconstriction, β2 bronchodilation, β1 output)."],["Uses of α1 agonists?","Nasal decongestion, mydriasis without cycloplegia, spinal shock, local haemostasis, orthostatic hypotension (midodrine)."],["α2 agonists for glaucoma?","Apraclonidine, brimonidine – ↓ aqueous humour production."],["Metabolic effects of β2 agonists?","↑ insulin + ↑ glycogenolysis → hyperglycaemia; K⁺ shifts into cells → hypokalaemia."],["Legitimate uses of amphetamines?","Narcolepsy, ADHD, (short-term) weight reduction."],["Toxicity by receptor?","α1 → hypertension; β1 → tachycardia, arrhythmias; β2 → tremor."],["Which sympathomimetic causes the most deaths in overdose?","Cocaine (arrhythmias, MI, seizures)."]],"quiz":[["A selective α1 agonist IV will cause:",["Tachycardia","Reflex bradycardia","Bronchodilation","Hypoglycaemia"],1,"Baroreflex."],["Drug of choice for anaphylactic shock:",["Antihistamine","Hydrocortisone","Adrenaline","Noradrenaline"],2,"Fast physiological antagonist."],["β-receptors signal via:",["Gq","Gi","Gs","Ion channel"],2,"↑ cAMP."],["Mydriasis WITHOUT cycloplegia is produced by:",["Atropine","Phenylephrine","Tropicamide","Pilocarpine"],1,"α1 agonist acts on dilator only."],["Low-dose dopamine causes renal vasodilation via:",["β1","α1","D1","D2"],2,"Gs-coupled D1."]],"kc":[{"t":"Indirect sympathomimetic","a":["Indirect"],"d":"Increases synaptic catecholamines without binding the receptor – by release (amphetamine, tyramine, ephedrine) or reuptake block (cocaine, TCAs).","x":"Doesn't work if nerve stores are depleted (e.g. reserpine); dangerous with MAOIs."},{"t":"Reflex bradycardia","a":["reflex bradycardia","Reflex BRADYCARDIA"],"d":"Slowing of the heart via the baroreceptor reflex when a drug raises BP (α1 agonists, noradrenaline).","x":""},{"t":"Pulse pressure","a":["Pulse pressure","pulse pressure"],"d":"Systolic – diastolic pressure; determined mainly by stroke volume (β1).","x":"Diastolic pressure depends on resistance (α, β2) and heart rate."},{"t":"Catecholamine","a":["catecholamines","Catecholamines"],"d":"Molecule with a catechol ring + amine (adrenaline, noradrenaline, dopamine, isoproterenol); destroyed by COMT and MAO.","x":"Not active orally, short-acting, don't enter the CNS."}],"ex":[["Topical α-agonists in the eye","Phenylephrine and <b>tetrahydrozoline</b> drops cause mydriasis (no cycloplegia) and relieve conjunctival itching and congestion. Adrenaline and its prodrug <b>dipivefrin</b> were previously used for glaucoma; now apraclonidine/brimonidine."],["Vasoconstrictors in shock – a caution","α-agonists (noradrenaline, phenylephrine) can keep BP up in shock to perfuse brain, heart and kidneys, but in shock from <b>sepsis or myocardial infarction</b> vasoconstriction may worsen things because sympathetic activity is already high."],["Indirect sympathomimetic overdose","Amphetamine, cocaine or <b>phenylpropanolamine</b> overdose → severe hypertension, which responds well to α-blockers."]]},{"id":10,"t":"Adrenoceptor Blockers","p":34,"big":"<b>α-blockers</b>: phenoxybenzamine (irreversible), phentolamine (reversible, non-selective), prazosin/doxazosin/terazosin (α1), tamsulosin (α1A), yohimbine (α2).<br><b>β-blockers</b>: all competitive; classified by β1-selectivity, partial agonist activity (ISA), local anaesthetic action, lipid solubility.","tbl":[["Phenoxybenzamine","IRREVERSIBLE (covalent) α blocker, slightly α1-selective; t½ short, action ~48 h; also blocks 5-HT, H1","Phaeochromocytoma pre-op; carcinoid; mastocytosis","Reflex tachycardia, orthostatic hypotension","<b>①</b> Forms a covalent bond with α-receptors<br><b>②</b> Receptor permanently blocked until new receptors are made<br><b>③</b> Catecholamine surges from the tumour can't overcome it","Pre-operative α-blockade for 1–2 weeks before phaeochromocytoma resection (also lets blood volume normalise).","Haemodynamics"],["Phentolamine","Reversible, non-selective α blocker; IV 20–40 min","Phaeochromocytoma during surgery; NA extravasation; clonidine rebound; cocaine/amphetamine hypertension","Marked reflex tachycardia (α2 block ↑ NA release)","<b>①</b> Competitively blocks α1 → vasodilation, ↓ BP<br><b>②</b> Also blocks presynaptic α2 → removes brake on NA release<br><b>③</b> More NA + baroreflex → strong tachycardia","Treats hypertensive surges during phaeochromocytoma surgery; local injection for noradrenaline extravasation.","Haemodynamics"],["Prazosin, doxazosin, terazosin","Reversible α1-selective; 8–24 h","Hypertension, BPH","FIRST-DOSE orthostatic hypotension → small dose at bedtime","<b>①</b> Block vascular α1 → ↓ resistance and venous return<br><b>②</b> Spare presynaptic α2 → NA release still inhibited → little tachycardia<br><b>③</b> Relax prostatic smooth muscle"],["Tamsulosin","α1A-selective","BPH – urinary difficulty/retention","","<b>①</b> α1A receptors predominate in prostate<br><b>②</b> Relaxes prostate with less effect on BP"],["Yohimbine","α2-selective blocker","Research; erectile dysfunction (with phentolamine)","","<b>①</b> Blocks presynaptic α2 receptors<br><b>②</b> Removes the brake on NA release → more NA released"],["Propranolol, nadolol, timolol","Non-selective β blockers (competitive)","HTN, angina, arrhythmias; timolol glaucoma; nadolol longest","Bronchospasm in asthma","<b>①</b> Block β1 → ↓ HR, contractility, renin<br><b>②</b> Block β2 → bronchoconstriction risk, ↓ glycogenolysis"],["Atenolol, metoprolol, acebutolol, esmolol","β1-selective","Preferred in asthmatics/diabetics; esmolol IV short (ester)","Selectivity lost at high doses","<b>①</b> Block cardiac β1 more than airway β2<br><b>②</b> Fewer bronchial and metabolic effects","Esmolol IV (seconds–minutes) blunts tachycardia and hypertension from laryngoscopy/intubation and treats perioperative tachyarrhythmias. Patients on chronic β-blockers should continue them perioperatively (abrupt stop → rebound).","Haemodynamics"],["Labetalol, carvedilol","β + α1 blockers (different isomers)","Hypertension, heart failure, phaeochromocytoma (labetalol)","","<b>①</b> β-block slows heart; α1-block dilates vessels<br><b>②</b> No reflex tachycardia from vasodilation","IV for perioperative hypertension (α + β block, no reflex tachycardia).","Haemodynamics"],["Pindolol, acebutolol","Partial agonists (intrinsic sympathomimetic activity)","Theoretically safer in asthma","","<b>①</b> Weakly stimulate β while blocking strong agonists<br><b>②</b> Less bradycardia and bronchospasm"],["Timolol (glaucoma)","No local anaesthetic action","Open-angle glaucoma – ↓ aqueous humour","Local anaesthetic β-blockers would ↓ corneal reflexes → keratitis","<b>①</b> Blocks β on ciliary epithelium → less aqueous humour → ↓ IOP"]],"traps":["Adrenaline reversal: α-blocker + adrenaline → BP FALLS (β2 vasodilation unmasked). Not with phenylephrine/NA (no β2). Also with phenothiazines, antihistamines.","β-blocker toxicity: bradycardia, AV block, HF; asthma attacks; ↓ insulin & MASK hypoglycaemia; sedation, fatigue, sleep disturbance; sexual dysfunction.","Less lipid-soluble (atenolol, nadolol, acebutolol) → fewer CNS effects.","β-blockers in chronic HF: labetalol, carvedilol, metoprolol ↓ morbidity & mortality."],"mem":["β1-selective = \"<b>A</b> to <b>M</b>\": <b>A</b>cebutolol, <b>A</b>tenolol, <b>E</b>smolol, <b>M</b>etoprolol (first half of alphabet).","Non-selective: \"<b>N</b>ot <b>P</b>icky <b>T</b>oday\" – Nadolol, Propranolol, Timolol."],"cards":[["Why is phenoxybenzamine used before phaeochromocytoma surgery?","Irreversible α block can't be overcome by catecholamine surges from the tumour."],["Why do non-selective α-blockers cause marked tachycardia?","Baroreflex + blockade of presynaptic α2 → ↑ NA release onto cardiac β1."],["What is adrenaline reversal?","With α blocked, adrenaline's β2 vasodilation dominates → BP falls instead of rises."],["First-dose effect of prazosin and how to avoid it?","Exaggerated orthostatic hypotension – start with a small dose at bedtime."],["Drug for BPH that targets α1A?","Tamsulosin."],["Uses of phentolamine?","Phaeochromocytoma surgery, NA extravasation, clonidine rebound, cocaine/amphetamine hypertension."],["β1-selective blockers?","Acebutolol, atenolol, esmolol, metoprolol."],["Which β-blockers also block α1?","Labetalol, carvedilol."],["Why are partial agonist β-blockers useful?","Less bronchospasm (pindolol, acebutolol)."],["Why must glaucoma β-blockers lack local anaesthetic action?","It would reduce protective corneal reflexes → ulcerative keratitis."],["β-blocker toxicity?","Bradycardia, AV block, HF, bronchospasm, ↓ insulin & masked hypoglycaemia, sedation, fatigue, sexual dysfunction."],["Short-acting IV β-blocker? Longest-acting?","Esmolol (ester); nadolol."]],"quiz":[["Adrenaline given after phentolamine causes:",["Greater BP rise","BP fall","No change","Bradycardia only"],1,"Adrenaline reversal (β2)."],["Best β-blocker for an asthmatic with hypertension:",["Propranolol","Timolol","Metoprolol","Nadolol"],2,"β1-selective."],["A diabetic on propranolol may not notice hypoglycaemia because:",["It raises glucose","It masks tachycardia/tremor warning signs","It blocks insulin receptors","It increases glucagon"],1,"Also ↓ insulin secretion."],["Irreversible α-blocker:",["Prazosin","Phentolamine","Phenoxybenzamine","Yohimbine"],2,"Covalent, 48 h."],["β-blocker that also blocks α1:",["Atenolol","Carvedilol","Esmolol","Pindolol"],1,"Also labetalol."]],"kc":[{"t":"Adrenaline reversal","a":["Adrenaline reversal","adrenaline reversal"],"d":"After α-blockade, adrenaline LOWERS BP because its β2 vasodilation is unmasked.","x":"Doesn't happen with noradrenaline or phenylephrine (no β2 effect)."},{"t":"Intrinsic sympathomimetic activity (ISA)","a":["intrinsic sympathomimetic activity","Partial agonists","partial agonist activity"],"d":"A β-blocker that is a partial agonist weakly stimulates β-receptors while blocking stronger agonists (pindolol, acebutolol).","x":"Less bradycardia and bronchospasm."},{"t":"Membrane-stabilising action","a":["local anaesthetic action","membrane-stabilising"],"d":"Na⁺ channel (local anaesthetic) effect of some β-blockers.","x":"Undesirable in eye drops (↓ corneal reflex) – timolol lacks it."},{"t":"First-dose effect","a":["FIRST-DOSE","first-dose","First-dose"],"d":"Marked orthostatic hypotension after the first dose of an α1-blocker.","x":"Start with a small dose at bedtime."}],"ex":[["Raynaud's phenomenon","Spasm of digital arterioles sometimes responds to α-blockers, but their efficacy is limited."]]},{"id":11,"t":"Antihypertensive Drugs","p":37,"big":"Four ways to lower BP: <b>diuretics</b>, <b>sympathoplegics</b>, <b>vasodilators</b>, <b>RAAS inhibitors</b> (+ renin inhibitor aliskiren). In essential hypertension the baroreflex and renin response are reset, so the body fights back: <b>tachycardia</b> (block with β-blockers) and <b>salt & water retention</b> (block with diuretics / ACEI).","tbl":[["Thiazides (hydrochlorothiazide)","↓ blood volume (+ unexplained vascular effect)","Mild HTN; max antihypertensive effect at a LOWER dose than max diuresis","Hypokalaemia; minimal compensation","<b>①</b> Block the Na⁺/Cl⁻ cotransporter in the distal convoluted tubule<br><b>②</b> More NaCl and water are excreted → blood volume and cardiac output fall<br><b>③</b> Over weeks there is probably also a direct vasodilating effect (not yet explained)<br><b>④</b> The body barely compensates, which is why they work well in mild hypertension"],["Loop diuretics (furosemide)","↓ blood volume","Moderate, severe, malignant HTN","Hypokalaemia","<b>①</b> Block the Na⁺/K⁺/2Cl⁻ cotransporter in the thick ascending limb<br><b>②</b> Very large NaCl and water loss → marked fall in blood volume<br><b>③</b> Strong enough for moderate, severe and malignant hypertension, but short-acting"],["Clonidine, methyldopa","Central α2 agonists → ↓ sympathetic outflow. Methyldo
