>②</b> Cofactor for homocysteine → methionine (with N5-methyl-THF → THF) and methylmalonyl-CoA → succinyl-CoA<br><b>③</b> Without B12, folate is trapped as N5-methyl-THF → no THF for dTMP → DNA synthesis fails → megaloblasts<br><b>④</b> The methylmalonyl pathway failure damages nerves (folate can't fix this)"],["Folic acid","Dihydrofolate reductase → tetrahydrofolate → dTMP cycle; small stores (months)","Megaloblastic anaemia; BEFORE & DURING PREGNANCY (neural tube defects)","None – but masks B12 neurology","<b>①</b> Reduced by dihydrofolate reductase to tetrahydrofolate (THF)<br><b>②</b> THF donates one-carbon units in the dTMP cycle → thymidine for DNA synthesis<br><b>③</b> Rapidly dividing cells (red cell precursors, fetal neural tube) depend on it most"],["Epoetin alfa, darbepoetin (long), CERA (monthly)","Erythropoietin receptor in marrow","Anaemia of RENAL FAILURE; chemo, HIV, cancer","Hypertension, THROMBOSIS – keep Hb ≤ 12 g/dL","<b>①</b> Recombinant erythropoietin binds EPO receptors on marrow erythroid progenitors<br><b>②</b> Stimulates their proliferation, maturation and release of red cells<br><b>③</b> Replaces EPO that failing kidneys can't make","Occasionally used to raise haemoglobin before major surgery (e.g. patients refusing transfusion).","Perioperative medication"],["Filgrastim (G-CSF), pegfilgrastim; sargramostim (GM-CSF)","↑ neutrophils; mobilise stem cells","Neutropenia after chemo, aplastic anaemia, stem cell transplantation","G-CSF: bone pain. GM-CSF: fever, arthralgia, capillary leak","<b>①</b> G-CSF binds receptors on myeloid progenitors → ↑ neutrophil production and function<br><b>②</b> Also mobilises stem cells into the blood (for harvesting)<br><b>③</b> GM-CSF acts on earlier progenitors → neutrophils + other myeloid and megakaryocytic lines"],["Oprelvekin (IL-11)","Megakaryocyte progenitors","Thrombocytopenia after chemo","Fatigue, headache, fluid retention","<b>①</b> Interleukin-11 stimulates growth of primitive megakaryocyte progenitors → more platelets"],["Romiplostim","Thrombopoietin receptor activator","ITP refractory to therapy","","<b>①</b> Peptide–Fc fusion that activates the thrombopoietin receptor<br><b>②</b> → megakaryocytes make more platelets"]],"traps":["Folate trap: in B12 deficiency folate is stuck as N5-methyltetrahydrofolate.","Folic acid corrects the ANAEMIA of B12 deficiency but NOT the NEUROLOGICAL damage → always exclude B12 deficiency first.","B12 is made only by bacteria.","Iron deficiency more common in women, vegetarians; ↑ needs in children and pregnancy."],"mem":["<b>De</b>feroxamine = <b>De</b>-iron.","<b>F</b>ilgrastim → <b>F</b>ights infection (neutrophils); <b>E</b>poetin → <b>E</b>rythrocytes; <b>O</b>prelvekin → platelets (<b>O</b>ne-one = IL-11)."],"cards":[["Most common type of anaemia?","Microcytic hypochromic iron-deficiency anaemia."],["How is total body iron regulated?","By intestinal absorption only – there's no effective excretion mechanism."],["Iron absorption pathway?","Fe²⁺/haem enters via DMT1 → stored as ferritin or exported by ferroportin → oxidised to Fe³⁺ → carried by transferrin."],["When is iron contraindicated?","Haemolytic anaemia (iron stores already increased)."],["Treatment of acute iron poisoning?","Remove tablets, correct acidosis/electrolytes, parenteral deferoxamine."],["Treatment of chronic iron overload?","Hereditary haemochromatosis – phlebotomy; transfusional – deferoxamine or deferasirox."],["Two reactions requiring B12?","Methylmalonyl-CoA → succinyl-CoA; homocysteine → methionine (linked to folate & dTMP synthesis)."],["What is the folate trap?","In B12 deficiency, folate accumulates as N5-methyltetrahydrofolate → ↓ tetrahydrofolate → ↓ DNA synthesis."],["Why must B12 deficiency be excluded before giving folic acid?","Folic acid corrects the anaemia but not the neurological damage, which can become irreversible."],["Why is B12 given parenterally in pernicious anaemia?","Deficiency is due to lack of intrinsic factor → poor absorpt <script>

const GROUPS=[["Basics",[1,2,3,4]],["Autonomic nervous system",[6,7,8,9,10]],["Cardiovascular & renal",[11,12,13,14,15]],["Autacoids & respiratory",[16,17,20]],["Central nervous system",[22,24,25,26,27,28,29,30,31,32]],["Blood",[33]]];

 $("#main").innerHTML=`<div class="card"><h2>Pharmacology study app</h2>

function rQuiz(){
 if(!Q.length){startQuiz("mix10");return}
 const sel=`<div class="chips"><span class="chip ${qsel==='mix10'?'on':''}" onclick="startQuiz('mix10')">Mixed 10</span><span class="chip ${qsel==='mix30'?'on':''}" onclick="startQuiz('mix30')">Mixed 30</span><span class="chip ${qsel==='mix999'?'on':''}" onclick="startQuiz('mix999')">Everything</span>
 ${CH.map(c=>`<span class="chip ${qsel==c.id?'on':''} ${S.best[c.id]===100?'done':''}" onclick="startQuiz('${c.id}')">${c.id}</span>`).join("")}</div>`;
 if(qi>=Q.length){const pct=Math.round(score/Q.length*100);if(/^\d+$/.test(qsel)){S.best[qsel]=Math.max(S.best[qsel]||0,pct);save()}
  $("#main").innerHTML=`<div class="card">${sel}</div><div class="card"><h2>Score: ${score}/${Q.length} (${pct}%)</h2><p>${pct>=90?'Excellent – move on! 🚀':pct>=70?'Good. Review the misses below, then continue.':'Go back to the Learn card + flashcards for this one, then retry.'}</p>
  ${wrong.length?`<h3>Review your misses</h3>${wrong.map(w=>`<div class="exp"><b>${w.q[0]}</b><br>✓ ${w.q[1][w.q[2]]} – <span class="muted">${w.q[3]}</span> <a style="color:var(--acc);cursor:pointer" onclick="go('learn',${w.ch})">(Ch ${w.ch})</a></div>`).join("")}`:""}
  <div class="row" style="margin-top:12px"><button class="btn p" onclick="startQuiz('${qsel}')">Retry</button></div></div>`;return}
 const {ch,q}=Q[qi];
 $("#main").innerHTML=`<div class="card">${sel}</div><div class="card"><div class="muted sm">Question ${qi+1}/${Q.length} · Ch ${ch} · score ${score}</div><h3 style="font-size:17px">${q[0]}</h3>
 <div id="opts">${q[1].map((o,i)=>`<button class="opt" onclick="ans(${i})">${String.fromCharCode(65+i)}. ${o}</button>`).join("")}</div><div id="fb"></div></div>`;answered=false}
function ans(i){if(answered)return;answered=true;const {ch,q}=Q[qi];const bs=document.querySelectorAll(".opt");
 bs[q[2]].classList.add("ok");if(i===q[2])score++;else{bs[i].classList.add("no");wrong.push({ch,q})}
 $("#fb").innerHTML=`<div class="exp">${i===q[2]?'✅ Correct. ':'❌ Not quite. '}${q[3]}</div><div class="row" style="margin-top:10px"><button class="btn p" onclick="qi++;rQuiz()">Next →</button></div>`}


function linkTerms(c){if(!c.kc)return;const al=[];c.kc.forEach((k,i)=>[k.t].concat(k.a||[]).forEach(s=>{s=s.replace(/\s*\(.*\)$/,'');if(s.length>1)al.push({s,i,cs:/[A-Z]/.test(s)&&(s.length<=6||s===s.toUpperCase())})}));
 al.sort((x,y)=>y.s.length-x.s.length);const esc=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
 const re=new RegExp('(?<![A-Za-z0-9])('+al.map(x=>esc(x.s)).join('|')+')(?![A-Za-z0-9])','gi');
 document.querySelectorAll('#main .big, #main table, #main .traps, #main .mem').forEach(root=>{
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);const nodes=[];while(w.nextNode())nodes.push(w.currentNode);
  nodes.forEach(n=>{if(n.parentElement.closest('.kc'))return;const t=n.nodeValue;re.lastIndex=0;let m,last=0,frag=null;
   while((m=re.exec(t))){const hit=al.find(x=>x.cs?x.s===m[1]:x.s.toLowerCase()===m[1].toLowerCase());if(!hit)continue;
    frag=frag||document.createDocumentFragment();frag.appendChild(document.createTextNode(t.slice(last,m.index)));
    const sp=document.createElement('span');sp.className='kc';sp.dataset.i=hit.i;sp.textContent=m[1];frag.appendChild(sp);last=m.index+m[1].length}
   if(frag){frag.appendChild(document.createTextNode(t.slice(last)));n.parentNode.replaceChild(frag,n)}})});
 document.querySelectorAll('#main .kc[data-i]').forEach(sp=>{const k=c.kc[+sp.dataset.i];
  const show=e=>{e.stopPropagation();const p=$('#kcpop');p.innerHTML=`<b>🔑 ${k.t}</b><div style="margin-top:4px">${k.d}</div>${k.x?`<div class="kcx">💡 ${k.x}</div>`:''}`;p.style.display='block';
   const r=sp.getBoundingClientRect();const pw=Math.min(340,innerWidth-20);p.style.width=pw+'px';p.style.left=Math.max(10,Math.min(r.left,innerWidth-pw-10))+'px';
   const below=r.bottom+8;p.style.top=(below+p.offsetHeight>innerHeight?Math.max(10,r.top-p.offsetHeight-8):below)+'px'};
  sp.addEventListener('mouseenter',show);sp.addEventListener('click',show);sp.addEventListener('mouseleave',()=>{$('#kcpop').style.display='none'})})}
document.addEventListener('click',()=>{const p=document.getElementById('kcpop');if(p)p.style.display='none'});
window.addEventListener('scroll',()=>{const p=document.getElementById('kcpop');if(p)p.style.display='none'},{passive:true});

function rCompare(){$("#main").innerHTML=COMPARE.map(t=>`<div class="card"><h2>${t.t}</h2><div class="tw"><table><tr>${t.h.map(h=>`<th>${h}</th>`).join("")}</tr>${t.r.map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join("")}</tr>`).join("")}</table></div></div>`).join("")}

document.addEventListener("keydown",e=>{if(tab==="cards"){if(e.code==="Space"){e.preventDefault();const f=$("#fc");f&&f.classList.toggle("flip")}if(e.key==="1")mark(0);if(e.key==="2")mark(1)}
 if(tab==="quiz"&&!answered&&/^[1-4a-d]$/i.test(e.key)){const m={a:0,b:1,c:2,d:3};ans(isNaN(e.key)?m[e.key.toLowerCase()]:+e.key-1)}
 else if(tab==="quiz"&&answered&&e.key==="Enter"){qi++;rQuiz()}});
window.addEventListener("hashchange",()=>{const t=location.hash.slice(1);if(TABS.find(x=>x[0]===t)&&t!==tab){tab=t;nav();render()}});
nav();updProg();render();
</script></body></html>
