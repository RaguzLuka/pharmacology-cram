pa = prodrug → methylnoradrenaline","Chronic HTN","Clonidine: severe REBOUND HTN on sudden stop (taper / phentolamine). Methyldopa: +Coombs, haemolytic anaemia. Both sedate (methyldopa more); salt retention","<b>①</b> Taken orally, they enter the CNS (methyldopa first becomes methylnoradrenaline in the brain)<br><b>②</b> They activate α2 receptors in the brainstem<br><b>③</b> This reduces sympathetic outflow to the heart and vessels<br><b>④</b> Result: ↓ cardiac output + ↓ vascular resistance<br><b>⑤</b> Compensation: salt and water retention. If clonidine is stopped suddenly, sympathetic outflow surges → rebound hypertension","Continue up to surgery (rebound hypertension if stopped); also used as an anaesthetic adjunct (sedation, ↓ anaesthetic requirement).","Adjuncts"],["Reserpine","Depletes NA stores; enters CNS; lasts days–weeks","Low-dose adjunct","SEVERE DEPRESSION; salt & water retention","<b>①</b> Blocks the vesicular pump, so noradrenaline can't be stored in vesicles<br><b>②</b> The nerve terminal empties of NA → less NA is released per impulse<br><b>③</b> ↓ venous tone, heart rate and resistance<br><b>④</b> It also empties brain amine stores (enters the CNS) → depression. The effect lasts days to weeks because new vesicles must be made"],["Guanethidine","Depletes stores + blocks release; enters terminal via NET; no CNS entry","Not used in Croatia","Orthostatic hypotension, sexual dysfunction. Cocaine & TCAs block its uptake → no effect","<b>①</b> Is taken up INTO the sympathetic nerve terminal by the NA reuptake transporter (NET)<br><b>②</b> Inside, it depletes NA stores and blocks NA release<br><b>③</b> Sympathetic tone falls → orthostatic hypotension<br><b>④</b> Doesn't enter the CNS. Drugs that block NET (cocaine, TCAs) stop it getting in, so it no longer works"],["Prazosin, doxazosin, terazosin","α1-selective block → ↓ resistance & venous return","HTN, benign prostatic hyperplasia","FIRST-DOSE orthostatic hypotension","<b>①</b> Block α1 receptors on arterioles and veins<br><b>②</b> Arterioles relax → ↓ peripheral resistance; veins relax → ↓ venous return<br><b>③</b> The first doses can drop BP sharply on standing (first-dose orthostatic hypotension)<br><b>④</b> α1-blockade also relaxes prostate smooth muscle → useful in BPH<br><b>⑤</b> Selective α1 block leaves presynaptic α2 alone, so there's less reflex tachycardia than with non-selective blockers"],["β-blockers (propranolol, atenolol, metoprolol, carvedilol, nebivolol)","First ↓ CO, after days ↓ resistance (↓ renin). Nebivolol also vasodilates","HTN (β1-selective preferred)","↑ glucose, LDL, TG; ↓ HDL","<b>①</b> Block β1 receptors in the heart → ↓ heart rate and contractility → ↓ cardiac output (first days)<br><b>②</b> Block β1 receptors on juxtaglomerular cells → ↓ renin → ↓ Ang II<br><b>③</b> Lower Ang II → ↓ vascular resistance after a few days<br><b>④</b> Nebivolol also vasodilates directly. β1-selective, less lipid-soluble drugs are preferred (fewer CNS effects)","Continue chronic β-blockers on the day of surgery – stopping abruptly causes rebound tachycardia and ischaemia.","Haemodynamics"],["Hydralazine","NO release; arterioles > veins","Chronic HTN (low dose)","Reflex tachycardia, salt retention, LUPUS-like syndrome (rare <200 mg/day)","<b>①</b> Releases nitric oxide (NO) from endothelial cells<br><b>②</b> NO → ↑ cGMP in vascular smooth muscle → relaxation<br><b>③</b> Acts mainly on arterioles (↓ afterload), much less on veins<br><b>④</b> BP falls → baroreflex → tachycardia; ↓ renal perfusion → renin → salt/water retention. So it's given with a β-blocker + diuretic"],["Minoxidil","Prodrug → minoxidil sulfate opens K⁺ channels → hyperpolarisation","Severe HTN; topical for alopecia","Hirsutism, strong reflex tachycardia, salt retention, angina","<b>①</b> Prodrug: converted in the liver to minoxidil sulfate<br><b>②</b> Minoxidil sulfate opens K⁺ channels in arteriolar smooth muscle<br><b>③</b> K⁺ leaves the cell → hyperpolarisation → voltage-gated Ca²⁺ channels can't open<br><b>④</b> Less Ca²⁺ inside → smooth muscle relaxes → strong arteriolar dilation<br><b>⑤</b> Very large BP fall → strong reflex tachycardia and salt/water retention"],["CCBs (nifedipine, amlodipine, verapamil, diltiazem)","Block L-type Ca²⁺ channels","Chronic HTN","Weak compensation → used more than hydralazine/minoxidil","<b>①</b> Block voltage-gated L-type Ca²⁺ channels in vascular smooth muscle (and the heart)<br><b>②</b> Less Ca²⁺ enters → less contraction → arterioles dilate → ↓ resistance<br><b>③</b> Verapamil and diltiazem also act on the heart (↓ cardiac output); nifedipine-type mostly on vessels<br><b>④</b> Compensation is weak → used far more than hydralazine/minoxidil"],["Nitroprusside","Releases NO from the molecule → ↑ cGMP; light-sensitive, IV infusion, minutes","Hypertensive EMERGENCY","Hypotension, tachycardia, CYANIDE/thiocyanate after days","<b>①</b> Given by continuous IV infusion (light-sensitive, acts in minutes)<br><b>②</b> The molecule itself releases NO (no enzyme needed)<br><b>③</b> NO activates guanylyl cyclase → ↑ cGMP → dilates both arterioles and veins<br><b>④</b> As NO is released, cyanide is released too → converted to thiocyanate; with infusions over days these accumulate","Deliberate (controlled) hypotension to reduce surgical bleeding and treatment of severe intra-operative hypertension (titratable, acts in minutes).","Haemodynamics"],["Diazoxide","Opens K⁺ channels (thiazide without diuresis); IV, hours","Emergency; hypoglycaemia from insulinoma","Hyperglycaemia, hypotension, salt retention","<b>①</b> Chemically a thiazide, but with NO diuretic action<br><b>②</b> Opens K⁺ channels in arteriolar smooth muscle → hyperpolarisation → relaxation (given IV, lasts hours)<br><b>③</b> Also opens K⁺ channels in pancreatic β-cells → ↓ insulin release → hyperglycaemia (useful for insulinoma)"],["Fenoldopam","D1 agonist → arteriolar dilation; ~10 min","Emergency (infusion)","","<b>①</b> Activates dopamine D1 receptors on arteriolar smooth muscle<br><b>②</b> D1 → ↑ cAMP → rapid arteriolar dilation<br><b>③</b> Given by infusion; very short action (~10 min) so it can be titrated in emergencies"],["ACE inhibitors (captopril, enalapril)","↓ Ang II & aldosterone, ↑ bradykinin","HTN, heart failure, diabetes (protect diabetic kidney)","COUGH (30%), renal failure with renal vascular disease, fetal renal damage – CONTRAINDICATED IN PREGNANCY; hyperkalaemia","<b>①</b> Inhibit angiotensin-converting enzyme (= kininase II / peptidyl dipeptidase)<br><b>②</b> Less Ang I → Ang II: ↓ vasoconstriction and ↓ aldosterone (less salt retention)<br><b>③</b> The same enzyme breaks down bradykinin → bradykinin rises → extra vasodilation (but also cough)<br><b>④</b> Little reflex compensation. ↓ aldosterone → K⁺ retention","Often withheld on the morning of surgery – can cause marked, hard-to-treat hypotension after induction.","Haemodynamics"],["ARBs (losartan, valsartan, irbesartan, candesartan)","Block AT1 receptor","Same as ACEI","Rarely cough; still contraindicated in pregnancy; hyperkalaemia","<b>①</b> Competitively block angiotensin II at the AT1 receptor<br><b>②</b> Ang II can still be made but can't cause vasoconstriction or aldosterone release<br><b>③</b> They don't affect ACE, so bradykinin isn't raised → cough is rare<br><b>④</b> Blocking feedback → renin and Ang I rise","Like ACE inhibitors, often withheld before surgery because of post-induction hypotension.","Haemodynamics"],["Aliskiren","Renin inhibitor → ↓ Ang I and II","HTN","Headache, diarrhoea","<b>①</b> Directly inhibits renin<br><b>②</b> Renin can't convert angiotensinogen → Ang I<br><b>③</b> So both Ang I and Ang II fall, along with aldosterone"]],"traps":["Know the COMPENSATORY response of each group: diuretics – minimal; α2 agonists, reserpine, guanethidine – salt retention; hydralazine/minoxidil – tachycardia + salt retention; non-selective α-blockers – tachycardia (so not used chronically).","ACEI/ARB/aliskiren + K⁺-sparing diuretic or K⁺-rich food or renal impairment → toxic hyperkalaemia.","The three IV emergency drugs: nitroprusside (NO), diazoxide (K⁺ channel), fenoldopam (D1)."],"mem":["Ni-<b>tro-PRUSS</b>-ide → Prussian blue → CYANIDE.","<b>Minox</b>idil grows hair → baldness lotion.","<b>H</b>ydralazine → <b>H</b>as lupus.","Clo<b>NID</b>ine: <b>N</b>ever <b>I</b>nterrupt <b>D</b>osing (rebound)."],"cards":[["Which antihypertensive causes severe rebound hypertension if stopped suddenly? How to prevent?","Clonidine. Taper slowly or give an α-blocker (phentolamine)."],["Methyldopa: what is it converted to, and what immune toxicity does it cause?","Prodrug → methylnoradrenaline in the brain. Positive Coombs test, sometimes haemolytic anaemia."],["Most serious adverse effect of reserpine?","Severe depression (it enters the CNS)."],["Why do cocaine and TCAs cancel guanethidine's effect?","Guanethidine enters the nerve terminal via NET; cocaine/TCAs block NET."],["Typical side effect of α1-blockers (prazosin)? Extra use?","First-dose orthostatic hypotension. Useful in benign prostatic hyperplasia."],["Metabolic effects of β-blockers in hypertension?","Moderate ↑ glucose, LDL, triglycerides and ↓ HDL."],["Hydralazine: mechanism and toxicity?","NO release from endothelium (arterioles). Reflex tachycardia, salt/water retention, reversible lupus-like syndrome."],["Minoxidil: mechanism and toxicity?","Prodrug → minoxidil sulfate opens K⁺ channels. Hirsutism, strong reflex tachycardia, salt retention, angina."],["Nitroprusside: mechanism and main toxicity?","Releases NO → guanylyl cyclase → ↑ cGMP. Hypotension, tachycardia, cyanide/thiocyanate accumulation with infusions over days."],["Diazoxide – mechanism and a second (non-BP) use?","Opens K⁺ channels; ↓ insulin release → treats hypoglycaemia from insulinoma. Causes hyperglycaemia."],["ACE inhibitor toxicity (3 key points)?","Cough (30%), renal failure with renal vascular disease, fetal renal damage (absolutely contraindicated in pregnancy). Also hyperkalaemia."],["Advantage of ARBs over ACE inhibitors?","They rarely cause cough (no bradykinin increase). Still contraindicated in pregnancy."]],"quiz":[["A pregnant woman has hypertension. Which drug is ABSOLUTELY contraindicated?",["Methyldopa","Captopril","Nifedipine","Hydralazine"],1,"ACE inhibitors (and ARBs) cause fetal renal damage."],["A patient on long-term antihypertensive therapy develops a lupus-like syndrome. Most likely drug?",["Minoxidil","Hydralazine","Losartan","Prazosin"],1,"Hydralazine – reversible lupus-like syndrome, rare below 200 mg/day."],["Which risk rises with a nitroprusside infusion lasting several days?",["Hyperglycaemia","Cyanide/thiocyanate accumulation","Hirsutism","Cough"],1,"Nitroprusside releases cyanide as it gives off NO."],["Which drug increases bradykinin levels?",["Losartan","Aliskiren","Captopril","Clonidine"],2,"ACE = kininase II; blocking it raises bradykinin → cough."],["Which drug is a D1 agonist used in hypertensive emergencies?",["Fenoldopam","Diazoxide","Clonidine","Nebivolol"],0,"Fenoldopam – D1 activation, short-acting (10 min) infusion."]],"kc":[{"t":"Compensatory response","a":["compensatory","Compensation","compensation"],"d":"The body's baroreflex (tachycardia) and renin (salt/water retention) reactions that oppose a fall in BP.","x":"Why vasodilators are combined with β-blockers and diuretics."},{"t":"Rebound hypertension","a":["rebound","REBOUND"],"d":"BP overshoot when an antihypertensive (classically clonidine) is stopped suddenly.","x":"Taper slowly; treat with phentolamine."},{"t":"Coombs test","a":["Coombs"],"d":"Detects antibodies on red cells; positive with methyldopa (sometimes haemolytic anaemia).","x":""},{"t":"Hypertensive emergency","a":["EMERGENCY","emergencies"],"d":"Severely raised BP with acute organ damage needing IV, titratable drugs.","x":"Nitroprusside, fenoldopam, diazoxide (also labetalol, nitroglycerin)."}],"ex":[["Secondary hypertension","Less than 20% of hypertension is secondary (identifiable, correctable): <b>phaeochromocytoma, coarctation of the aorta, renal vascular disease, adrenocortical tumours</b>. The rest is essential (primary)."],["Baroreceptor-sensitising drugs","Natural <b>veratrum alkaloids</b> sensitise baroreceptor nerves → ↓ sympathetic outflow, ↑ vagal tone (historical class of sympathoplegics)."],["Other dihydropyridines","Besides nifedipine and amlodipine: <b>felodipine and isradipine</b> – all cause only weak compensatory responses."]]},{"id":12,"t":"Vasodilators & Angina Pectoris","p":40,"big":"Angina = O₂ delivery < O₂ demand. Fix by <b>↓ demand</b> (nitrates, CCBs, β-blockers) or <b>↑ delivery</b> (nitrates & CCBs relieve spasm). Demand is set by <b>wall tension</b> (preload, afterload), <b>heart rate</b> and <b>contractility</b>.<br><br><b>Types:</b> classic/atherosclerotic (90%, exercise, relieved by rest in 15 min) · vasospastic/Prinzmetal (10%, any time, even sleep) · unstable (emergency: angioplasty + anti-clotting – GP IIb/IIIa inhibitors abciximab, eptifibatide, tirofiban; IV nitroglycerin).","tbl":[["Nitroglycerin (glyceryl trinitrate)","Denitration → NO → guanylyl cyclase → ↑ cGMP → myosin light chain dephosphorylation → relaxation. Veins > arteries > arterioles → mainly ↓ PRELOAD","Sublingual 10–20 min (acute); oral 4–6 h (via dinitrate); patch 24 h","Tachycardia (reflex), orthostatic hypotension, throbbing headache; TOLERANCE after 8–10 h (remove patch after 10–12 h)","<b>①</b> Nitroglycerin is denitrated in smooth muscle → releases nitric oxide (NO)<br><b>②</b> NO activates guanylyl cyclase → ↑ cGMP<br><b>③</b> cGMP → myosin light chains are dephosphorylated → smooth muscle relaxes<br><b>④</b> Veins dilate most → ↓ venous return (preload) → smaller heart, ↓ wall tension → ↓ O₂ demand (MAIN effect)<br><b>⑤</b> Arteries dilate → ↓ afterload, ↑ flow through collaterals and relief of spasm. Liver first pass ≈90% (oral F ~10%), so sublingual is used for attacks","IV infusion for perioperative myocardial ischaemia, hypertension and to reduce preload; sublingual spray for chest pain in recovery.","Haemodynamics"],["Isosorbide dinitrate / mononitrate","Same; dinitrate → active mononitrate","SL ~30 min, oral","","<b>①</b> Same NO → cGMP mechanism as nitroglycerin<br><b>②</b> Isosorbide dinitrate is rapidly denitrated to isosorbide mononitrate, which is also active<br><b>③</b> Longer action than sublingual nitroglycerin"],["Amyl nitrite","Volatile, inhaled","Rarely used","Nitrites → methaemoglobin (cyanide antidote)","<b>①</b> Volatile liquid, inhaled → very rapid NO-mediated vasodilation<br><b>②</b> As a NITRITE it oxidises haemoglobin Fe²⁺ → Fe³⁺ (methaemoglobin)<br><b>③</b> Methaemoglobin binds cyanide more strongly than cytochrome oxidase → used as a cyanide antidote"],["Verapamil, diltiazem","L-type Ca²⁺ block; ↓ HR, contractility, AV conduction","Prophylaxis classic + vasospastic angina; AV nodal arrhythmias","Heart failure, AV block, sinus depression (verapamil most); constipation","<b>①</b> Block L-type Ca²⁺ channels in heart AND vessels<br><b>②</b> In the heart: ↓ heart rate, ↓ contractility, slower AV conduction → ↓ O₂ demand<br><b>③</b> In vessels: dilation → ↓ afterload and relief of coronary spasm (↑ O₂ supply)<br><b>④</b> Because they also slow the heart, there's no reflex tachycardia","IV for rate control of supraventricular tachycardia during surgery.","Haemodynamics"],["Nifedipine (dihydropyridines)","L-type block; mostly vasodilation → reflex tachycardia","Prophylaxis; has been used in acute attacks","Flushing, dizziness, pretibial oedema, nausea","<b>①</b> Dihydropyridine: blocks L-type channels mainly in VASCULAR smooth muscle<br><b>②</b> Strong arteriolar dilation → ↓ afterload, relieves spasm<br><b>③</b> The BP fall triggers a sympathetic reflex → heart rate may rise (no bradycardia)"],["β-blockers","↓ HR, force, BP","PROPHYLAXIS only; exercise angina; NOT vasospastic, NOT acute","↑ end-diastolic volume, ↑ ejection time","<b>①</b> Block β1 receptors in the heart<br><b>②</b> ↓ heart rate, ↓ contractility, ↓ BP → ↓ O₂ demand during exercise<br><b>③</b> Unwanted: ↑ end-diastolic volume and ↑ ejection time (partly cancel the benefit)<br><b>④</b> They don't relax coronary spasm → useless in vasospastic angina. Combined with nitrates they cancel the reflex tachycardia"]],"traps":["Oral nitroglycerin bioavailability ≈10% (first pass) – sublingual avoids it.","Nitrates + sildenafil (PDE-5 inhibitor) → synergistic ↑ cGMP → dangerous hypotension.","Nitrates have NO direct cardiac effect – tachycardia/↑ contractility are baroreflex.","β-blocker + nitrate is a great combo: β-blocker cancels the reflex tachycardia.","NITRITES (not nitrates) cause methaemoglobinaemia → binds cyanide. Being replaced by hydroxocobalamin.","'Monday disease' – explosives workers lose tolerance over the weekend → headache + tachycardia every Monday."],"mem":["Nitrates dilate <b>V</b>eins most → ↓ <b>V</b>olume (preload).","Non-DHP CCBs (<b>V</b>erapamil, <b>D</b>iltiazem) act on the heart; DHPs (nifeDIPINE) on the vessels."],"cards":[["What are the 3 types of angina and their frequency?","Classic/atherosclerotic (~90%), vasospastic/Prinzmetal (~10%), unstable (acute coronary syndrome, emergency)."],["Most important determinant of myocardial O₂ demand?","Cardiac wall tension (preload + afterload). Also heart rate and contractility."],["Mechanism of nitrates?","Release NO → stimulates guanylyl cyclase → ↑ cGMP → dephosphorylation of myosin light chains → smooth muscle relaxation."],["Which vessels are most sensitive to nitrates?","Veins > arteries > arterioles. Venodilation ↓ preload = main anti-anginal mechanism."],["Why should a nitroglycerin patch be removed after 10–12 h?","Tolerance develops after 8–10 h; a nitrate-free interval restores sensitivity."],["Three typical toxic effects of nitrates?","Reflex tachycardia, orthostatic hypotension, throbbing headache (meningeal artery dilation)."],["Why are nitrates + sildenafil dangerous?","Nitrates ↑ cGMP formation, PDE-5 inhibitors ↓ cGMP breakdown → synergistic vasodilation → severe hypotension."],["How do nitrites treat cyanide poisoning?","Convert Fe²⁺ to Fe³⁺ → methaemoglobin, which binds cyanide more avidly than cytochrome oxidase. Now replaced by hydroxocobalamin."],["Which CCB causes the most AV block / heart failure?","Verapamil."],["Why are β-blockers useless in vasospastic angina?","They don't relieve spasm; they only reduce demand (prophylaxis of exercise angina)."],["Treatment of unstable angina?","Urgent angioplasty + prevent clotting: GP IIb/IIIa inhibitors (abciximab, eptifibatide, tirofiban); sometimes IV nitroglycerin."]],"quiz":[["Main mechanism by which nitrates relieve atherosclerotic angina:",["Coronary vasodilation only","↓ preload via venodilation → ↓ wall tension","Direct negative inotropy","β-receptor blockade"],1,"Veins are most sensitive; ↓ preload reduces wall tension and O₂ demand."],["Oral bioavailability of nitroglycerin is about:",["90%","50%","10%","100%"],2,"High hepatic first-pass metabolism."],["A patient on isosorbide dinitrate asks about sildenafil. Risk?",["Hypertensive crisis","Severe hypotension","Bradycardia only","No interaction"],1,"Both raise cGMP → synergistic vasodilation."],["Which drug class is ineffective in vasospastic angina?",["Nitrates","Calcium channel blockers","β-blockers","All are effective"],2,"β-blockers don't relieve coronary spasm."],["Pretibial oedema and constipation are side effects of:",["Nitrates","Calcium channel blockers","β-blockers","ACE inhibitors"],1,"CCB toxicity: constipation, pretibial oedema, flushing, dizziness."]],"kc":[{"t":"Preload","a":["preload","PRELOAD"],"d":"Ventricular filling (end-diastolic volume), set by blood volume and venous tone.","x":"Nitrates mainly reduce preload."},{"t":"Afterload","a":["afterload"],"d":"Resistance the ventricle ejects against – arterial pressure and arterial stiffness.","x":""},{"t":"Wall tension","a":["wall tension"],"d":"Main determinant of myocardial O₂ demand (Laplace: ∝ pressure × radius); raised by preload, afterload, heart rate, contractility.","x":""},{"t":"Nitrate tolerance","a":["tolerance","TOLERANCE"],"d":"Loss of nitrate effect after 8–10 h of continuous exposure (thiol depletion).","x":"Nitrate-free interval: remove the patch for 10–12 h daily."},{"t":"Methaemoglobin","a":["methaemoglobin","methaemoglobinaemia"],"d":"Haemoglobin with Fe³⁺ – can't carry O₂ but binds cyanide strongly.","x":"Nitrites produce it as a cyanide antidote; prilocaine causes it as toxicity."}]},{"id":13,"t":"Drugs Used in Heart Failure","p":44,"big":"↓ cardiac output → body activates <b>sympathetic system + RAAS</b> → tachycardia, ↑ resistance, salt/water retention, cardiomegaly, apoptosis. These help short-term but worsen failure long-term.<br><br><b>Acute HF:</b> loop diuretic ± fast inotropes (β-agonists, PDE inhibitors) + vasodilators (nitroprusside, nitroglycerin, nesiritide).<br><b>Chronic HF:</b> diuretics (loop + spironolactone) + ACEI/ARB + β-blocker; digoxin if systolic dysfunction.<br><b>Prolong life:</b> ACEI/ARB, β-blockers (carvedilol, bisoprolol, metoprolol), spironolactone/eplerenone. <b>Digoxin only relieves symptoms.</b>","tbl":[["Digoxin","Inhibits Na⁺/K⁺-ATPase → ↑ Na⁺ᵢ → less Ca²⁺ extruded by NCX → ↑ SR Ca²⁺ → ↑ contractility. Vagal effect slows AV node. F 60–75%, t½ 36–40 h, 60% renal","Systolic HF (symptoms), atrial fibrillation (rate control)","Arrhythmias (Ca overload → DADs, PVBs, bigeminy), N/V/D, visual disturbances, confusion","<b>①</b> Inhibits the Na⁺/K⁺-ATPase pump in cardiac cells<br><b>②</b> Intracellular Na⁺ rises slightly<br><b>③</b> This weakens the Na⁺/Ca²⁺ exchanger (NCX), so less Ca²⁺ is pumped out<br><b>④</b> Extra Ca²⁺ is stored in the sarcoplasmic reticulum → more is released each beat → stronger contraction<br><b>⑤</b> Also ↑ vagal tone → slows AV conduction (helps in atrial fibrillation). Too much Ca²⁺ → afterdepolarisations → arrhythmias"],["Loop diuretics (furosemide)","↓ volume","FIRST-LINE: acute pulmonary congestion, severe oedema; moderate/severe chronic HF","Hypokalaemia (→ digoxin toxicity!)","<b>①</b> Block NKCC2 in the thick ascending limb → large NaCl and water loss<br><b>②</b> Blood volume falls → ↓ preload → less pulmonary congestion and oedema<br><b>③</b> Also dilate pulmonary vessels → fast relief in acute pulmonary oedema"],["Thiazides","↓ volume","Mild chronic HF","","<b>①</b> Block Na⁺/Cl⁻ in the DCT → moderate diuresis<br><b>②</b> Enough to remove fluid in mild chronic failure"],["Spironolactone, eplerenone","Aldosterone antagonists","Chronic HF – ↓ MORTALITY","Hyperkalaemia","<b>①</b> Block the aldosterone receptor (they enter tubular cells from the blood side)<br><b>②</b> ↓ Na⁺ reabsorption, ↓ K⁺ loss in the collecting tubule<br><b>③</b> Also block aldosterone's harmful effects on the heart (fibrosis, remodelling) → ↓ mortality"],["ACEI (captopril) / ARB (losartan)","↓ afterload, ↓ salt retention","First-line chronic HF with diuretics; ↓ morbidity & mortality","","<b>①</b> Block Ang II formation (ACEI) or its AT1 receptor (ARB)<br><b>②</b> ↓ arteriolar constriction → ↓ afterload → heart ejects more easily<br><b>③</b> ↓ aldosterone → less salt and water retention → ↓ preload<br><b>④</b> Block Ang II-driven remodelling and cardiomegaly → ↓ morbidity and mortality"],["Carvedilol, bisoprolol, metoprolol","↓ excess sympathetic drive","Slow progression of CHRONIC HF","Not in acute HF; harmful with systolic dysfunction (acute)","<b>①</b> Block chronically excessive sympathetic stimulation of the heart<br><b>②</b> Protect myocytes from catecholamine-driven damage, remodelling and apoptosis<br><b>③</b> Slows progression of chronic failure (started carefully at low dose)"],["Dobutamine (β1), dopamine","↑ contractility","ACUTE systolic failure only","Tolerance, no oral efficacy, arrhythmias","<b>①</b> Dobutamine stimulates β1 receptors → Gs → ↑ cAMP → ↑ Ca²⁺ entry → stronger contraction<br><b>②</b> Dopamine acts similarly (β1 + other receptors)<br><b>③</b> Quick boost to output in acute failure, but tolerance develops and they're not orally active","Inotropic support in low-output states, e.g. weaning from cardiopulmonary bypass.","Haemodynamics"],["Inamrinone, milrinone (bipyridines)","PDE inhibition → ↑ cAMP → ↑ Ca²⁺; vasodilation (main benefit)","Acute only","↑ morbidity & mortality in chronic HF","<b>①</b> Inhibit phosphodiesterase (PDE) → cAMP is not broken down → ↑ cAMP<br><b>②</b> ↑ cAMP → ↑ intracellular Ca²⁺ → ↑ contractility (like β-agonists)<br><b>③</b> They also strongly vasodilate (main benefit); at high doses ↑ myofilament Ca²⁺ sensitivity","Milrinone is used after cardiac surgery / bypass for low cardiac output with high vascular resistance.","Haemodynamics"],["Nitroprusside, nitroglycerin","↓ preload & afterload","Acute HF","","<b>①</b> Release NO → ↑ cGMP → venous and arterial dilation<br><b>②</b> ↓ venous return (preload) + ↓ arterial pressure (afterload)<br><b>③</b> The heart gets smaller and works more efficiently","Afterload reduction in acute heart failure during cardiac anaesthesia.","Haemodynamics"],["Nesiritide","Recombinant BNP: vasodilation + diuresis","Acute HF","Renal toxicity","<b>①</b> Recombinant brain natriuretic peptide (BNP)<br><b>②</b> Mainly causes vasodilation (↓ preload and afterload), plus some diuresis"],["Hydralazine + isosorbide dinitrate","Oral vasodilators","Chronic HF","","<b>①</b> Hydralazine dilates arterioles (↓ afterload)<br><b>②</b> Isosorbide dinitrate dilates veins (↓ preload)<br><b>③</b> Together they unload the heart from both sides; both taken orally"]],"traps":["Digoxin ECG – early: ↑ PR (slow AV conduction), flat T (vagal, atropine-blockable). Later: short QT, inverted T, ST depression.","Digoxin toxicity ↑ by HYPOkalaemia, HYPOmagnesaemia, HYPERcalcaemia. Diuretics cause hypoK; digoxin vomiting causes hypoMg.","Quinidine ↓ digoxin clearance → ↑ levels.","Toxicity treatment: mild → skip doses + K⁺; severe acute (has HYPERkalaemia) → NO K⁺; antiarrhythmics lidocaine/phenytoin (propranolol); digoxin Fab antibodies."],"mem":["Digoxin toxicity: \"<b>Low K, Low Mg, High Ca</b>\" make it worse.","Bigeminy = PVB : normal beat 1:1 → think digoxin."],"cards":[["Mechanism of digoxin's positive inotropic effect?","Inhibits Na⁺/K⁺-ATPase → ↑ intracellular Na⁺ → ↓ Ca²⁺ extrusion via Na⁺/Ca²⁺ exchanger → more Ca²⁺ stored in SR → stronger contraction."],["Digoxin pharmacokinetics (F, t½, elimination)?","Oral bioavailability 60–75%, t½ 36–40 h, 60% renal + 40% hepatic."],["Early ECG effects of digoxin?","PR prolongation (slowed AV conduction) and T-wave flattening – parasympathetic, partly blocked by atropine."],["Most important manifestation of digoxin toxicity and its mechanism?","Increased automaticity from intracellular Ca²⁺ overload → delayed afterdepolarisations → extrasystoles, tachycardia, fibrillation (bigeminy)."],["Which electrolyte changes increase digoxin toxicity?","Hypokalaemia, hypomagnesaemia, hypercalcaemia."],["Which antiarrhythmic raises digoxin levels?","Quinidine (↓ digoxin clearance)."],["Treatment of severe acute digoxin poisoning?","Digoxin-specific Fab antibody fragments. No K⁺ supplements (patient is hyperkalaemic); antiarrhythmics are dangerous."],["Does digoxin prolong life in heart failure?","No – it relieves symptoms only. ACEI/ARB, β-blockers and spironolactone/eplerenone do reduce mortality."],["Why are PDE inhibitors (milrinone) not used in chronic HF?","They increase morbidity and mortality."],["Which β-blockers slow chronic HF progression?","Carvedilol, bisoprolol, metoprolol (not in acute failure)."],["What is nesiritide?","Recombinant brain natriuretic peptide – vasodilator + diuretic for acute HF; renal toxicity."]],"quiz":[["A patient on digoxin starts furosemide and develops bigeminy. Most likely cause?",["Hyperkalaemia","Hypokalaemia","Hypocalcaemia","Hypermagnesaemia"],1,"Loop diuretics lower K⁺ → precipitates digoxin toxicity."],["Which of these REDUCES mortality in chronic heart failure?",["Digoxin","Milrinone","Spironolactone","Dobutamine"],2,"Aldosterone antagonists have favourable long-term effects and reduce mortality."],["Digoxin primarily inhibits:",["Phosphodiesterase","Na⁺/K⁺-ATPase","β1 receptors","L-type Ca²⁺ channels"],1,"Na⁺/K⁺-ATPase inhibition is the primary mechanism."],["Dobutamine is NOT suitable for chronic HF because:",["It is hepatotoxic","Tolerance, no oral efficacy, arrhythmogenic","It causes hypokalaemia","It blocks β1"],1,"Use only in acute systolic failure."],["First-line drugs for immediate relief of pulmonary congestion in acute HF:",["Thiazides","Loop diuretics","β-blockers","Digoxin"],1,"Furosemide is very effective for acute pulmonary congestion."]],"kc":[{"t":"Frank–Starling curve","a":["Frank–Starling"],"d":"Stroke volume rises with end-diastolic fibre length (preload) – up to a limit. In failure the curve is flattened.","x":"Diuretics move along the curve; inotropes shift it up."},{"t":"Positive inotrope","a":["inotropic","inotropes","inotrope"],"d":"Drug that increases the force of cardiac contraction (digoxin, dobutamine, milrinone).","x":""},{"t":"Systolic vs diastolic failure","a":["systolic failure","diastolic failure","systolic dysfunction"],"d":"Systolic: weak contraction, low ejection fraction. Diastolic: stiff ventricle can't fill, ejection fraction may be normal.","x":"Inotropes help only systolic failure."},{"t":"Afterdepolarisation","a":["afterdepolarisations","DADs"],"d":"Abnormal depolarisation after an AP; delayed afterdepolarisations come from Ca²⁺ overload (digoxin toxicity).","x":"Cause extrasystoles, bigeminy, tachycardia."},{"t":"Bigeminy","a":["bigeminy"],"d":"Every normal beat followed by a premature ventricular beat (1:1).","x":"Classic sign of digoxin toxicity."},{"t":"Remodelling","a":["remodelling","cardiomegaly"],"d":"Structural changes (hypertrophy, fibrosis, apoptosis) driven by Ang II, aldosterone and catecholamines.","x":"Drugs that block remodelling (ACEI, β-blockers, spironolactone) reduce mortality."}]},{"id":14,"t":"Antiarrhythmic Drugs","p":48,"big":"Arrhythmias arise from <b>abnormal automaticity</b> or <b>abnormal conduction</b>. Drugs act on the 3 currents (Na⁺, K⁺, Ca²⁺) or β-receptors. Most have a narrow therapeutic index.<br><br><b>Class 1</b> Na⁺ blockers · <b>Class 2</b> β-blockers · <b>Class 3</b> K⁺ blockers · <b>Class 4</b> Ca²⁺ blockers · <b>Misc</b> adenosine, K⁺, Mg²⁺.<br><br><b>Use-/state-dependence:</b> Na⁺ blockers bind open/inactivated channels → they hit fast-firing or depolarised (ischaemic) tissue more than normal tissue.","tbl":[["1A: procainamide, quinidine, disopyramide","Block Na⁺ AND K⁺ → ↑ AP duration & refractory period; wide QRS","Atrial + ventricular; procainamide in acute MI","Procainamide: hypotension, LUPUS. Quinidine: CINCHONISM, ↑ digoxin, TdP. Disopyramide: antimuscarinic, HF. HyperK ↑ toxicity; overdose → Na lactate","<b>①</b> Block open/inactivated Na⁺ channels → ↓ Na⁺ current → slower conduction (wide QRS)<br><b>②</b> ALSO block K⁺ channels → slower repolarisation → longer action potential and refractory period (long QT)<br><b>③</b> Suppress abnormal pacemakers in atria and ventricles; at high doses slow AV conduction"],["1B: lidocaine (IV), mexiletine (oral), phenytoin","Selective for ischaemic/depolarised ventricular tissue; shortens AP; little ECG effect","Acute ischaemic VENTRICULAR arrhythmias (post-MI); digitalis arrhythmias","Local anaesthetic toxicity: CNS stimulation, convulsions; CV depression; allergy","<b>①</b> Bind Na⁺ channels mainly when they are inactivated → selective for depolarised, ischaemic tissue<br><b>②</b> Slow recovery of Na⁺ channels from inactivation → refractory period isn't shortened, even though the AP may be<br><b>③</b> Almost no effect on normal cells → very little ECG change; little effect on atria. Lidocaine IV only (big first pass)","IV lidocaine (≈1.5 mg/kg) before intubation blunts the cough and pressor response; treats ventricular arrhythmias during surgery.","Airway"],["1C: flecainide, propafenone, moricizine","Strong Na⁺ block; no change in AP/QT; wide QRS","Approved for SUPRAventricular; refractory cases","MOST PROARRHYTHMIC; local anaesthetic toxicity","<b>①</b> Strongly depress the Na⁺ current in atria and ventricles → markedly slower conduction (wide QRS)<br><b>②</b> Don't block K⁺ → no change in AP duration or QT<br><b>③</b> Unbind slowly → can provoke new arrhythmias (most proarrhythmic)"],["2: propranolol, esmolol, metoprolol, timolol","β-block → ↓ cAMP → ↓ Na⁺/Ca²⁺ currents; AV node very sensitive","Esmolol IV for acute; post-MI prophylaxis (≥2 years protection)","↓ cardiac output","<b>①</b> Block β-receptors → less cAMP in cardiac cells<br><b>②</b> ↓ cAMP → ↓ Na⁺ and Ca²⁺ currents<br><b>③</b> Suppresses abnormal pacemakers; the AV node is especially sensitive → slower AV conduction (↑ PR)<br><b>④</b> Esmolol is very short-acting (IV); propranolol/metoprolol/timolol protect after MI","Esmolol infusion for intra-operative supraventricular tachycardia and the intubation response.","Haemodynamics"],["3: dofetilide, ibutilide","K⁺ block → ↑ AP & ERP; long QT","Atrial flutter & fibrillation","TORSADES DE POINTES","<b>①</b> Block the K⁺ channels responsible for repolarisation<br><b>②</b> Repolarisation is delayed → longer action potential and effective refractory period<br><b>③</b> Cells can't respond to rapid re-entrant impulses → stops flutter/fibrillation<br><b>④</b> Seen as long QT → risk of torsades de pointes"],["3: sotalol","β-block (one isomer) + K⁺ block; oral","Arrhythmias","TdP, sinus bradycardia, asthma","<b>①</b> Chiral mixture: one isomer blocks β-receptors (class 2), both block K⁺ channels (class 3)<br><b>②</b> → slows heart rate AND prolongs AP/QT"],["3: amiodarone","Blocks Na⁺, Ca²⁺, K⁺ AND β → MOST effective","Most arrhythmias (officially resistant ones)","Corneal & skin deposits, THYROID dysfunction, PULMONARY FIBROSIS, paraesthesias, tremor; rarely new arrhythmias","<b>①</b> Blocks K⁺ channels → greatest AP prolongation<br><b>②</b> Also blocks Na⁺ channels (class 1A-like), Ca²⁺ channels (class 4) and β-receptors (class 2)<br><b>③</b> Because it acts on all four classes it's the most effective antiarrhythmic, and rarely proarrhythmic despite long QT","Perioperative atrial fibrillation; shock-refractory VF/pulseless VT during cardiac arrest.","Emergencies"],["3: dronedarone","Amiodarone analogue, less effective & less toxic","AF and flutter","","<b>①</b> Structural analogue of amiodarone with the same multi-channel block<br><b>②</b> Designed to be less toxic (also less effective)"],["4: verapamil, diltiazem","Use-dependent L-type block → slow AV node, ↑ ERP","Convert/prevent AV nodal re-entrant tachycardia","↓ contractility, AV block, hypotension. AVOID in VT. DHPs useless (reflex sympathetic)","<b>①</b> Block L-type Ca²⁺ channels in a use-/state-dependent way<br><b>②</b> The AV node depends on Ca²⁺ current for depolarisation → conduction through it slows and its refractory period lengthens<br><b>③</b> Breaks re-entry circuits that run through the AV node<br><b>④</b> Dihydropyridines don't work: they lower BP → reflex sympathetic drive → more arrhythmias"],["Adenosine","IV; hyperpolarises AV node (K⁺ current), ↓ Ca²⁺ current; seconds","DRUG OF CHOICE for paroxysmal SVT","Flushing, hypotension, transient chest pain, dyspnoea","<b>①</b> IV adenosine activates adenosine receptors in the AV node<br><b>②</b> Opens K⁺ channels → hyperpolarisation; ↓ Ca²⁺ current<br><b>③</b> AV conduction is briefly blocked → re-entrant SVT terminates<br><b>④</b> Half-life of seconds → side effects (flushing, hypotension) pass quickly","Terminates paroxysmal SVT occurring during anaesthesia (rapid IV bolus, flush).","Emergencies"],["Potassium","Depresses ectopic pacemakers","Keep K⁺ normal; digitalis arrhythmias","Too high → depressed conduction, re-entry","<b>①</b> Normal K⁺ stabilises the resting potential and depresses ectopic pacemakers (incl. digitalis-induced)<br><b>②</b> Low K⁺ → more arrhythmias (especially with digitalis); high K⁺ → slowed conduction → re-entry. Keep it normal"],["Magnesium","Like K⁺","Digitalis arrhythmias, TORSADES DE POINTES","","<b>①</b> Acts similarly to K⁺ on digitalis-induced arrhythmias<br><b>②</b> Suppresses the early afterdepolarisations that trigger torsades de pointes (exact mechanism not fully known)","Torsades de pointes; also reduces anaesthetic/analgesic needs and potentiates neuromuscular blockers (reduce relaxant dose).","Emergencies"]],"traps":["1A ↑ AP · 1B ↓ AP · 1C no change in AP.","Torsades de pointes is caused by drugs that prolong QT (quinidine, sotalol, ibutilide, dofetilide). Treat with Mg²⁺.","Lidocaine is IV because of huge first-pass + cardiotoxic metabolites; acts on atria only in digitalis arrhythmias.","Hyperkalaemia worsens toxicity of all class 1 drugs."],"mem":["Classes 1–4: \"<b>S</b>ome <b>B</b>lock <b>P</b>otassium <b>C</b>hannels\" = Sodium, Beta, Potassium, Calcium.","1A/1B/1C: \"<b>D</b>ouble <b>Q</b>uarter <b>P</b>ounder (1A: Disopyramide, Quinidine, Procainamide) · <b>L</b>ettuce <b>M</b>ayo (1B: Lidocaine, Mexiletine) · <b>F</b>ries <b>P</b>lease (1C: Flecainide, Propafenone)\".","Amiodarone toxicity = organs it 'paints': eyes/skin (deposits), thyroid, lungs (fibrosis)."],"cards":[["Effect of class 1A, 1B and 1C on action potential duration?","1A prolongs, 1B shortens (in some tissues), 1C no effect."],["What does use-dependent (state-dependent) block mean?","Na⁺ blockers bind open/inactivated channels better than resting ones → they selectively block fast-firing or depolarised (ischaemic) tissue."],["Toxicity of procainamide?","Hypotension (esp. IV) and reversible lupus-like syndrome."],["What is cinchonism and which drug causes it?","Headache, vertigo, tinnitus – quinidine."],["Indication for lidocaine as antiarrhythmic?","Acute ischaemic ventricular arrhythmias (e.g. after MI); atrial only if digitalis-induced."],["Which antiarrhythmic class is the most proarrhythmic?","1C (flecainide)."],["Which β-blocker is used IV for acute arrhythmias?","Esmolol (short-acting)."],["Hallmark ECG effect of class 3 and its main danger?","QT prolongation → torsades de pointes."],["Amiodarone – what channels/receptors does it block and what are its toxicities?","Na⁺, Ca²⁺, K⁺ channels and β-receptors. Corneal/skin deposits, thyroid dysfunction, pulmonary fibrosis, paraesthesias, tremor."],["Why aren't dihydropyridines (nifedipine) used as antiarrhythmics?","They lower BP so much that reflex sympathetic stimulation promotes arrhythmias."],["Drug of choice for paroxysmal supraventricular tachycardia?","Adenosine – extremely short-acting, low toxicity (flushing, hypotension, chest pain)."],["Drug used for torsades de pointes?","Magnesium."],["Which drugs should be avoided in ventricular tachycardia?","Verapamil and diltiazem (class 4)."]],"quiz":[["Drug of choice to terminate paroxysmal SVT:",["Verapamil","Adenosine","Lidocaine","Amiodarone"],1,"Adenosine – very short action, very low toxicity."],["A patient on long-term antiarrhythmic therapy develops pulmonary fibrosis and hypothyroidism. Drug?",["Sotalol","Flecainide","Amiodarone","Procainamide"],2,"Amiodarone: deposits, thyroid, lungs, paraesthesias, tremor."],["Which drug acts selectively on ischaemic ventricular tissue with little effect on the normal ECG?",["Quinidine","Lidocaine","Flecainide","Dofetilide"],1,"Class 1B – lidocaine."],["Torsades de pointes is LEAST likely with:",["Quinidine","Ibutilide","Sotalol","Lidocaine"],3,"TdP comes from AP/QT prolonging drugs; lidocaine shortens AP."],["Class 4 antiarrhythmics act mainly on:",["Purkinje fibres","AV node (Ca²⁺-dependent)","Atrial muscle","Ventricular muscle"],1,"Verapamil/diltiazem slow AV conduction."]],"kc":[{"t":"Use-dependent (state-dependent) block","a":["use-dependent","state-dependent","Use-/state-dependence","Use-dependence"],"d":"Drug binds channels mainly in the open/inactivated state → acts most on fast-firing or depolarised (ischaemic) tissue.","x":"Applies to class 1 antiarrhythmics and local anaesthetics."},{"t":"Effective refractory period","a":["refractory period","ERP"],"d":"Time after an AP during which a new AP can't be propagated.","x":"Prolonging it (class 1A, 3) stops re-entry."},{"t":"QT interval","a":["QT"],"d":"ECG measure of ventricular depolarisation + repolarisation.","x":"Long QT (class 1A, 3, some antipsychotics/antidepressants) → torsades de pointes."},{"t":"Torsades de pointes","a":["torsades de pointes","Torsades de pointes","TdP","TORSADES DE POINTES"],"d":"Polymorphic VT with 'twisting' QRS axis, triggered by long QT.","x":"Treat with IV magnesium; stop QT-prolonging drugs."},{"t":"Re-entry","a":["re-entrant","re-entry","Re-entry"],"d":"An impulse circulates around a loop of tissue and re-excites it repeatedly.","x":"Abolished by slowing conduction or prolonging refractoriness."},{"t":"Proarrhythmic effect","a":["proarrhythmic","PROARRHYTHMIC"],"d":"An antiarrhythmic provoking new or worse arrhythmias (highest with class 1C).","x":""}]},{"id":15,"t":"Diuretics","p":52,"big":"Each nephron segment reabsorbs Na⁺ differently → each diuretic class works at one segment. Effects are predictable from that segment's job.<br><br><b>PCT</b> 60–70% Na⁺ (carbonic anhydrase inhibitors, mannitol) → <b>Thick ascending limb</b> 20–30% via NKCC2 (loops) → <b>DCT</b> 5–8% via Na⁺/Cl⁻ (thiazides) → <b>Collecting tubule</b> 2–5% via ENaC under aldosterone (K⁺-sparing) + water via ADH.<br><br>Most diuretics act from the lumen (filtered/secreted). Exception: <b>spironolactone/eplerenone</b> enter from the blood side.","tbl":[["Acetazolamide (dorzolamide, brinzolamide topical)","Inhibits carbonic anhydrase (all tissues) → bicarbonate diuresis","Acute GLAUCOMA, MOUNTAIN SICKNESS, oedema with metabolic alkalosis","Metabolic ACIDOSIS, K⁺ wasting, self-limiting (2–3 d), drowsiness, paraesthesias, Ca stones, hepatic encephalopathy (NH₃), sulfonamide allergy","<b>①</b> Inhibit carbonic anhydrase in the proximal tubule brush border and cells<br><b>②</b> Filtered HCO₃⁻ can't be converted to CO₂ + H₂O → HCO₃⁻ stays in the urine with Na⁺ (bicarbonate diuresis)<br><b>③</b> Body HCO₃⁻ falls → metabolic acidosis → less HCO₃⁻ filtered → diuresis stops in 2–3 days<br><b>④</b> More Na⁺ reaches the collecting tubule → K⁺ is secreted (K⁺ wasting)<br><b>⑤</b> In the eye ↓ aqueous humour (↓ IOP); in the brain ↓ CSF HCO₃⁻ → CSF acidosis → hyperventilation (mountain sickness)"],["Loops: furosemide, bumetanide, torsemide, ethacrynic acid","Block Na⁺/K⁺/2Cl⁻ (NKCC2) → lose lumen + potential → ↑ Ca²⁺ & Mg²⁺ excretion","Oedema (HF, ascites), ACUTE PULMONARY OEDEMA (also pulmonary vasodilation), refractory HTN, HYPERCALCAEMIA (+ saline)","HypoK metabolic ALKALOSIS, hypovolaemia, OTOTOXICITY, sulfonamide allergy (not ethacrynic acid). NSAIDs ↓ effect","<b>①</b> Block the Na⁺/K⁺/2Cl⁻ cotransporter (NKCC2) in the thick ascending limb (20–30% of Na⁺ reabsorption)<br><b>②</b> Huge NaCl diuresis; urine can't be diluted<br><b>③</b> K⁺ normally leaks back into the lumen making it positive, which drives Ca²⁺ and Mg²⁺ reabsorption → loops abolish this → Ca²⁺ and Mg²⁺ are lost<br><b>④</b> Much Na⁺ reaches the collecting tubule → K⁺ and H⁺ secreted → hypokalaemic alkalosis. Need prostaglandins (NSAIDs blunt them)","IV furosemide for intra-operative fluid overload or pulmonary oedema.","Haemodynamics"],["Thiazides: hydrochlorothiazide (metolazone)","Block Na⁺/Cl⁻ in DCT; 6–12 h; ↑ Ca²⁺ REABSORPTION","HYPERTENSION, mild HF, Ca stones, NEPHROGENIC DI","HypoK alkalosis, hyponatraemia, hyperGLYCAEMIA, hyperURICAEMIA, hyperLIPIDAEMIA, allergy","<b>①</b> Block the Na⁺/Cl⁻ cotransporter in the distal convoluted tubule (5–8% of Na⁺)<br><b>②</b> Moderate but long (6–12 h) NaCl diuresis<br><b>③</b> Less Na⁺ inside the cell → the basolateral Na⁺/Ca²⁺ exchanger works harder → MORE Ca²⁺ reabsorbed<br><b>④</b> Reduce free water excretion → hyponatraemia; distal Na⁺ delivery → K⁺ loss"],["Spironolactone, eplerenone","Aldosterone receptor antagonists (↓ ENaC & pump synthesis); slow 24–72 h","Aldosteronism, HF, with thiazides","HYPERkalaemia, metabolic acidosis; spironolactone: gynaecomastia, antiandrogen","<b>①</b> Synthetic steroids that enter tubular cells from the blood and block the cytoplasmic aldosterone receptor<br><b>②</b> Aldosterone can no longer switch on genes for ENaC channels and Na⁺/K⁺-ATPase<br><b>③</b> ↓ Na⁺ reabsorption → ↓ K⁺ and H⁺ secretion (K⁺ retained, acidosis)<br><b>④</b> Slow onset/offset (24–72 h) because it works through protein synthesis"],["Amiloride, triamterene","Block ENaC directly; 12–24 h","K⁺ wasting from other diuretics","Hyperkalaemia – NEVER with K⁺ supplements","<b>①</b> Directly plug the epithelial Na⁺ channels (ENaC) in the collecting tubule (not voltage-gated channels)<br><b>②</b> Na⁺ can't enter → the lumen doesn't become negative → K⁺ and H⁺ aren't secreted<br><b>③</b> Works regardless of aldosterone; lasts 12–24 h"],["Mannitol","Osmotic (IV), mainly PCT","↑ urine flow (haemolysis, rhabdomyolysis), ↓ ICP, ↓ IOP","Hyponatraemia → hypernatraemia, pulmonary oedema, headache, N/V","<b>①</b> Given IV, freely filtered but not reabsorbed<br><b>②</b> Stays in the tubule and holds water osmotically (mainly in the proximal tubule, also loop and collecting tubule)<br><b>③</b> Fast urine flow → Na⁺ transporters can't keep up → more Na⁺ lost too<br><b>④</b> In blood it draws water out of cells → ↓ brain volume (ICP) and eye pressure (IOP)","Reduces intracranial pressure and 'relaxes' the brain in neurosurgery; maintains urine flow in some vascular/renal surgery.","Neuro-anaesthesia"],["Vasopressin, desmopressin","V2 → Gs → cAMP → AQP2 insertion","CENTRAL diabetes insipidus","Hyponatraemia, hypertension","<b>①</b> Activate V2 receptors on collecting-tubule cells<br><b>②</b> V2 → Gs → adenylyl cyclase → ↑ cAMP<br><b>③</b> cAMP causes insertion of aquaporin-2 water channels into the luminal membrane<br><b>④</b> Water is reabsorbed → concentrated, low-volume urine"],["Conivaptan (V1+V2), tolvaptan, demeclocycline","ADH antagonists","SIADH","Conivaptan: demyelination if Na⁺ corrected too fast","<b>①</b> Block ADH (V2) receptors (conivaptan also V1)<br><b>②</b> No cAMP signal → fewer aquaporin-2 channels → free water is excreted<br><b>③</b> Raises plasma Na⁺ in SIADH (correct slowly, or demyelination)"]],"traps":["Calcium: LOOPS LOSE calcium (hypercalcaemia treatment); THIAZIDES KEEP calcium (calcium stones).","Acid–base: CAI & K⁺-sparing → acidosis; loops & thiazides → hypokalaemic alkalosis.","Furosemide for hypercalcaemia must be given WITH saline – otherwise haemoconcentration raises Ca²⁺.","Nephrogenic DI is paradoxically treated with thiazides (volume ↓ → ↑ proximal reabsorption).","Lithium has ADH-antagonist effects."],"mem":["\"<b>Loops Lose</b> calcium, <b>Thiazides Take</b> it back\".","Thiazide metabolic side effects – <b>hyperGLUC</b>: Glycaemia, Lipidaemia, Uricaemia, Calcaemia."],"cards":[["% of Na⁺ reabsorbed in each segment?","PCT 60–70%, thick ascending limb 20–30%, DCT 5–8%, collecting tubule 2–5%."],["Which diuretics act from the basolateral (blood) side?","Aldosterone antagonists – spironolactone and eplerenone."],["Main renal effect & acid-base change of acetazolamide?","Bicarbonate diuresis → metabolic acidosis; self-limiting in 2–3 days."],["Clinical uses of carbonic anhydrase inhibitors?","Acute glaucoma, prevention of mountain sickness, oedema with metabolic alkalosis."],["Why is acetazolamide dangerous in liver disease?","Alkaline urine prevents NH₃ → NH₄⁺ conversion → ↑ ammonia reabsorption → hepatic encephalopathy."],["Target of loop diuretics and effect on Ca²⁺/Mg²⁺?","Na⁺/K⁺/2Cl⁻ cotransporter (NKCC2); ↑ excretion of Ca²⁺ and Mg²⁺ (loss of + luminal potential)."],["Typical toxicity of loop diuretics?","Hypokalaemic metabolic alkalosis, hypovolaemia, ototoxicity, sulfonamide allergy."],["Which loop diuretic is not a sulfonamide?","Ethacrynic acid."],["Thiazide effect on calcium and clinical consequence?","↑ Ca²⁺ reabsorption (opposite of loops) → used in calcium kidney stones."],["Metabolic side effects of thiazides?","Hyperglycaemia, hyperuricaemia, hyperlipidaemia (LDL), hypokalaemia, hyponatraemia."],["Main danger of potassium-sparing diuretics?","Hyperkalaemia (+ metabolic acidosis) – never combine with K⁺ supplements; caution with ACEI/ARB."],["Spironolactone-specific side effects?","Gynaecomastia, antiandrogenic/endocrine effects (eplerenone fewer)."],["Uses of mannitol?","Maintain urine flow (haemolysis, rhabdomyolysis), lower intracranial and intraocular pressure."],["How is SIADH treated?","ADH antagonists: conivaptan (V1+V2), tolvaptan, demeclocycline."]],"quiz":[["Which diuretic is used to treat severe hypercalcaemia (with saline)?",["Hydrochlorothiazide","Furosemide","Spironolactone","Acetazolamide"],1,"Loops increase Ca²⁺ excretion."],["A patient with recurrent calcium kidney stones – which diuretic helps?",["Furosemide","Hydrochlorothiazide","Mannitol","Acetazolamide"],1,"Thiazides increase Ca²⁺ reabsorption. Acetazolamide actually promotes stones."],["Hearing loss is a toxic effect of:",["Thiazides","Loop diuretics","Amiloride","Mannitol"],1,"Loop diuretic ototoxicity (reversible)."],["Which diuretic causes hyperkalaemic metabolic acidosis?",["Furosemide","Hydrochlorothiazide","Amiloride","Acetazolamide"],2,"K⁺-sparing diuretics."],["Prevention of acute mountain sickness:",["Furosemide","Acetazolamide","Mannitol","Spironolactone"],1,"CSF acidosis → hyperventilation."],["Central diabetes insipidus is treated with:",["Desmopressin","Conivaptan","Lithium","Demeclocycline"],0,"ADH agonist; nephrogenic DI is treated with thiazides."]],"kc":[{"t":"Hypokalaemic metabolic alkalosis","a":["hypokalaemic metabolic alkalosis","HypoK metabolic ALKALOSIS","Hypokalaemic metabolic alkalosis","hypoK alkalosis"],"d":"More Na⁺ reaching the collecting tubule → K⁺ and H⁺ secreted in exchange → low K⁺ and high pH.","x":"Loops and thiazides; prevented by K⁺-sparing diuretics."},{"t":"Self-limiting diuresis","a":["self-limiting","Self-limiting"],"d":"Acetazolamide diuresis stops in 2–3 days because body bicarbonate falls, so less is filtered.","x":""},{"t":"SIADH","a":["SIADH"],"d":"Syndrome of inappropriate ADH secretion → water retention, dilutional hyponatraemia.","x":"ADH antagonists (conivaptan, tolvaptan), demeclocycline."},{"t":"Central vs nephrogenic DI","a":["diabetes insipidus","DI"],"d":"Central: no ADH → treat with desmopressin. Nephrogenic: kidney doesn't respond → thiazides (paradoxically), salt restriction.","x":"Lithium causes nephrogenic DI."},{"t":"Osmotic diuresis","a":["osmotic","Osmotic"],"d":"Non-reabsorbable solute (mannitol) holds water in the tubule.","x":"Also draws water from brain and eye → ↓ ICP and IOP."}]},{"id":16,"t":"Histamine, Serotonin & Ergot Alkaloids","p":57,"big":"<b>Histamine</b> (from histidine; mast cells, ECL cells) – allergy, gastric acid, neurotransmitter. No therapeutic use itself; its blockers matter.<br><b>Serotonin</b> (from tryptophan; enterochromaffin cells, platelets) – carcinoid diagnosed by urinary <b>5-HIAA</b>.<br><b>Ergots</b> – partial agonists at α, 5-HT and dopamine receptors; split by target: vessels, uterus, brain.","tbl":[["H1 receptor","Gq → IP₃/DAG","Itch, pain, bronchoconstriction, vasodilation (NO), oedema","","<b>①</b> Gq-coupled → phospholipase C → IP₃ + DAG → ↑ Ca²⁺<br><b>②</b> Bronchial and gut smooth muscle contract; nerve endings → itch and pain<br><b>③</b> Endothelium releases NO → vasodilation; endothelial cells contract → gaps → oedema"],["H2 receptor","Gs → ↑ cAMP","Gastric acid, heart stimulation, ↓ mast cell release","","<b>①</b> Gs-coupled → adenylyl cyclase → ↑ cAMP<br><b>②</b> Parietal cells secrete acid; heart is stimulated<br><b>③</b> Negative feedback: inhibits further histamine release from mast cells"],["H3 / H4","H3 Gi presynaptic CNS; H4 leukocytes (eosinophils)","Chemotaxis (H4)","","<b>①</b> H3: Gi, presynaptic → inhibit histamine release in the CNS<br><b>②</b> H4: on leukocytes (eosinophils) and mast cells → chemotaxis"],["1st-gen H1: diphenhydramine, promethazine (chlorpheniramine, cyclizine less sedating)","Competitive H1 block + antimuscarinic, α, 5-HT block; local anaesthetic","Allergy, MOTION SICKNESS (diphenhydramine, dimenhydrinate, cyclizine, promethazine), chemo vomiting, hypnotic","Sedation, dry mouth, blurred vision; promethazine α-block → orthostatic hypotension; additive with alcohol/BZD","<b>①</b> Competitive antagonists (inverse agonists) at H1 receptors – they don't stop histamine release, so work best taken BEFORE exposure<br><b>②</b> Lipid-soluble → enter the CNS → sedation; act on vestibular pathways → prevent motion sickness<br><b>③</b> Structurally like muscarinic and α-blockers → also block those receptors (dry mouth, hypotension); many are local anaesthetics","Cyclizine and promethazine for PONV; diphenhydramine/chlorphenamine as second-line treatment of allergic reactions (after adrenaline in anaphylaxis).","PONV & allergy"],["2nd-gen H1: cetirizine, fexofenadine, loratadine","Less lipid-soluble","Chronic allergy (hay fever, urticaria)","Little sedation","<b>①</b> Same competitive H1 block<br><b>②</b> Much less lipid-soluble → hardly cross the blood–brain barrier → little sedation and weak autonomic effects; longer t½"],["H2 blockers: cimetidine, ranitidine, famotidine, nizatidine","Competitive H2 block → ↓ acid","Duodenal/gastric ulcer, stress ulcer prevention (IV), ZES, GORD (PPIs better)","CIMETIDINE: CYP inhibitor, ↓ hepatic blood flow, antiandrogen","<b>①</b> Competitively and selectively block H2 receptors on parietal cells<br><b>②</b> ↓ cAMP → less acid secretion (especially basal and nocturnal)<br><b>③</b> No effect on H1 or autonomic receptors. Cimetidine also binds and inhibits CYP450 enzymes","Raise gastric pH before surgery to reduce aspiration pneumonitis risk (e.g. Caesarean section, emergency surgery).","Premedication"],["Sumatriptan (triptans)","5-HT1D agonist","FIRST-LINE acute migraine & cluster headache","","<b>①</b> Agonist at 5-HT1D (and 5-HT1B) receptors on cranial vessels and trigeminal nerves<br><b>②</b> Constricts dilated cranial vessels and reduces release of inflammatory neuropeptides<br><b>③</b> Relieves migraine and cluster headache"],["Ergotamine (+ caffeine); dihydroergotamine","α partial agonist → prolonged vasoconstriction","Acute migraine; DHE for prophylaxis","Ischaemia, GANGRENE (antidote nitroprusside); adrenaline reversal","<b>①</b> Partial agonist at α-adrenoceptors and 5-HT receptors on vascular smooth muscle<br><b>②</b> Causes powerful, long-lasting vasoconstriction<br><b>③</b> As a partial agonist it can also block strong agonists → 'adrenaline reversal'"],["Ergonovine","Uterine contraction","POSTPARTUM HAEMORRHAGE – only AFTER placenta","Uterine contraction – avoid in pregnancy","<b>①</b> Acts on uterine α and 5-HT receptors → strong, sustained contraction<br><b>②</b> The uterus is most sensitive near term<br><b>③</b> Contracted uterine muscle squeezes bleeding vessels shut after delivery","Uterine atony / postpartum haemorrhage at Caesarean section – only after delivery of the placenta (causes hypertension; avoid in pre-eclampsia).","Obstetric anaesthesia"],["Bromocriptine, pergolide","D2 agonists","Hyperprolactinaemia, prolactinoma, Parkinson's","","<b>①</b> Act as agonists at dopamine D2 receptors<br><b>②</b> In the pituitary: D2 activation inhibits prolactin release (and shrinks prolactinomas)<br><b>③</b> In the basal ganglia: replace missing dopamine signalling (Parkinson's)"],["LSD","5-HT2 block peripherally; DA/5-HT agonist in brain","—","Hallucinations","<b>①</b> Peripherally a potent 5-HT2 blocker<br><b>②</b> In the brain: agonist at dopamine and serotonin receptors → hallucinations"]],"traps":["Triple response (red spot, wheal, flare) = H1 + H2.","5-HT3 = ligand-gated cation channel (area postrema, CTZ) → antagonists are antiemetics. All other 5-HT receptors are G-protein coupled.","Long-term ergots → fibroplasia (retroperitoneal, pleural, subendocardial) like carcinoid.","Serotonin syndrome: fever, muscle effects, CV instability."],"mem":["H<b>1</b> = <b>1</b>tch & allergy; H<b>2</b> = s<b>2</b>mach acid.","ERGO-<b>NOV</b>ine → <b>N</b>ew baby (uterus); ERGO-<b>TAM</b>ine → <b>T</b>ension headache/migraine (vessels)."],"cards":[["Second messengers of H1 and H2 receptors?","H1: Gq → IP₃ & DAG. H2: Gs → ↑ cAMP."],["What is the triple response?","Red spot + oedematous wheal + red flare after intradermal histamine (H1 and H2)."],["Difference between 1st and 2nd generation antihistamines?","2nd gen (cetirizine, loratadine, fexofenadine) are less lipid-soluble → little sedation, weak autonomic effects, longer t½ (12–24 h)."],["Antihistamines used for motion sickness?","Diphenhydramine, dimenhydrinate, cyclizine, promethazine."],["Why is cimetidine prone to drug interactions?","Inhibits hepatic drug-metabolising enzymes and ↓ hepatic blood flow; also antiandrogenic."],["How is carcinoid syndrome diagnosed?","Urinary 5-hydroxyindoleacetic acid (5-HIAA)."],["Which 5-HT receptor is an ion channel and why does it matter?","5-HT3 – vomiting centre/CTZ; antagonists are powerful antiemetics."],["Sumatriptan mechanism and use?","5-HT1D agonist – first-line for acute migraine and cluster headache."],["Ergonovine use and timing rule?","Postpartum haemorrhage – only after delivery of the placenta."],["Antidote for ergot vasospasm/gangrene?","Nitroprusside."],["Which ergots are D2 agonists and what for?","Bromocriptine, pergolide – hyperprolactinaemia, prolactinoma, Parkinson's."]],"quiz":[["Main toxicity distinguishing cimetidine from famotidine:",["Sedation","CYP inhibition and antiandrogen effects","Hypotension","Ototoxicity"],1,"Ranitidine and others have weaker enzyme inhibition and no endocrine effects."],["First-line drug for an acute migraine attack:",["Ergonovine","Sumatriptan","Bromocriptine","Diphenhydramine"],1,"Triptans preferred over ergots (lower toxicity)."],["An antiemetic acting on a ligand-gated ion channel blocks which receptor?",["5-HT1D","5-HT2","5-HT3","H2"],2,"5-HT3 is a 5-HT-gated cation channel."],["Postpartum bleeding after placental delivery – drug?",["Ergonovine","Sumatriptan","Cetirizine","Pergolide"],0,"Powerful, prolonged uterine contraction."],["Which antihistamine causes marked α-blockade and orthostatic hypotension?",["Loratadine","Promethazine","Fexofenadine","Famotidine"],1,"Promethazine is a phenothiazine derivative."]],"kc":[{"t":"Triple response","a":["Triple response","triple response"],"d":"Intradermal histamine → red spot (capillary dilation), wheal (oedema), flare (axon reflex) – H1 + H2.","x":""},{"t":"Carcinoid syndrome","a":["carcinoid","Carcinoid"],"d":"Serotonin-secreting tumour → flushing, diarrhoea, bronchoconstriction; diagnosed by urinary 5-HIAA.","x":""},{"t":"Serotonin syndrome","a":["Serotonin syndrome","serotonin syndrome"],"d":"Excess 5-HT → hyperthermia, muscle rigidity/myoclonus, autonomic instability, agitation.","x":"Caused by drug combinations (MAOI + SSRI, meperidine, triptans in excess)."},{"t":"Ergotism","a":["ergotism","St Anthony's fire"],"d":"Ergot poisoning: intense vasoconstriction → gangrene, plus hallucinations.","x":""}],"ex":[["Histamine in disease","Released from mast cells in IgE-mediated reactions, histamine drives <b>allergic rhinitis, urticaria and angioedema</b>; it also controls gastric acid and is a CNS neurotransmitter."]]},{"id":17,"t":"Angiotensin","p":61,"big":"<b>Angiotensinogen</b> —(renin, from juxtaglomerular apparatus)→ <b>Angiotensin I</b> (inactive decapeptide) —(ACE = kininase II)→ <b>Angiotensin II</b> (active octapeptide), rapidly degraded by peptidases.","tbl":[["AT1 receptor (Gq)","Ang II: arteriolar VASOCONSTRICTION, ALDOSTERONE release (salt retention), facilitates NA release (presynaptic)","Mediator in HTN and HF","Blocked by ARBs","<b>①</b> Gq-coupled receptor activated by angiotensin II<br><b>②</b> → arteriolar vasoconstriction (↑ resistance)<br><b>③</b> → adrenal cortex releases aldosterone → renal salt retention<br><b>④</b> → presynaptic facilitation of NA release from sympathetic nerves"],["AT2 receptor","Vasodilation via NO","Probably fetal development","","<b>①</b> Activated by Ang II but opposes AT1: vasodilation via NO<br><b>②</b> Probably important in fetal development"],["ACE inhibitors (captopril, enalapril)","↓ Ang II formation","HTN, heart failure","Compensatory ↑ renin & Ang I","<b>①</b> Inhibit ACE → Ang I is not converted to Ang II (and bradykinin isn't broken down)<br><b>②</b> Loss of Ang II feedback → renin and Ang I rise"],["ARBs (losartan, valsartan)","Oral non-peptide AT1 blockers","HTN, HF","Compensatory ↑ renin & Ang I","<b>①</b> Orally active non-peptide blockers of AT1<br><b>②</b> Ang II is present but can't act → no vasoconstriction or aldosterone release; renin and Ang I rise"],["Aliskiren","Oral renin inhibitor → ↓ Ang I and Ang II","HTN","","<b>①</b> Blocks renin's action on angiotensinogen → Ang I isn't formed<br><b>②</b> → both Ang I and Ang II fall"]],"traps":["Ang II antagonists work even in normal- and low-renin hypertension.","ACE is the same enzyme as kininase II (breaks bradykinin)."],"mem":["Ang <b>I</b> = deca (10), Ang <b>II</b> = octa (8) – ACE cuts off 2 amino acids."],"cards":[["Sequence of the renin–angiotensin cascade?","Angiotensinogen → (renin) → Ang I (decapeptide) → (ACE/kininase II) → Ang II (octapeptide)."],["Effects of angiotensin II (receptor)?","Via AT1 (Gq): arteriolar vasoconstriction, aldosterone release, ↑ NA release from adrenergic nerves."],["What does the AT2 receptor do?","Vasodilation via NO; probably important in fetal development."],["What happens to renin when ACEI/ARBs are given?","Compensatory increase in renin and angiotensin I."]],"quiz":[["Angiotensin II acts mainly through which receptor?",["AT2","AT1 (Gq)","V2","H1"],1,"All the main effects are AT1-mediated."],["Aliskiren inhibits:",["ACE","Renin","AT1","Aldosterone receptor"],1,"Direct renin inhibitor."]],"kc":[{"t":"Kininase II","a":["kininase II"],"d":"Another name for ACE – the same enzyme that breaks down bradykinin.","x":"Why ACE inhibitors raise bradykinin and cause cough."}]},{"id":20,"t":"Drugs Used in Asthma","p":62,"big":"Asthma = airway <b>inflammation</b> + reversible <b>bronchospasm</b>. IgE-activated mast cells release LTC4, LTD4 (constriction), LTB4 (chemotaxis), cytokines → chronic inflammation → hyperreactivity.<br><br><b>Acute attack → bronchodilators:</b> SABA (first), antimuscarinics, theophylline.<br><b>Chronic prevention → anti-inflammatory:</b> inhaled corticosteroids, cromolyn/nedocromil, LABA (only with steroids), leukotriene antagonists, anti-IgE.","tbl":[["SABA: salbutamol, terbutaline, metaproterenol","β2 → Gs → ↑ cAMP → bronchodilation; inhaled; ≤4–6 h","DRUG OF CHOICE for acute bronchospasm; life-saving","Tremor, tachycardia, arrhythmias, tolerance","<b>①</b> Inhaled → reach airway smooth muscle with little systemic dose<br><b>②</b> Activate β2 receptors → Gs → adenylyl cyclase → ↑ cAMP<br><b>③</b> cAMP → protein kinase A → smooth muscle relaxes → powerful bronchodilation within minutes<br><b>④</b> At high doses β2-selectivity is lost → β1 effects (tachycardia); β2 on skeletal muscle → tremor","Bronchospasm during anaesthesia; optimise asthmatics before surgery.","Airway"],["LABA: salmeterol, formoterol","Same, ≥12 h, slower onset","Prophylaxis – ONLY with corticosteroids","Alone → ↑ mortality","<b>①</b> Same β2 → cAMP pathway<br><b>②</b> Highly lipid-soluble and stay anchored in the membrane → action ≥12 h but slower onset<br><b>③</b> Make β-receptors work better with corticosteroids (steroids ↑ β-receptor responsiveness)"],["Theophylline (aminophylline = salt)","PDE inhibition → ↑ cAMP; adenosine block; hepatic P450","Nocturnal asthma (slow-release)","GI upset, tremor, insomnia; overdose → arrhythmias, CONVULSIONS. Antidote for CV toxicity: β-blockers","<b>①</b> Inhibits phosphodiesterase → cAMP isn't broken down → ↑ cAMP → bronchodilation (needs high concentrations)<br><b>②</b> Blocks adenosine receptors (adenosine can constrict airways) – link to bronchodilation not proven<br><b>③</b> May have a third unknown action; also strengthens the diaphragm, stimulates CNS and heart"],["Ipratropium, tiotropium (long-acting)","Inhaled quaternary muscarinic blockers → block vagal bronchoconstriction","COPD (better than in asthma); 1/3–2/3 of asthmatics","Minimal; NO tremor or arrhythmias","<b>①</b> Quaternary amines → inhaled, barely absorbed<br><b>②</b> Competitively block muscarinic receptors on airway smooth muscle<br><b>③</b> Vagus nerve releases ACh to constrict airways → blocked → bronchodilation (no effect on inflammation)","Adjunct for bronchospasm in ventilated patients, especially COPD.","Airway"],["Cromolyn, nedocromil","Mast cell stabilisers (↓ mediator release); insoluble → local only","Prophylaxis (children); hay fever drops; oral for food allergy","Cough, irritation. NO bronchodilation","<b>①</b> Very insoluble → act only where applied<br><b>②</b> Stabilise mast cell membranes → less release of histamine and leukotrienes when antigen binds IgE<br><b>③</b> Prevent both the early (bronchoconstriction) and late (inflammation) response, but don't relax smooth muscle"],["Inhaled corticosteroids: beclomethasone, budesonide, fluticasone, flunisolide","↓ PLA₂ → ↓ arachidonic acid; ↓ COX-2; ↑ β-responsiveness","FIRST-LINE moderate–severe asthma","Oral CANDIDIASIS, adrenal suppression, slowed growth in children","<b>①</b> Enter cells and bind the intracellular glucocorticoid receptor<br><b>②</b> Complex moves to the nucleus → binds glucocorticoid response elements (GRE) → changes gene transcription<br><b>③</b> ↓ phospholipase A₂ → less arachidonic acid → fewer leukotrienes and prostaglandins; ↓ COX-2; ↓ cytokines<br><b>④</b> ↑ β-receptor responsiveness. Inhaled = high airway dose, low systemic dose"],["Systemic: prednisone, methylprednisolone (IV)","Same","Severe asthma, STATUS ASTHMATICUS","Systemic toxicity if >2 weeks; alternate-day dosing","<b>①</b> Same genomic mechanism as inhaled steroids but given orally/IV<br><b>②</b> Reach the whole body → powerful anti-inflammation in severe attacks, but systemic toxicity with long use","IV hydrocortisone for severe bronchospasm and anaphylaxis; 'stress-dose' steroids for patients on long-term steroids (adrenal suppression).","Premedication"],["Zafirlukast, montelukast","LTD4 receptor antagonists; oral","Prophylaxis: exercise-, antigen-, ASPIRIN-induced","Low toxicity; not for acute attacks","<b>①</b> Competitively block the LTD4 (cysteinyl-leukotriene) receptor<br><b>②</b> LTC4/LTD4 can't cause bronchoconstriction, mucus secretion or inflammation<br><b>③</b> Prevent exercise-, antigen- and aspirin-induced bronchospasm"],["Zileuton","5-lipoxygenase inhibitor","Exercise/antigen/aspirin asthma","LIVER damage","<b>①</b> Inhibits 5-lipoxygenase<br><b>②</b> Arachidonic acid can't be made into leukotrienes at all<br><b>③</b> Especially useful in aspirin asthma (where blocked COX diverts arachidonic acid into leukotrienes)"],["Omalizumab","Anti-IgE monoclonal antibody; parenteral","Chronic therapy","","<b>①</b> Monoclonal antibody that binds free IgE<br><b>②</b> IgE can't attach to mast cells → antigen can't trigger mast cell activation and mediator release"]],"traps":["Theophylline clearance ↑ in smokers and young adolescents; changed by enzyme inducers/inhibitors.","Pentoxifylline (methylxanthine) → intermittent claudication (↓ blood viscosity).","Aspirin asthma: COX block diverts arachidonic acid to leukotrienes → zileuton / LT antagonists help.","Methylxanthines: caffeine (coffee), theophylline (tea), theobromine (cocoa)."],"mem":["<b>S</b>ABA = <b>S</b>OS (rescue); <b>L</b>ABA = <b>L</b>ong-term, never <b>L</b>one.","Zi<b>LEU</b>ton → <b>LIV</b>er; Mon<b>TELU</b>kast → recep<b>T</b>or."],"cards":[["Drug of choice for an acute asthma attack?","Short-acting inhaled β2-agonist (salbutamol)."],["Why must LABAs never be used alone?","Used alone they increase mortality; with corticosteroids they improve control."],["Mechanism of β2-agonists?","β2 → Gs → adenylyl cyclase → ↑ cAMP → bronchodilation."],["Common toxicity of β2-agonists?","Skeletal muscle tremor; tachycardia; arrhythmias if overused."],["Mechanisms of theophylline?","PDE inhibition (↑ cAMP, needs high conc.) and adenosine receptor block; maybe a third unknown action."],["Factors affecting theophylline clearance?","Age (highest in adolescents), smoking (↑), enzyme inducers/inhibitors."],["Toxicity of theophylline overdose and antidote?","Nausea, vomiting, hypertension, arrhythmias, convulsions – β-blockers for CV toxicity."],["Where are antimuscarinics (ipratropium) more effective – asthma or COPD?","COPD – more effective and less toxic. No tremor or arrhythmias."],["Mechanism and use of cromolyn?","Stabilises mast cells (↓ mediator release); prevents early & late response; prophylaxis esp. children. No bronchodilation."],["How do corticosteroids work in asthma?","↓ phospholipase A₂ (↓ leukotrienes), inhibit COX-2, ↑ β-receptor responsiveness."],["Most common adverse effect of inhaled corticosteroids?","Oropharyngeal candidiasis (also adrenal suppression, slowed growth)."],["Montelukast vs zileuton?","Montelukast/zafirlukast = LTD4 receptor antagonists; zileuton = 5-lipoxygenase inhibitor (liver toxicity)."],["What is omalizumab?","Anti-IgE monoclonal antibody, prevents mast cell activation; parenteral."]],"quiz":[["A child with mild asthma uses salmeterol alone. Main concern?",["Hepatotoxicity","Increased mortality without corticosteroid","Candidiasis","Ototoxicity"],1,"LABA monotherapy increases mortality."],["Which drug is preferred in COPD rather than asthma?",["Cromolyn","Tiotropium","Zafirlukast","Omalizumab"],1,"Antimuscarinics are more effective and less toxic in COPD."],["Oral thrush in an asthmatic suggests:",["Salbutamol","Inhaled corticosteroid","Montelukast","Theophylline"],1,"Changes in oropharyngeal flora → candidiasis."],["Liver damage is the toxicity of:",["Zileuton","Montelukast","Cromolyn","Ipratropium"],0,"Zileuton – 5-LOX inhibitor."],["Which drug has no bronchodilator effect but prevents allergen-induced bronchoconstriction?",["Ipratropium","Cromolyn","Theophylline","Terbutaline"],1,"Mast cell stabiliser."]],"kc":[{"t":"Bronchial hyperreactivity","a":["hyperreactivity"],"d":"Exaggerated bronchoconstriction to irritants, cold air, histamine, due to chronic airway inflammation.","x":"Anti-inflammatory drugs reduce it; bronchodilators don't."},{"t":"Early vs late response","a":["late response","late inflammatory response","early (bronchoconstriction)"],"d":"Early (minutes): mast cell mediators → bronchospasm. Late (hours): inflammatory cell influx → inflammation and hyperreactivity.","x":"Cromolyn and corticosteroids block the late response."},{"t":"Status asthmaticus","a":["status asthmaticus","STATUS ASTHMATICUS"],"d":"Severe, prolonged attack not responding to usual bronchodilators.","x":"Systemic corticosteroids are life-saving."},{"t":"Aspirin asthma","a":["aspirin asthma","ASPIRIN","aspirin allergy"],"d":"Blocking COX diverts arachidonic acid into leukotrienes → bronchospasm.","x":"Leukotriene antagonists and zileuton help."}],"ex":[["Inhaled corticosteroids – full list","Beclomethasone, budesonide, <b>dexamethasone</b>, flunisolide, fluticasone. Systemic steroids are used chronically only when other therapy fails."]]},{"id":22,"t":"Sedative-Hypnotic Drugs","p":66,"big":"Dose-dependent CNS depression: sedation → hypnosis → anaesthesia → coma/medullary depression (death). Groups: <b>benzodiazepines</b>, <b>barbiturates</b>, <b>Z-drugs</b> (zolpidem, zaleplon, eszopiclone), and atypicals <b>buspirone</b> & <b>ramelteon</b>.","tbl":[["Benzodiazepines","Bind BZ site (between α1 and γ2) on GABA_A → ↑ FREQUENCY of Cl⁻ channel opening","Anxiety/panic (alprazolam, clonazepam), insomnia (triazolam, flurazepam, estazolam), status epilepticus (IV diazepam, lorazepam), anaesthesia (midazolam), alcohol withdrawal (chlordiazepoxide, diazepam), spasticity (diazepam)","Psychomotor impairment, ANTEROGRADE AMNESIA, falls in elderly. Reversed by FLUMAZENIL","<b>①</b> Bind the benzodiazepine site on the GABA_A receptor–Cl⁻ channel (between α1 and γ2 subunits; also α2, α3, α5 isoforms)<br><b>②</b> Allosterically increase GABA's affinity/effect – they do NOTHING without GABA<br><b>③</b> ↑ FREQUENCY of Cl⁻ channel opening → Cl⁻ enters → hyperpolarisation → neurons fire less<br><b>④</b> Ceiling effect → safer in overdose. Flumazenil competitively displaces them","Midazolam: anxiolytic/amnestic premedication, procedural (conscious) sedation, co-induction; IV diazepam/midazolam stop local-anaesthetic-toxicity seizures. Reversed by flumazenil.","Premedication"],["Barbiturates (thiopental, phenobarbital, secobarbital)","Different GABA_A site → ↑ DURATION of opening; also block glutamate & Na⁺","Thiopental induction; phenobarbital seizures","More lethal overdose; INDUCE liver enzymes; contraindicated in acute intermittent PORPHYRIA. Flumazenil does NOT reverse","<b>①</b> Bind a DIFFERENT site on GABA_A<br><b>②</b> ↑ DURATION of Cl⁻ channel opening; at high doses open the channel even without GABA<br><b>③</b> Also block excitatory glutamate receptors and, at high doses, Na⁺ channels<br><b>④</b> No ceiling → deep medullary depression; flumazenil doesn't work","Thiopental: rapid IV induction; lowers intracranial pressure (neuro-anaesthesia).","Induction"],["Zolpidem, zaleplon, eszopiclone","Bind BZ1 (ω1) – only α1-containing GABA_A","Insomnia: fast onset, little disruption of sleep stages, less hangover","Milder withdrawal; 'sleep driving'; reversed by flumazenil; no enzyme induction","<b>①</b> Bind the BZ1 (ω1) site only on GABA_A receptors containing the α1 subunit<br><b>②</b> α1 receptors mediate sedation/hypnosis → sleep with little anxiolytic, anticonvulsant or muscle-relaxant action<br><b>③</b> Same frequency-type facilitation as BZDs → reversed by flumazenil"],["Buspirone","5-HT1A partial agonist","Generalised anxiety disorder (onset ~1 week); less in panic","No sedation, no anticonvulsant/muscle relaxant effect, minimal dependence; CYP3A4 (erythromycin, ketoconazole ↑); safe in pregnancy","<b>①</b> Partial agonist at 5-HT1A serotonin receptors (exact anxiolytic mechanism unknown)<br><b>②</b> Does NOT act on GABA → no sedation, no anticonvulsant/muscle-relaxant effect, no additive effect with alcohol<br><b>③</b> Needs ~1 week of adaptation → onset is slow"],["Ramelteon","Melatonin receptor agonist (suprachiasmatic nucleus)","Sleep latency","Dizziness, fatigue, ↓ testosterone, ↑ prolactin; rifampicin ↓, fluvoxamine/fluconazole ↑","<b>①</b> Activates melatonin MT1/MT2 receptors in the suprachiasmatic nucleus (body clock)<br><b>②</b> Mimics the night-time melatonin signal → shortens time to fall asleep<br><b>③</b> No GABA action → little rebound insomnia or withdrawal"]],"traps":["Lorazepam & oxazepam: conjugated, NO active metabolites. Diazepam & flurazepam: long-lived active metabolites → accumulation.","Thiopental's effect ends by REDISTRIBUTION (brain → muscle), not metabolism.","Phenobarbital partly excreted unchanged in urine.","Duration: zaleplon < zolpidem = triazolam = eszopiclone … >30 h: chlordiazepoxide, clorazepate, diazepam, phenobarbital.","Overdose deadliest with alcohol, barbiturates, carbamates. Additive CNS depression with alcohol, antihistamines, antipsychotics, opioids, TCAs.","Withdrawal (anxiety, tremor, hyperreflexia, convulsions) worse with SHORT-acting drugs. REM rebound after stopping."],"mem":["<b>F</b>requency for BZD (<b>F</b>lumazenil works) · <b>D</b>uration for Barbi<b>D</b>urates.","<b>LOT</b> – Lorazepam, Oxazepam, (Temazepam) = 'Outside The Liver' – no active metabolites."],"cards":[["How do benzodiazepines vs barbiturates affect the GABA_A Cl⁻ channel?","BZD ↑ FREQUENCY of opening; barbiturates ↑ DURATION of opening (and block glutamate receptors)."],["Where is the BZD binding site on the main GABA_A isoform?","Between α1 and γ2 subunits (isoform 2α1 2β2 1γ2)."],["Flumazenil reverses which drugs?","Benzodiazepines, zolpidem, zaleplon, eszopiclone – NOT barbiturates."],["What are β-carbolines at the BZ receptor?","Inverse agonists – cause anxiety and seizures."],["Which BZDs have no active metabolites?","Lorazepam and oxazepam (conjugation)."],["Why does thiopental act so briefly?","Redistribution from brain to other well-perfused tissues (skeletal muscle)."],["Z-drugs: receptor selectivity and advantages?","Bind only α1-containing GABA_A (BZ1/ω1); fast sleep onset, minimal sleep-stage disruption, less hangover, milder withdrawal."],["Why are barbiturates contraindicated in acute intermittent porphyria?","They increase porphyrin synthesis."],["Buspirone mechanism and characteristics?","5-HT1A partial agonist; anxiolytic without sedation, slow onset (1 week), used in GAD; minimal dependence."],["Ramelteon mechanism?","Melatonin receptor agonist in the suprachiasmatic nucleus."],["Long-acting BZDs used in alcohol withdrawal?","Chlordiazepoxide, diazepam."],["BZDs most effective long-term in panic disorder?","Alprazolam and clonazepam."]],"quiz":[["Barbiturates enhance GABA by:",["Increasing frequency of Cl⁻ channel opening","Increasing duration of Cl⁻ channel opening","Inhibiting GABA-T","Blocking GABA reuptake"],1,"Duration = barbiturates; frequency = benzodiazepines."],["An elderly patient with liver disease needs an anxiolytic BZD. Best choice:",["Diazepam","Flurazepam","Lorazepam","Chlordiazepoxide"],2,"No active metabolites (conjugation)."],["Flumazenil will NOT reverse an overdose of:",["Zolpidem","Midazolam","Phenobarbital","Eszopiclone"],2,"Barbiturates bind a different site."],["A non-sedating anxiolytic that takes about a week to work:",["Alprazolam","Buspirone","Zaleplon","Ramelteon"],1,"5-HT1A partial agonist."],["Which sedative-hypnotic INDUCES hepatic microsomal enzymes?",["Zolpidem","Phenobarbital","Lorazepam","Eszopiclone"],1,"Barbiturates and carbamates induce enzymes."]],"kc":[{"t":"Anterograde amnesia","a":["anterograde amnesia","ANTEROGRADE AMNESIA","amnesia"],"d":"Inability to form new memories after the drug is taken.","x":"Typical of benzodiazepines (midazolam premedication)."},{"t":"Redistribution","a":["redistribution","REDISTRIBUTION"],"d":"A very lipid-soluble drug's effect ends because it moves from brain to muscle/fat, not because it's eliminated.","x":"Thiopental, propofol single doses."},{"t":"Hangover effect","a":["hangover"],"d":"Next-day drowsiness and impaired psychomotor function after a hypnotic.","x":"Worst with long-acting drugs with active metabolites."},{"t":"REM rebound","a":["REM"],"d":"Increase in REM sleep after stopping a hypnotic that suppressed it.","x":""},{"t":"Cross-tolerance","a":["cross-tolerance","Cross-tolerance"],"d":"Tolerance to one drug extends to chemically different drugs with similar action.","x":"Why long-acting BZDs treat alcohol withdrawal."},{"t":"Physical dependence","a":["dependence","Dependence"],"d":"Adaptation that produces a withdrawal syndrome when the drug is stopped.","x":"Sedative withdrawal can cause fatal seizures."}]},{"id":24,"t":"Antiseizure Drugs","p":69,"big":"Goal: suppress repetitive firing in epileptic foci. Three mechanism families: <b>Na⁺ channel block</b>, <b>GABA enhancement</b>, <b>T-type Ca²⁺ block</b>. Heavy on <b>pharmacokinetics and interactions</b> (inducers vs inhibitors) – exam favourite.","tbl":[["Phenytoin (fosphenytoin IV)","Rate-dependent Na⁺ block (prolongs inactivation)","Partial & tonic-clonic seizures","Nystagmus, diplopia, sedation, GINGIVAL HYPERPLASIA, HIRSUTISM, anaemia, neuropathy, osteoporosis, fetal hydantoin syndrome; ZERO-ORDER kinetics at high doses; 97–98% protein bound; INDUCER","<b>①</b> Binds voltage-gated Na⁺ channels in the inactivated state<br><b>②</b> Keeps them inactivated longer → longer refract
