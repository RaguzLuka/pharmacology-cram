MA differ from amphetamine?","More selective for the serotonin transporter; hyperthermia, serotonin syndrome, loss of serotonergic neurons."],["Cause of death in cocaine overdose?","Arrhythmias (NA reuptake block), seizures (local anaesthetic action), respiratory depression; also MI/stroke. No antidote."],["Signs of PCP intoxication and treatment?","Psychosis, horizontal & vertical nystagmus, hypertension, seizures → parenteral benzodiazepines."],["Endogenous cannabinoids?","Anandamide and 2-arachidonylglycerol – retrograde messengers inhibiting presynaptic release."],["Which drugs are used for date rape?","Flunitrazepam (Rohypnol), GHB, chloral hydrate with alcohol."]],"quiz":[["Vertical and horizontal nystagmus, agitation and hypertension suggest:",["LSD","PCP","Heroin","Marijuana"],1,"NMDA antagonist."],["Which withdrawal is potentially life-threatening?",["Heroin","Alcohol/barbiturates","Caffeine","Marijuana"],1,"Seizures."],["Varenicline acts at:",["CB1 receptors","α4β2 nicotinic receptors (partial agonist)","μ receptors","NMDA receptors"],1,"Blocks rewarding effects of smoking."],["Hallucinogens that are NOT addictive:",["Cocaine","Amphetamine","LSD and psilocybin","Heroin"],2,"No action on DA pathways; tachyphylaxis."],["Red conjunctivae and tachycardia after smoking a plant product:",["Cocaine","Marijuana","PCP","Nicotine"],1,"Cannabinoid effects."]],"kc":[{"t":"Dependence vs addiction","a":["dependence","addiction"],"d":"Dependence = physiological adaptation with a withdrawal syndrome. Addiction = compulsive use despite harm (old 'psychological dependence').","x":""},{"t":"Reward pathway","a":["mesolimbic","reward"],"d":"Mesolimbic dopamine (VTA → nucleus accumbens); most addictive drugs increase dopamine here.","x":"PCP and classic hallucinogens don't – and hallucinogens aren't addictive."},{"t":"Withdrawal syndrome","a":["Withdrawal","withdrawal"],"d":"Rebound symptoms opposite to the drug's effects when it's stopped.","x":"Sedative withdrawal can kill; opioid withdrawal rarely does."}],"ex":[["Cocaine/amphetamines in pregnancy","Neonates of addicted mothers risk teratogenic damage (<b>cystic cortical lesions</b>). Antidepressants help post-cocaine depression."]]},{"id":33,"t":"Anaemias & Haematopoietic Growth Factors","p":100,"big":"Most anaemias = lack of <b>iron</b> (microcytic hypochromic – most common) or <b>B12/folate</b> (megaloblastic). Pernicious anaemia = no intrinsic factor. Other cytopenias → recombinant growth factors.","tbl":[["Iron: ferrous sulfate, gluconate, fumarate (oral); iron dextran, ferric gluconate, iron sucrose (parenteral)","Haem; absorbed as Fe²⁺ via DMT1 → ferroportin → Fe³⁺ on transferrin; stored as ferritin. NO excretion route – regulated by absorption","ONLY iron-deficiency anaemia; contraindicated in HAEMOLYTIC anaemia","Acute (children): necrotising gastroenteritis, acidosis, coma → DEFEROXAMINE. Chronic haemochromatosis → phlebotomy (hereditary) or deferoxamine/deferasirox (transfusions)","<b>①</b> Dietary Fe²⁺/haem enters gut cells via DMT1<br><b>②</b> Stored as ferritin, or exported by ferroportin and oxidised to Fe³⁺<br><b>③</b> Fe³⁺ travels on transferrin to the marrow, where it is built into haem → haemoglobin<br><b>④</b> No excretion route – the body controls iron only by how much it absorbs","IV iron corrects pre-operative iron-deficiency anaemia to reduce transfusion needs.","Perioperative medication"],["Vitamin B12: cyanocobalamin, hydroxocobalamin (longer t½)","Needs intrinsic factor; transcobalamin II; 5-year liver store. Methylmalonyl-CoA → succinyl-CoA; homocysteine → methionine","Pernicious anaemia, gastric resection – PARENTERAL","No significant toxicity","<b>①</b> Absorbed in the ileum bound to intrinsic factor (from parietal cells); carried by transcobalamin II; 5-year liver store<br><b>②</b> Cofactor for homocysteine → methionine (with N5-methyl-THF → THF) and methylmalonyl-CoA → succinyl-CoA<br><b>③</b> Without B12, folate is trapped as N5-methyl-THF → no THF for dTMP → DNA synthesis fails → megaloblasts<br><b>④</b> The methylmalonyl pathway failure damages nerves (folate can't fix this)"],["Folic acid","Dihydrofolate reductase → tetrahydrofolate → dTMP cycle; small stores (months)","Megaloblastic anaemia; BEFORE & DURING PREGNANCY (neural tube defects)","None – but masks B12 neurology","<b>①</b> Reduced by dihydrofolate reductase to tetrahydrofolate (THF)<br><b>②</b> THF donates one-carbon units in the dTMP cycle → thymidine for DNA synthesis<br><b>③</b> Rapidly dividing cells (red cell precursors, fetal neural tube) depend on it most"],["Epoetin alfa, darbepoetin (long), CERA (monthly)","Erythropoietin receptor in marrow","Anaemia of RENAL FAILURE; chemo, HIV, cancer","Hypertension, THROMBOSIS – keep Hb ≤ 12 g/dL","<b>①</b> Recombinant erythropoietin binds EPO receptors on marrow erythroid progenitors<br><b>②</b> Stimulates their proliferation, maturation and release of red cells<br><b>③</b> Replaces EPO that failing kidneys can't make","Occasionally used to raise haemoglobin before major surgery (e.g. patients refusing transfusion).","Perioperative medication"],["Filgrastim (G-CSF), pegfilgrastim; sargramostim (GM-CSF)","↑ neutrophils; mobilise stem cells","Neutropenia after chemo, aplastic anaemia, stem cell transplantation","G-CSF: bone pain. GM-CSF: fever, arthralgia, capillary leak","<b>①</b> G-CSF binds receptors on myeloid progenitors → ↑ neutrophil production and function<br><b>②</b> Also mobilises stem cells into the blood (for harvesting)<br><b>③</b> GM-CSF acts on earlier progenitors → neutrophils + other myeloid and megakaryocytic lines"],["Oprelvekin (IL-11)","Megakaryocyte progenitors","Thrombocytopenia after chemo","Fatigue, headache, fluid retention","<b>①</b> Interleukin-11 stimulates growth of primitive megakaryocyte progenitors → more platelets"],["Romiplostim","Thrombopoietin receptor activator","ITP refractory to therapy","","<b>①</b> Peptide–Fc fusion that activates the thrombopoietin receptor<br><b>②</b> → megakaryocytes make more platelets"]],"traps":["Folate trap: in B12 deficiency folate is stuck as N5-methyltetrahydrofolate.","Folic acid corrects the ANAEMIA of B12 deficiency but NOT the NEUROLOGICAL damage → always exclude B12 deficiency first.","B12 is made only by bacteria.","Iron deficiency more common in women, vegetarians; ↑ needs in children and pregnancy."],"mem":["<b>De</b>feroxamine = <b>De</b>-iron.","<b>F</b>ilgrastim → <b>F</b>ights infection (neutrophils); <b>E</b>poetin → <b>E</b>rythrocytes; <b>O</b>prelvekin → platelets (<b>O</b>ne-one = IL-11)."],"cards":[["Most common type of anaemia?","Microcytic hypochromic iron-deficiency anaemia."],["How is total body iron regulated?","By intestinal absorption only – there's no effective excretion mechanism."],["Iron absorption pathway?","Fe²⁺/haem enters via DMT1 → stored as ferritin or exported by ferroportin → oxidised to Fe³⁺ → carried by transferrin."],["When is iron contraindicated?","Haemolytic anaemia (iron stores already increased)."],["Treatment of acute iron poisoning?","Remove tablets, correct acidosis/electrolytes, parenteral deferoxamine."],["Treatment of chronic iron overload?","Hereditary haemochromatosis – phlebotomy; transfusional – deferoxamine or deferasirox."],["Two reactions requiring B12?","Methylmalonyl-CoA → succinyl-CoA; homocysteine → methionine (linked to folate & dTMP synthesis)."],["What is the folate trap?","In B12 deficiency, folate accumulates as N5-methyltetrahydrofolate → ↓ tetrahydrofolate → ↓ DNA synthesis."],["Why must B12 deficiency be excluded before giving folic acid?","Folic acid corrects the anaemia but not the neurological damage, which can become irreversible."],["Why is B12 given parenterally in pernicious anaemia?","Deficiency is due to lack of intrinsic factor → poor absorption."],["Main indication & risks of epoetin alfa?","Anaemia of renal failure. Hypertension, thrombosis – Hb should not exceed 12 g/dL."],["Filgrastim vs sargramostim?","Filgrastim = G-CSF (neutrophils; bone pain). Sargramostim = GM-CSF (more AEs: fever, arthralgia, capillary damage)."],["Drugs for thrombocytopenia?","Oprelvekin (IL-11) after chemo; romiplostim (TPO receptor) in refractory ITP."]],"quiz":[["A child swallows many iron tablets. Antidote:",["Penicillamine","Deferoxamine","Dimercaprol","EDTA"],1,"Chelates circulating iron."],["Megaloblastic anaemia with neuropathy treated with folate alone – result?",["Both improve","Anaemia improves, neuropathy progresses","Neither improves","Neuropathy improves only"],1,"Folate doesn't correct B12 neurology."],["Anaemia of chronic kidney disease is treated with:",["Iron dextran alone","Epoetin alfa","Filgrastim","Folic acid"],1,"Reduced erythropoietin synthesis."],["Bone pain is the typical AE of:",["Epoetin","Filgrastim (G-CSF)","Oprelvekin","Iron sucrose"],1,"G-CSF toxicity is minimal apart from bone pain."],["Folic acid supplementation before conception prevents:",["Cardiac anomalies","Neural tube defects","Cleft palate","Megaloblastic crisis"],1,"Recommended before and during pregnancy."]],"kc":[{"t":"Megaloblastic anaemia","a":["megaloblastic","Megaloblastic"],"d":"Large, immature red cells from impaired DNA synthesis – B12 or folate deficiency.","x":""},{"t":"Pernicious anaemia","a":["Pernicious","pernicious"],"d":"B12 deficiency from lack of intrinsic factor (autoimmune or after gastrectomy).","x":"Needs parenteral B12."},{"t":"Folate trap","a":["folate trap","trapped as N5-methyl-THF"],"d":"In B12 deficiency folate is stuck as N5-methyl-THF and can't be recycled to THF for DNA synthesis.","x":"Folic acid fixes the anaemia but not the neuropathy."},{"t":"Chelation","a":["chelates","chelators","DEFEROXAMINE","deferoxamine"],"d":"Drug binding a metal ion so it can be excreted (deferoxamine, deferasirox for iron).","x":""},{"t":"Stem cell mobilisation","a":["mobilise","mobilises"],"d":"G-CSF moves haematopoietic stem cells from marrow into peripheral blood for collection before transplantation.","x":""}],"ex":[["Causes of iron overload","Hereditary haemochromatosis (abnormal absorption) and frequent transfusions for haemolytic disorders such as <b>thalassaemia major</b>."]]}];

families:[
["Na⁺ channel blockers","One mechanism, four jobs: numb a nerve, calm a heart, stop a seizure.","Local anaesthetics (lidocaine, bupivacaine…) · Class 1 antiarrhythmics (procainamide, quinidine, lidocaine, flecainide) · Antiseizure drugs (phenytoin, carbamazepine, lamotrigine, valproate) · TCAs in overdose (wide QRS)","All are use-dependent – they hit fast-firing tissue most. Lidocaine sits in two chapters!"],
["GABA_A boosters","The 'brakes' of the brain – more Cl⁻ in, less firing.","Benzodiazepines (↑ frequency) · Barbiturates (↑ duration) · Z-drugs · Propofol, etomidate, inhaled anaesthetics · Alcohol","All add up dangerously; only BZDs and Z-drugs have an antidote (flumazenil). Baclofen is GABA_B (different)."],
["NO → cGMP vasodilators","Release nitric oxide → ↑ cGMP → smooth muscle relaxes.","Nitroglycerin, isosorbide di/mononitrate, amyl nitrite · Nitroprusside · Hydralazine (endothelial NO) · Muscarinic agonists (via endothelial NO) · Sildenafil (blocks cGMP breakdown)","Nitrate + sildenafil = dangerous hypotension; nitroprusside → cyanide."],
["K⁺ channel openers","Open K⁺ channels → hyperpolarise → muscle can't contract / cell can't secrete.","Minoxidil (arterioles) · Diazoxide (arterioles + pancreas → hyperglycaemia) · Adenosine (AV node) · Opioids (neurons) · Baclofen (GABA_B)","Hair growth (minoxidil), high sugar (diazoxide)."],
["K⁺ channel BLOCKERS = long QT","Delay repolarisation → longer AP → torsades risk.","Class 3 (amiodarone, sotalol, ibutilide, dofetilide) · Class 1A (quinidine, procainamide) · Quetiapine, ziprasidone, thioridazine · Citalopram","Treat torsades with magnesium."],
["Ca²⁺ channel blockers","Less Ca²⁺ in → less contraction or firing.","L-type: verapamil, diltiazem (heart) · nifedipine, amlodipine (vessels) · T-type: ethosuximide (thalamus, absence) · valproate (partly)","Verapamil avoid in VT; nifedipine → reflex tachycardia."],
["α2 agonists (central 'calm down')","Stimulate α2 → less NA release / less sympathetic outflow.","Clonidine, methyldopa (BP) · Tizanidine (spasticity) · Apraclonidine, brimonidine (glaucoma) · Dexmedetomidine (sedation, anaesthesia)","Sedation; clonidine rebound hypertension."],
["Dopamine AGONISTS vs BLOCKERS – mirror images","What one cures, the other causes.","Agonists: levodopa, bromocriptine, pramipexole, ropinirole, apomorphine, amantadine → treat Parkinson's & prolactinoma, cause psychosis/nausea · Blockers: haloperidol, phenothiazines, metoclopramide, droperidol → treat psychosis/vomiting, cause parkinsonism & ↑ prolactin","Never give a D2-blocking antiemetic to a Parkinson's patient."],
["Antimuscarinic side-effect club","Many drugs secretly block muscarinic receptors.","Atropine, scopolamine, ipratropium, benztropine (on purpose) · TCAs · 1st-gen antihistamines (diphenhydramine) · Phenothiazines (chlorpromazine, thioridazine) · Disopyramide · Clozapine/olanzapine · Amantadine · Cyclobenzaprine","Dry as a bone, red as a beet, mad as a hatter – urinary retention & glaucoma in the elderly."],
["Serotonin raisers (serotonin syndrome risk)","Anything that raises 5-HT – combine two and you get serotonin syndrome.","SSRIs, SNRIs, TCAs · MAOIs (incl. selegiline) · Meperidine · Dextromethorphan · MDMA, amphetamines · Triptans · Lithium","Rigidity, myoclonus, fever → cyproheptadine."],
["The '-mimetics' and '-lytics' of the ANS","Two systems, two directions = four boxes.","Cholinomimetics (bethanechol, pilocarpine, neostigmine) ↔ Antimuscarinics (atropine) · Sympathomimetics (adrenaline, phenylephrine, salbutamol) ↔ Adrenoceptor blockers (prazosin, propranolol)","Learn one box well and flip the signs for its opposite."],
["Drugs that end in a reversal","Know the off-switch for every on-switch.","Opioids → naloxone · BZDs/Z-drugs → flumazenil · Non-depolarising relaxants → neostigmine (+ atropine) · Organophosphates → atropine + pralidoxime · Digoxin → Fab fragments · Paracetamol → acetylcysteine · Iron → deferoxamine · Malignant hyperthermia/NMS → dantrolene","See also Compare → Antidotes."]
],

["Seizures","Bupropion, meperidine (normeperidine), theophylline, local anaesthetic overdose, clozapine (high dose), atracurium (laudanosine)","'Be My Teacher, Look Closely, Always' – Bupropion, Meperidine, Theophylline, LAs, Clozapine, Atracurium"],

method:[
["Story first, details second","Read a drug's Anki story once as a film in your head: who it is, where it works, what it fixes, what goes wrong. Then add details. A story has hooks; a list doesn't."],
["Learn families, not single drugs","Learn the family once (e.g. 'all -olols block β'), then only learn what makes each member different (esmolol = ultra-short IV, labetalol = also α, sotalol = also K⁺). That cuts the work by about 70%."],
["Use the name stem","When you meet an unknown name, check the ending first – it usually tells you the class and therefore 80% of the story."],
["Mechanism → effects → side effects","Side effects are just the mechanism happening in the wrong organ (β-blockers slow the heart AND tighten the bronchi). Derive them instead of memorising them."],
["Anki loop","Do 'Study' daily for spacing, and 'Cram' a chapter the night before an exam. Be honest: if you couldn't say mechanism + use + toxicity, press Again."],
["Say it out loud / teach it","Explaining a drug to a friend (or the wall) in 20 seconds is the fastest test of whether you know it."]
]};

</script>
<script>
const ANKI=[{"id":"1-0","ch":1,"front":"Drug–receptor bonds","story":"<p>Picture a drug arriving at its receptor and deciding how tightly to hold on. The strongest handshake is the <b>covalent bond</b>, where electrons are shared – practically <b>irreversible</b>. Weaker is the <b>electrostatic bond</b>, a cation drawn to an anion. The gentlest grips are <b>hydrogen bonds, van der Waals and hydrophobic forces</b>: weak alone, but they demand a precise fit, so they make binding very selective.</p><p>The classic iron grip is <b>phenoxybenzamine</b>: it bonds covalently to α-receptors, leaves the blood in under an hour, yet acts about <b>48 h</b> because the receptor stays blocked until new ones are made. Shape matters too – mirror-image <b>enantiomers</b> of one drug can differ in receptor affinity and metabolism.</p>","hook":"Covalent = forever (phenoxybenzamine 48 h); weak bonds = selective fit."},{"id":"1-1","ch":1,"front":"Inert binding sites","story":"<p>Not every place a drug lands is a receptor. Many molecules get caught by <b>inert binding sites</b> such as <b>albumin</b> – they bind, but nothing happens. While bound, the drug can't leave the vessel, reach its receptor or be eliminated.</p><p>So albumin becomes a <b>reservoir</b>: as <b>free drug</b> is used or cleared, bound drug is released to replace it. Only the free fraction acts and is eliminated, so inert binding quietly controls the effective concentration. Warfarin, for example, stays largely in plasma bound to albumin.</p>","hook":"Only FREE drug acts; albumin is the waiting room."},{"id":"1-2","ch":1,"front":"Aqueous diffusion","story":"<p>A small, water-loving molecule slips through <b>water-filled pores</b> between endothelial cells. Nothing pushes it – it moves passively down its <b>concentration gradient</b>, following <b>Fick's law</b>. Polar and charged molecules are water-soluble because water dipoles form a shell around them, so this is their road.</p><p>Capillary pores let most small molecules out of the blood. But at the <b>brain and testis</b> the road is closed: their capillaries <b>lack aqueous pores</b>, which is why polar drugs reach the brain so poorly.</p>","hook":"Small + polar = through pores; brain and testis have none."},{"id":"1-3","ch":1,"front":"Lipid diffusion","story":"<p>Most drugs cross membranes by dissolving into the <b>lipid bilayer</b> and drifting down their gradient – passive, by <b>Fick's law</b>. The entry ticket: only the <b>uncharged (non-ionised) form</b> dissolves in lipid, because lipid solubility falls as charge rises.</p><p>Whether a weak acid or base gets through depends on how much is uncharged at that moment – set by the local <b>pH</b> and the drug's <b>pKa</b> (Henderson–Hasselbalch). Change the pH and you change how fast it crosses.</p>","hook":"Only the UNCHARGED form swims through lipid."},{"id":"1-4","ch":1,"front":"Special carriers","story":"<p>Some drugs resemble natural substances enough to hitch a ride on their <b>transporters</b> – for amino acids, glucose, or amines (<b>NET, SERT, DAT</b>), plus pumps like <b>Na⁺/K⁺-ATPase</b>. This isn't Fick's-law diffusion: the carrier has limited seats, so transport is <b>saturable (capacity-limited)</b> with a maximum rate.</p><p>Carriers are also drug targets: <b>antidepressants work by inhibiting amine transporters</b> – an SSRI blocks SERT so serotonin lingers in the synapse.</p>","hook":"Carriers are saturable – and targets (SSRIs block SERT)."},{"id":"1-5","ch":1,"front":"Endocytosis / pinocytosis","story":"<p>Large or lipid-hating molecules such as <b>proteins</b> or <b>vitamin B12</b> can't diffuse. They bind a specialised patch of membrane, which folds inward around them and pinches off into a <b>vesicle</b> – <b>endocytosis</b> (pinocytosis).</p><p>Inside, the vesicle ruptures and releases its cargo. The process is <b>highly selective</b>, because the molecule must first bind its membrane site. Run it backwards and you get <b>exocytosis</b>.</p>","hook":"Big molecules (B12, proteins) get swallowed in vesicles."},{"id":"1-6","ch":1,"front":"Fick's law","story":"<p>Fick's law is the speed rule of passive diffusion: <b>Flux = (C1 – C2) × Area × Permeability / Thickness</b>. The bigger the <b>concentration gradient</b>, the faster the flow – that's the main driver.</p><p>Each term has a real face: huge <b>surface area</b> is why the <b>small intestine absorbs better than the stomach</b>; a thin barrier is why the <b>lungs beat the thick skin</b>; higher lipid solubility raises permeability; thicker membranes slow everything.</p>","hook":"Gradient × area × permeability ÷ thickness."},{"id":"1-7","ch":1,"front":"Henderson–Hasselbalch","story":"<p><b>log (protonated / unprotonated) = pKa – pH</b>. The twist: a <b>weak acid</b> (RCOOH) is <b>uncharged</b> when protonated and slips back across membranes, while a <b>weak base</b> (RNH₃⁺) is <b>charged</b> when protonated and gets stuck.</p><p>Doctors use this for <b>ion trapping</b>. For <b>aspirin</b> overdose (weak acid) they <b>alkalinise the urine with bicarbonate</b> – aspirin becomes RCOO⁻, can't be reabsorbed, and is excreted. For <b>methamphetamine</b> (weak base) they <b>acidify the urine with ammonium chloride</b> so it stays charged and trapped.</p>","hook":"Acids leave in Alkaline urine; bases in acidic urine."},{"id":"1-8","ch":1,"front":"First-order elimination","story":"<p>Most drugs drain like a leaky bucket: the more drug present, the faster it pours out. The elimination rate is <b>proportional to concentration</b>, so a constant <b>fraction</b> is removed per unit time.</p><p>The result is an <b>exponential fall</b> with a <b>constant half-life</b> – the level halves every t½ whatever the starting dose. This is how the vast majority of drugs behave.</p>","hook":"First-order = constant FRACTION, constant t½."},{"id":"1-9","ch":1,"front":"Zero-order elimination","story":"<p>Some drugs overwhelm their elimination machinery. The enzymes are <b>saturated</b>, so only a <b>constant amount</b> is removed per hour however high the level, and the concentration falls in a <b>straight line</b>.</p><p>There is <b>no constant half-life</b>, and a small dose increase can cause a big rise in level. Classic examples: <b>ethanol</b>, <b>phenytoin</b> and <b>aspirin at toxic doses</b>.</p>","hook":"Zero-order = constant AMOUNT: ethanol, phenytoin, toxic aspirin."},{"id":"2-0","ch":2,"front":"Efficacy (Emax)","story":"<p>Keep raising the dose and the response climbs – until it stops. That ceiling is the drug's <b>efficacy</b>, its <b>Emax</b>, the biggest effect it can ever produce: the <b>height</b> of the dose–response plateau.</p><p>Efficacy depends on the drug, receptor and tissue. A <b>partial agonist</b> has a lower Emax than a full agonist however much you give. Efficacy is <b>not potency</b>: a drug needing large milligram doses may still give the bigger maximal effect.</p>","hook":"Efficacy = how HIGH the curve goes."},{"id":"2-1","ch":2,"front":"Potency (EC50 / ED50)","story":"<p>Potency answers 'how much drug do I need?'. Plot effect against log dose and read the concentration giving <b>50% of maximum</b> – the <b>EC50</b>. The <b>smaller the EC50, the more potent</b> the drug, and the further <b>left</b> its curve.</p><p>Graded curves give the EC50; <b>quantal</b> (all-or-none, population) curves give the <b>ED50, TD50 and LD50</b>. Potency is set by <b>affinity</b> and receptor number, and says nothing about maximal effect.</p>","hook":"Potency = curve POSITION (left = more potent)."},{"id":"2-2","ch":2,"front":"Affinity (Kd)","story":"<p>Affinity is how strongly a drug grabs its receptor. On a <b>binding curve</b> (percent bound vs log concentration), <b>Kd</b> is the concentration occupying <b>50% of receptors</b>. <b>Smaller Kd = higher affinity</b>.</p><p>The plateau of that curve, <b>Bmax</b>, gives total receptor number. Comparing Kd with EC50 reveals whether a tissue has spare receptors.</p>","hook":"Kd = 50% occupancy; small Kd = tight grip."},{"id":"2-3","ch":2,"front":"Spare receptors","story":"<p>Sometimes a tissue reaches full response while most receptors are still empty. These are <b>spare receptors</b>, and the giveaway is <b>EC50 < Kd</b> – half the effect needs less than half the occupancy.</p><p>Either the effector stays switched on after the drug leaves, or there are <b>more receptors than effector molecules</b>. Spare receptors <b>increase sensitivity</b>, and explain why an <b>irreversible antagonist</b> may first shift the curve right before lowering the maximum.</p>","hook":"Full effect with partial occupancy: EC50 < Kd."},{"id":"2-4","ch":2,"front":"Full / partial / inverse agonist","story":"<p>Receptors flicker between <b>active (Ra)</b> and <b>inactive (Ri)</b> states. A <b>full agonist</b> binds Ra strongly and drives all receptors active. A <b>partial agonist</b> binds both, favouring Ra, so it gives a <b>submaximal</b> response – and next to a full agonist it <b>acts as an antagonist</b>.</p><p>An <b>inverse agonist</b> prefers Ri and switches off even the spontaneous <b>constitutive activity</b>. A <b>neutral antagonist</b> binds both states equally and does nothing alone – it just blocks.</p>","hook":"Full drives all, partial half-way, inverse below zero, neutral sits still."},{"id":"2-5","ch":2,"front":"Competitive antagonist","story":"<p>A competitive antagonist sits in the agonist's seat without switching the receptor on. Because it binds <b>reversibly</b> at the <b>same site</b>, enough agonist pushes it out.</p><p>The agonist curve <b>shifts right</b> (higher EC50) but reaches the <b>same Emax</b>: the block is <b>surmountable</b>.</p>","hook":"Competitive = right shift, same max."},{"id":"2-6","ch":2,"front":"Irreversible antagonist","story":"<p>An irreversible antagonist binds <b>covalently</b> and never lets go, permanently removing receptors from the pool. Fewer receptors means the <b>maximal response falls (↓ Emax)</b>, and no amount of agonist wins them back.</p><p>With <b>spare receptors</b> the curve may first shift right before the maximum drops. Recovery needs <b>new receptor synthesis</b>. Example: <b>phenoxybenzamine</b> at α-receptors.</p>","hook":"Irreversible = insurmountable, ↓ Emax."},{"id":"2-7","ch":2,"front":"Noncompetitive (allosteric) antagonist","story":"<p>This antagonist doesn't fight for the agonist's seat. It binds a <b>different, allosteric site</b> and twists the receptor so the agonist can't activate it even when bound.</p><p>Because they aren't competing for one site, <b>more agonist doesn't help</b>. Allosteric antagonists may be reversible or irreversible.</p>","hook":"Allosteric = binds elsewhere; more agonist doesn't help."},{"id":"2-8","ch":2,"front":"Physiological antagonist","story":"<p>A physiological antagonist never touches the first drug's receptor. It acts on <b>its own receptor</b> to produce the <b>opposite effect</b>.</p><p>Histamine narrows the bronchi via H1; <b>adrenaline</b> opens them via <b>β2</b> – how it rescues anaphylaxis. <b>Glucagon</b>, through its own receptor, reverses the cardiac effects of a <b>propranolol overdose</b>.</p>","hook":"Different receptor, opposite effect."},{"id":"2-9","ch":2,"front":"Chemical antagonist","story":"<p>A chemical antagonist ignores receptors and reacts with the drug or toxin itself, neutralising it before it can bind.</p><p><b>Dimercaprol</b> chelates <b>lead</b> and other metals; <b>pralidoxime</b> binds the phosphorus of an <b>organophosphate</b> and pulls it off the enzyme. Pure chemistry.</p>","hook":"Chemical antagonist binds the DRUG."},{"id":"2-10","ch":2,"front":"Therapeutic index / window","story":"<p>How safe is a drug? From animal quantal curves: <b>therapeutic index = TD50 / ED50</b>. A high TI means a wide gap between helpful and harmful doses – but TI can't ethically be measured in humans.</p><p>So clinicians use the <b>therapeutic window</b>: from <b>minimum effective</b> to <b>minimum toxic</b> concentration in patients – the practical dosing range.</p>","hook":"TI = TD50/ED50; window = min effective → min toxic."},{"id":"2-11","ch":2,"front":"5 transmembrane signalling mechanisms","story":"<p>A signal reaches inside a cell in five ways. <b>Lipid-soluble</b> agents (<b>steroids, NO</b>) cross the membrane to an <b>intracellular receptor</b>. <b>Insulin</b> binds a receptor that is itself a <b>tyrosine kinase</b>. <b>Cytokines</b> activate a receptor that recruits <b>JAK</b>, which phosphorylates <b>STAT</b>, which travels to the nucleus.</p><p>Some receptors are <b>ion channels</b> – ACh opens the nicotinic channel; BZDs modify GABA_A. The commonest route: receptor → <b>G protein</b> → effector such as adenylyl cyclase → <b>cAMP</b>.</p>","hook":"Inside, enzyme, JAK-STAT, channel, G protein."},{"id":"3-0","ch":3,"front":"Volume of distribution (Vd)","story":"<p>Vd asks: how big would the body need to be if the drug were spread evenly at its plasma concentration? <b>Vd = amount in body / plasma concentration</b> – an <b>apparent</b>, not real, volume.</p><p>A drug staying in plasma (warfarin on albumin) has a tiny Vd, about <b>4% of body weight</b>; one hiding in tissues (chloroquine) leaves little in plasma, so Vd can <b>exceed body volume</b>. Vd sets the <b>loading dose</b>.</p>","hook":"Vd = amount ÷ Cp → LOADING dose."},{"id":"3-1","ch":3,"front":"Clearance (CL)","story":"<p>Clearance is the volume of plasma wiped clean of drug per unit time: <b>CL = rate of elimination / Cp</b>. Constant for first-order drugs, not for zero-order ones.</p><p>Organ clearance = <b>extraction ratio × blood flow</b>. For highly extracted drugs it is <b>flow-limited</b>, so blood flow matters more than organ disease. CL decides the <b>maintenance dose</b>; disease and age change CL more than Vd.</p>","hook":"CL sets the MAINTENANCE dose."},{"id":"3-2","ch":3,"front":"Half-life (t½)","story":"<p>Half-life is born from Vd and CL: <b>t½ = 0.693 × Vd / CL</b>. Bigger Vd or smaller CL makes it longer.</p><p>It sets how fast levels rise on infusion and fall after stopping – about <b>3–4 half-lives</b> to near steady state or washout. If Vd and CL fall together (<b>lidocaine in heart failure</b>), t½ may not change.</p>","hook":"t½ = 0.693 × Vd / CL."},{"id":"3-3","ch":3,"front":"Bioavailability (F)","story":"<p>An oral tablet must be absorbed and survive the gut wall and liver – the <b>first pass</b> – before reaching the circulation. The fraction that makes it is <b>bioavailability, F</b>; IV = 100%.</p><p>It's measured from the <b>AUC</b>: F = AUC oral / AUC IV. High hepatic extraction → <b>low oral bioavailability</b>.</p>","hook":"F = AUC oral / AUC IV."},{"id":"3-4","ch":3,"front":"Extraction ratio","story":"<p>Each pass of blood through an organ removes a fraction of the drug – the <b>extraction ratio</b>.</p><p>A high hepatic extraction ratio means most of an oral dose is destroyed on first pass: <b>extensive first-pass metabolism</b>, low oral F and flow-limited clearance.</p>","hook":"High extraction = big first pass."},{"id":"3-5","ch":3,"front":"Maintenance dose","story":"<p>To hold a target level, put in what the body removes. At <b>steady state</b> dosing rate = elimination rate = CL × Cp.</p><p>So <b>dosing rate = CL × target Cp / F</b>. <b>Vd isn't in the formula</b>.</p>","hook":"Maintenance = CL × Cp / F."},{"id":"3-6","ch":3,"front":"Loading dose","story":"<p>Need the target level now? Fill the whole Vd at once: <b>loading dose = Vd × target Cp / F</b> – vital for drugs with a <b>large Vd</b>.</p><p><b>Clearance isn't in the formula</b>. A huge loading dose may need to be given slowly.</p>","hook":"Loading = Vd × Cp / F."},{"id":"3-7","ch":3,"front":"Therapeutic window","story":"<p>Every drug has a corridor between <b>minimum effective</b> and <b>minimum toxic</b> concentration; dosing keeps the trough above one and the peak below the other.</p><p><b>Theophylline</b>: <b>8–20 mg/L</b> (8–15 in some patients). A <b>narrow window</b> means smaller, more frequent doses.</p>","hook":"Theophylline 8–20 mg/L."},{"id":"4-0","ch":4,"front":"Phase I metabolism","story":"<p>A lipid-soluble drug reaches the liver and meets the <b>CYP450 mixed-function oxidases</b> of the smooth ER. In <b>phase I</b> it is <b>oxidised</b> – or reduced, deaminated or hydrolysed – adding or unmasking a group like –OH, –NH₂ or –SH.</p><p>Phase I isn't very selective, and enantiomers may differ. The product can be inactive, active or toxic. About <b>75% of CYP-metabolised drugs use CYP3A4 or CYP2D6</b>.</p>","hook":"Phase I = oxidation (CYP450), reduction, hydrolysis."},{"id":"4-1","ch":4,"front":"Phase II metabolism","story":"<p>In <b>phase II</b> the body attaches an endogenous molecule – <b>glucuronic acid, sulfate, acetate, glutathione, glycine or methyl</b> – to the drug: <b>conjugation</b>.</p><p>The conjugate is <b>polar</b>, can't be reabsorbed by the tubules, and is <b>excreted</b>. Phase II usually follows phase I, sometimes precedes it.</p>","hook":"Phase II = conjugation → polar → excreted."},{"id":"4-2","ch":4,"front":"Ester hydrolysis – succinylcholine (atypical cholinesterase)","story":"<p>Succinylcholine is an ester destroyed by <b>plasma butyrylcholinesterase</b> so fast that it normally acts about <b>5 min</b>. But <b>1 in 2500</b> people inherit an <b>atypical enzyme</b> that hydrolyses it very slowly.</p><p>In them one intubating dose causes <b>paralysis lasting hours</b>. The anaesthetic answer: keep the patient <b>sedated and ventilated</b> until the block wears off.</p>","hook":"1 in 2500 → succinylcholine apnoea for hours."},{"id":"4-3","ch":4,"front":"N-acetylation – slow acetylators (isoniazid, hydralazine, procainamide)","story":"<p><b>N-acetyltransferase</b> inactivates <b>isoniazid, hydralazine and procainamide</b>. About <b>50% of whites</b> (autosomal recessive) are <b>slow acetylators</b>.</p><p>In them the drug accumulates and causes <b>toxicity at normal doses</b> – e.g. drug-induced <b>lupus</b> with hydralazine or procainamide.</p>","hook":"Slow acetylators → lupus."},{"id":"4-4","ch":4,"front":"Enzyme inducers","story":"<p>Some drugs act like a factory foreman, switching on <b>CYP genes</b> so the liver builds more enzyme: <b>carbamazepine, phenobarbital, rifampicin</b>, plus <b>smoking</b> and <b>ethanol</b>.</p><p>Other drugs are metabolised faster and their <b>levels fall</b>. Because protein must be made, induction takes <b>days</b> to appear and to reverse.</p>","hook":"Carbamazepine, phenobarbital, rifampicin → ↓ others."},{"id":"4-5","ch":4,"front":"Enzyme inhibitors","story":"<p>Inhibitors jam the CYP machinery: <b>amiodarone, cimetidine, grapefruit juice, azole antifungals, ritonavir</b>. Other drugs are cleared slowly, levels <b>rise</b>, toxicity follows.</p><p><b>Suicide inhibitors</b> are converted into products that <b>irreversibly destroy</b> the enzyme: ethinyl oestradiol, norethindrone, spironolactone, secobarbital, allopurinol. Propranolol interacts by <b>reducing hepatic blood flow</b>.</p>","hook":"Inhibitors → ↑ levels."},{"id":"4-6","ch":4,"front":"Paracetamol (acetaminophen) toxicity","story":"<p>At normal doses paracetamol is safely conjugated with <b>glucuronide and sulfate</b>. In overdose these routes <b>saturate</b>, and more goes through <b>CYP450</b>, which makes the reactive <b>NAPQI</b>.</p><p>Glutathione neutralises NAPQI until it <b>runs out</b>; then NAPQI binds liver proteins → <b>hepatic necrosis</b>. Antidote: <b>acetylcysteine</b>, an SH donor. Ethanol and liver disease make it worse.</p>","hook":"Overdose → NAPQI → no glutathione → acetylcysteine."},{"id":"6-0","ch":6,"front":"ACh synthesis","story":"<p>Inside a cholinergic terminal, <b>choline</b> is carried in by a transporter – the <b>rate-limiting step</b>, blocked by <b>hemicholinium</b>. <b>Choline acetyltransferase (ChAT)</b> joins it to mitochondrial <b>acetyl-CoA</b>.</p><p>The new ACh is loaded into vesicles by the <b>vesicle-associated transporter (VAT)</b>, blocked by <b>vesamicol</b>, and waits for an action potential.</p>","hook":"Choline uptake (hemicholinium) → ChAT → VAT (vesamicol)."},{"id":"6-1","ch":6,"front":"ACh release","story":"<p>An action potential opens <b>Ca²⁺ channels</b>. Calcium triggers the <b>SNAREs</b>: <b>synaptobrevin</b> on the vesicle locks onto <b>SNAP-25 and syntaxin</b> on the membrane, the vesicle fuses and ACh pours out.</p><p><b>Botulinum toxin</b> cuts synaptobrevin, so <b>no ACh is released</b>. Being large and slow to diffuse, injected botox acts <b>locally</b>.</p>","hook":"Ca²⁺ → SNAREs → fusion; botulinum cuts synaptobrevin."},{"id":"6-2","ch":6,"front":"ACh termination","story":"<p>ACh lasts milliseconds in the cleft: <b>acetylcholinesterase</b> splits it into <b>acetate and choline</b>.</p><p>Choline is recycled into the terminal. AChE is the target of <b>cholinesterase inhibitors</b> – block it and ACh lingers.</p>","hook":"AChE ends ACh in milliseconds."},{"id":"6-3","ch":6,"front":"NA synthesis & storage","story":"<p>Noradrenaline begins as <b>tyrosine</b>. <b>Tyrosine hydroxylase</b> makes DOPA – the <b>rate-limiting step</b>, blocked by <b>metyrosine</b>. DOPA becomes dopamine, which is pumped into the vesicle and converted to NA.</p><p><b>Reserpine</b> blocks that vesicular pump, emptying the terminal. Amine left in the cytoplasm is destroyed by mitochondrial <b>MAO</b> – so MAO inhibitors increase stores.</p>","hook":"Tyrosine → DOPA (metyrosine) → DA → NA (reserpine)."},{"id":"6-4","ch":6,"front":"NA termination","story":"<p>NA's action ends mainly by <b>reuptake through NET</b> (DAT for dopamine) and diffusion. Outside the cleft <b>MAO and COMT</b> degrade it.</p><p>Metabolites – <b>metanephrines and VMA</b> – in 24-h urine diagnose <b>phaeochromocytoma</b>. <b>Cocaine and TCAs</b> block NET.</p>","hook":"Reuptake ends NA; metanephrines/VMA for phaeo."},{"id":"6-5","ch":6,"front":"Muscarinic receptors","story":"<p>Muscarinic receptors are <b>G-protein-coupled</b> on effector cells – heart, smooth muscle, glands, endothelium. ACh activates <b>Gq or Gi</b>, giving slower modulatory responses like parasympathetic stimulation.</p><p>Notably, <b>endothelial</b> muscarinic receptors are <b>not innervated</b> – but drugs still activate them, releasing NO.</p>","hook":"Muscarinic = G protein."},{"id":"6-6","ch":6,"front":"Nicotinic receptors","story":"<p>Nicotinic receptors are <b>ligand-gated ion channels</b>: ACh binds, the channel opens, <b>Na⁺ rushes in</b> and the cell depolarises fast.</p><p><b>NN</b> sit in autonomic <b>ganglia</b>; <b>NM</b> at the <b>neuromuscular junction</b>.</p>","hook":"Nicotinic = ion channel."},{"id":"6-7","ch":6,"front":"Adrenoceptors (overview)","story":"<p>Adrenoceptors split into <b>α</b> (vessels, presynaptic terminals, platelets, fat, brain) and <b>β</b> (heart, smooth muscle, fat). <b>α1 → Gq, α2 → Gi, all β → Gs</b>.</p><p>Dopamine receptors: <b>D1 (Gs)</b> dilates <b>renal vessels</b>; <b>D2 (Gi)</b> is presynaptic and central.</p>","hook":"α1 Gq, α2 Gi, β Gs."},{"id":"6-8","ch":6,"front":"Presynaptic α2 autoreceptors","story":"<p>Released NA turns back and binds <b>α2 autoreceptors</b> on its own terminal; via <b>Gi</b> they cut Ca²⁺ entry and <b>inhibit further release</b> – negative feedback.</p><p>This brake underlies <b>clonidine</b> (α2 agonist) and <b>mirtazapine</b> (α2 blocker). Receptors for other transmitters on the terminal are <b>heteroreceptors</b>.</p>","hook":"NA brakes its own release."},{"id":"6-9","ch":6,"front":"Baroreceptor reflex","story":"<p>When BP falls, stretch receptors signal the vasomotor centre: <b>sympathetic ↑, vagal ↓</b> → heart rate, contractility and resistance rise. The kidney releases <b>renin</b> → Ang II → aldosterone → salt and water retention.</p><p>This is why vasodilators cause <b>reflex tachycardia</b> (and pressors reflex bradycardia), and why the reflex can override a drug's direct effect.</p>","hook":"↓ BP → ↑ sympathetic + renin."},{"id":"6-10","ch":6,"front":"Autonomic control of the eye","story":"<p>Two iris muscles compete: the <b>dilator</b> is <b>α1 (sympathetic)</b> → <b>mydriasis</b>; the <b>sphincter</b> is <b>muscarinic</b> → <b>miosis</b>.</p><p>The <b>ciliary muscle</b> (M) controls <b>accommodation</b>; the <b>ciliary epithelium (β)</b> secretes aqueous humour – so <b>β-blockers lower IOP</b>.</p>","hook":"Dilator α1, sphincter M, ciliary epithelium β."},{"id":"6-x0","ch":6,"front":"Botulinum toxin","story":"<p>Botulinum toxin is molecular scissors: inside the cholinergic terminal it <b>cleaves synaptobrevin</b>, a <b>SNARE</b> protein, so vesicles can't fuse with the membrane and <b>no ACh is released</b>.</p><p>Because it is large and diffuses slowly, an injection acts <b>locally</b>, paralysing only the injected muscle – the basis of its use in focal spasm.</p>","hook":"Cuts synaptobrevin → no ACh release."},{"id":"6-x1","ch":6,"front":"Hemicholinium and vesamicol","story":"<p>Two research tools sabotage ACh production at different stations. <b>Hemicholinium</b> blocks the <b>choline transporter</b>, the rate-limiting step of ACh synthesis.</p><p><b>Vesamicol</b> blocks the <b>vesicle-associated transporter (VAT)</b>, so newly made ACh can't be loaded into vesicles.</p>","hook":"Hemicholinium halts choline uptake; vesamicol blocks loading."},{"id":"6-x2","ch":6,"front":"Metyrosine","story":"<p>Metyrosine blocks <b>tyrosine hydroxylase</b>, the <b>rate-limiting enzyme</b> converting tyrosine to DOPA.</p><p>Without it the terminal can't make dopamine or noradrenaline – the catecholamine production line stops at the first step.</p>","hook":"Blocks tyrosine hydroxylase."},{"id":"7-0","ch":7,"front":"Muscarinic agonists (bethanechol, carbachol, pilocarpine, muscarine)","story":"<p>These drugs knock directly on muscarinic doors. On smooth muscle and glands, <b>M3 → Gq → IP₃ + DAG → Ca²⁺</b> makes the gut contract and glands secrete. In the heart, <b>M2 → Gi</b> lowers cAMP and opens K⁺ channels, slowing it. On non-innervated <b>endothelial</b> M3 receptors they release <b>NO</b>: vessels dilate, BP falls and the baroreflex gives <b>reflex tachycardia</b> at small doses.</p><p><b>Pilocarpine</b> treats <b>glaucoma</b> and <b>Sjögren's</b>; <b>bethanechol</b> wakes an <b>atonic bowel or bladder</b> – in anaesthesia, <b>postoperative urinary retention and paralytic ileus</b>. Muscarine-containing mushrooms cause brief nausea, vomiting and diarrhoea.</p>","hook":"M3 squeezes, M2 slows, endothelial M3 → NO → reflex tachycardia."},{"id":"7-1","ch":7,"front":"Nicotinic agonists (nicotine, varenicline)","story":"<p>Nicotine opens the nicotinic <b>Na⁺/K⁺ channel</b> → EPSP → action potential. In ganglia the effect follows the organ's dominant division: vessels constrict (sympathetic), the gut speeds up (parasympathetic).</p><p>At the <b>end plate</b> it first causes fasciculations, then prolonged activation leaves the membrane stuck depolarised – <b>depolarising paralysis</b>. <b>Varenicline</b>, a <b>partial agonist</b>, helps <b>smoking cessation</b>.</p>","hook":"Stimulate, then depolarising block; varenicline = quit smoking."},{"id":"7-2","ch":7,"front":"Carbamates (neostigmine, physostigmine, pyridostigmine, rivastigmine)","story":"<p>A carbamate enters acetylcholinesterase posing as ACh. The enzyme cleaves it but is left <b>carbamylated</b>, recovering over <b>2–8 h</b>, so ACh builds up at every innervated synapse.</p><p>They treat <b>myasthenia gravis</b>, <b>Alzheimer's</b> (rivastigmine) and <b>reverse neuromuscular block</b>. In anaesthesia, <b>neostigmine</b> reverses non-depolarising relaxants – always with <b>atropine or glycopyrrolate</b> to block bradycardia and secretions. <b>Physostigmine</b> crosses the BBB and treats <b>central anticholinergic syndrome</b>.</p>","hook":"Carbamates block AChE 2–8 h; neostigmine + atropine."},{"id":"7-3","ch":7,"front":"Organophosphates (parathion)","story":"<p>Organophosphate insecticides such as <b>parathion</b> <b>phosphorylate</b> acetylcholinesterase, forming a very stable complex. The enzyme stays inactive for <b>days to weeks</b> until new enzyme is made, and over time the bond <b>'ages'</b> and becomes permanent.</p><p>Poisoned patients show cholinergic excess – <b>DUMBBELSS</b>: diarrhoea, urination, miosis, bronchoconstriction, bradycardia, excitation, lacrimation, salivation, sweating – with convulsions and later respiratory and cardiovascular depression.</p>","hook":"AChE inactive for weeks; beware ageing."},{"id":"7-4","ch":7,"front":"Edrophonium","story":"<p>Edrophonium is a tiny <b>short-acting</b> alcohol that occupies AChE for just <b>minutes</b>, briefly raising ACh – a perfect bedside test.</p><p>In a weak myasthenic: improvement means a <b>myasthenic crisis</b> (too little ACh effect); worsening means a <b>cholinergic crisis</b> (too much). It also <b>diagnoses myasthenia</b> and gives <b>rapid reversal of non-depolarising block</b>.</p>","hook":"Better = myasthenic, worse = cholinergic."},{"id":"7-5","ch":7,"front":"Organophosphate poisoning – treatment","story":"<p>A farmer arrives with pinpoint pupils, drooling, wheeze and twitching. First come <b>support</b> and <b>atropine</b>, which blocks the muscarinic flood – secretions, bronchospasm, bradycardia – but not the nicotinic muscle signs.</p><p>Then <b>pralidoxime</b>: its oxime binds the organophosphate's phosphorus more strongly than the enzyme does and pulls it off, <b>regenerating AChE</b> – but only before <b>ageing</b>.</p>","hook":"Atropine + pralidoxime early."},{"id":"7-x3","ch":7,"front":"Neostigmine","story":"<p>Neostigmine is a <b>quaternary carbamate</b> cholinesterase inhibitor, so it does not enter the brain. By blocking AChE for hours it raises ACh at the <b>neuromuscular junction</b> and muscarinic sites.</p><p>Its main job is <b>reversing non-depolarising neuromuscular block</b> at the end of surgery, always with <b>atropine or glycopyrrolate</b> to prevent bradycardia and secretions. It also treats <b>myasthenia gravis</b>.</p>","hook":"Quaternary: reverses the relaxant, with atropine."},{"id":"7-x4","ch":7,"front":"Physostigmine","story":"<p>Physostigmine is a carbamate cholinesterase inhibitor that, unlike neostigmine, is a <b>tertiary amine</b> and <b>crosses the blood–brain barrier</b>.</p><p>That makes it the drug for <b>central anticholinergic syndrome</b> – for example a patient waking from anaesthesia confused and agitated after antimuscarinic drugs.</p>","hook":"Crosses the BBB: central anticholinergic syndrome."},{"id":"7-x5","ch":7,"front":"Pilocarpine","story":"<p>Pilocarpine is a <b>direct muscarinic agonist</b> alkaloid. In the eye it contracts the <b>iris sphincter</b> giving <b>miosis</b>, and the ciliary muscle, opening the drainage angle and lowering intraocular pressure.</p><p>It is used for <b>glaucoma</b> and to stimulate saliva in <b>Sjögren's syndrome</b>.</p>","hook":"Miosis, glaucoma, Sjögren's."},{"id":"8-0","ch":8,"front":"Atropine","story":"<p>Atropine is the prototype <b>competitive, non-selective muscarinic blocker</b>. As a <b>tertiary amine</b> it enters brain and eye; t½ 2 h, action 4–8 h, but ≥72 h in the eye. A low dose may first cause slight <b>bradycardia</b> before the expected <b>tachycardia</b>.</p><p>In anaesthesia it is an <b>antisialagogue</b>, treats <b>bradycardia</b> (vagal reflexes, succinylcholine) and accompanies <b>neostigmine</b>; it is key in <b>organophosphate poisoning</b>. In overdose: <b>dry as a bone, red as a beet, mad as a hatter, hot</b> – <b>atropine fever</b>, worst in infants. Avoid in angle-closure glaucoma and prostatic hyperplasia.</p>","hook":"Dry, red, mad, hot – and great for bradycardia."},{"id":"8-1","ch":8,"front":"Scopolamine (hyoscine)","story":"<p>Scopolamine slips easily into the <b>CNS</b> and quiets vestibular and vomiting pathways – the standard drug for <b>motion sickness</b>, including as a <b>transdermal patch</b>.</p><p>Its central action <b>sedates</b>. In anaesthesia it is premedication for sedation, amnesia and drying secretions, and the patch prevents <b>PONV</b>.</p>","hook":"Scopolamine = motion-sickness patch."},{"id":"8-2","ch":8,"front":"Benztropine, biperiden, trihexyphenidyl","story":"<p>In Parkinson's, dopamine falls and acetylcholine becomes relatively too strong in the striatum. These <b>central muscarinic blockers</b> restore the <b>DA/ACh balance</b>.</p><p>Used for <b>Parkinson's disease</b> and, as <b>IV benztropine</b>, for <b>acute dystonia</b> from antipsychotics.</p>","hook":"Central antimuscarinics: Parkinson's, dystonia."},{"id":"8-3","ch":8,"front":"Mydriatics (atropine, homatropine, cyclopentolate, tropicamide)","story":"<p>Antimuscarinic drops block the <b>iris sphincter</b> – <b>mydriasis</b> – and paralyse the <b>ciliary muscle</b> – <b>cycloplegia</b>, ideal for eye examination.</p><p>Durations: <b>atropine 72 h, homatropine 24 h, cyclopentolate 2–12 h, tropicamide 0.5–4 h</b>. The danger is triggering <b>angle-closure glaucoma</b>.</p>","hook":"Atropine 72 h > homatropine 24 h > cyclopentolate > tropicamide."},{"id":"8-4","ch":8,"front":"Ipratropium, tiotropium","story":"<p>These <b>quaternary</b> antimuscarinics are permanently charged, so inhaled they stay in the airways, barely absorbed. They block <b>M3</b> on airway muscle and stop <b>vagal bronchoconstriction</b>.</p><p>Used in <b>asthma and COPD</b> (tiotropium long-acting), with <b>less tachycardia and arrhythmia than β-agonists</b>. In anaesthesia: <b>bronchospasm in ventilated patients</b>.</p>","hook":"Quaternary, inhaled – COPD."},{"id":"8-5","ch":8,"front":"Bladder antimuscarinics (oxybutynin, tolterodine, darifenacin, solifenacin, fesoterodine, trospium)","story":"<p>The bladder's <b>detrusor</b> contracts via <b>M3</b>. Block it and the bladder relaxes, reducing urgency and spasm.</p><p>They treat <b>urge incontinence</b>, bladder spasm and mild cystitis, with the usual dry mouth, constipation and blurred vision.</p>","hook":"Bladder M3 blockers for urge incontinence."},{"id":"8-6","ch":8,"front":"Pralidoxime","story":"<p>Pralidoxime is a <b>chemical antagonist</b>: its <b>oxime</b> binds the <b>phosphorus</b> of an organophosphate more avidly than the enzyme does, pulling it off and <b>regenerating acetylcholinesterase</b>.</p><p>It must be given early in <b>organophosphate poisoning</b>, before the bond <b>ages</b>; afterwards it no longer works.</p>","hook":"Pralidoxime regenerates AChE before ageing."},{"id":"8-x6","ch":8,"front":"Glycopyrrolate","story":"<p>Glycopyrrolate is a <b>quaternary</b> antimuscarinic: it blocks muscarinic receptors in the body but <b>does not enter the CNS</b>.</p><p>In anaesthesia it is a common alternative to atropine – drying secretions, treating <b>bradycardia</b>, and paired with <b>neostigmine</b> for reversal – without central effects.</p>","hook":"Atropine without the brain."},{"id":"9-0","ch":9,"front":"α1 receptor","story":"<p>When an agonist binds α1, <b>Gq</b> activates <b>phospholipase C</b>, splitting PIP₂ into <b>IP₃</b> (releases Ca²⁺) and <b>DAG</b> (activates PKC). Calcium makes smooth muscle contract.</p><p>The results: <b>vasoconstriction</b>, <b>mydriasis</b> (iris dilator) and <b>sphincter contraction</b>. Excess α1 stimulation causes <b>hypertension</b>.</p>","hook":"α1 → Gq → IP₃/DAG → contraction."},{"id":"9-1","ch":9,"front":"α2 receptor","story":"<p>α2 receptors couple to <b>Gi</b>, which <b>inhibits adenylyl cyclase</b> and lowers cAMP.</p><p>Presynaptically they <b>reduce NA release</b>; centrally they <b>reduce sympathetic outflow</b>; in the eye they reduce <b>aqueous humour</b>; in the gut, secretion.</p>","hook":"α2 → Gi → ↓ cAMP → ↓ release."},{"id":"9-2","ch":9,"front":"β1, β2, β3 receptors","story":"<p>All β receptors use <b>Gs → ↑ cAMP → protein kinase A</b>. In the heart (<b>β1</b>) this means faster rate, faster AV conduction and stronger contraction, plus <b>renin release</b>.</p><p><b>β2</b> relaxes bronchial, vascular and uterine muscle and drives glycogenolysis → hyperglycaemia and K⁺ shift into cells (<b>hypokalaemia</b>), plus <b>tremor</b>. <b>β3</b> drives <b>lipolysis</b>. Excess β1: tachycardia, arrhythmias.</p>","hook":"β1 heart, β2 bronchi & tremor, β3 fat."},{"id":"9-3","ch":9,"front":"D1 / D2 receptors and the dopamine dose ladder","story":"<p><b>D1 (Gs)</b> on renal and splanchnic vessels raises cAMP → <b>vasodilation</b>; <b>D2 (Gi)</b> acts presynaptically and in the brain.</p><p>Dopamine climbs a <b>dose ladder</b>: <b>low</b> dose D1 (renal vasodilation), <b>moderate</b> β1 (stronger heart), <b>high</b> α1 (vasoconstriction) – useful in <b>shock with renal failure</b>.</p>","hook":"Low D1, middle β1, high α1."},{"id":"9-4","ch":9,"front":"Adrenaline (epinephrine)","story":"<p>Adrenaline stimulates <b>all α and β receptors</b>. In anaphylaxis it is the ideal rescuer: <b>α1</b> constricts leaky vessels and raises BP, <b>β1</b> drives the heart, <b>β2</b> opens the bronchi – a <b>physiological antagonist</b> of the mediators, and the <b>drug of choice in anaphylaxis</b>.</p><p>It also provides <b>local haemostasis</b> and is added to local anaesthetics. In anaesthesia: <b>anaphylaxis</b>, <b>cardiac arrest</b>, and 1:200,000 in an LA to <b>prolong the block</b>, reduce bleeding and lower toxicity. Dangers: <b>arrhythmias</b> and stroke.</p>","hook":"α + β = anaphylaxis drug of choice."},{"id":"9-5","ch":9,"front":"Noradrenaline (norepinephrine)","story":"<p>Noradrenaline hits <b>α1 and β1 but not β2</b>. Strong α1 vasoconstriction pushes BP up, and the baroreflex answers with vagal tone, giving <b>reflex bradycardia</b> that overrides its β1 effect – unless the reflex is blocked, when tachycardia appears.</p><p>It is used in <b>shock</b>, including spinal shock; in theatre and ICU it is the infusion for persistent <b>hypotension or vasoplegia</b>, e.g. in septic patients.</p>","hook":"α1 + β1, no β2 → reflex bradycardia."},{"id":"9-6","ch":9,"front":"Phenylephrine, midodrine","story":"<p>These <b>selective α1 agonists</b> constrict skin and splanchnic vessels; resistance and BP rise, and the heart slows by <b>reflex bradycardia</b>.</p><p>Uses: <b>nasal decongestant</b>, <b>mydriasis without cycloplegia</b>, and <b>orthostatic hypotension</b> (midodrine). In anaesthesia, phenylephrine treats <b>hypotension after induction or spinal anaesthesia</b>, best when the heart rate is normal or high.</p>","hook":"Pure α1: pressor with reflex bradycardia."},{"id":"9-7","ch":9,"front":"Isoproterenol (isoprenaline)","story":"<p>Isoproterenol is a pure <b>β1 + β2 agonist</b> that nerves do not take up. β1 speeds and strengthens the heart; β2 dilates skeletal muscle vessels, so <b>diastolic BP falls</b>.</p><p>The net result: it <b>always increases heart rate</b>.</p>","hook":"β1+β2: always ↑ HR, ↓ diastolic BP."},{"id":"9-8","ch":9,"front":"Dobutamine, dopamine as inotropes","story":"<p>Dobutamine stimulates cardiac <b>β1 → Gs → ↑ cAMP → ↑ Ca²⁺</b>, so contraction strengthens and output rises.</p><p>They are used in <b>acute heart failure</b> and <b>cardiogenic shock</b>, with <b>arrhythmias</b> limiting the dose. In anaesthesia they support <b>low cardiac output during or after cardiac surgery</b>.</p>","hook":"β1 inotrope for acute failure."},{"id":"9-9","ch":9,"front":"Salbutamol (albuterol), terbutaline, salmeterol","story":"<p>These <b>β2 agonists</b> raise cAMP in bronchial smooth muscle and open the airways. <b>SABAs</b> (salbutamol, terbutaline) rescue an <b>acute asthma attack</b>; the <b>LABA</b> salmeterol is prophylaxis and must be given <b>with a corticosteroid</b>.</p><p>Side effects: <b>tremor</b> and <b>tachycardia</b>. β2 tocolytics (terbutaline, ritodrine) for premature labour have been replaced by NSAIDs, CCBs and Mg²⁺. In anaesthesia salbutamol treats <b>bronchospasm</b>.</p>","hook":"β2 opens airways; tremor; LABA never alone."},{"id":"9-10","ch":9,"front":"Clonidine, apraclonidine, brimonidine","story":"<p>These <b>α2 agonists</b> work through Gi. Orally, <b>clonidine</b> accumulates in the CNS and <b>reduces sympathetic outflow</b>, lowering BP; given IV or topically it can briefly <b>constrict vessels</b>.</p><p><b>Apraclonidine and brimonidine</b> cut aqueous humour production in <b>glaucoma</b>. In anaesthesia clonidine sedates, reduces anaesthetic and opioid requirements and prolongs nerve blocks – and must not be stopped before surgery because of <b>rebound hypertension</b>.</p>","hook":"Central ↓ BP (clonidine), glaucoma (brimonidine)."},{"id":"9-11","ch":9,"front":"Amphetamine","story":"<p>Amphetamine is an <b>indirect sympathomimetic</b>: it enters nerve terminals through transporters and <b>displaces NA and dopamine from vesicles</b>, flooding the synapse. Resisting MAO and COMT, it is <b>orally active, long-acting</b> and enters the brain, where dopamine release brings alertness, euphoria and anorexia.</p><p>Legitimate uses: <b>narcolepsy, ADHD</b> and short-term weight reduction. The dark side: <b>abuse, tolerance, paranoia and seizures</b>.</p>","hook":"Releases catecholamines: narcolepsy, ADHD, abuse."},{"id":"9-12","ch":9,"front":"Ephedrine","story":"<p>Ephedrine has a <b>mixed action</b> – it releases stored NA and also stimulates receptors directly. It is <b>orally active and long-acting</b>; its α effect tightens the bladder trigone and prostate, helping <b>urinary incontinence and enuresis</b>, and it treats <b>orthostatic hypotension</b>.</p><p>In anaesthesia it is the <b>first-line bolus for hypotension after spinal anaesthesia or induction</b>, especially with a low heart rate, since it raises both BP and HR. Because part of its action is indirect, avoid it in patients on <b>MAOIs</b>.</p>","hook":"Mixed action: spinal hypotension with low HR."},{"id":"9-13","ch":9,"front":"Cocaine and TCAs (reuptake blockers)","story":"<p>Cocaine and tricyclic antidepressants block <b>NET</b> (cocaine also DAT), so released NA isn't pumped back and lingers in the synapse, enhancing sympathetic effects.</p><p>Among sympathomimetics, <b>cocaine causes the most deaths in overdose</b>: <b>arrhythmias, myocardial infarction and seizures</b>.</p>","hook":"Reuptake block; cocaine kills by arrhythmias and seizures."},{"id":"9-x7","ch":9,"front":"Tyramine","story":"<p>Tyramine, found in foods such as aged cheese, is an <b>indirect sympathomimetic</b> that releases stored NA. Normally <b>MAO</b> in gut and liver destroys it before it can act.</p><p>In someone taking an <b>MAO inhibitor</b>, stores are larger and tyramine survives, releasing a flood of NA – a <b>hypertensive crisis</b>.</p>","hook":"MAOI + cheese = hypertensive crisis."},{"id":"9-e0","ch":9,"front":"📌 Topical α-agonists in the eye","story":"<p>Phenylephrine and <b>tetrahydrozoline</b> drops cause mydriasis (no cycloplegia) and relieve conjunctival itching and congestion. Adrenaline and its prodrug <b>dipivefrin</b> were previously used for glaucoma; now apraclonidine/brimonidine.</p>","hook":""},{"id":"9-e1","ch":9,"front":"📌 Vasoconstrictors in shock – a caution","story":"<p>α-agonists (noradrenaline, phenylephrine) can keep BP up in shock to perfuse brain, heart and kidneys, but in shock from <b>sepsis or myocardial infarction</b> vasoconstriction may worsen things because sympathetic activity is already high.</p>","hook":""},{"id":"9-e2","ch":9,"front":"📌 Indirect sympathomimetic overdose","story":"<p>Amphetamine, cocaine or <b>phenylpropanolamine</b> overdose → severe hypertension, which responds well to α-blockers.</p>","hook":""},{"id":"10-0","ch":10,"front":"Phenoxybenzamine","story":"<p>Phenoxybenzamine is the clingy one. It grabs the <b>α-receptor</b> with a <b>covalent bond</b> and never lets go, so even though it leaves the blood in under an hour, the block lasts about <b>48 hours</b> – until the cell builds new receptors. It's slightly α1-selective and also blocks 5-HT and H1 receptors.</p><p>Its big job is the patient with a <b>phaeochromocytoma</b>: the tumour can flood the body with catecholamines, but no surge can push an irreversible blocker aside. It's given for 1–2 weeks <b>before surgery</b> (also helping in carcinoid and mastocytosis). The price is <b>orthostatic hypotension</b> and <b>reflex tachycardia</b>.</p>","hook":"Covalent, 48 h, phaeochromocytoma pre-op."},{"id":"10-1","ch":10,"front":"Phentolamine","story":"<p>Phentolamine is the quick, reversible cousin – a <b>competitive, non-selective α-blocker</b> given IV, working for 20–40 minutes. It blocks α1 on vessels, so BP falls, but it also blocks presynaptic <b>α2</b>, removing the brake on noradrenaline release.</p><p>More NA plus the baroreflex makes the heart race: <b>marked reflex tachycardia</b>. Clinically it rescues several crises – BP surges during <b>phaeochromocytoma surgery</b>, <b>noradrenaline extravasation</b> (injected locally), <b>clonidine-withdrawal rebound</b>, and cocaine/amphetamine hypertension.</p>","hook":"Reversible α-block for crises – but the heart races."},{"id":"10-2","ch":10,"front":"Prazosin, doxazosin, terazosin","story":"<p>These three are the selective <b>α1-blockers</b> (8–24 h). They relax arterioles and veins, so resistance and venous return fall. Because they leave presynaptic α2 alone, NA still inhibits its own release, so there's <b>little reflex tachycardia</b>.</p><p>They treat <b>hypertension</b> and relax the prostate in <b>benign prostatic hyperplasia</b>. Their trap is the <b>first-dose effect</b> – a sudden faint on standing after the first tablet – avoided by starting with a <b>small dose at bedtime</b>.</p>","hook":"-azosin: α1 block, BPH, first-dose faint."},{"id":"10-3","ch":10,"front":"Tamsulosin","story":"<p>Tamsulosin is the specialist: it prefers the <b>α1A</b> subtype, which dominates the smooth muscle of the <b>prostate</b>.</p><p>So it relaxes the bladder outlet and helps men with <b>BPH</b> and urinary retention, with less effect on blood pressure than prazosin-type drugs.</p>","hook":"α1A → prostate, not blood pressure."},{"id":"10-4","ch":10,"front":"Yohimbine","story":"<p>Yohimbine is the rare <b>α2-selective blocker</b>. By blocking presynaptic α2 autoreceptors it removes the brake on <b>noradrenaline release</b>.</p><p>It's mostly a research tool, sometimes used (with phentolamine) for <b>erectile dysfunction</b>.</p>","hook":"Blocks α2 → more NA released."},{"id":"10-5","ch":10,"front":"Propranolol, nadolol, timolol","story":"<p>These are the <b>non-selective β-blockers</b>: they block β1 and β2 alike. Blocking cardiac β1 slows the heart, weakens contraction and lowers <b>renin</b>; that's why they treat <b>hypertension, angina and arrhythmias</b>. Timolol drops lower eye pressure in glaucoma, and nadolol is the longest-acting.</p><p>Blocking β2 is the problem: airways can tighten, so they're risky in <b>asthma</b>, and hypoglycaemia warning signs get masked. Propranolol is lipid-soluble and enters the brain (sedation, sleep problems).</p>","hook":"Non-selective: heart AND bronchi."},{"id":"10-6","ch":10,"front":"Atenolol, metoprolol, acebutolol, esmolol","story":"<p>These are the <b>β1-selective</b> blockers – they aim at the heart more than the airways, so they are preferred in <b>asthmatics and diabetics</b>. Remember: selectivity is relative and is <b>lost at high doses</b>.</p><p><b>Esmolol</b> is the sprinter: an ester broken down in blood within minutes, given IV for acute arrhythmias and to blunt the response to intubation. Atenolol is less lipid-soluble, so fewer CNS effects. Metoprolol slows chronic heart failure progression.</p>","hook":"A to M = β1-selective; esmolol = minutes, IV."},{"id":"10-7","ch":10,"front":"Labetalol, carvedilol","story":"<p>Labetalol and carvedilol wear two hats: different isomers block <b>β-receptors and α1-receptors</b>. The β-block slows the heart while the α1-block dilates vessels, so BP falls <b>without reflex tachycardia</b>.</p><p>Labetalol is used IV for hypertensive emergencies, perioperatively and in phaeochromocytoma; carvedilol is a star in <b>chronic heart failure</b>, where it reduces mortality.</p>","hook":"β + α1 block: no reflex tachycardia."},{"id":"10-8","ch":10,"front":"Pindolol, acebutolol","story":"<p>These β-blockers are <b>partial agonists</b> – they have <b>intrinsic sympathomimetic activity (ISA)</b>. They weakly stimulate the receptor while keeping strong agonists out.</p><p>The result is <b>less bradycardia</b> and, in theory, less bronchospasm – so they may be safer for asthmatics or people with slow heart rates.</p>","hook":"ISA: blocks but gently pushes too."},{"id":"10-9","ch":10,"front":"Timolol (glaucoma)","story":"<p>In the eye, the <b>ciliary epithelium</b> makes aqueous humour under β-stimulation. Timolol drops block those β-receptors, so less fluid is produced and <b>intraocular pressure falls</b> – a classic treatment for <b>open-angle glaucoma</b>.</p><p>Timolol is chosen because it has <b>no local anaesthetic (membrane-stabilising) action</b>. A β-blocker that numbed the cornea would remove the protective blink reflex and risk <b>ulcerative keratitis</b>.</p>","hook":"Timolol: ↓ aqueous, no corneal numbing."},{"id":"10-x0","ch":10,"front":"Esmolol","story":"<p>Esmolol is a <b>β1-selective</b> blocker built with an ester bond, so blood esterases destroy it within minutes. Given IV, it can be switched on and off almost instantly.</p><p>It's ideal for <b>acute arrhythmias</b> and, in anaesthesia, to blunt the <b>tachycardia and hypertension of intubation</b>.</p>","hook":"Esmolol: the minutes-long IV β-blocker."},{"id":"10-e0","ch":10,"front":"📌 Raynaud's phenomenon","story":"<p>Spasm of digital arterioles sometimes responds to α-blockers, but their efficacy is limited.</p>","hook":""},{"id":"11-0","ch":11,"front":"Thiazides (hydrochlorothiazide) – in hypertension","story":"<p>Hydrochlorothiazide blocks the <b>Na⁺/Cl⁻ cotransporter</b> in the distal tubule. Salt and water leave, <b>blood volume</b> and cardiac output fall, and over weeks an unexplained vasodilating effect joins in.</p><p>It's the gentle first choice for <b>mild hypertension</b>, with almost no compensation. Twist: its <b>maximal BP effect comes at a lower dose than maximal diuresis</b>. Watch for <b>hypokalaemia</b>.</p>","hook":"Thiazide: low dose, mild HTN, watch K⁺."},{"id":"11-1","ch":11,"front":"Loop diuretics (furosemide) – in hypertension","story":"<p>Furosemide blocks the <b>Na⁺/K⁺/2Cl⁻ cotransporter</b> in the thick ascending limb, causing a big NaCl diuresis and a sharp fall in blood volume.</p><p>Because it's so powerful it's kept for <b>moderate, severe and malignant hypertension</b> (and patients with kidney failure). Like thiazides, it can cause <b>hypokalaemia</b>.</p>","hook":"Loop for severe HTN."},{"id":"11-2","ch":11,"front":"Clonidine, methyldopa","story":"<p>Both sneak into the brainstem and stimulate <b>central α2 receptors</b> (methyldopa first turns into <b>methylnoradrenaline</b>). The brain sends less sympathetic traffic, so heart output and resistance fall. Both cause sedation and salt retention.</p><p>Each has a signature danger. Stop <b>clonidine</b> suddenly and sympathetic outflow surges – <b>rebound hypertension</b> – so taper or give phentolamine. <b>Methyldopa</b> can make the <b>Coombs test positive</b> and occasionally cause haemolytic anaemia.</p>","hook":"Central α2: clonidine rebound, methyldopa Coombs."},{"id":"11-3","ch":11,"front":"Reserpine","story":"<p>Reserpine blocks the vesicle pump, so noradrenaline can't be stored and the nerve terminal slowly <b>empties of NA</b>. Less NA per impulse means lower heart rate, venous tone and resistance; the effect lasts days to weeks until new vesicles are made.</p><p>It also empties <b>brain amines</b>, and that's its tragedy: <b>severe depression</b>. Today it's only a low-dose add-on, and it causes salt and water retention.</p>","hook":"Empties NA stores – and the mood."},{"id":"11-4","ch":11,"front":"Guanethidine","story":"<p>Guanethidine is a Trojan horse: it is carried into sympathetic nerve terminals by the <b>NA reuptake transporter (NET)</b>, then depletes NA and blocks its release. It doesn't enter the brain.</p><p>Patients get <b>orthostatic hypotension</b> and <b>sexual dysfunction</b>. Block its door – with <b>cocaine or TCAs</b>, which block NET – and it can't get in, so it stops working.</p>","hook":"Enters via NET – blocked by cocaine and TCAs."},{"id":"11-5","ch":11,"front":"Prazosin, doxazosin, terazosin – in hypertension","story":"<p>Blocking <b>α1</b> receptors relaxes arterioles and veins, lowering resistance and venous return.</p><p>They suit hypertensive men with <b>BPH</b>, but the first dose can cause a dramatic <b>orthostatic faint</b>.</p>","hook":"α1 block: HTN + BPH, first-dose faint."},{"id":"11-6","ch":11,"front":"β-blockers in hypertension","story":"<p>At first a β-blocker lowers BP by <b>slowing the heart</b> (↓ cardiac output). After a few days a second effect appears: blocking β1 on the kidney lowers <b>renin</b>, so Ang II and resistance fall. Nebivolol also vasodilates directly.</p><p>β1-selective, less lipid-soluble drugs are preferred. Metabolically they can slightly raise <b>glucose, LDL and triglycerides</b> and lower HDL.</p>","hook":"First heart rate, later renin."},{"id":"11-7","ch":11,"front":"Hydralazine","story":"<p>Hydralazine makes endothelial cells release <b>nitric oxide</b>, which relaxes <b>arterioles</b> (much less the veins). Afterload falls.</p><p>The body fights back: <b>reflex tachycardia</b> and renin-driven <b>salt and water retention</b>, so it's paired with a β-blocker and a diuretic. Its unique trap is a reversible <b>lupus-like syndrome</b>, rare below 200 mg/day.</p>","hook":"Hydralazine Has lupus."},{"id":"11-8","ch":11,"front":"Minoxidil","story":"<p>Minoxidil is a <b>prodrug</b>; the liver turns it into minoxidil sulfate, which <b>opens K⁺ channels</b> in arteriolar muscle. The cell hyperpolarises, Ca²⁺ channels can't open, and arterioles dilate strongly.</p><p>Used for <b>severe hypertension</b>, it triggers strong <b>reflex tachycardia</b>, salt retention and angina. Its famous side effect, <b>hirsutism</b>, became a use: topical minoxidil for <b>baldness</b>.</p>","hook":"Opens K⁺ channels – and grows hair."},{"id":"11-9","ch":11,"front":"Calcium channel blockers in hypertension","story":"<p>CCBs block <b>L-type Ca²⁺ channels</b>. With less Ca²⁺ entering vascular smooth muscle, arterioles dilate and resistance falls. Verapamil and diltiazem also slow the heart; nifedipine-type drugs act mostly on vessels.</p><p>Their strength is <b>weak compensation</b> – much less reflex trouble than hydralazine or minoxidil – so they're widely used in chronic hypertension.</p>","hook":"CCBs: dilate with little fight-back."},{"id":"11-10","ch":11,"front":"Nitroprusside","story":"<p>Nitroprusside is given as an <b>IV infusion</b> and acts within minutes; it is <b>light-sensitive</b>. The molecule itself releases <b>NO</b>, activating guanylyl cyclase and raising cGMP, so both arterioles and veins dilate – perfect for a <b>hypertensive emergency</b>.</p><p>Every NO it releases also frees <b>cyanide</b>, which is converted to thiocyanate. Over days of infusion these build up – <b>cyanide/thiocyanate toxicity</b> – alongside hypotension and tachycardia.</p>","hook":"Nitro-PRUSS-ide → Prussian blue → cyanide."},{"id":"11-11","ch":11,"front":"Diazoxide","story":"<p>Diazoxide is chemically a thiazide that has lost its diuretic power. It <b>opens K⁺ channels</b> in arterioles, given IV for <b>hypertensive emergencies</b> (lasting hours).</p><p>It opens K⁺ channels in pancreatic β-cells too, so <b>insulin release falls</b> – causing <b>hyperglycaemia</b>, which is useful for hypoglycaemia from an <b>insulinoma</b>. It also causes salt retention.</p>","hook":"K⁺ opener: BP down, sugar up."},{"id":"11-12","ch":11,"front":"Fenoldopam","story":"<p>Fenoldopam stimulates <b>dopamine D1 receptors</b> on arterioles, raising cAMP and dilating them.</p><p>Its action lasts only about <b>10 minutes</b>, so it's given by infusion in <b>hypertensive emergencies</b> where it can be finely titrated.</p>","hook":"D1 agonist, 10 minutes, emergencies."},{"id":"11-13","ch":11,"front":"ACE inhibitors (captopril, enalapril)","story":"<p>ACE inhibitors block the enzyme that turns Ang I into <b>Ang II</b>. Less Ang II means less vasoconstriction and less <b>aldosterone</b>. ACE is also kininase II, so <b>bradykinin</b> builds up and adds vasodilation. They treat <b>hypertension, heart failure and diabetic kidney disease</b>.</p><p>Bradykinin brings the classic <b>dry cough</b> (30%). Less aldosterone means K⁺ retention – <b>hyperkalaemia</b>. In renal artery disease they can cause <b>renal failure</b>, and they damage the fetal kidney: <b>contraindicated in pregnancy</b>.</p>","hook":"-pril: cough, K⁺ up, never in pregnancy."},{"id":"11-14","ch":11,"front":"ARBs (losartan, valsartan, irbesartan, candesartan)","story":"<p>ARBs let Ang II be made but block its <b>AT1 receptor</b>, so it can't constrict vessels or release aldosterone. Renin and Ang I rise in response.</p><p>Because ACE is untouched, bradykinin isn't raised, so <b>cough is rare</b>. They share the other ACE-inhibitor risks: <b>hyperkalaemia</b> and <b>no use in pregnancy</b>.</p>","hook":"-sartan: like -pril without the cough."},{"id":"11-15","ch":11,"front":"Aliskiren","story":"<p>Aliskiren goes to the very top of the cascade: it <b>directly inhibits renin</b>, so angiotensinogen can't become Ang I.</p><p>With both Ang I and Ang II low, BP falls. Side effects include <b>headache and diarrhoea</b>.</p>","hook":"Aliskiren stops renin itself."},{"id":"11-x1","ch":11,"front":"Methyldopa","story":"<p>Methyldopa is a prodrug converted in the brain to <b>methylnoradrenaline</b>, a central <b>α2 agonist</b> that lowers sympathetic outflow.</p><p>It sedates and causes salt retention; its signature is a <b>positive Coombs test</b> and occasional <b>haemolytic anaemia</b>.</p>","hook":"Methyldopa → Coombs positive."},{"id":"11-e0","ch":11,"front":"📌 Secondary hypertension","story":"<p>Less than 20% of hypertension is secondary (identifiable, correctable): <b>phaeochromocytoma, coarctation of the aorta, renal vascular disease, adrenocortical tumours</b>. The rest is essential (primary).</p>","hook":""},{"id":"11-e1","ch":11,"front":"📌 Baroreceptor-sensitising drugs","story":"<p>Natural <b>veratrum alkaloids</b> sensitise baroreceptor nerves → ↓ sympathetic outflow, ↑ vagal tone (historical class of sympathoplegics).</p>","hook":""},{"id":"11-e2","ch":11,"front":"📌 Other dihydropyridines","story":"<p>Besides nifedipine and amlodipine: <b>felodipine and isradipine</b> – all cause only weak compensatory responses.</p>","hook":""},{"id":"12-0","ch":12,"front":"Nitroglycerin (glyceryl trinitrate)","story":"<p>Inside smooth muscle, nitroglycerin is denitrated and releases <b>NO</b>, raising <b>cGMP</b> so myosin light chains are dephosphorylated and muscle relaxes. <b>Veins</b> are most sensitive, so venous return – <b>preload</b> – falls, the heart shrinks and wall tension and O₂ demand drop. It also relieves coronary spasm.</p><p>Swallowed, about 90% is destroyed by first-pass metabolism, so attacks are treated <b>sublingually</b> (10–20 min); patches last 24 h but <b>tolerance</b> appears after 8–10 h, so they're removed for 10–12 h. Watch for <b>throbbing headache</b>, orthostatic hypotension and reflex tachycardia, and never combine with <b>sildenafil</b>.</p>","hook":"Veins first: preload down. Never with sildenafil."},{"id":"12-1","ch":12,"front":"Isosorbide dinitrate / mononitrate","story":"<p>Isosorbide dinitrate works by the same <b>NO → cGMP</b> mechanism. In the body it is denitrated to <b>isosorbide mononitrate</b>, which is also active.</p><p>Sublingual dinitrate lasts about 30 minutes; oral forms give longer prophylaxis. Combined with hydralazine it treats chronic heart failure.</p>","hook":"Dinitrate → active mononitrate."},{"id":"12-2","ch":12,"front":"Amyl nitrite","story":"<p>Amyl nitrite is a volatile liquid that is <b>inhaled</b> for very rapid NO-mediated vasodilation; it's rarely used for angina now.</p><p>As a <b>nitrite</b> it oxidises haemoglobin to <b>methaemoglobin</b>, which binds cyanide more strongly than cytochrome oxidase does – making it a classic <b>cyanide antidote</b> (now being replaced by hydroxocobalamin).</p>","hook":"Nitrite → methaemoglobin → mops up cyanide."},{"id":"12-3","ch":12,"front":"Verapamil, diltiazem (in angina)","story":"<p>These non-dihydropyridine CCBs block L-type Ca²⁺ channels in <b>both heart and vessels</b>. The heart slows, contracts less and conducts more slowly through the AV node, so <b>O₂ demand falls</b>; vessels dilate and <b>spasm is relieved</b>.</p><p>They prevent both classic and <b>vasospastic angina</b>. Verapamil is the most likely to cause <b>AV block</b>, sinus depression and <b>heart failure</b>; constipation is common.</p>","hook":"Heart + vessels: slow, dilate, unspasm."},{"id":"12-4","ch":12,"front":"Nifedipine (dihydropyridines)","story":"<p>Nifedipine blocks L-type channels mainly in <b>vascular smooth muscle</b>. Arterioles dilate strongly, afterload falls and coronary spasm is relieved.</p><p>Because BP drops, the baroreflex speeds the heart – <b>reflex tachycardia</b>. Typical side effects are <b>flushing, dizziness, pretibial (ankle) oedema</b> and nausea.</p>","hook":"Nifedipine: vessels only → flushing, ankle oedema."},{"id":"12-5","ch":12,"front":"β-blockers in angina","story":"<p>β-blockers protect the heart by lowering <b>heart rate, contractility and BP</b>, so O₂ demand falls during exercise – <b>prophylaxis</b> of exercise-induced angina.</p><p>They don't relax coronary spasm, so they're <b>useless in vasospastic angina</b> and not for acute attacks. They raise end-diastolic volume and ejection time; combined with nitrates they cancel each other's downsides (β-block stops the reflex tachycardia).</p>","hook":"Prophylaxis only – not for spasm."},{"id":"12-x2","ch":12,"front":"GP IIb/IIIa inhibitors (abciximab, eptifibatide, tirofiban)","story":"<p>In <b>unstable angina</b>, platelets clump on a ruptured plaque. These drugs block the platelet <b>glycoprotein IIb/IIIa receptor</b>, the final step of aggregation.</p><p>They're given with urgent <b>angioplasty</b> to prevent clotting; abciximab is a monoclonal antibody (-mab).</p>","hook":"Stop platelets sticking in unstable angina."},{"id":"13-0","ch":13,"front":"Digoxin","story":"<p>Digoxin jams the <b>Na⁺/K⁺-ATPase</b> pump. A little extra Na⁺ inside means the Na⁺/Ca²⁺ exchanger pushes out less Ca²⁺, so more Ca²⁺ is stored in the sarcoplasmic reticulum and each beat is <b>stronger</b>. Vagal effects slow AV conduction, helping in <b>atrial fibrillation</b>. Oral F 60–75%, t½ 36–40 h, 60% renal. It relieves <b>symptoms</b> of systolic failure but doesn't prolong life.</p><p>Too much Ca²⁺ triggers <b>delayed afterdepolarisations</b> – extra beats and <b>bigeminy</b>, plus nausea, visual disturbances and confusion. Toxicity worsens with <b>low K⁺, low Mg²⁺, high Ca²⁺</b> and with quinidine. Treatment: K⁺ in mild cases, lidocaine/phenytoin, and <b>digoxin Fab antibodies</b> in severe poisoning.</p>","hook":"Low K, low Mg, high Ca = digoxin toxicity."},{"id":"13-1","ch":13,"front":"Loop diuretics in heart failure","story":"<p>Furosemide removes salt and water fast, cutting <b>preload</b>, and also dilates pulmonary vessels.</p><p>It's the <b>first choice</b> for <b>acute pulmonary congestion</b> and severe oedema. The <b>hypokalaemia</b> it causes can trigger digoxin toxicity.</p>","hook":"Furosemide = fast relief of a wet lung."},{"id":"13-2","ch":13,"front":"Thiazides in heart failure","story":"<p>Thiazides block Na⁺/Cl⁻ in the distal tubule for a moderate diuresis.</p><p>Enough to clear fluid in <b>mild chronic failure</b>.</p>","hook":"Mild failure → thiazide."},{"id":"13-3","ch":13,"front":"Spironolactone, eplereno
