r blocking reuptake – and also has <b>antimuscarinic</b> effects.</p><p>Its benefit is short-lived, fading within weeks. Its signature side effect is a net-like purple skin mottling called <b>livedo reticularis</b>, plus <b>peripheral oedema</b>, psychosis and urinary retention.</p>","hook":"Amantadine: releases dopamine, fights flu, paints livedo."},{"id":"28-8","ch":28,"front":"Benztropine, biperiden, orphenadrine","story":"<p>When dopamine falls in the striatum, acetylcholine becomes relatively too strong. These <b>antimuscarinic</b> drugs block striatal muscarinic receptors and restore the balance.</p><p>They improve <b>tremor and rigidity</b> but not bradykinesia, and they are also used for <b>antipsychotic-induced EPS</b>. They bring atropine-like effects and, importantly, <b>worsen tardive dyskinesia</b>.</p>","hook":"Antimuscarinics fix tremor and rigidity, not slowness."},{"id":"28-x1","ch":28,"front":"MPTP (drug-induced parkinsonism)","story":"<p>In the 1980s, people making illicit <b>meperidine</b> accidentally produced a by-product, MPTP. Once injected, it is converted to a toxin that <b>irreversibly destroys nigrostriatal dopaminergic neurons</b>.</p><p>The result is a permanent, levodopa-responsive <b>parkinsonism</b>. Remember it, alongside antipsychotics and reserpine, as a classic cause of <b>drug-induced parkinsonism</b>.</p>","hook":"MPTP – the street-drug by-product that killed the substantia nigra."},{"id":"29-0","ch":29,"front":"Haloperidol, fluphenazine","story":"<p>Haloperidol is the purest <b>D2 blocker</b> of the typicals. In the <b>mesolimbic–mesocortical</b> pathway it silences overactive dopamine and calms <b>positive symptoms</b> – hallucinations and delusions. But it can't stay there: blocking D2 in the <b>nigrostriatal</b> pathway brings the <b>most EPS</b> (parkinsonism, dystonia, akathisia), and in the pituitary it raises prolactin.</p><p>Because it barely touches muscarinic, α or H1 receptors, it causes <b>little sedation</b> and few autonomic effects. Fluphenazine, a piperazine phenothiazine, behaves similarly. In anaesthesia, small doses of haloperidol or droperidol prevent <b>PONV</b>, and droperidol + fentanyl + N₂O forms <b>neuroleptanaesthesia</b>.</p>","hook":"Haloperidol: strongest D2 → most EPS, least sedation."},{"id":"29-1","ch":29,"front":"Chlorpromazine, thioridazine","story":"<p>Chlorpromazine is the messy original phenothiazine: it blocks D2 but also <b>muscarinic, α1 and H1</b> receptors. That brings <b>sedation</b>, dry mouth and blurred vision, <b>orthostatic hypotension</b> and failed ejaculation – though the antimuscarinic effect partly protects against EPS. It can leave deposits in the front of the eye.</p><p>Thioridazine has the strongest autonomic effects of all, deposits pigment in the <b>retina</b>, and impairs cardiac conduction, causing <b>fatal ventricular arrhythmias</b>.</p>","hook":"Chlorpromazine: sedating, hypotensive; thioridazine: retina and heart."},{"id":"29-2","ch":29,"front":"Clozapine","story":"<p>Clozapine is the rescue drug for <b>refractory schizophrenia</b>. It blocks <b>D4 and 5-HT2</b> receptors but has little D2 affinity in the striatum, so it rarely causes EPS and doesn't worsen tardive dyskinesia, and it may help negative symptoms.</p><p>Its price is high: <b>agranulocytosis</b> in 1–2% of patients (so the white cell count must be monitored), <b>seizures</b> at high doses, and weight gain with diabetes.</p>","hook":"Clozapine zaps white cells and causes seizures – but works when nothing else does."},{"id":"29-3","ch":29,"front":"Olanzapine, quetiapine, risperidone","story":"<p>These atypicals block <b>5-HT2A</b> strongly as well as D2. Blocking 5-HT2A in the striatum lets more dopamine be released there, so they cause <b>fewer EPS</b>, and they may improve <b>negative symptoms</b>.</p><p>Olanzapine and quetiapine are also used alone in <b>mania</b>. Each has a signature problem: olanzapine is <b>diabetogenic</b> (weight gain), risperidone raises <b>prolactin</b> the most, and quetiapine <b>prolongs QT</b>.</p>","hook":"Olanzapine fat and sugar, risperidone prolactin, quetiapine QT."},{"id":"29-4","ch":29,"front":"Ziprasidone","story":"<p>Ziprasidone is a balanced atypical: it blocks <b>D2, 5-HT2A and 5-HT1D</b> and activates <b>5-HT1A</b>. That mix keeps EPS low and causes <b>little metabolic effect</b> and no antimuscarinic effects.</p><p>Its main concern is <b>QT prolongation</b>.</p>","hook":"Ziprasidone: metabolically clean, but watch QT."},{"id":"29-5","ch":29,"front":"Aripiprazole","story":"<p>Aripiprazole is a <b>partial agonist at D2</b> (and 5-HT1A) and a 5-HT2A antagonist. Where dopamine is excessive, as in the mesolimbic pathway, it acts as a blocker; where dopamine is low, it gives a little stimulation – a dopamine 'stabiliser'.</p><p>Used in <b>schizophrenia</b> and <b>bipolar maintenance</b>, it causes few EPS, little <b>prolactin</b> rise, little metabolic or endocrine effect and little sedation.</p>","hook":"Aripiprazole: the D2 partial agonist that balances dopamine."},{"id":"29-6","ch":29,"front":"Prochlorperazine; promethazine","story":"<p>Not every phenothiazine is an antipsychotic. Prochlorperazine blocks D2 in the <b>chemoreceptor trigger zone</b> and is used as an <b>antiemetic</b> – including for postoperative nausea and vomiting.</p><p>Promethazine, a short-side-chain phenothiazine, is mainly an <b>H1 blocker</b>: it stops itch and causes <b>sedation</b>.</p>","hook":"Phenothiazines that stop vomiting (prochlorperazine) or itch (promethazine)."},{"id":"29-7","ch":29,"front":"Lithium","story":"<p>Lithium calms mania by quietly jamming cell signalling: it inhibits the recycling of <b>inositol phosphates</b>, so <b>PIP₂</b> is depleted and less IP₃ and DAG are made by overactive amine pathways. It has a t½ of 20 h and is handled by the kidney like Na⁺ (clearance 20% of creatinine clearance).</p><p>It treats <b>acute mania</b> and prevents relapses in <b>bipolar disorder</b>. With its narrow window, levels rise with <b>dehydration, thiazides, NSAIDs, ACE inhibitors</b> and loops (fall with caffeine, theophylline), so <b>plasma levels</b> are monitored. Toxicity: tremor, sedation, ataxia, <b>hypothyroidism</b>, <b>nephrogenic diabetes insipidus</b>, oedema, acne, leukocytosis, <b>Ebstein's anomaly</b>. It can prolong neuromuscular block in anaesthesia.</p>","hook":"Lithium: thyroid down, kidney leaks water, heart anomaly in the baby."},{"id":"29-8","ch":29,"front":"Valproate, carbamazepine, lamotrigine (in bipolar disorder)","story":"<p>The antiseizure drugs found a second life in psychiatry, stabilising neuronal firing the same way they do in epilepsy (Na⁺/Ca²⁺ channel block, more GABA).</p><p><b>Valproate</b> is as effective as lithium for <b>acute mania</b>, carbamazepine also treats mania, and <b>lamotrigine</b> is used to prevent the <b>depressive phase</b> of bipolar disorder.</p>","hook":"Valproate = lithium-like for mania; lamotrigine for bipolar depression."},{"id":"29-x2","ch":29,"front":"Tardive dyskinesia & neuroleptic malignant syndrome","story":"<p>After years on antipsychotics, a patient begins making involuntary chewing and lip-smacking movements – <b>tardive dyskinesia</b>. It comes from dopamine receptor <b>supersensitivity</b>, may be irreversible, has no specific treatment and is <b>worsened by antimuscarinics</b>; clozapine doesn't worsen it.</p><p>A different emergency is <b>neuroleptic malignant syndrome</b>: muscle rigidity, impaired sweating, temperature above 41.5 °C and autonomic instability. It is treated with <b>dantrolene</b>, diazepam and dopamine agonists. Acute EPS (parkinsonism, akathisia, dystonia) are instead treated with antimuscarinics or diphenhydramine.</p>","hook":"TD = late, irreversible; NMS = hot, rigid → dantrolene."},{"id":"29-e0","ch":29,"front":"📌 Other uses of antipsychotics","story":"<p>Psychotic symptoms in <b>schizoaffective disorder</b>, <b>toxic psychosis</b> from CNS stimulants, <b>Tourette's syndrome</b>, behavioural disturbance in Alzheimer's disease and parkinsonism (newer agents). Aripiprazole and olanzapine for bipolar maintenance.</p>","hook":""},{"id":"29-e1","ch":29,"front":"📌 Thioxanthenes","story":"<p>Third typical subgroup besides phenothiazines and butyrophenones: <b>thiothixene</b>.</p>","hook":""},{"id":"29-e2","ch":29,"front":"📌 Antipsychotic overdose","story":"<p>Usually NOT fatal – except <b>thioridazine</b> (cardiotoxicity) and <b>mesoridazine</b>. Hypotension responds to fluids; seizures are treated with diazepam/phenytoin.</p>","hook":""},{"id":"30-0","ch":30,"front":"TCAs: imipramine, amitriptyline, clomipramine, doxepin","story":"<p>The tricyclics block the reuptake pumps for <b>noradrenaline and serotonin</b>, so more transmitter stays in the synapse; over weeks the receptors adapt, which matches the delayed clinical effect. But they also block <b>muscarinic, α1 and H1</b> receptors, which explains their side effects: sedation, <b>atropine-like</b> dryness, orthostatic hypotension, weight gain and conduction defects.</p><p>They suit depression with psychomotor retardation and insomnia, and also treat enuresis, chronic pain, panic and ADHD; clomipramine treats OCD. In overdose remember the <b>3 Cs: coma, convulsions, cardiotoxicity</b>. They block guanethidine's uptake, and in anaesthesia patients on TCAs respond exaggeratedly to vasopressors, so use small doses.</p>","hook":"TCA overdose: Coma, Convulsions, Cardiotoxicity."},{"id":"30-1","ch":30,"front":"SSRIs: fluoxetine, citalopram, escitalopram, fluvoxamine, paroxetine, sertraline","story":"<p>SSRIs bind an allosteric site on the <b>serotonin transporter (SERT)</b> and inhibit it selectively, so 5-HT builds up in the synapse while NA and the muscarinic, histamine and α receptors are left alone – fewer side effects and safety in overdose.</p><p>They treat <b>depression, OCD</b>, GAD, panic, PTSD, bulimia and more. Typical complaints: nausea, headache, anxiety, insomnia and <b>sexual dysfunction</b>, plus a <b>withdrawal syndrome</b> if stopped abruptly. Fluoxetine and paroxetine inhibit <b>CYP2D6</b> (fluoxetine's active metabolite norfluoxetine lasts days), fluvoxamine inhibits 1A2, and citalopram can prolong QT. With MAOIs they cause <b>serotonin syndrome</b>.</p>","hook":"SSRIs: SERT block, sexual dysfunction, CYP2D6 (fluoxetine, paroxetine)."},{"id":"30-2","ch":30,"front":"SNRIs: venlafaxine, desvenlafaxine, duloxetine","story":"<p>SNRIs inhibit both <b>SERT and NET</b>, raising serotonin and noradrenaline, but unlike TCAs they don't block H1, muscarinic or α receptors. Venlafaxine has weaker NET affinity than duloxetine and desvenlafaxine.</p><p>Besides depression they treat <b>neuropathic pain</b> and fibromyalgia; duloxetine is used for painful <b>diabetic neuropathy</b>. Venlafaxine raises <b>blood pressure</b>, has a severe <b>withdrawal syndrome</b> even after one missed dose, and is cardiotoxic in overdose; duloxetine rarely causes hepatotoxicity.</p>","hook":"SNRIs ease nerve pain; venlafaxine raises BP and bites when missed."},{"id":"30-3","ch":30,"front":"Trazodone, nefazodone","story":"<p>These antidepressants mainly <b>block 5-HT2A receptors</b> (and weakly inhibit SERT), producing antidepressant and anxiolytic effects. They also block H1 and α1, so they are strongly <b>sedating</b> – trazodone is often used as a <b>sleep aid</b>. Their short half-life means dosing 2–3 times a day.</p><p>Trazodone causes weight gain; nefazodone is a <b>CYP3A4 inhibitor</b> and can be <b>hepatotoxic</b>.</p>","hook":"Trazodone helps you sleep; nefazodone hurts the liver."},{"id":"30-4","ch":30,"front":"Mirtazapine","story":"<p>Mirtazapine takes off the brakes: it blocks presynaptic <b>α2 receptors</b>, which normally restrain the release of NA and 5-HT, so both are released more. It also blocks <b>5-HT2</b> receptors – and H1, which explains its main effects in daily life.</p><p>Patients get an antidepressant that causes <b>sedation and weight gain</b>.</p>","hook":"Mirtazapine: α2 block, sleepy and hungry."},{"id":"30-5","ch":30,"front":"Bupropion","story":"<p>Bupropion is the mysterious one – its mechanism is <b>unknown</b>, and it barely affects NA or 5-HT. It is a <b>stimulating</b> antidepressant.</p><p>Its special use is helping people <b>quit smoking</b>. Its danger: anxiety, agitation and <b>seizures</b> at high doses.</p>","hook":"Bupropion: quits cigarettes, may trigger seizures."},{"id":"30-6","ch":30,"front":"Amoxapine, maprotiline","story":"<p>These heterocyclics inhibit noradrenaline reuptake (maprotiline) or both NA and 5-HT (amoxapine). Amoxapine has an unusual extra: it blocks <b>D2 receptors</b>, so it can cause <b>parkinsonism</b> and the amenorrhoea–galactorrhoea syndrome.</p><p>Both are dangerous in overdose, causing <b>seizures and cardiotoxicity</b>.</p>","hook":"Amoxapine: the antidepressant that acts like an antipsychotic."},{"id":"30-7","ch":30,"front":"MAOIs: phenelzine, tranylcypromine (selegiline patch)","story":"<p>Inside the nerve ending, MAO-A destroys NA, 5-HT and tyramine, and MAO-B destroys dopamine. MAOIs <b>inhibit MAO</b>, so more amine is stored and released per impulse. They help depression with <b>anxiety, phobias</b> and hypochondriasis.</p><p>Danger lives in the fridge: <b>tyramine</b> from aged cheese or wine is no longer broken down, reaches nerve endings and releases massive NA → <b>hypertensive crisis</b>. With SSRIs they cause <b>serotonin syndrome</b>. In anaesthesia avoid <b>meperidine</b> and indirect sympathomimetics such as ephedrine – use direct ones like phenylephrine.</p>","hook":"MAOI + cheese = hypertensive crisis; + SSRI = serotonin syndrome."},{"id":"30-x3","ch":30,"front":"Serotonin syndrome","story":"<p>Combine two serotonin-raising drugs – classically an <b>MAOI with an SSRI</b> (first described with fluoxetine), or add meperidine, dextromethorphan, TCAs or MDMA – and serotonin overflows.</p><p>The patient develops <b>rigidity, myoclonus, hyperthermia</b>, cardiovascular instability and <b>seizures</b>. Treatment is supportive with anticonvulsants and muscle relaxants, plus the 5-HT antagonist <b>cyproheptadine</b>.</p>","hook":"Too much serotonin: hot, stiff, twitching → cyproheptadine."},{"id":"30-e0","ch":30,"front":"📌 Nefazodone interactions","story":"<p>Via CYP3A4 inhibition, nefazodone enhances <b>carbamazepine, clozapine, statins and TCAs</b>. Nefazodone and duloxetine rarely cause hepatotoxicity.</p>","hook":""},{"id":"31-0","ch":31,"front":"Strong opioid agonists: morphine, methadone, meperidine, fentanyl, levorphanol, heroin","story":"<p>Morphine docks on <b>μ receptors</b>. On the pain fibre's terminal it <b>closes Ca²⁺ channels</b>, so less glutamate and substance P are released; on the next neuron it <b>opens K⁺ channels</b> and hyperpolarises it. Acting in the spinal cord, brainstem and limbic system, it blocks both the pain signal and the suffering. Morphine-6-glucuronide is active; morphine-3-glucuronide is neuroexcitatory.</p><p>It treats severe pain, acute pulmonary oedema (morphine) and dependence (methadone). The price: <b>respiratory depression</b>, <b>constipation</b>, <b>miosis</b>, nausea, histamine release (morphine) – and <b>no tolerance develops to miosis or constipation</b>. In anaesthesia morphine gives intra- and postoperative analgesia (IV, PCA, epidural/spinal) and high-dose opioids are used in cardiac anaesthesia.</p>","hook":"μ agonists: close Ca²⁺, open K⁺ – pinpoint pupils forever."},{"id":"31-1","ch":31,"front":"Moderate (partial) agonists: codeine, hydrocodone, oxycodone","story":"<p>These opioids are weaker μ agonists with a lower <b>ceiling</b> of analgesia, so they are often combined with <b>paracetamol or NSAIDs</b> for moderate pain; codeine also suppresses <b>cough</b>.</p><p>Codeine is a <b>prodrug</b>: <b>CYP2D6</b> demethylates it to morphine. Because CYP2D6 is genetically variable, some people get little effect and others get too much.</p>","hook":"Codeine needs CYP2D6 to become morphine."},{"id":"31-2","ch":31,"front":"Meperidine (pethidine)","story":"<p>Meperidine is the opioid that breaks the rules. It is a μ agonist but also <b>blocks muscarinic receptors</b>, so it causes <b>no miosis</b> and no biliary spasm.</p><p>Its metabolite <b>normeperidine</b> excites the CNS and causes <b>seizures</b> (worse in renal failure). It inhibits serotonin reuptake, so with <b>MAOIs</b> it causes a hyperpyrexic coma and with SSRIs serotonin syndrome. In the recovery room, a small IV dose stops <b>postoperative shivering</b>.</p>","hook":"Meperidine: no miosis, normeperidine seizures, never with MAOIs."},{"id":"31-3","ch":31,"front":"Fentanyl / remifentanil","story":"<p>Fentanyl is an extremely <b>potent, lipid-soluble</b> μ agonist: given IV it acts fast and lasts 1–2 h, and its lipid solubility lets it pass through skin from a <b>72-hour patch</b>. It is the most-used intra-operative opioid, blunting the response to intubation, and is given epidurally and spinally. In large doses it can cause <b>chest wall rigidity</b>.</p><p>Remifentanil is broken down by <b>esterases</b> in blood and muscle, so it wears off in minutes – ideal for a titratable infusion during <b>TIVA</b>.</p>","hook":"Fentanyl: potent, patchable; remifentanil: gone in minutes (esterases)."},{"id":"31-4","ch":31,"front":"Buprenorphine","story":"<p>Buprenorphine is a <b>partial μ agonist</b> that grips the receptor with very high affinity and lets go slowly, so it acts for a long time. It is also a weak κ and δ antagonist.</p><p>It is used for <b>opioid withdrawal and replacement therapy</b>. Because it binds so tightly, it can displace full agonists and <b>precipitate withdrawal</b> in someone using heroin, and its respiratory depression is <b>resistant to naloxone</b>.</p>","hook":"Buprenorphine holds on so tight that naloxone can't pull it off."},{"id":"31-5","ch":31,"front":"Nalbuphine, pentazocine","story":"<p>These mixed agonist–antagonists stimulate <b>κ receptors</b> (spinal analgesia, sedation) while weakly <b>blocking μ</b>. That μ block puts a ceiling on respiratory depression, and pentazocine's analgesia is about equal to codeine.</p><p>Their κ action brings <b>dysphoria and hallucinations</b>, they cause less dependence, and they can precipitate withdrawal in μ-dependent users.</p>","hook":"κ agonist + weak μ blocker: dysphoria, less dependence."},{"id":"31-6","ch":31,"front":"Dextromethorphan; diphenoxylate, loperamide","story":"<p>Some opioids work in small, useful corners. <b>Dextromethorphan</b> suppresses the cough centre (mechanism unknown) and is used for <b>cough</b> – but at high doses it causes hallucinations and seizures.</p><p><b>Diphenoxylate and loperamide</b> act on μ receptors in the gut wall, slowing peristalsis and treating <b>diarrhoea</b>; they barely reach the brain.</p>","hook":"Dextromethorphan for cough, loperamide for diarrhoea."},{"id":"31-7","ch":31,"front":"Naloxone, nalmefene, naltrexone","story":"<p>A patient lies unconscious with pinpoint pupils and barely breathes. <b>Naloxone</b>, a pure competitive antagonist with high μ affinity, is injected IV and knocks the opioid off its receptors, rapidly reversing <b>respiratory depression</b> and coma. Because it is short-acting, it may need to be repeated.</p><p>In a dependent person it causes <b>precipitated withdrawal</b>, and after surgery it must be titrated in small doses – sudden full reversal brings pain, hypertension and pulmonary oedema. <b>Naltrexone</b> is long-acting and oral, used to block heroin in maintenance programmes and to reduce <b>alcohol craving</b>.</p>","hook":"Naloxone rescues overdose; naltrexone keeps heroin and alcohol away."},{"id":"31-8","ch":31,"front":"Alvimopan, methylnaltrexone","story":"<p>These are μ antagonists that <b>can't cross the blood–brain barrier</b>. They block opioid receptors only in the gut.</p><p>That relieves <b>opioid-induced constipation</b> while the brain's analgesia stays intact and no withdrawal is triggered.</p>","hook":"Peripheral opioid blockers: unblock the bowel, keep the pain relief."},{"id":"31-x4","ch":31,"front":"Opioid overdose, tolerance and withdrawal","story":"<p>An overdose shows the classic triad: <b>pinpoint pupils, coma and respiratory depression</b> – treated with naloxone and ventilation. Raised PCO₂ dilates cerebral vessels and <b>raises ICP</b>, so opioids are dangerous after head injury.</p><p>With chronic use <b>tolerance</b> develops to analgesia, euphoria and respiratory depression – but <b>not to miosis or constipation</b>. Cross-tolerance is incomplete, allowing opioid rotation. Stopping brings <b>withdrawal</b>: rhinorrhoea, lacrimation, piloerection, yawning, diarrhoea, muscle aches and anxiety – unpleasant but rarely fatal.</p>","hook":"Pin, Coma, Resp – and no tolerance to pupils or bowels."},{"id":"31-x7","ch":31,"front":"Methadone","story":"<p>Methadone is a long-acting oral <b>full μ agonist</b>. Its slow, steady action avoids the highs and lows of heroin.</p><p>That makes it the classic drug for <b>opioid dependence</b>: users are switched to methadone and it is then <b>tapered</b>. It is also a strong analgesic, and it shares the opioid side effects of <b>respiratory depression</b> and constipation.</p>","hook":"Methadone: long, oral, for replacement and taper."},{"id":"31-e0","ch":31,"front":"📌 Opioid endocrine & skin effects","story":"<p>Morphine releases histamine → <b>flushing and itching</b>. Opioids ↑ <b>ADH and prolactin</b> but ↓ <b>LH</b>. Exaggerated response in <b>adrenal insufficiency and hypothyroidism</b>.</p>","hook":""},{"id":"31-e1","ch":31,"front":"📌 First-pass opioids","story":"<p><b>Morphine, hydromorphone and oxymorphone</b> undergo extensive first-pass metabolism → usually parenteral or sustained-release oral forms.</p>","hook":""},{"id":"32-0","ch":32,"front":"Sedative-hypnotics of abuse: ethanol, barbiturates, BZDs, flunitrazepam, GHB, chloral hydrate","story":"<p>These drugs strengthen <b>GABA_A</b> inhibition, melting away anxiety and inhibitions, and also disinhibit the dopamine reward pathway. Some have a sinister use as <b>date-rape drugs</b>: flunitrazepam, GHB and chloral hydrate with alcohol.</p><p>Overdose depresses the medulla, so airway and ventilation must be supported (flumazenil reverses BZDs). After chronic use the brain adapts, and stopping suddenly removes the brake: <b>withdrawal can be fatal</b> because of <b>seizures</b>. It is treated with a <b>long-acting BZD</b> (diazepam, chlordiazepoxide) tapered slowly, plus clonidine or propranolol.</p>","hook":"Sedative withdrawal can kill – taper with a long-acting BZD."},{"id":"32-1","ch":32,"front":"Opioids of abuse: heroin, morphine, oxycodone (meperidine, fentanyl in health workers)","story":"<p>Opioids activate μ, κ and δ receptors and inhibit GABA interneurons in the VTA, which <b>disinhibits dopamine</b> neurons – the reward. Injected IV, heroin reaches the brain fast, producing a <b>'rush'</b> and quick tolerance and addiction. Health workers more often abuse meperidine and fentanyl.</p><p>Overdose is reversed with <b>naloxone</b>. Withdrawal is miserable but <b>rarely fatal</b>, and dependence is managed by replacing with <b>methadone</b> and tapering, or with <b>buprenorphine</b>.</p>","hook":"Opioid withdrawal is horrible but rarely fatal – methadone or buprenorphine."},{"id":"32-2","ch":32,"front":"Caffeine, nicotine","story":"<p>Caffeine stimulates the brain by blocking <b>adenosine receptors</b>; stopping it brings lethargy and headache. Nicotine activates nicotinic receptors (including <b>α4β2</b>) and releases dopamine; its withdrawal brings anxiety, and an overdose can cause <b>respiratory paralysis</b>.</p><p>To help smokers quit, <b>varenicline</b> – a partial agonist at α4β2 receptors – gives mild stimulation while blocking nicotine's reward.</p>","hook":"Caffeine blocks adenosine; varenicline helps quit nicotine."},{"id":"32-3","ch":32,"front":"Amphetamines (dextroamphetamine, methamphetamine)","story":"<p>Amphetamines slip into nerve endings, block the amine transporters and run them <b>backwards</b>, pushing <b>dopamine, NA and 5-HT</b> out into the synapse. The dopamine flood brings euphoria; the NA flood brings sympathetic overdrive.</p><p>Heavy use can cause a <b>psychosis that resembles schizophrenia</b>. Overdose brings agitation, <b>hyperthermia</b> and seizures with <b>no antidote</b>, and long-term use can cause necrotising arteritis. Withdrawal leaves the user depressed, sleepy and hungry.</p>","hook":"Amphetamines push amines out – psychosis, hyperthermia, no antidote."},{"id":"32-4","ch":32,"front":"MDMA (ecstasy), MDA, DOM","story":"<p>MDMA works mostly on the <b>serotonin transporter</b>, releasing large amounts of 5-HT, which creates feelings of empathy and intimacy.</p><p>The danger is heat and serotonin: <b>hyperthermia</b>, <b>serotonin syndrome</b> and seizures. Repeated use damages and kills <b>serotonergic neurons</b>, and users may suffer weeks of depression.</p>","hook":"Ecstasy: serotonin flood, hyperthermia, dead 5-HT neurons."},{"id":"32-5","ch":32,"front":"Cocaine","story":"<p>Cocaine blocks the <b>dopamine, NA and 5-HT transporters</b> without releasing them. Dopamine piles up and gives an intense, short euphoria. Blocking NA reuptake causes vasoconstriction, and blocking Na⁺ channels – it is also a <b>local anaesthetic</b> – contributes to seizures.</p><p>Death comes from <b>arrhythmias</b>, <b>seizures</b> or respiratory depression, and users can have an <b>MI or stroke</b>; there is <b>no antidote</b>. Withdrawal brings severe depression.</p>","hook":"Cocaine: reuptake blocker + local anaesthetic – arrhythmias, MI, stroke."},{"id":"32-6","ch":32,"front":"PCP, ketamine","story":"<p>PCP and ketamine block the <b>NMDA glutamate receptor</b> channel, disrupting cortical signalling and causing dissociation and psychosis – without any direct dopamine action.</p><p>PCP is the most dangerous of the hallucinogens: <b>psychosis</b>, horizontal and vertical <b>nystagmus</b>, hypertension and seizures. It is treated with <b>parenteral benzodiazepines</b>.</p>","hook":"PCP: NMDA block, nystagmus in all directions → benzodiazepines."},{"id":"32-7","ch":32,"front":"LSD, mescaline, psilocybin","story":"<p>These classic hallucinogens act mainly on <b>serotonin (5-HT2)</b> receptors in the cortex, altering perception and producing hallucinations. They don't touch dopamine reward pathways.</p><p>That's why they are <b>not addictive</b>; they show rapid <b>tachyphylaxis</b>. The main risk is a frightening 'bad trip'.</p>","hook":"Hallucinogens: serotonin, not dopamine – no addiction."},{"id":"32-8","ch":32,"front":"Marijuana (THC, CBD, CBN)","story":"<p>Normally the brain releases <b>anandamide</b> and 2-AG from postsynaptic cells; they travel backwards as <b>retrograde messengers</b> to inhibit presynaptic release. THC mimics them at <b>CB1</b> cannabinoid receptors.</p><p>Users get <b>red conjunctivae</b>, tachycardia and impaired judgement; withdrawal is mild. Medically, <b>dronabinol</b> treats nausea, and cannabinoids lower intraocular pressure. Rimonabant is a CB1 antagonist once used for obesity.</p>","hook":"THC hijacks CB1: red eyes, fast heart, dronabinol for nausea."},{"id":"32-9","ch":32,"front":"Inhalants: N₂O, ether, chloroform, toluene, benzene, hexane","story":"<p>Often abused by children and adolescents, volatile substances dissolve in neuronal membranes and depress the CNS much like anaesthetics.</p><p>Pure nitrous oxide displaces oxygen and can cause <b>asphyxia</b>, while industrial solvents damage the <b>liver, kidney, lungs and nerves</b>.</p>","hook":"Inhalants: anaesthetic-like high, organ damage, asphyxia."},{"id":"32-x5","ch":32,"front":"Dopamine hypothesis of addiction","story":"<p>Almost every addictive drug, by different routes, increases <b>dopamine</b> in the <b>mesolimbic reward pathway</b>. Excessive stimulation of this pathway teaches the brain to want the drug compulsively.</p><p>The exceptions – <b>PCP/ketamine</b> and the classic hallucinogens (LSD, mescaline, psilocybin) – don't act on dopamine, and hallucinogens aren't addictive. Modern terms: physiological dependence → <b>dependence</b>; psychological dependence → <b>addiction</b>.</p>","hook":"Addiction = too much mesolimbic dopamine."},{"id":"32-x8","ch":32,"front":"Varenicline","story":"<p>Varenicline is a <b>partial agonist at α4β2 nicotinic receptors</b>. It gives the brain a little of the stimulation it craves while occupying the receptors, so a cigarette's nicotine gives less reward.</p><p>It is used for <b>smoking cessation</b>.</p>","hook":"Varenicline: partial α4β2 agonist to quit smoking."},{"id":"32-e0","ch":32,"front":"📌 Cocaine/amphetamines in pregnancy","story":"<p>Neonates of addicted mothers risk teratogenic damage (<b>cystic cortical lesions</b>). Antidepressants help post-cocaine depression.</p>","hook":""},{"id":"33-0","ch":33,"front":"Iron (oral ferrous salts; parenteral iron dextran, ferric gluconate, iron sucrose)","story":"<p>Dietary iron enters gut cells as Fe²⁺ through <b>DMT1</b>, is stored as <b>ferritin</b> or exported by <b>ferroportin</b>, oxidised to Fe³⁺ and carried on <b>transferrin</b> to the marrow to build haemoglobin. The body has <b>no excretion route</b>, so it controls iron only by absorption.</p><p>Iron is only for <b>iron-deficiency anaemia</b> and is contraindicated in haemolytic anaemia. Acute poisoning in children causes necrotising gastroenteritis, acidosis and coma → <b>deferoxamine</b>. Chronic overload (haemochromatosis) is treated by phlebotomy or deferoxamine/deferasirox. Before surgery, IV iron corrects iron-deficiency anaemia.</p>","hook":"Iron in via DMT1, no way out – deferoxamine for poisoning."},{"id":"33-1","ch":33,"front":"Vitamin B12: cyanocobalamin, hydroxocobalamin","story":"<p>B12 – made only by bacteria – is absorbed in the ileum bound to <b>intrinsic factor</b>, carried by transcobalamin II and stored in the liver for about 5 years. It drives two reactions: homocysteine → methionine (recycling folate) and <b>methylmalonyl-CoA → succinyl-CoA</b>.</p><p>Without it, folate gets stuck as N5-methyl-THF (the <b>folate trap</b>), DNA synthesis fails and <b>megaloblastic anaemia</b> appears, while the methylmalonyl failure damages <b>nerves</b>. In <b>pernicious anaemia</b> or after gastric resection it is given <b>parenterally</b>; hydroxocobalamin lasts longer. It has no significant toxicity.</p>","hook":"B12 needs intrinsic factor – protects blood and nerves."},{"id":"33-2","ch":33,"front":"Folic acid","story":"<p>Folic acid is reduced by dihydrofolate reductase to <b>tetrahydrofolate</b>, which donates one-carbon units to the dTMP cycle for DNA synthesis. Stores are small and last only months, so rapidly dividing cells feel a deficiency quickly.</p><p>It treats <b>megaloblastic anaemia</b> and is given <b>before and during pregnancy</b> to prevent <b>neural tube defects</b>. The trap: folic acid corrects the anaemia of B12 deficiency but <b>not the neurological damage</b>, so B12 deficiency must always be excluded first.</p>","hook":"Folate fixes blood, not B12 nerves – and protects the neural tube."},{"id":"33-3","ch":33,"front":"Epoetin alfa, darbepoetin, CERA","story":"<p>Failing kidneys stop making erythropoietin. Recombinant epoetin binds <b>EPO receptors</b> on erythroid progenitors in the marrow and drives them to proliferate and mature into red cells. Darbepoetin lasts longer and CERA is given monthly.</p><p>It treats the <b>anaemia of renal failure</b>, and also anaemia from chemotherapy, HIV and cancer. Push haemoglobin too high and you risk <b>hypertension and thrombosis</b>, so keep Hb ≤ 12 g/dL.</p>","hook":"Epoetin for kidney anaemia – keep Hb ≤ 12 g/dL."},{"id":"33-4","ch":33,"front":"Filgrastim (G-CSF), pegfilgrastim; sargramostim (GM-CSF)","story":"<p>Filgrastim, a G-CSF, binds myeloid progenitors and multiplies <b>neutrophils</b>, boosting their function; it also <b>mobilises stem cells</b> into the blood for collection. Sargramostim (GM-CSF) acts on earlier progenitors, raising several myeloid lines.</p><p>They are used for <b>neutropenia after chemotherapy</b>, aplastic anaemia and stem cell transplantation. G-CSF's toxicity is minimal apart from <b>bone pain</b>; GM-CSF brings more – fever, arthralgia and capillary leak.</p>","hook":"Filgrastim fights infection – the price is bone pain."},{"id":"33-5","ch":33,"front":"Oprelvekin (IL-11)","story":"<p>Oprelvekin is interleukin-11, which stimulates primitive <b>megakaryocyte</b> progenitors to make more <b>platelets</b>.</p><p>It is used for <b>thrombocytopenia after chemotherapy</b>, with fatigue, headache and <b>fluid retention</b> as side effects.</p>","hook":"Oprelvekin (IL-11) brings back platelets."},{"id":"33-6","ch":33,"front":"Romiplostim","story":"<p>Romiplostim is a peptide–Fc fusion that activates the <b>thrombopoietin receptor</b>, so megakaryocytes produce more platelets.</p><p>It is reserved for <b>immune thrombocytopenia (ITP)</b> that hasn't responded to other therapy.</p>","hook":"Romiplostim: TPO receptor activator for refractory ITP."},{"id":"33-x6","ch":33,"front":"Deferoxamine & deferasirox (iron chelators)","story":"<p>When too much iron enters the body, there is no exit. Chelators bind the iron so it can be excreted. <b>Deferoxamine</b> is given <b>parenterally</b> for <b>acute iron poisoning</b> (after removing tablets and correcting acidosis).</p><p>For chronic iron overload from repeated <b>transfusions</b>, deferoxamine or oral <b>deferasirox</b> is used; hereditary haemochromatosis is treated by phlebotomy instead.</p>","hook":"Chelators give iron a way out."},{"id":"33-e0","ch":33,"front":"📌 Causes of iron overload","story":"<p>Hereditary haemochromatosis (abnormal absorption) and frequent transfusions for haemolytic disorders such as <b>thalassaemia major</b>.</p>","hook":""}];
</script>
<script>
const $=s=>document.querySelector(s);

try{const x=JSON.parse(localStorage.getItem("pharmaCram")||"null");if(x)S=Object.assign(S,x)}catch(e){}

const allCards=CH.flatMap(c=>c.cards.map((x,i)=>({ch:c.id,k:c.id+"-"+i,q:x[0],a:x[1]})).concat((c.ex||[]).map((x,i)=>({ch:c.id,k:c.id+"-ex"+i,q:"📌 "+x[0]+" – what do your notes say?",a:x[1]}))).concat((c.kc||[]).map((x,i)=>({ch:c.id,k:c.id+"-kc"+i,q:"🔑 Key concept: what is <b>"+x.t+"</b>?",a:x.d+(x.x?"<div class=\"sm\" style=\"margin-top:10px\">💡 "+x.x+"</div>":"")}))));
function updProg(){const d=CH.filter(c=>S.done[c.id]).length;const k=Object.keys(S.known).length;
 $("#progtxt").textContent=`${d}/${CH.length} chapters · ${k}/${allCards.length} cards known`;$("#progbar").style.width=(d/CH.length*100)+"%"}
const TABS=[["home","🏠 Home"],["anki","🗂 Anki"],["learn","📖 Learn"],["cards","🃏 Flashcards"],["quiz","✅ Quiz"],["anaesthesia","💉 Anaesthesia"],["memory","🧩 Memory tricks"],["compare","📊 Compare & antidotes"]];
let tab=(location.hash||"#home").slice(1);if(!TABS.find(t=>t[0]===tab))tab="home";

function render(){({home:rHome,anki:()=>window.rAnki&&rAnki(),learn:rLearn,cards:rCards,quiz:rQuiz,anaesthesia:rAnaes,memory:rMem,compare:rCompare})[tab]()}
function toggleDone(id,v){S.done[id]=v;save();render()}

const GROUPS=[["Basics",[1,2,3,4]],["Autonomic nervous system",[6,7,8,9,10]],["Cardiovascular & renal",[11,12,13,14,15]],["Autacoids & respiratory",[16,17,20]],["Central nervous system",[22,24,25,26,27,28,29,30,31,32]],["Blood",[33]]];
const ROLES=["Premedication","Premedication & haemodynamics","Premedication & PONV","Induction","Maintenance","Analgesia","Muscle relaxation","Reversal","Regional anaesthesia","Haemodynamics","Airway","Neuro-anaesthesia","Obstetric anaesthesia","PONV & allergy","Adjuncts","Emergencies","Postoperative care","Perioperative medication"];
function rHome(){const d=CH.filter(c=>S.done[c.id]).length;
 $("#main").innerHTML=`<div class="card"><h2>Pharmacology study app</h2>
 <p>Interactive study material for <b>${CH.length} chapters</b> of pharmacology (Katzung-based): learn cards with short and step-by-step mechanisms, <b>${allCards.length} flashcards</b>, <b>${CH.reduce((s,c)=>s+c.quiz.length,0)} quiz questions</b>, comparison tables and how drugs are used in <b>anaesthesia</b>.</p>
 <div class="row"><button class="btn p" onclick="go('learn',${(CH.find(c=>!S.done[c.id])||CH[0]).id})">${d?'Continue studying':'Start with chapter 1'} →</button><button class="btn" onclick="go('anki')">🗂 Anki drug cards</button><button class="btn" onclick="startQuiz('mix10')">Quick mixed quiz</button><button class="btn" onclick="go('anaesthesia')">💉 Anaesthesia overview</button></div></div>
 <div class="card"><h3 style="margin-top:0">How to use it</h3><ol class="sm" style="margin:0;padding-left:18px">
 <li><b>📖 Learn</b> – read a chapter's big picture, 🔑 key concepts (highlighted terms – hover or tap them), drug table, exam traps and memory hooks. Use <b>Hide answers</b> to test yourself on the table.</li>
 <li><b>🗂 Anki</b> – one card per drug, written as a short story. Rate Again / Hard / Good / Easy and cards come back on a spaced-repetition schedule; use <b>Cram</b> to spam a whole chapter.</li>
 <li><b>🃏 Flashcards</b> – say the answer out loud, flip, then mark <b>Again</b> or <b>Got it</b>. Clear the Again pile regularly.</li>
 <li><b>✅ Quiz</b> – per chapter or mixed; every answer is explained.</li>
 <li><b>🧩 Memory tricks</b> – drug families that do the same job, name endings (-olol, -pril, -caine…) and side-effect clusters.</li>
 <li><b>💉 Anaesthesia</b> – every drug with a role in anaesthesia, grouped by what it's used for.</li>
 <li><b>📊 Compare</b> – side-by-side tables: receptors, diuretics, antiarrhythmics, antidotes, teratogens…</li></ol>
 <p class="sm muted" style="margin-bottom:0">Your progress is saved only in your own browser.</p></div>
 ${GROUPS.map(g=>`<div class="card"><h3 style="margin-top:0">${g[0]}</h3>${g[1].map(id=>{const c=byId[id];return `<div class="chrow"><input type="checkbox" ${S.done[id]?'checked':''} onchange="toggleDone(${id},this.checked)">
  <span>Ch ${id} – ${c.t}</span> · <a onclick="go('learn',${id})">learn</a> · <a onclick="startCards(${id})">cards</a> · <a onclick="startQuiz('${id}')">quiz</a></div>`}).join("")}</div>`).join("")}`}
function rAnaes(){const items=CH.flatMap(c=>c.tbl.filter(r=>r[5]).map(r=>({ch:c.id,name:r[0],txt:r[5],role:r[6]})));
 const roles=ROLES.filter(r=>items.some(i=>i.role===r)).concat([...new Set(items.map(i=>i.role))].filter(r=>!ROLES.includes(r)));
 $("#main").innerHTML=`<div class="card"><h2>💉 Drugs in anaesthesia</h2><p class="muted sm" style="margin:0">${items.length} drugs from all chapters, grouped by their role in anaesthesia. The same notes appear in each chapter's drug table. Some practical details go beyond the source notes – check them against your anaesthesia lectures.</p>
 <div class="chips" style="margin-top:10px">${roles.map(r=>`<a class="chip" href="#anaesthesia" onclick="event.preventDefault();document.getElementById('r-${r.replace(/\W/g,'')}').scrollIntoView({behavior:'smooth'})">${r}</a>`).join("")}</div></div>
 ${roles.map(r=>`<div class="card" id="r-${r.replace(/\W/g,'')}"><h3 style="margin-top:0">${r}</h3><table>${items.filter(i=>i.role===r).map(i=>`<tr><td style="width:28%">${i.name}<div class="sm muted"><a style="color:var(--acc);cursor:pointer" onclick="go('learn',${i.ch})">Ch ${i.ch}</a></div></td><td style="font-weight:400">${i.txt}</td></tr>`).join("")}</table></div>`).join("")}`}

let hideCols=false,mm='both';
function rLearn(){
 const c=byId[curCh];
 $("#main").innerHTML=`<div class="layout"><div class="side card" style="padding:8px">${CH.map(x=>`<button class="${x.id===curCh?'on':''}" onclick="curCh=${x.id};rLearn();scrollTo(0,0)">${S.done[x.id]?'<span class="d">✓</span> ':''}${x.id}. ${x.t}</button>`).join("")}</div>
 <div><div class="card"><div class="row" style="justify-content:space-between"><div><div class="muted sm">Chapter ${c.id} · notes p. ${c.p}</div><h2>${c.t}</h2></div>
 <label class="row sm"><input type="checkbox" ${S.done[c.id]?'checked':''} onchange="toggleDone(${c.id},this.checked)"> Chapter done</label></div>
 <h3>🎯 The big picture</h3><div class="big">${c.big}</div>
 ${c.kc?`<h3>🔑 Key concepts <span class="muted sm" style="font-weight:400">– highlighted <span class="kc" style="pointer-events:none">like this</span> wherever they appear in this chapter; hover or tap to see the explanation</span></h3><div class="kcg">${c.kc.map((k,i)=>`<div class="kcc" id="kc-${i}"><div class="kct">${k.t}</div><div>${k.d}</div>${k.x?`<div class="kcx">💡 ${k.x}</div>`:''}</div>`).join('')}</div>`:''}
 <h3 class="row" style="justify-content:space-between">💊 Drug table <span class="row"><span class="chips">${[['both','Short + detailed'],['short','Short only'],['det','Detailed only']].map(m=>`<span class="chip ${mm===m[0]?'on':''}" onclick="mm='${m[0]}';rLearn()">${m[1]}</span>`).join('')}</span><button class="btn sm" onclick="hideCols=!hideCols;rLearn()">${hideCols?'Show answers':'Hide answers (self-test)'}</button></span></h3>
 <div class="tw"><table class="${hideCols?'hide-col':''} m-${mm}"><tr><th>Drug / item</th><th>How it works</th><th>Used for</th><th>Watch out</th></tr>
 ${c.tbl.map(r=>{const cells=[r[0],`<div class="sh">${r[1]||'—'}</div><div class="dt">${r[4]||''}</div>`,(r[2]||'—')+(r[5]?`<div class="an">💉 <b>Anaesthesia:</b> ${r[5]}</div>`:''),r[3]];return `<tr>${cells.map(x=>`<td onclick="this.classList.add('rev')">${x||'—'}</td>`).join("")}</tr>`}).join("")}</table></div>
 <h3>⚠️ Exam traps</h3><div class="traps"><ul style="margin:0;padding-left:18px">${c.traps.map(x=>`<li>${x}</li>`).join("")}</ul></div>
 ${c.ex?`<h3>📌 Also in your notes</h3><div class="kcg">${c.ex.map(x=>`<div class="kcc" style="border-left-color:var(--ok)"><div class="kct">${x[0]}</div>${x[1]}</div>`).join('')}</div>`:''}
 <h3>🧠 Memory hooks</h3><div class="mem"><ul style="margin:0;padding-left:18px">${c.mem.map(x=>`<li>${x}</li>`).join("")}</ul></div>
 <div class="row" style="margin-top:16px"><button class="btn p" onclick="startCards(${c.id})">🃏 Flashcards (${c.cards.length})</button><button class="btn p" onclick="startQuiz('${c.id}')">✅ Quiz (${c.quiz.length})</button>
 ${CH.indexOf(c)<CH.length-1?`<button class="btn" onclick="curCh=${CH[CH.indexOf(c)+1].id};rLearn();scrollTo(0,0)">Next chapter →</button>`:""}</div></div></div></div>`;linkTerms(c)}

/* flashcards */
let deck=[],di=0,fsel="all";
function startCards(sel){fsel=String(sel);buildDeck();go("cards")}
function buildDeck(){let d=fsel==="all"?allCards:fsel==="again"?allCards.filter(c=>S.again[c.k]):fsel==="unknown"?allCards.filter(c=>!S.known[c.k]):allCards.filter(c=>c.ch==fsel);
 deck=d.slice().sort(()=>Math.random()-.5);di=0}
function rCards(){
 if(!deck.length&&fsel!=="again")buildDeck();
 const n=Object.keys(S.again).length;
 const sel=`<div class="chips"><span class="chip ${fsel==='all'?'on':''}" onclick="startCards('all')">All (${allCards.length})</span>
 <span class="chip ${fsel==='unknown'?'on':''}" onclick="startCards('unknown')">Not yet known</span>
 <span class="chip ${fsel==='again'?'on':''}" onclick="startCards('again')">🔁 Again pile (${n})</span>
 ${CH.map(c=>`<span class="chip ${fsel==c.id?'on':''}" onclick="startCards(${c.id})">${c.id}</span>`).join("")}</div>`;
 if(di>=deck.length){$("#main").innerHTML=`<div class="card">${sel}</div><div class="card" style="text-align:center"><h2>🎉 Deck finished</h2><p class="muted">${deck.length?'':'Nothing in this pile.'} Again pile now has ${n} card(s).</p>
  <div class="row" style="justify-content:center">${n?`<button class="btn r" onclick="startCards('again')">Review Again pile</button>`:""}<button class="btn" onclick="buildDeck();rCards()">Shuffle & restart</button>
  ${/^\d+$/.test(fsel)?`<button class="btn p" onclick="startQuiz('${fsel}')">Take the quiz →</button>`:""}</div></div>`;return}
 const c=deck[di];
 $("#main").innerHTML=`<div class="card">${sel}</div><div class="card"><div class="row" style="justify-content:space-between"><span class="muted sm">Card ${di+1}/${deck.length} · Ch ${c.ch} ${byId[c.ch].t}</span>
 <span class="muted sm"><kbd>Space</kbd> flip · <kbd>1</kbd> again · <kbd>2</kbd> got it</span></div>
 <div class="fc" id="fc" onclick="this.classList.toggle('flip')"><div class="fci"><div class="face"><span class="lab">QUESTION</span>${c.q}<div class="muted sm" style="margin-top:14px">Say the answer out loud, then tap to flip</div></div>
 <div class="face back"><span class="lab">ANSWER</span>${c.a}</div></div></div>
 <div class="row" style="justify-content:center"><button class="btn r" onclick="mark(0)">🔁 Again</button><button class="btn g" onclick="mark(1)">✓ Got it</button></div></div>`}
function mark(ok){const c=deck[di];if(ok){S.known[c.k]=1;delete S.again[c.k]}else{S.again[c.k]=1;delete S.known[c.k]}save();di++;rCards()}

/* quiz */
let Q=[],qi=0,score=0,answered=false,qsel="mix10",wrong=[];
function startQuiz(sel){qsel=String(sel);let pool;
 const all=CH.flatMap(c=>c.quiz.map(q=>({ch:c.id,q})));
 if(qsel.startsWith("mix")){pool=all.sort(()=>Math.random()-.5).slice(0,+qsel.slice(3))}else pool=all.filter(x=>x.ch==qsel).sort(()=>Math.random()-.5);
 Q=pool;qi=0;score=0;answered=false;wrong=[];go("quiz")}
function rQuiz(){
 if(!Q.length){startQuiz("mix10");return}
 const sel=`<div class="chips"><span class="chip ${qsel==='mix10'?'on':''}" onclick="startQuiz('mix10')">Mixed 10</span><span class="chip ${qsel==='mix30'?'on':''}" onclick="startQuiz('mix30')">Mixed 30</span><span class="chip ${qsel==='mix999'?'on':''}" onclick="startQuiz('mix999')">Everything</span>
 ${CH.map(c=>`<span class="chip ${qsel==c.id?'on':''} ${S.best[c.id]===100?'done':''}" onclick="startQuiz('${c.id}')">${c.id}</span>`).join("")}</div>`;
 if(qi>=Q.length){const pct=Math.round(score/Q.length*100);if(/^\d+$/.test(qsel)){S.best[qsel]=Math.max(S.best[qsel]||0,pct);save()}
  $("#main").innerHTML=`<div class="card">${sel}</div><div class="card"><h2>Score: ${score}/${Q.length} (${pct}%)</h2><p>${pct>=90?'Excellent – move on! 🚀':pct>=70?'Good. Review the misses below, then continue.':'Go back to the Learn card + flashcards for this one, then retry.'}</p>
  ${wrong.length?`<h3>Review your misses</h3>${wrong.map(w=>`<div class="exp"><b>${w.q[0]}</b><br>✓ ${w.q[1][w.q[2]]} – <span class="muted">${w.q[3]}</span> <a style="color:var(--acc);cursor:pointer" onclick="go('learn',${w.ch})">(Ch ${w.ch})</a></div>`).join("")}`:""}
  <div class="row" style="margin-top:12px"><button class="btn p" onclick="startQuiz('${qsel}')">Retry</button></div></div>`;return}
 const {ch,q}=Q[qi];
 $("#main").innerHTML=`<div class="card">${sel}</div><div class="card"><div class="muted sm">Question ${qi+1}/${Q.length} · Ch ${ch} · score ${score}</div><h3 style="font-size:17px">${q[0]}</h3>
 <div id="opts">${q[1].map((o,i)=>`<button class="opt" onclick="ans(${i})">${String.fromCharCode(65+i)}. ${o}</button>`).join("")}</div><div id="fb"></div></div>`;answered=false}
function ans(i){if(answered)return;answered=true;const {ch,q}=Q[qi];const bs=document.querySelectorAll(".opt");
 bs[q[2]].classList.add("ok");if(i===q[2])score++;else{bs[i].classList.add("no");wrong.push({ch,q})}
 $("#fb").innerHTML=`<div class="exp">${i===q[2]?'✅ Correct. ':'❌ Not quite. '}${q[3]}</div><div class="row" style="margin-top:10px"><button class="btn p" onclick="qi++;rQuiz()">Next →</button></div>`}


function linkTerms(c){if(!c.kc)return;const al=[];c.kc.forEach((k,i)=>[k.t].concat(k.a||[]).forEach(s=>{s=s.replace(/\s*\(.*\)$/,'');if(s.length>1)al.push({s,i,cs:/[A-Z]/.test(s)&&(s.length<=6||s===s.toUpperCase())})}));
 al.sort((x,y)=>y.s.length-x.s.length);const esc=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
 const re=new RegExp('(?<![A-Za-z0-9])('+al.map(x=>esc(x.s)).join('|')+')(?![A-Za-z0-9])','gi');
 document.querySelectorAll('#main .big, #main table, #main .traps, #main .mem').forEach(root=>{
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);const nodes=[];while(w.nextNode())nodes.push(w.currentNode);
  nodes.forEach(n=>{if(n.parentElement.closest('.kc'))return;const t=n.nodeValue;re.lastIndex=0;let m,last=0,frag=null;
   while((m=re.exec(t))){const hit=al.find(x=>x.cs?x.s===m[1]:x.s.toLowerCase()===m[1].toLowerCase());if(!hit)continue;
    frag=frag||document.createDocumentFragment();frag.appendChild(document.createTextNode(t.slice(last,m.index)));
    const sp=document.createElement('span');sp.className='kc';sp.dataset.i=hit.i;sp.textContent=m[1];frag.appendChild(sp);last=m.index+m[1].length}
   if(frag){frag.appendChild(document.createTextNode(t.slice(last)));n.parentNode.replaceChild(frag,n)}})});
 document.querySelectorAll('#main .kc[data-i]').forEach(sp=>{const k=c.kc[+sp.dataset.i];
  const show=e=>{e.stopPropagation();const p=$('#kcpop');p.innerHTML=`<b>🔑 ${k.t}</b><div style="margin-top:4px">${k.d}</div>${k.x?`<div class="kcx">💡 ${k.x}</div>`:''}`;p.style.display='block';
   const r=sp.getBoundingClientRect();const pw=Math.min(340,innerWidth-20);p.style.width=pw+'px';p.style.left=Math.max(10,Math.min(r.left,innerWidth-pw-10))+'px';
   const below=r.bottom+8;p.style.top=(below+p.offsetHeight>innerHeight?Math.max(10,r.top-p.offsetHeight-8):below)+'px'};
  sp.addEventListener('mouseenter',show);sp.addEventListener('click',show);sp.addEventListener('mouseleave',()=>{$('#kcpop').style.display='none'})})}
document.addEventListener('click',()=>{const p=document.getElementById('kcpop');if(p)p.style.display='none'});
window.addEventListener('scroll',()=>{const p=document.getElementById('kcpop');if(p)p.style.display='none'},{passive:true});


let memQ="";

 $("#main").innerHTML=`<div class="card"><h2>🧩 Memory tricks – make pharmacology simpler</h2>

 <div class="card" id="m-method"><h3 style="margin-top:0">🎯 How to memorise drugs</h3><div class="kcg">${MEM.method.map(x=>`<div class="kcc"><div class="kct">${x[0]}</div>${x[1]}</div>`).join("")}</div></div>
 <div class="card" id="m-fam"><h3 style="margin-top:0">👪 Same job, different chapters</h3><p class="sm muted" style="margin-top:0">One mechanism shows up again and again. Learn it once here and the chapters connect.</p>
 <div class="kcg" style="grid-template-columns:repeat(auto-fill,minmax(320px,1fr))">${MEM.families.map(x=>`<div class="kcc" style="border-left-color:var(--acc)"><div class="kct">${x[0]}</div><div class="muted" style="margin-bottom:6px">${x[1]}</div><div>${x[2]}</div><div class="kcx">💡 ${x[3]}</div></div>`).join("")}</div></div>
 <div class="card" id="m-stem"><div class="row" style="justify-content:space-between"><h3 style="margin:0">🔤 Name endings (stems) – the ending tells you the class</h3>
 <input id="memq" placeholder="Search a drug or ending…" value="${memQ}" oninput="memQ=this.value;rMem();const i=document.getElementById('memq');i.focus();i.setSelectionRange(i.value.length,i.value.length)" style="padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);min-width:220px"></div>
 <div class="tw" style="margin-top:10px"><table><tr><th>Ending</th><th>Class</th><th>Drugs in your notes</th><th>The whole story in one line</th></tr>
 ${MEM.stems.filter(r=>f(r.join(" "))).map(r=>`<tr><td style="font-size:16px;color:var(--acc)">${r[0]}</td><td>${r[1]}</td><td style="font-weight:400">${r[2]}</td><td style="font-weight:400">${r[3]}</td></tr>`).join("")}</table></div></div>
 <div class="card" id="m-clu"><h3 style="margin-top:0">⚠️ Side-effect clusters – "which drugs cause…?"</h3><div class="tw"><table><tr><th>Side effect</th><th>Drugs</th><th>Hook</th></tr>
 ${MEM.clusters.filter(r=>f(r.join(" "))).map(r=>`<tr><td>${r[0]}</td><td style="font-weight:400">${r[1]}</td><td style="font-weight:400" class="muted">${r[2]||''}</td></tr>`).join("")}</table></div></div>`}

function rCompare(){$("#main").innerHTML=COMPARE.map(t=>`<div class="card"><h2>${t.t}</h2><div class="tw"><table><tr>${t.h.map(h=>`<th>${h}</th>`).join("")}</tr>${t.r.map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join("")}</tr>`).join("")}</table></div></div>`).join("")}

</script><script>
/* ===== Anki-style spaced repetition ===== */
const MIN=60e3,DAY=864e5,STEPS=[1*MIN,10*MIN],RELEARN=10*MIN;
let AK={c:{},opt:{newLimit:9999,order:"chapter"},log:[]};
try{const x=JSON.parse(localStorage.getItem("pharmaAnki")||"null");if(x)AK=Object.assign(AK,x)}catch(e){}
function akSave(){try{localStorage.setItem("pharmaAnki",JSON.stringify(AK))}catch(e){}}
const akById=Object.fromEntries(ANKI.map(c=>[c.id,c]));
function st(id){return AK.c[id]||{s:"new",step:0,due:0,ivl:0,ease:2.5,reps:0,lapses:0}}
function fmt(ms){if(ms<60*MIN)return Math.max(1,Math.round(ms/MIN))+" min";if(ms<DAY)return Math.round(ms/36e5)+" h";const d=ms/DAY;if(d<30)return Math.round(d)+" d";if(d<365)return (d/30).toFixed(1).replace(".0","")+" mo";return (d/365).toFixed(1).replace(".0","")+" y"}
/* returns the new state for a rating 1=Again 2=Hard 3=Good 4=Easy */
function sched(s0,r,now){const s=Object.assign({},s0);s.reps++;
 if(s.s==="new"||s.s==="learn"){s.s="learn";
  if(r===1){s.step=0;s.due=now+STEPS[0]}
  else if(r===2){s.due=now+(s.step===0?(STEPS[0]+STEPS[1])/2:STEPS[s.step])}
  else if(r===3){if(s.step+1<STEPS.length){s.step++;s.due=now+STEPS[s.step]}else{s.s="review";s.ivl=1;s.due=now+DAY}}
  else{s.s="review";s.ivl=4;s.due=now+4*DAY}}
 else if(s.s==="relearn"){
  if(r===1){s.due=now+RELEARN}else if(r===2){s.due=now+RELEARN*1.5}
  else{s.s="review";s.ivl=Math.max(1,s.ivl);if(r===4)s.ivl=Math.max(2,s.ivl*1.5);s.due=now+s.ivl*DAY}}
 else{ /* review */
  if(r===1){s.lapses++;s.ease=Math.max(1.3,s.ease-0.2);s.ivl=Math.max(1,Math.round(s.ivl*0.5));s.s="relearn";s.due=now+RELEARN}
  else if(r===2){s.ease=Math.max(1.3,s.ease-0.15);s.ivl=Math.max(s.ivl+1,Math.round(s.ivl*1.2));s.due=now+s.ivl*DAY}
  else if(r===3){s.ivl=Math.max(s.ivl+1,Math.round(s.ivl*s.ease));s.due=now+s.ivl*DAY}
  else{s.ivl=Math.max(s.ivl+2,Math.round(s.ivl*s.ease*1.3));s.ease+=0.15;s.due=now+s.ivl*DAY}}
 return s}
const FAM=MEM.stems.map((s,i)=>{const names=s[2].replace(/\(.*?\)/g,m=>m.slice(1,-1)).split(/[,;]| and /).map(x=>x.trim().toLowerCase()).filter(x=>x.length>3);
 return {id:"s"+i,label:s[0]+" · "+s[1],cards:ANKI.filter(c=>{const f=c.front.toLowerCase();return names.some(n=>f.includes(n))})}}).filter(f=>f.cards.length>1);
const famById=Object.fromEntries(FAM.map(f=>[f.id,f]));
function deckCards(d){return d==="all"?ANKI:d[0]==="s"?(famById[d]||{cards:[]}).cards:ANKI.filter(c=>c.ch==d)}
function counts(d,now){let n=0,l=0,r=0,m=0;deckCards(d).forEach(c=>{const s=st(c.id);if(s.s==="new")n++;else if((s.s==="learn"||s.s==="relearn")){if(s.due<=now+20*MIN)l++}else{if(s.due<=now)r++;if(s.ivl>=21)m++}});return {n,l,r,m,t:deckCards(d).length}}
let akDeck=null,akCur=null,akShown=false,akCram=false,akCQ=[],akUndo=null,akNewSeen=0;
function akNext(){const now=Date.now(),cs=deckCards(akDeck);
 if(akCram){akCur=akCQ[0]||null;return}
 const learnDue=cs.filter(c=>{const s=st(c.id);return (s.s==="learn"||s.s==="relearn")&&s.due<=now}).sort((a,b)=>st(a.id).due-st(b.id).due);
 const revDue=cs.filter(c=>{const s=st(c.id);return s.s==="review"&&s.due<=now}).sort((a,b)=>st(a.id).due-st(b.id).due);
 const news=akNewSeen<AK.opt.newLimit?cs.filter(c=>st(c.id).s==="new"):[];
 if(AK.opt.order==="random")news.sort(()=>Math.random()-.5);
 akCur=learnDue[0]||revDue[0]||news[0]||null;
 if(!akCur){/* learn-ahead: Anki shows learning cards due within 20 min */
  const soon=cs.filter(c=>{const s=st(c.id);return (s.s==="learn"||s.s==="relearn")&&s.due<=now+20*MIN}).sort((a,b)=>st(a.id).due-st(b.id).due);akCur=soon[0]||null}}
function startAnki(d,cram){akDeck=String(d);akCram=!!cram;akShown=false;akUndo=null;akNewSeen=0;
 if(akCram){akCQ=deckCards(akDeck).slice();if(AK.opt.order==="random")akCQ.sort(()=>Math.random()-.5)}
 akNext();go("anki")}
function akRate(r){if(!akCur||!akShown)return;const now=Date.now();
 if(akCram){const c=akCQ.shift();akUndo={cram:true,q:[c].concat(akCQ)};
  if(r===1)akCQ.splice(Math.min(2,akCQ.length),0,c);else if(r===2)akCQ.splice(Math.min(6,akCQ.length),0,c);else if(r===3)akCQ.splice(Math.min(15,akCQ.length),0,c);
 }else{const prev=AK.c[akCur.id];akUndo={id:akCur.id,prev:prev?Object.assign({},prev):null,ns:akNewSeen};
  if(st(akCur.id).s==="new")akNewSeen++;AK.c[akCur.id]=sched(st(akCur.id),r,now);
  AK.log.push([akCur.id,r,now]);if(AK.log.length>3000)AK.log=AK.log.slice(-3000);akSave()}
 akShown=false;akNext();rAnki()}
function akUndoLast(){if(!akUndo)return;if(akUndo.cram){akCQ=akUndo.q}else{if(akUndo.prev)AK.c[akUndo.id]=akUndo.prev;else delete AK.c[akUndo.id];akNewSeen=akUndo.ns;akSave();akCur=akById[akUndo.id]}
 akUndo=null;if(akCram)akNext();akShown=false;rAnki()}
function akReset(d){const scope=d==="all"?"ALL decks":"Chapter "+d;const b=document.getElementById("rst-"+d);
 if(b&&b.dataset.armed!=="1"){b.dataset.armed="1";b.textContent="Tap again to reset "+scope;b.classList.add("r");return}
 deckCards(d).forEach(c=>delete AK.c[c.id]);akSave();rAnki()}
function rAnki(){
 const now=Date.now();
 if(!akDeck){ /* deck list */
  const tot=counts("all",now);
  const row=(d,label)=>{const k=counts(d,now);const pct=Math.round(k.m/k.t*100)||0;
   return `<tr><td><a style="cursor:pointer;color:var(--ink)" onclick="startAnki('${d}')"><b>${label}</b></a><div class="bar" style="width:120px;margin-top:4px" title="${pct}% mature (interval ≥ 21 days)"><i style="width:${pct}%"></i></div></td>
   <td class="akn">${k.n}</td><td class="akl">${k.l}</td><td class="akr">${k.r}</td><td class="sm muted">${k.t}</td>
   <td style="white-space:nowrap"><button class="btn p sm" onclick="startAnki('${d}')">Study</button> <button class="btn sm" onclick="startAnki('${d}',true)" title="Go through every card now, ignoring the schedule">Cram</button></td></tr>`};
  $("#main").innerHTML=`<div class="card"><h2>🗂 Anki – drug stories</h2>
  <p class="muted sm" style="margin:0 0 8px">${ANKI.length} cards – one for every drug (and key concept) by chapter. The front shows the drug; try to tell its story out loud (mechanism → uses → toxicity), then reveal and rate yourself. Ratings schedule each card like Anki: <b>Again</b> brings it back in a minute, <b>Easy</b> pushes it days away.</p>
  <div class="row sm"><span>New cards per session:</span>${[[20,"20"],[50,"50"],[9999,"All"]].map(x=>`<span class="chip ${AK.opt.newLimit===x[0]?'on':''}" onclick="AK.opt.newLimit=${x[0]};akSave();rAnki()">${x[1]}</span>`).join("")}
  <span style="margin-left:10px">Order:</span>${[["chapter","In order"],["random","Shuffled"]].map(x=>`<span class="chip ${AK.opt.order===x[0]?'on':''}" onclick="AK.opt.order='${x[0]}';akSave();rAnki()">${x[1]}</span>`).join("")}</div></div>
  <div class="card"><div class="tw"><table><tr><th>Deck</th><th class="akn">New</th><th class="akl">Learning</th><th class="akr">Due</th><th>Cards</th><th></th></tr>
  ${row("all","⭐ All chapters")}${CH.filter(c=>ANKI.some(a=>a.ch==c.id)).map(c=>row(c.id,`Ch ${c.id} · ${c.t}`)).join("")}</table></div>
  <h3>👪 Study by drug family <span class="sm muted" style="font-weight:400">– same cards, grouped by name ending so similar drugs come together</span></h3>
  <div class="tw"><table><tr><th>Family</th><th class="akn">New</th><th class="akl">Learning</th><th class="akr">Due</th><th>Cards</th><th></th></tr>${FAM.map(f=>row(f.id,f.label)).join("")}</table></div>
  <p class="sm muted">Blue = new · red = in learning (due within 20 min) · green = due for review. The bar shows how much of the deck is "mature" (interval of 21 days or more). Progress is saved in this browser.</p>
  <button class="btn sm" id="rst-all" onclick="akReset('all')">Reset all progress</button></div>`;return}
 const k=counts(akDeck,now);const label=akDeck==="all"?"All chapters":akDeck[0]==="s"?"Family "+famById[akDeck].label:"Ch "+akDeck+" · "+(byId[akDeck]||{}).t;
 const head=`<div class="card"><div class="row" style="justify-content:space-between"><div><a style="cursor:pointer;color:var(--acc)" onclick="akDeck=null;rAnki()">← Decks</a> · <b>${label}</b>${akCram?' <span class="chip on" style="cursor:default">Cram mode</span>':''}</div>
  <div class="row sm">${akCram?`<span>${akCQ.length} left in this cram round</span>`:`<span class="akn">${k.n}</span> + <span class="akl">${k.l}</span> + <span class="akr">${k.r}</span>`}
  ${akUndo?`<button class="btn sm" onclick="akUndoLast()">↶ Undo</button>`:''}</div></div></div>`;
 if(!akCur){const cs=deckCards(akDeck);const nextDue=cs.map(c=>st(c.id)).filter(s=>s.s!=="new").map(s=>s.due).sort((a,b)=>a-b)[0];
  $("#main").innerHTML=head+`<div class="card" style="text-align:center"><h2>🎉 ${akCram?'Cram round finished!':'Congratulations – nothing due right now'}</h2>
  <p class="muted">${!akCram&&nextDue?'Next card in this deck is due in <b>'+fmt(nextDue-now)+'</b>.':''}</p>
  <div class="row" style="justify-content:center"><button class="btn p" onclick="startAnki('${akDeck}',true)">🔥 Cram the whole deck again</button>
  ${!akCram&&k.n?`<button class="btn" onclick="AK.opt.newLimit=9999;akSave();startAnki('${akDeck}')">Study remaining new cards</button>`:''}
  <button class="btn" onclick="akDeck=null;rAnki()">Back to decks</button></div></div>`;return}
 const c=akCur,s=st(c.id);
 const btn=(r,lab,cls)=>{let iv;if(akCram){iv=["soon","later","end of round","done"][r-1]}else{const ns=sched(s,r,now);iv=fmt(ns.due-now)}
  return `<button class="btn akb ${cls}" onclick="akRate(${r})"><div>${lab}</div><div class="sm" style="opacity:.85">${iv}</div></button>`};
 $("#main").innerHTML=head+`<div class="card akcard">
  <div class="muted sm">Ch ${c.ch} · ${(byId[c.ch]||{}).t||''} ${!akCram?`· <span class="${s.s==='new'?'akn':s.s==='review'?'akr':'akl'}">${{new:'new',learn:'learning',relearn:'relearning',review:'review'}[s.s]}</span>`:''}</div>
  <div class="akfront">${c.front}</div>
  ${akShown?`<div class="akback">${c.story}${c.hook?`<div class="akhook">🧠 ${c.hook}</div>`:''}</div>
   <div class="akbtns">${btn(1,"Again","r")}${btn(2,"Hard","h")}${btn(3,"Good","g")}${btn(4,"Easy","e")}</div>
   <div class="sm muted" style="text-align:center;margin-top:6px"><kbd>1</kbd> Again · <kbd>2</kbd> Hard · <kbd>3</kbd> Good · <kbd>4</kbd> Easy</div>`
  :`<p class="muted" style="text-align:center">Tell the story out loud: <b>what is it → how does it work → what is it used for → what goes wrong?</b></p>
   <div style="text-align:center"><button class="btn p" style="min-width:220px;padding:12px" onclick="akShown=true;rAnki()">Show answer <span class="sm">(space)</span></button></div>`}</div>`}
document.addEventListener("keydown",e=>{if(tab!=="anki"||!akDeck||!akCur)return;if(e.target.tagName==="INPUT")return;
 if(!akShown&&(e.code==="Space"||e.key==="Enter")){e.preventDefault();akShown=true;rAnki();return}
 if(akShown&&/^[1-4]$/.test(e.key)){akRate(+e.key)}else if(akShown&&e.code==="Space"){e.preventDefault();akRate(3)}
 if((e.ctrlKey||e.metaKey)&&e.key==="z")akUndoLast()});

if(tab==='anki')rAnki();
</script>
