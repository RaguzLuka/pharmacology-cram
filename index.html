ne in heart failure","story":"<p>These block the <b>aldosterone receptor</b>, entering tubular cells from the blood side. Na⁺ reabsorption falls and K⁺ is kept.</p><p>They also block aldosterone's harmful <b>fibrosis and remodelling</b> of the heart, so they <b>reduce mortality</b> in chronic failure. Watch for <b>hyperkalaemia</b>.</p>","hook":"Aldosterone blockers save lives – watch K⁺."},{"id":"13-4","ch":13,"front":"ACE inhibitors / ARBs in heart failure","story":"<p>Blocking Ang II formation (captopril) or its AT1 receptor (losartan) lowers <b>afterload</b> and, through less aldosterone, <b>preload</b>.</p><p>They also stop Ang II-driven <b>remodelling</b>, so they're first-line in chronic failure and <b>reduce morbidity and mortality</b>.</p>","hook":"Unload the heart, stop remodelling."},{"id":"13-5","ch":13,"front":"Carvedilol, bisoprolol, metoprolol in heart failure","story":"<p>In chronic failure the sympathetic system is permanently switched on and damages heart cells. These β-blockers shield the myocardium from that <b>catecholamine damage</b>, remodelling and apoptosis.</p><p>Started at a low dose, they <b>slow progression of chronic failure</b> and reduce mortality – but they're not for acute failure.</p>","hook":"Chronic only: start low, go slow."},{"id":"13-6","ch":13,"front":"Dobutamine, dopamine","story":"<p>Dobutamine stimulates <b>β1</b> → Gs → ↑ cAMP → more Ca²⁺ → stronger contraction (dopamine acts similarly).</p><p>They give a quick boost in <b>acute systolic failure</b>, but <b>tolerance</b> develops, they aren't orally active, and they can cause <b>arrhythmias</b> – so never for chronic failure.</p>","hook":"Acute boost only."},{"id":"13-7","ch":13,"front":"Inamrinone, milrinone","story":"<p>These bipyridines inhibit <b>phosphodiesterase</b>, so cAMP isn't broken down; more cAMP means more Ca²⁺ and contraction, and above all strong <b>vasodilation</b>.</p><p>Used only in <b>acute failure</b> (e.g. after cardiac surgery), because in chronic failure they <b>increase morbidity and mortality</b>.</p>","hook":"PDE inhibitors: acute only."},{"id":"13-8","ch":13,"front":"Nitroprusside, nitroglycerin in heart failure","story":"<p>Both release <b>NO</b>, raise cGMP and dilate veins and arteries.</p><p>Lower <b>preload and afterload</b> let the failing heart pump more efficiently in <b>acute failure</b>.</p>","hook":"Dilate both sides in acute failure."},{"id":"13-9","ch":13,"front":"Nesiritide","story":"<p>Nesiritide is recombinant <b>brain natriuretic peptide (BNP)</b>. It mainly causes <b>vasodilation</b>, plus some diuresis.</p><p>It's used in <b>acute heart failure</b>; its drawback is <b>renal toxicity</b>.</p>","hook":"Nesiritide = BNP in a bottle."},{"id":"13-10","ch":13,"front":"Hydralazine + isosorbide dinitrate","story":"<p>This oral duo unloads the heart from both sides: hydralazine dilates <b>arterioles</b> (↓ afterload) and isosorbide dinitrate dilates <b>veins</b> (↓ preload).</p><p>Used in <b>chronic heart failure</b>.</p>","hook":"Arteries + veins, both oral."},{"id":"13-x3","ch":13,"front":"Digoxin Fab antibodies","story":"<p>These antibody fragments bind <b>digoxin</b> in the blood so it can no longer act on the Na⁺/K⁺-ATPase.</p><p>They're the treatment for <b>severe acute digoxin poisoning</b>, where K⁺ supplements would be dangerous (the patient is already hyperkalaemic).</p>","hook":"Fab = digoxin sponge."},{"id":"14-0","ch":14,"front":"Class 1A: procainamide, quinidine, disopyramide","story":"<p>Class 1A drugs block <b>Na⁺ channels</b>, slowing conduction (wide QRS), and also block <b>K⁺ channels</b>, prolonging the action potential and refractory period (<b>long QT</b>). They treat atrial and ventricular arrhythmias; procainamide is used in acute MI.</p><p>Each has a personality: <b>procainamide</b> → hypotension and a <b>lupus</b>-like syndrome; <b>quinidine</b> → <b>cinchonism</b> (headache, vertigo, tinnitus), raises digoxin, torsades; <b>disopyramide</b> → antimuscarinic effects and heart failure. Hyperkalaemia worsens their toxicity; overdose is treated with <b>sodium lactate</b>.</p>","hook":"1A: Na⁺ + K⁺ block, long QT."},{"id":"14-1","ch":14,"front":"Class 1B: lidocaine, mexiletine, phenytoin","story":"<p>Class 1B drugs prefer <b>inactivated Na⁺ channels</b>, so they act on <b>depolarised, ischaemic</b> ventricular tissue and barely touch normal cells – little change on the ECG, and they shorten the AP.</p><p><b>Lidocaine</b> is given IV (huge first-pass) for <b>ischaemic ventricular arrhythmias after MI</b> and digitalis arrhythmias; mexiletine is the oral version. Toxicity is local-anaesthetic-like: <b>CNS stimulation and convulsions</b>.</p>","hook":"1B: ischaemic ventricle, lidocaine IV."},{"id":"14-2","ch":14,"front":"Class 1C: flecainide, propafenone, moricizine","story":"<p>Class 1C drugs block Na⁺ channels strongly, markedly slowing conduction (wide QRS) without changing AP duration.</p><p>They unbind slowly and are the <b>most proarrhythmic</b> class – approved mainly for <b>supraventricular</b> arrhythmias.</p>","hook":"1C: strongest Na⁺ block, most proarrhythmic."},{"id":"14-3","ch":14,"front":"Class 2: propranolol, esmolol, metoprolol, timolol","story":"<p>β-blockers lower cAMP, reducing Na⁺ and Ca²⁺ currents and suppressing abnormal pacemakers. The <b>AV node</b> is especially sensitive (↑ PR).</p><p><b>Esmolol</b> is the IV, ultra-short choice for acute arrhythmias; propranolol, metoprolol and timolol given <b>after MI</b> protect for years.</p>","hook":"Class 2: AV node slows; esmolol IV."},{"id":"14-4","ch":14,"front":"Class 3: dofetilide, ibutilide","story":"<p>These block the <b>K⁺ channels</b> of repolarisation, prolonging the AP and refractory period so re-entrant circuits can't continue.</p><p>They convert <b>atrial flutter and fibrillation</b>, but the long QT brings the risk of <b>torsades de pointes</b>.</p>","hook":"K⁺ block → long QT → torsades."},{"id":"14-5","ch":14,"front":"Class 3: sotalol","story":"<p>Sotalol is two drugs in one: one isomer blocks <b>β-receptors</b> (class 2) and both isomers block <b>K⁺ channels</b> (class 3), so it slows the heart and lengthens the QT.</p><p>Watch for <b>torsades de pointes</b>, sinus bradycardia and bronchospasm in <b>asthma</b>.</p>","hook":"Sotalol = β-block + K⁺ block."},{"id":"14-6","ch":14,"front":"Class 3: amiodarone","story":"<p>Amiodarone blocks <b>K⁺ channels</b> but also Na⁺ channels, Ca²⁺ channels and β-receptors – all four classes. That makes it the <b>most effective</b> antiarrhythmic and, despite a long QT, rarely proarrhythmic.</p><p>It 'paints' the body: <b>corneal and skin deposits</b>, <b>thyroid dysfunction</b>, <b>pulmonary fibrosis</b>, paraesthesias and tremor. In anaesthesia it's used for perioperative AF and shock-resistant VF.</p>","hook":"Amiodarone: eyes, skin, thyroid, lungs."},{"id":"14-7","ch":14,"front":"Class 3: dronedarone","story":"<p>Dronedarone is a structural analogue of amiodarone with the same multi-channel block.</p><p>It's <b>less effective but less toxic</b>, used for <b>AF and flutter</b>.</p>","hook":"Amiodarone-lite."},{"id":"14-8","ch":14,"front":"Class 4: verapamil, diltiazem","story":"<p>The AV node fires with <b>Ca²⁺ current</b>. Verapamil and diltiazem block L-type channels in a use-dependent way, slowing <b>AV conduction</b> and lengthening its refractory period, which breaks <b>AV nodal re-entrant tachycardia</b>.</p><p>They reduce contractility and can cause AV block and hypotension – <b>avoid them in ventricular tachycardia</b>. Dihydropyridines are useless here (reflex sympathetic activation).</p>","hook":"Class 4: AV node; never in VT."},{"id":"14-9","ch":14,"front":"Adenosine","story":"<p>Given as a rapid IV bolus, adenosine acts on AV-node receptors: it opens K⁺ channels and reduces Ca²⁺ current, so the AV node is briefly blocked and a re-entrant SVT stops.</p><p>It's the <b>drug of choice for paroxysmal SVT</b>. Its half-life is seconds, so its side effects – <b>flushing, hypotension, chest pain, dyspnoea</b> – pass quickly.</p>","hook":"Adenosine: seconds-long reset of PSVT."},{"id":"14-10","ch":14,"front":"Potassium","story":"<p>Normal K⁺ stabilises the resting potential and depresses ectopic pacemakers, including <b>digitalis-induced</b> ones.</p><p>Low K⁺ invites arrhythmias (especially with digoxin); too much slows conduction and promotes re-entry – <b>keep K⁺ normal</b>.</p>","hook":"Keep K⁺ in the middle."},{"id":"14-11","ch":14,"front":"Magnesium","story":"<p>Magnesium acts like K⁺ on digitalis arrhythmias and suppresses the early afterdepolarisations that start <b>torsades de pointes</b>.</p><p>It's the treatment for <b>torsades</b> and digitalis arrhythmias.</p>","hook":"Torsades → magnesium."},{"id":"14-x4","ch":14,"front":"Quinidine","story":"<p>Quinidine, a class 1A drug, blocks Na⁺ and K⁺ channels, prolonging the QT.</p><p>Its trademarks: <b>cinchonism</b> (headache, vertigo, tinnitus), <b>raised digoxin levels</b> (reduced clearance) and <b>torsades de pointes</b>.</p>","hook":"Quinidine: cinchonism + digoxin up."},{"id":"14-x5","ch":14,"front":"Procainamide","story":"<p>Procainamide is a class 1A antiarrhythmic used, for example, in acute MI.</p><p>It can cause <b>hypotension</b> (especially IV) and a reversible <b>lupus-like syndrome</b> – more likely in slow acetylators.</p>","hook":"Procainamide → lupus."},{"id":"15-0","ch":15,"front":"Acetazolamide (dorzolamide, brinzolamide)","story":"<p>Acetazolamide inhibits <b>carbonic anhydrase</b> in the proximal tubule, so filtered HCO₃⁻ isn't reclaimed – a <b>bicarbonate diuresis</b>. Body HCO₃⁻ falls (<b>metabolic acidosis</b>) and the diuresis stops in 2–3 days; extra distal Na⁺ causes <b>K⁺ wasting</b>.</p><p>In the eye it reduces aqueous humour (<b>glaucoma</b>; dorzolamide/brinzolamide are topical); in the brain CSF acidosis drives breathing (<b>mountain sickness</b>). Side effects: drowsiness, paraesthesias, <b>calcium stones</b>, hepatic encephalopathy (ammonia) and sulfonamide allergy.</p>","hook":"CAI: bicarbonate out, acidosis in, eyes and mountains."},{"id":"15-1","ch":15,"front":"Loops: furosemide, bumetanide, torsemide, ethacrynic acid","story":"<p>Loops block <b>NKCC2</b> in the thick ascending limb (20–30% of Na⁺). Normally recycled K⁺ makes the lumen positive and pushes Ca²⁺ and Mg²⁺ back; loops abolish this, so <b>Ca²⁺ and Mg²⁺ are lost</b>. They treat oedema, <b>acute pulmonary oedema</b>, refractory hypertension and <b>hypercalcaemia</b> (given with saline).</p><p>Extra distal Na⁺ causes <b>hypokalaemic metabolic alkalosis</b>; they can cause hypovolaemia and <b>ototoxicity</b>. All except <b>ethacrynic acid</b> are sulfonamides. NSAIDs blunt their effect.</p>","hook":"Loops lose calcium – and can hurt hearing."},{"id":"15-2","ch":15,"front":"Thiazides: hydrochlorothiazide (metolazone)","story":"<p>Thiazides block <b>Na⁺/Cl⁻</b> in the distal tubule for a long (6–12 h) moderate diuresis. With less Na⁺ inside, the cell's Na⁺/Ca²⁺ exchanger works harder, so <b>Ca²⁺ is retained</b> – the opposite of loops.</p><p>They treat <b>hypertension</b>, mild heart failure, <b>calcium stones</b> and, paradoxically, <b>nephrogenic diabetes insipidus</b>. Side effects: hypokalaemic alkalosis, hyponatraemia, and the metabolic trio <b>hyperglycaemia, hyperuricaemia, hyperlipidaemia</b>.</p>","hook":"Thiazides take Ca²⁺ back; raise sugar, urate, lipids."},{"id":"15-3","ch":15,"front":"Spironolactone, eplerenone","story":"<p>These steroids enter tubular cells from the blood and block the <b>aldosterone receptor</b>, so genes for ENaC and the Na⁺/K⁺ pump aren't switched on. Na⁺ reabsorption falls and K⁺ and H⁺ are kept – slow onset (24–72 h).</p><p>Used in <b>aldosteronism</b>, heart failure and with thiazides. Danger: <b>hyperkalaemia</b> and acidosis. Spironolactone is also antiandrogenic – <b>gynaecomastia</b>.</p>","hook":"Block aldosterone: keep K⁺, maybe grow breasts."},{"id":"15-4","ch":15,"front":"Amiloride, triamterene","story":"<p>These directly plug the <b>epithelial Na⁺ channels (ENaC)</b> in the collecting tubule, regardless of aldosterone. Without Na⁺ entry the lumen isn't negative, so K⁺ and H⁺ aren't secreted.</p><p>They prevent K⁺ loss from other diuretics, but cause <b>hyperkalaemia</b> – <b>never combine with K⁺ supplements</b>.</p>","hook":"Plug ENaC – never add K⁺."},{"id":"15-5","ch":15,"front":"Mannitol","story":"<p>Mannitol is given IV, filtered but not reabsorbed, so it holds water in the tubule – an <b>osmotic diuresis</b>. In the blood it draws water out of cells.</p><p>It keeps urine flowing in haemolysis and rhabdomyolysis and lowers <b>intracranial and intraocular pressure</b>. Side effects: hyponatraemia then hypernatraemia, <b>pulmonary oedema</b>, headache.</p>","hook":"Osmotic water-holder: brain and eye pressure down."},{"id":"15-6","ch":15,"front":"Vasopressin, desmopressin","story":"<p>ADH acts on <b>V2 receptors</b> → Gs → cAMP → insertion of <b>aquaporin-2</b> water channels, so water is reabsorbed and urine concentrated.</p><p>They treat <b>central diabetes insipidus</b>; side effects are hyponatraemia and hypertension.</p>","hook":"V2 → aquaporins → central DI."},{"id":"15-7","ch":15,"front":"Conivaptan, tolvaptan, demeclocycline","story":"<p>These block ADH (conivaptan V1 and V2), so fewer aquaporins appear and <b>free water is excreted</b>.</p><p>They raise Na⁺ in <b>SIADH</b> – but correct it slowly, because too rapid correction (conivaptan) can cause <b>demyelination</b>.</p>","hook":"-vaptans for SIADH – correct slowly."},{"id":"15-x6","ch":15,"front":"Ethacrynic acid","story":"<p>Ethacrynic acid is a loop diuretic that works like furosemide on NKCC2.</p><p>Its special feature: it is <b>not a sulfonamide</b>, so it can be used in patients with sulfonamide allergy – though it is highly ototoxic.</p>","hook":"The loop for sulfa-allergic patients."},{"id":"16-0","ch":16,"front":"H1 receptor","story":"<p>Picture histamine stepping out of a mast cell and finding the <b>H1 receptor</b>, a doorbell wired to a <b>Gq</b> protein. Ringing it switches on phospholipase C, which splits PIP₂ into <b>IP₃ and DAG</b>; IP₃ empties calcium stores and the cell gets busy. In the bronchi and gut the smooth muscle squeezes, so the patient wheezes. At sensory nerve endings the same signal is felt as <b>itch and pain</b>.</p><p>In blood vessels the story splits in two. The endothelium answers by releasing <b>NO</b>, so the vessels widen and the skin flushes. Meanwhile endothelial cells contract and open gaps between them, plasma leaks out and <b>oedema</b> forms. Add H2 to the picture and you get the famous <b>triple response</b> to injected histamine: red spot, wheal and flare.</p>","hook":"H1 = Gq: itch, wheeze, flush, swelling."},{"id":"16-1","ch":16,"front":"H2 receptor","story":"<p>The second doorbell, the <b>H2 receptor</b>, is wired to <b>Gs</b>. When histamine rings it, adenylyl cyclase fires up and <b>cAMP rises</b>. Its most famous home is the parietal cell of the stomach, where histamine released from neighbouring ECL cells drives <b>gastric acid secretion</b>. In the heart the same cAMP signal stimulates the muscle.</p><p>H2 also keeps the system in check: on mast cells it acts as a brake, <b>inhibiting further histamine release</b>. That's why blocking H2 with drugs like famotidine mainly means <b>less acid</b>, not fewer allergic symptoms. When you picture the triple response to injected histamine, remember that H2 joins H1 in widening the vessels.</p>","hook":"H2 = Gs, cAMP, stomach acid."},{"id":"16-2","ch":16,"front":"H3 and H4 receptors","story":"<p>The two quieter histamine receptors work behind the scenes. <b>H3</b> sits <b>presynaptically in the CNS</b> and couples to <b>Gi</b>. It is an autoreceptor: when histamine builds up, H3 tells the nerve ending to <b>release less histamine</b>, like a thermostat switching off the heater.</p><p><b>H4</b> lives on white blood cells, especially <b>eosinophils</b>, and on mast cells. When histamine binds it, the cells follow the chemical trail towards the site of inflammation, a process called <b>chemotaxis</b>. Neither receptor has a classic drug in your notes, but expect them as exam distractors: H3 = presynaptic brake in the brain, H4 = leukocyte movement.</p>","hook":"H3 = brake in the brain; H4 = leukocytes on the move."},{"id":"16-3","ch":16,"front":"1st-generation H1 antihistamines: diphenhydramine, promethazine (chlorpheniramine, cyclizine)","story":"<p>The old-school antihistamines are oily, lipid-soluble characters that slip straight across the blood–brain barrier. At the H1 receptor they are <b>competitive antagonists (inverse agonists)</b>, so they work best taken <b>before</b> histamine is released. In the brain they cause <b>sedation</b>, which is why diphenhydramine also works as a sleep aid, and they calm the vestibular system, making diphenhydramine, dimenhydrinate, cyclizine and promethazine good for <b>motion sickness</b> and chemotherapy vomiting.</p><p>Because they look like other blockers, they also block <b>muscarinic</b> receptors (dry mouth, blurred vision, urinary retention) and α receptors; <b>promethazine</b> can drop blood pressure on standing. Many even act as local anaesthetics. They add dangerously to alcohol and other CNS depressants. In theatre, cyclizine and promethazine treat <b>PONV</b>, and these drugs are second-line for allergic reactions, always after adrenaline in anaphylaxis.</p>","hook":"Old antihistamines cross into the brain: sleepy, dry, motion-proof."},{"id":"16-4","ch":16,"front":"2nd-generation H1 antihistamines: cetirizine, fexofenadine, loratadine","story":"<p>The newer generation was redesigned to stay out of the brain. Cetirizine, fexofenadine and loratadine are still <b>competitive H1 blockers</b>, but they are <b>much less lipid-soluble</b>, so they barely cross the blood–brain barrier. The patient keeps their allergy relief without the drowsy fog of diphenhydramine.</p><p>They also have <b>weak autonomic effects</b> (little dry mouth or blood pressure drop) and a <b>longer half-life of 12–24 hours</b>, so once-daily dosing works. That makes them the sensible choice for chronic allergy, <b>hay fever and urticaria</b>, especially for people who need to drive or study. If an exam question mentions a non-sedating antihistamine, think of this trio.</p>","hook":"New antihistamines stay out of the brain: allergy relief without sleep."},{"id":"16-5","ch":16,"front":"H2 blockers: cimetidine, ranitidine, famotidine, nizatidine","story":"<p>These drugs stand guard at the parietal cell's <b>H2 receptor</b> and competitively block histamine. Less cAMP means <b>less acid</b>, especially the <b>basal and night-time</b> secretion. They heal <b>duodenal and gastric ulcers</b>, help in GORD and Zollinger–Ellison syndrome (although proton pump inhibitors do these jobs better), and are given IV to prevent <b>stress ulcers</b> in critically ill patients.</p><p>One member is a troublemaker: <b>cimetidine</b> inhibits hepatic <b>CYP450</b> enzymes and reduces liver blood flow, so other drugs build up. It also has <b>antiandrogen</b> effects (gynaecomastia). Famotidine and the others are much cleaner. Before anaesthesia, an H2 blocker raises gastric pH to reduce the risk of <b>aspiration pneumonitis</b>, for example before a Caesarean section or emergency surgery.</p>","hook":"H2 blockers turn down the acid tap; cimetidine also jams the liver's enzymes."},{"id":"16-6","ch":16,"front":"Sumatriptan (triptans)","story":"<p>During a migraine attack the cranial vessels are swollen and the trigeminal nerves are firing inflammatory peptides. <b>Sumatriptan</b> arrives as a <b>5-HT1D (and 5-HT1B) agonist</b>. It squeezes the <b>dilated cranial vessels</b> back to size and tells the trigeminal endings to stop releasing their inflammatory neuropeptides, and the headache fades.</p><p>Sumatriptan is the prototype, with naratriptan and the other triptans close behind. They are <b>first-line for acute migraine</b> and <b>cluster headache</b>, taken orally, and sumatriptan can also be injected. Triptans have replaced ergot alkaloids for acute migraine because they are <b>less toxic</b>. Remember that serotonin agonists in large amounts can contribute to <b>serotonin syndrome</b>.</p>","hook":"Triptans tighten the throbbing vessels: first-line migraine relief."},{"id":"16-7","ch":16,"front":"Ergotamine (+ caffeine); dihydroergotamine","story":"<p>Ergotamine is a fungal alkaloid with a dark history: medieval epidemics of <b>ergotism</b>, 'St Anthony's fire'. It is a <b>partial agonist at α and 5-HT receptors</b> on vascular smooth muscle and produces <b>powerful, prolonged vasoconstriction</b>. Given with caffeine it aborts an <b>acute migraine</b>; its cousin <b>dihydroergotamine</b> is used for prophylaxis. Being a partial agonist, it can also block strong agonists, so adrenaline may lower blood pressure instead of raising it (<b>adrenaline reversal</b>).</p><p>The danger is too much squeezing: limbs become ischaemic and can turn <b>gangrenous</b>, and the best antidote is <b>nitroprusside</b>. Long-term use causes strange <b>fibroplasia</b> in the retroperitoneum, pleura or under the endocardium, like carcinoid lesions. Expect nausea, vomiting and diarrhoea, and avoid it in pregnancy because it contracts the uterus.</p>","hook":"Ergotamine clamps vessels: migraine relief, but gangrene if overdone (antidote nitroprusside)."},{"id":"16-8","ch":16,"front":"Ergonovine","story":"<p>Ergonovine is the ergot that loves the <b>uterus</b>. It acts on uterine α and 5-HT receptors and produces a <b>powerful, sustained contraction</b>, and the uterus is most sensitive near term. After a delivery that clamped-down muscle squeezes the open blood vessels shut, which is why ergonovine (and ergotamine) control <b>postpartum haemorrhage</b>.</p><p>The golden rule: give it <b>only after the placenta is delivered</b>, because a contracting uterus can trap the placenta, and in late pregnancy the contraction can even cause abortion. That's why ergots are avoided in pregnancy. In <b>obstetric anaesthesia</b> ergonovine treats uterine atony at Caesarean section, but it raises blood pressure, so it is avoided in <b>pre-eclampsia</b>.</p>","hook":"Ergonovine clamps the uterus after the placenta is out."},{"id":"16-9","ch":16,"front":"Bromocriptine, pergolide","story":"<p>These synthetic ergots have switched sides from serotonin to <b>dopamine</b>: they are potent <b>D2 receptor agonists</b>. In the pituitary, dopamine is the natural brake on prolactin, so bromocriptine and pergolide <b>suppress prolactin secretion</b> and even <b>shrink prolactinomas</b>. They treat hyperprolactinaemia with galactorrhoea and infertility.</p><p>In the basal ganglia they replace the missing dopamine signal of <b>Parkinson's disease</b>, acting directly on D2 receptors without needing surviving dopamine neurons. Unlike natural ergots and LSD, these therapeutic derivatives don't cause hallucinations through serotonin. Expect <b>nausea, hypotension, confusion and dyskinesia</b> in practice.</p>","hook":"Bromocriptine = dopamine agonist: shrinks prolactinomas, helps Parkinson's."},{"id":"16-10","ch":16,"front":"LSD (lysergic acid diethylamide)","story":"<p>LSD is the ergot relative that went rogue. In <b>peripheral tissues</b> it is a potent <b>5-HT2 blocker</b>, but its fame comes from the brain, where it acts as an <b>agonist at dopamine and serotonin receptors</b>. The result is vivid, psychosis-like <b>hallucinations</b>.</p><p>Natural ergot alkaloids can cause hallucinations too, and sometimes so can <b>methysergide</b>, but the therapeutic ergot derivatives used for migraine, haemorrhage or prolactinoma do not. LSD has no medical use. In the drugs-of-abuse chapter you'll meet it again among the hallucinogens that are <b>not addictive</b> and that show rapid <b>tachyphylaxis</b>.</p>","hook":"LSD: blocks 5-HT2 in the body, trips the brain via DA/5-HT agonism."},{"id":"16-x0","ch":16,"front":"5-HT3 receptor & 5-HT3 antagonists","story":"<p>Among the 14 serotonin receptors, <b>5-HT3</b> is the odd one out: it isn't a G-protein receptor but a <b>ligand-gated cation channel</b>. You find it in the <b>vomiting centre (area postrema)</b>, the <b>chemoreceptor trigger zone</b> and on peripheral sensory and enteric nerves. When chemotherapy or surgery floods the gut with serotonin, these channels open and the patient vomits.</p><p>Drugs that <b>block 5-HT3</b> (ondansetron is the best-known example) are therefore <b>very useful antiemetics</b>, a mainstay against chemotherapy-induced and <b>postoperative nausea and vomiting</b>. Keep the contrast clear: 5-HT1D agonists (triptans) treat migraine, 5-HT2 mediates carcinoid effects, 5-HT4 drives gut motility, and 5-HT3 antagonists stop vomiting.</p>","hook":"5-HT3 is a channel in the vomiting centre: block it to stop vomiting."},{"id":"16-x1","ch":16,"front":"Methysergide","story":"<p>Methysergide is an ergot-family drug that acts on <b>serotonin receptors</b>. Your notes mention it in two warnings. First, like LSD and the natural ergots, it can sometimes cause <b>psychosis-like hallucinations</b>.</p><p>Second, as an ergot used long-term, it belongs to the group that can trigger <b>fibroplasia</b>: an unusual overgrowth of connective tissue in the <b>retroperitoneum</b> (blocking the ureters and causing hydronephrosis), the <b>pleural cavity</b> or under the endocardium (causing murmurs). These lesions resemble those of carcinoid tumour and are thought to come from <b>agonist action at serotonin receptors</b>.</p>","hook":"Methysergide: hallucinations and retroperitoneal fibrosis."},{"id":"16-e0","ch":16,"front":"📌 Histamine in disease","story":"<p>Released from mast cells in IgE-mediated reactions, histamine drives <b>allergic rhinitis, urticaria and angioedema</b>; it also controls gastric acid and is a CNS neurotransmitter.</p>","hook":""},{"id":"17-0","ch":17,"front":"AT1 receptor (Gq)","story":"<p>Angiotensin II is the body's emergency pressure-raiser, and the <b>AT1 receptor</b> is where it does its work. AT1 is <b>Gq-coupled</b>. When Ang II binds, arterioles clamp down in strong <b>vasoconstriction</b> and peripheral resistance climbs.</p><p>At the same moment Ang II tells the adrenal cortex to release <b>aldosterone</b>, so the kidney holds on to salt and water. It also works presynaptically to <b>facilitate noradrenaline release</b> from sympathetic nerves. Every important harmful effect of Ang II in hypertension and heart failure runs through AT1, and that's exactly the receptor that <b>ARBs</b> like losartan block.</p>","hook":"AT1: squeeze vessels, save salt, boost noradrenaline."},{"id":"17-1","ch":17,"front":"AT2 receptor","story":"<p>The <b>AT2 receptor</b> is angiotensin II's quieter, opposite-minded sibling. Ang II binds it too, but instead of constriction it produces <b>vasodilation via nitric oxide</b>, partly balancing AT1.</p><p>Its main job is thought to be in <b>fetal development</b>. When an exam asks which receptor ARBs target, the answer is always AT1. AT2 is left unblocked, and because Ang II levels rise when AT1 is blocked, AT2 may get even more stimulation.</p>","hook":"AT2: the NO-releasing, fetal sibling of AT1."},{"id":"17-2","ch":17,"front":"ACE inhibitors (captopril, enalapril)","story":"<p>Angiotensinogen is cut by renin into angiotensin I, an inactive <b>decapeptide</b>. Angiotensin-converting enzyme then trims two more amino acids to make the active <b>octapeptide angiotensin II</b>. Captopril and enalapril jam that enzyme, so Ang II formation falls, with less vasoconstriction and less aldosterone.</p><p>ACE has a second identity, <b>kininase II</b>, the enzyme that breaks down <b>bradykinin</b>. Blocking it lets bradykinin pile up, adding vasodilation but also causing the classic <b>cough</b>. Because Ang II no longer gives negative feedback, <b>renin and Ang I rise</b> in compensation. These drugs treat <b>hypertension and heart failure</b>.</p>","hook":"ACE = kininase II: block it, lose Ang II, gain bradykinin."},{"id":"17-3","ch":17,"front":"ARBs (losartan, valsartan)","story":"<p>Instead of stopping angiotensin II from being made, losartan and valsartan let it form but lock the door it needs. They are <b>orally active, non-peptide blockers of the AT1 receptor</b>. Ang II circulates freely but can no longer cause vasoconstriction or aldosterone release.</p><p>The body notices the missing signal and <b>raises renin and Ang I</b>. Since ACE isn't touched, bradykinin isn't raised, so cough is rare. ARBs work in <b>hypertension and heart failure</b>, and even in normal- and low-renin hypertension.</p>","hook":"ARBs let Ang II exist but lock the AT1 door."},{"id":"17-4","ch":17,"front":"Aliskiren","story":"<p>Aliskiren goes to the very top of the cascade. It is an <b>orally active renin inhibitor</b>, so renin can no longer cut angiotensinogen into angiotensin I.</p><p>With no Ang I made, there is nothing for ACE to convert, so <b>both Ang I and Ang II fall</b>, along with aldosterone. It's used in <b>hypertension</b>. In the antihypertensive chapter its side effects are listed as headache and diarrhoea, and like other RAAS blockers it can raise potassium.</p>","hook":"Aliskiren cuts the cascade at renin: Ang I and II both fall."},{"id":"20-0","ch":20,"front":"SABA: salbutamol, terbutaline, metaproterenol","story":"<p>An asthmatic is struggling for breath and reaches for the blue inhaler. <b>Salbutamol</b> lands on <b>β2 receptors</b> in airway smooth muscle; <b>Gs</b> switches on adenylyl cyclase, <b>cAMP</b> rises, protein kinase A relaxes the muscle, and within minutes the airways open. This is the <b>drug of choice for acute bronchospasm</b>, lasting about 4–6 hours.</p><p>Inhaled, it reaches the airways with little systemic dose, but overuse spills over. β2 receptors on skeletal muscle cause <b>tremor</b>, and as selectivity is lost at high doses β1 effects bring <b>tachycardia and arrhythmias</b>; tolerance can develop. In theatre, salbutamol through an in-line inhaler treats <b>bronchospasm during anaesthesia</b> and helps optimise asthmatics before surgery.</p>","hook":"SABA = rescue: β2 → cAMP → open airways; tremor if overused."},{"id":"20-1","ch":20,"front":"LABA: salmeterol, formoterol","story":"<p>Salmeterol and formoterol are the marathon runners of the β2 family. They use the same <b>β2 → Gs → cAMP</b> pathway, but they are highly <b>lipid-soluble</b> and stay anchored in the cell membrane, so they act for <b>12 hours or more</b>, with a slower onset.</p><p>Their role is <b>prophylaxis</b>, not rescue, and they come with one iron rule: <b>never alone</b>. Used as monotherapy they <b>increase asthma mortality</b>. Paired with an <b>inhaled corticosteroid</b> they work brilliantly, because steroids increase β-receptor responsiveness and control the inflammation that a LABA would otherwise mask.</p>","hook":"LABA: long-acting, never alone, always with a steroid."},{"id":"20-2","ch":20,"front":"Theophylline (aminophylline)","story":"<p>Theophylline is the tea-leaf methylxanthine, a cousin of caffeine and theobromine. It works in two ways. It <b>inhibits phosphodiesterase</b>, so cAMP isn't broken down and the bronchi relax (but only at high concentrations), and it <b>blocks adenosine receptors</b>. It also strengthens the diaphragm and stimulates the CNS and heart. Aminophylline is its salt, and slow-release forms help <b>nocturnal asthma</b>.</p><p>The problem is its <b>narrow therapeutic window</b> and its dependence on <b>hepatic CYP450</b>. Clearance is higher in <b>smokers and adolescents</b> and changes with enzyme inducers and inhibitors. Mild toxicity means GI upset, tremor and insomnia; overdose brings <b>arrhythmias and convulsions</b>. <b>β-blockers</b> are the antidote for its cardiovascular toxicity.</p>","hook":"Theophylline: PDE + adenosine block, narrow window, seizures and arrhythmias."},{"id":"20-3","ch":20,"front":"Ipratropium, tiotropium","story":"<p>The vagus nerve constricts the airways by releasing acetylcholine onto muscarinic receptors. <b>Ipratropium</b> and long-acting <b>tiotropium</b> are inhaled <b>quaternary muscarinic blockers</b> that stand in the way. Because they carry a permanent charge they are <b>barely absorbed</b>, so they relax the airways locally with almost no systemic effect: <b>no tremor or arrhythmias</b>, unlike β-agonists.</p><p>They don't touch inflammation, and they help only one- to two-thirds of asthmatics, but in <b>COPD</b> they are more effective and less toxic, making them a cornerstone there. In theatre and ICU, ipratropium by nebuliser or in-line inhaler treats <b>bronchospasm in ventilated patients</b>, especially those with COPD.</p>","hook":"Ipratropium: block the vagus, open the airways, best in COPD."},{"id":"20-4","ch":20,"front":"Cromolyn, nedocromil","story":"<p>Cromolyn and nedocromil are bodyguards for <b>mast cells</b>. They are so insoluble that they stay exactly where they're applied. There they <b>stabilise mast cell membranes</b>, so when antigen meets IgE the cell releases far less histamine and leukotriene.</p><p>That prevents both the <b>early bronchoconstriction</b> and the <b>late inflammatory response</b>, but only if taken beforehand, because they <b>do not relax smooth muscle</b> and are useless in an acute attack. They are used for <b>prophylaxis, especially in children</b>, as eye or nasal drops for hay fever, and orally for food allergy. Side effects are minor: cough and irritation.</p>","hook":"Cromolyn calms the mast cell before the storm, but can't open airways."},{"id":"20-5","ch":20,"front":"Inhaled corticosteroids: beclomethasone, budesonide, fluticasone, flunisolide","story":"<p>Inhaled steroids are the long-term firefighters of asthma. They enter airway cells, bind the <b>glucocorticoid receptor</b>, travel to the nucleus and change gene transcription. They <b>inhibit phospholipase A₂</b> (less arachidonic acid, fewer leukotrienes and prostaglandins), <b>block COX-2</b> and cytokines, and even make β-receptors respond better.</p><p>Over weeks the chronic inflammation and <b>hyperreactivity</b> settle, making them <b>first-line for moderate–severe asthma</b>. Inhalation gives a high airway dose and a low systemic dose, but the throat pays a price: oral <b>candidiasis</b> (rinse after use). High doses can still cause <b>adrenal suppression</b> and <b>slowed growth in children</b>.</p>","hook":"Inhaled steroids put out the fire: PLA₂ ↓, first-line, watch for thrush."},{"id":"20-6","ch":20,"front":"Systemic corticosteroids: prednisone, methylprednisolone (IV)","story":"<p>When an attack is too severe for inhalers, the steroids are sent in through the bloodstream. Oral <b>prednisone</b> or IV <b>methylprednisolone</b> use the same genomic mechanism as inhaled steroids but reach the whole body, giving powerful anti-inflammation that can be <b>life-saving in status asthmaticus</b>.</p><p>The price of systemic exposure is toxicity if they're used for more than about <b>2 weeks</b>, so short courses or <b>alternate-day dosing</b> are preferred. In anaesthesia, IV <b>hydrocortisone</b> treats severe bronchospasm and anaphylaxis, and patients on long-term steroids need <b>'stress-dose' steroids</b> around surgery because their adrenals are suppressed.</p>","hook":"Systemic steroids rescue status asthmaticus; long courses cost toxicity."},{"id":"20-7","ch":20,"front":"Zafirlukast, montelukast","story":"<p>Leukotrienes LTC4 and LTD4 are the inflammatory messengers that constrict bronchi, increase mucus and attract inflammation. <b>Zafirlukast</b> and <b>montelukast</b> are oral <b>LTD4 (cysteinyl-leukotriene) receptor antagonists</b> that block their landing site.</p><p>They are used for <b>prophylaxis</b>, especially <b>exercise-, antigen- and aspirin-induced asthma</b>, and have low toxicity, but they are <b>not for acute attacks</b>. Aspirin asthma is their showcase: blocking COX shunts arachidonic acid into the leukotriene pathway, and these drugs block the result.</p>","hook":"-lukasts block the LTD4 receptor: prevention, especially aspirin asthma."},{"id":"20-8","ch":20,"front":"Zileuton","story":"<p>Zileuton goes one step earlier than the -lukasts. It <b>inhibits 5-lipoxygenase</b>, the enzyme that turns arachidonic acid into leukotrienes, so they are never made.</p><p>That makes it useful in <b>exercise-, antigen- and especially aspirin-induced asthma</b>, where blocked COX diverts arachidonic acid into leukotrienes. Its signature danger is <b>liver damage</b>, so liver enzymes need monitoring. Remember the pair: montelukast blocks the receptor, zileuton blocks the factory.</p>","hook":"Zileuton shuts the leukotriene factory (5-LOX), but watch the liver."},{"id":"20-9","ch":20,"front":"Omalizumab","story":"<p>Omalizumab is a <b>monoclonal antibody against IgE</b>. It mops up free IgE in the blood before it can attach to mast cells.</p><p>Without IgE on their surface, mast cells can't be triggered by antigen, so <b>mediator release is prevented</b> at its source. It is given <b>parenterally</b> as chronic therapy for asthma that is hard to control.</p>","hook":"Omalizumab grabs IgE so mast cells can't be armed."},{"id":"20-x2","ch":20,"front":"Pentoxifylline and other methylxanthines (caffeine, theobromine)","story":"<p>Three beverages hide three <b>methylxanthines</b>: <b>caffeine</b> in coffee, <b>theophylline</b> in tea and <b>theobromine</b> in cocoa. They explain why these drinks are stimulating, but theophylline is the only one that matters in asthma.</p><p>A fourth relative, <b>pentoxifylline</b>, has found a different job: it treats <b>intermittent claudication</b> (leg pain on walking from peripheral arterial disease). It works by <b>reducing blood viscosity</b>, so blood flows more easily through narrowed vessels.</p>","hook":"Coffee, tea, cocoa = caffeine, theophylline, theobromine; pentoxifylline for claudication."},{"id":"20-e0","ch":20,"front":"📌 Inhaled corticosteroids – full list","story":"<p>Beclomethasone, budesonide, <b>dexamethasone</b>, flunisolide, fluticasone. Systemic steroids are used chronically only when other therapy fails.</p>","hook":""},{"id":"22-0","ch":22,"front":"Benzodiazepines","story":"<p>GABA is the brain's brake, and the <b>GABA_A receptor</b> is a chloride channel. Benzodiazepines bind their own site on it, between the <b>α1 and γ2 subunits</b>, and turn up GABA's effect: the channel opens <b>more often (↑ frequency)</b>, chloride flows in and neurons hyperpolarise. Without GABA they do nothing, which gives a <b>ceiling effect</b> and relative safety in overdose unless alcohol joins in. <b>Flumazenil</b> reverses them.</p><p>Uses depend on the drug: alprazolam and clonazepam for <b>panic</b>, triazolam and flurazepam for insomnia, IV diazepam or lorazepam for <b>status epilepticus</b>, chlordiazepoxide and diazepam for <b>alcohol withdrawal</b>. <b>Lorazepam and oxazepam</b> form no active metabolites; diazepam and flurazepam do and accumulate. Expect <b>anterograde amnesia</b>, psychomotor impairment and falls in the elderly. In anaesthesia, <b>midazolam</b> is the premedication and sedation drug, and BZDs stop local-anaesthetic seizures.</p>","hook":"BZDs open the chloride gate more often; flumazenil shuts the party."},{"id":"22-1","ch":22,"front":"Barbiturates (thiopental, phenobarbital, secobarbital)","story":"<p>Barbiturates bind a <b>different site on GABA_A</b> and hold the chloride channel open <b>longer (↑ duration)</b>. At high doses they open it even without GABA, and they also block excitatory <b>glutamate receptors</b> and Na⁺ channels. With no ceiling, overdose goes deep into <b>medullary depression</b>, and <b>flumazenil does not help</b>.</p><p><b>Thiopental</b> is so lipid-soluble that it puts a patient to sleep in under a minute and wears off by <b>redistribution</b> to muscle; it also lowers intracranial pressure, making it a classic IV induction agent in neuro-anaesthesia. <b>Phenobarbital</b> treats seizures and is partly excreted unchanged in urine. Barbiturates <b>induce liver enzymes</b>, causing drug interactions, and are contraindicated in <b>acute intermittent porphyria</b>.</p>","hook":"Barbiturates hold the gate open longer: no ceiling, no flumazenil, porphyria danger."},{"id":"22-2","ch":22,"front":"Zolpidem, zaleplon, eszopiclone","story":"<p>The 'Z-drugs' are specialists. They bind the <b>BZ1 (ω1) site</b> only on GABA_A receptors containing the <b>α1 subunit</b>, the subtype that mediates sleep. So they act as hypnotics with little anxiolytic, anticonvulsant or muscle-relaxant effect.</p><p>Patients fall asleep quickly with <b>little disruption of sleep stages</b>, less hangover and <b>milder withdrawal</b> than with BZDs, and the drugs don't induce liver enzymes. Zaleplon is the shortest-acting. Because they use the BZ site, <b>flumazenil reverses</b> them. Watch for complex sleep behaviours such as <b>'sleep driving'</b>.</p>","hook":"Z-drugs: α1-only sleepers, reversed by flumazenil."},{"id":"22-3","ch":22,"front":"Buspirone","story":"<p>Buspirone is the anxiolytic that ignores GABA. It is a <b>partial agonist at 5-HT1A receptors</b> (its exact anxiolytic mechanism is unknown), so it causes <b>no sedation</b>, has no anticonvulsant or muscle-relaxant effect, doesn't add to alcohol and doesn't impair driving.</p><p>The catch is patience: it takes about <b>one week</b> to work, so it's useless for acute panic but good for <b>generalised anxiety disorder</b>. Tolerance and <b>dependence are minimal</b> and withdrawal is mild. It is metabolised by <b>CYP3A4</b>, so erythromycin and ketoconazole raise its levels, and it appears safe in pregnancy.</p>","hook":"Buspirone: 5-HT1A, no sleepiness, slow (1 week) GAD calmer."},{"id":"22-4","ch":22,"front":"Ramelteon","story":"<p>Ramelteon talks to the body clock. It is a <b>melatonin receptor agonist</b> in the <b>suprachiasmatic nucleus</b> and mimics the night-time melatonin signal, so the patient falls asleep sooner (<b>shorter sleep latency</b>).</p><p>Because it has no GABA action, rebound insomnia and withdrawal are minimal. It is metabolised by CYP enzymes: <b>rifampicin lowers</b> its levels, while <b>fluvoxamine (CYP1A2) and fluconazole raise</b> them. Side effects are dizziness, fatigue and endocrine changes, with <b>↓ testosterone and ↑ prolactin</b>.</p>","hook":"Ramelteon: melatonin agonist that resets the clock, with endocrine quirks."},{"id":"22-x3","ch":22,"front":"Flumazenil","story":"<p>Flumazenil is the rescuer for benzodiazepine overdose. It is a <b>competitive antagonist at the benzodiazepine site</b> of the GABA_A receptor, pushing BZDs off and reversing their CNS depression.</p><p>It also reverses <b>zolpidem, zaleplon and eszopiclone</b>, which use the same site, and speeds recovery after <b>midazolam</b> sedation. It does <b>not reverse barbiturates</b> or alcohol, which bind elsewhere. In mixed overdoses the mainstay is still airway and ventilatory support.</p>","hook":"Flumazenil kicks BZDs and Z-drugs off their site, but not barbiturates."},{"id":"24-0","ch":24,"front":"Phenytoin (fosphenytoin IV)","story":"<p>In an epileptic focus neurons fire in rapid bursts. <b>Phenytoin</b> binds <b>voltage-gated Na⁺ channels</b> in their <b>inactivated state</b> and keeps them closed longer. This block is <b>rate-dependent</b>: the faster a neuron fires, the more it is blocked, so normal activity is spared. It treats partial and tonic-clonic seizures, and water-soluble <b>fosphenytoin</b> is the IV form.</p><p>Its kinetics are tricky: <b>97–98% protein-bound</b> and switching to <b>zero-order</b> elimination at higher doses, so a small dose increase can cause a big jump in levels. It <b>induces liver enzymes</b>. Toxicity runs head to toe: <b>nystagmus</b>, diplopia, sedation, <b>gingival hyperplasia</b>, hirsutism, anaemia, neuropathy, osteoporosis and <b>fetal hydantoin syndrome</b>. In neuro-anaesthesia fosphenytoin prevents or treats perioperative seizures.</p>","hook":"Phenytoin: rate-dependent Na⁺ block, zero-order kinetics, gums and hair grow."},{"id":"24-1","ch":24,"front":"Carbamazepine","story":"<p>Carbamazepine works like phenytoin, with <b>rate-dependent block of inactivated Na⁺ channels</b> that stops high-frequency firing. It treats seizures and acute mania in <b>bipolar disorder</b>.</p><p>Its trademark is <b>autoinduction</b>: it induces the enzymes that metabolise itself, so its levels fall over the first weeks, and it also speeds the breakdown of clonazepam, lamotrigine and valproate. Valproate does the reverse and slows its metabolism. Toxicity includes <b>diplopia</b>, ataxia, drowsiness and the rare but serious <b>blood dyscrasias</b>. In pregnancy it causes <b>craniofacial anomalies and spina bifida</b>.</p>","hook":"Carbamazepine induces itself and can wreck the blood count."},{"id":"24-2","ch":24,"front":"Lamotrigine","story":"<p>Lamotrigine also calms the seizure focus by <b>blocking voltage-gated Na⁺ channels</b> in a rate-dependent way, stabilising membranes and reducing glutamate release. It is eliminated by <b>hepatic glucuronidation</b>.</p><p>It treats seizures and is used in <b>bipolar disorder for the depressive phase</b>. Everyday side effects are dizziness, ataxia and nausea, but the word to remember is <b>rash</b>: it can progress to <b>Stevens–Johnson syndrome</b> or <b>toxic epidermal necrolysis</b>. Valproate inhibits its metabolism and enzyme inducers lower its levels.</p>","hook":"Lamotrigine: Na⁺ block with a dangerous rash (SJS/TEN)."},{"id":"24-3","ch":24,"front":"Valproic acid","story":"<p>Valproic acid is the multitool of antiseizure drugs. At high doses it blocks <b>Na⁺ channels</b>, it <b>inhibits GABA transaminase</b> so more GABA stays around, it blocks <b>T-type Ca²⁺ channels</b> like ethosuximide, and it hyperpolarises membranes via K⁺. That gives it a <b>broad spectrum, including absence seizures</b>, plus a role in mania.</p><p>Unlike most antiseizure drugs it is an <b>enzyme inhibitor</b>: it raises carbamazepine, ethosuximide, phenytoin, phenobarbital and lamotrigine and displaces phenytoin from albumin. A toxic metabolite causes <b>fatal hepatotoxicity</b>, especially in <b>children under 2</b> and those on several drugs. It is teratogenic, causing <b>neural tube defects</b>, and also causes hair loss, weight gain, tremor and drowsiness.</p>","hook":"Valproate: broad-spectrum inhibitor; liver failure under 2, spina bifida."},{"id":"24-4","ch":24,"front":"Ethosuximide","story":"<p>Absence seizures come from rhythmic 3-Hz discharges between thalamus and cortex, driven by <b>T-type Ca²⁺ channels</b> in thalamic neurons. <b>Ethosuximide</b> blocks those channels and the rhythm collapses.</p><p>That precise target makes it a specialist: it works <b>only in absence seizures</b>. Side effects are mild: <b>GI upset</b>, lethargy, headache and behavioural changes. Valproate inhibits its metabolism. Drugs for absence seizures are generally easier to withdraw than drugs for tonic-clonic seizures.</p>","hook":"Ethosuximide: T-type Ca²⁺ in the thalamus, absence only."},{"id":"24-5","ch":24,"front":"Phenobarbital","story":"<p>Phenobarbital attacks seizures from several angles. It binds the <b>barbiturate site on GABA_A</b> and prolongs chloride channel opening (<b>↑ duration</b>), blocks Na⁺ channels at high doses and is a <b>glutamate receptor antagonist</b>. It is one of the few drugs with relatively selective anticonvulsant action and is used for seizures and <b>status epilepticus</b>.</p><p>The costs are <b>sedation</b> and cognitive impairment; paradoxically, children can become <b>hyperactive</b>. It is a strong <b>enzyme inducer</b> that lowers levels of other drugs, so expect interactions.</p>","hook":"Phenobarbital: longer GABA opening, sedating, enzyme-inducing."},{"id":"24-6","ch":24,"front":"Benzodiazepines as antiseizure drugs (clonazepam, diazepam, lorazepam)","story":"<p>Benzodiazepines bind the <b>BZD site of GABA_A</b> and increase the <b>frequency</b> of chloride channel opening, strengthening GABA's brake on the brain. Given IV, <b>diazepam or lorazepam</b> rapidly stop <b>status epilepticus</b>, and clonazepam has selective anticonvulsant use, including absence seizures.</p><p>For long-term control their usefulness is limited by <b>sedation</b> and <b>tolerance</b>. In overdose they depress breathing, and <b>flumazenil</b> reverses them. In theatre, IV lorazepam, midazolam or diazepam treat seizures, including those from <b>local anaesthetic toxicity</b>.</p>","hook":"IV BZDs are first to stop status epilepticus; tolerance limits chronic use."},{"id":"24-7","ch":24,"front":"Levetiracetam","story":"<p>Levetiracetam is the antiseizure drug that gets along with everyone. It is <b>eliminated unchanged by the kidneys</b>, so it has <b>no drug interactions</b>, which is a big advantage when patients take many other medicines. (Its mechanism, binding the synaptic vesicle protein SV2A, isn't described in your notes.)</p><p>Its side effects are mostly central: dizziness, sedation, fatigue, asthenia and behavioural problems such as <b>agitation</b>, and occasionally hallucinations.</p>","hook":"Levetiracetam: renal, unchanged, no interactions, watch the mood."},{"id":"24-8","ch":24,"front":"Vigabatrin","story":"<p>GABA is normally cleared by the enzyme <b>GABA aminotransferase (GABA-T)</b>. Vigabatrin <b>irreversibly inhibits</b> it.</p><p>With the enzyme permanently disabled, GABA builds up in the brain and inhibition increases. Contrast it with <b>valproic acid</b>, which also inhibits GABA-T but only at high concentrations and reversibly, alongside its many other actions.</p>","hook":"Vigabatrin permanently kills GABA-T so GABA piles up."},{"id":"24-9","ch":24,"front":"Topiramate","story":"<p>Topiramate is an antiseizure drug whose fate your notes describe more than its mechanism. It takes two exits from the body: part is <b>metabolised in the liver</b> and part is excreted <b>unchanged by the kidneys</b>.</p><p>Keep it in the group of newer antiseizure drugs, and remember its mixed elimination route as the distinguishing exam detail (compare levetiracetam: purely renal, unchanged; lamotrigine: hepatic glucuronidation).</p>","hook":"Topiramate: half liver, half kidney."},{"id":"24-e0","ch":24,"front":"📌 Carbamazepine interactions","story":"<p>Carbamazepine induces the metabolism of itself and of clonazepam, lamotrigine and valproic acid. Its OWN metabolism is inhibited by <b>valproic acid, propoxyphene and troleandomycin</b>.</p>","hook":""},{"id":"25-0","ch":25,"front":"Nitrous oxide","story":"<p>Nitrous oxide is the light, fast gas of anaesthesia. Its <b>very low blood:gas partition coefficient</b> means blood saturates quickly, so brain levels rise and fall fast. It gives strong <b>analgesia and amnesia</b>, but it's weak: its <b>MAC is so high</b> that it can't produce full surgical anaesthesia on its own. It causes the least cardiovascular and respiratory depression of the inhaled agents.</p><p>So it's an <b>adjunct</b>: it carries other agents and lowers the volatile dose, and as Entonox (50% N₂O/O₂) it eases labour pain. Prolonged exposure inactivates <b>methionine synthase</b>, causing <b>megaloblastic anaemia</b>. It expands closed gas spaces, so it is avoided with <b>pneumothorax</b> or bowel obstruction.</p>","hook":"N₂O: fast in, fast out, great analgesia, too weak alone (high MAC)."},{"id":"25-1","ch":25,"front":"Halothane","story":"<p>Halothane is the veteran volatile agent. It facilitates <b>GABA_A</b> inhibition (and acts on glycine and nicotinic receptors), but its <b>high blood solubility</b> makes induction and recovery slow.</p><p>Its baggage is heavy. It directly <b>depresses the myocardium</b> and <b>sensitises the heart to catecholamines</b>, so adrenaline can trigger arrhythmias. Liver metabolism produces reactive metabolites linked to <b>postoperative hepatitis</b>. Historically it was used for <b>inhalational induction in children</b>, but today it is rarely used. Like other volatiles, it can trigger malignant hyperthermia.</p>","hook":"Halothane: slow, heart-sensitising, liver-damaging relic."},{"id":"25-2","ch":25,"front":"Isoflurane, sevoflurane","story":"<p>These are the modern workhorses of anaesthetic <b>maintenance</b>. They facilitate <b>GABA_A</b>-mediated inhibition to keep the patient unconscious, and they relax vascular smooth muscle, causing <b>peripheral vasodilation</b> and a fall in blood pressure. Isoflurane strongly <b>potentiates neuromuscular blockers</b>.</p><p><b>Sevoflurane</b> has a special talent: it's <b>non-pungent</b>, so it can be breathed calmly for <b>inhalational induction</b> in children, needle-phobic adults or a difficult airway. Its weakness is metabolism to <b>fluoride ions</b>, a potential kidney risk with prolonged exposure.</p>","hook":"Iso/sevo: maintenance workhorses; sevo is sweet enough for mask induction."},{"id":"25-3","ch":25,"front":"Desflurane","story":"<p>Desflurane has <b>low blood solubility</b>, so it comes on and wears off quickly, giving rapid wake-up after surgery. That makes it attractive for <b>maintenance when fast recovery matters</b>.</p><p>Its flaw is its smell: it is pungent and <b>irritates the airway</b>, causing coughing, breath-holding and <b>bronchospasm</b>. So it is <b>not used for induction</b>; sevoflurane or an IV agent starts the anaesthetic, then desflurane takes over.</p>","hook":"Desflurane: quick wake-up, but it irritates the airway."},{"id":"25-4","ch":25,"front":"Enflurane","story":"<p>Enflurane is a volatile agent that facilitates <b>GABA_A</b> inhibition but brings a list of problems. It <b>depresses the myocardium</b>, and at high concentrations it causes <b>spike-and-wave EEG activity</b> and muscle twitching, a seizure-like picture.</p><p>It irritates the airway (breath-holding), so it's not used for induction, and its metabolism yields <b>fluoride ions</b> that can damage the kidney. Today it is considered <b>obsolete</b>.</p>","hook":"Enflurane: seizure-like EEG + fluoride = obsolete."},{"id":"25-5","ch":25,"front":"Methoxyflurane","story":"<p>Methoxyflurane is the volatile agent most heavily <b>metabolised in the liver</b>. That metabolism releases large amounts of free <b>fluoride ions</b>, which cause <b>renal damage</b>.</p><p>For that reason it has no place in general anaesthesia today. It survives only in <b>low-dose inhaled form for short-term emergency analgesia</b>. Remember it as the extreme example of fluoride nephrotoxicity, alongside enflurane and sevoflurane.</p>","hook":"Methoxyflurane: most metabolised, most fluoride, kidney damage."},{"id":"25-6","ch":25,"front":"Thiopental, methohexital","story":"<p>Thiopental is so lipid-soluble that within one circulation, <b>under a minute</b>, it floods the brain and the patient is asleep, as it facilitates <b>GABA_A</b> and prolongs chloride channel opening. Then comes the twist: the patient wakes a few minutes later not because the drug is gone, but because it <b>redistributes</b> from brain to muscle and fat; the liver clears it later.</p><p>It <b>lowers cerebral metabolism, blood flow and intracranial pressure</b>, which makes it valuable in <b>neuro-anaesthesia</b> and a classic agent for <b>rapid IV induction</b> and short procedures. The cost is <b>respiratory and circulatory depression</b>. Methohexital behaves similarly.</p>","hook":"Thiopental: asleep in a minute, awake by redistribution, ↓ ICP."},{"id":"25-7","ch":25,"front":"Midazolam","story":"<p>Midazolam is the anaesthetist's favourite benzodiazepine. It increases the <b>frequency</b> of GABA_A chloride channel opening, giving sedation and strong <b>amnesia</b>. Compared with thiopental its onset is slower and its action longer.</p><p>It is used for <b>premedication</b> and procedural sedation and in <b>co-induction</b>, where it lowers the dose of other induction agents. It's usually combined with inhaled anaesthetics and opioids. The risk is <b>postoperative respiratory depression</b>, and <b>flumazenil</b> speeds recovery.</p>","hook":"Midazolam: calm, forgetful premedication, reversed by flumazenil."},{"id":"25-8","ch":25,"front":"Ketamine","story":"<p>Ketamine is the rebel of anaesthesia. Instead of boosting GABA, it <b>blocks the NMDA glutamate receptor</b> and disconnects the cortex from the limbic system. The patient has open eyes and looks catatonic, but feels no pain and remembers nothing: <b>dissociative anaesthesia</b>. It is related to PCP.</p><p>Unlike other anaesthetics it <b>stimulates the sympathetic system</b>, raising heart rate and blood pressure, so it is ideal for induction in <b>shock or hypovolaemia</b> and in asthma (bronchodilator), and gives analgesia at low dose. It raises <b>intracranial pressure</b>, so avoid it in head injury. Patients can have vivid <b>emergence reactions</b>, which benzodiazepines reduce.</p>","hook":"Ketamine: NMDA block, dissociated but stable BP, bad dreams."},{"id":"25-9","ch":25,"front":"Fentanyl, sufentanil (alfentanil, remifentanil)","story":"<p>Fentanyl and its cousins are potent <b>μ-opioid agonists</b> that give deep analgesia and blunt the body's stress response with <b>little cardiac depression</b>. They are given with other CNS depressants (N₂O, benzodiazepines) rather than alone, and they suit patients who couldn't tolerate full general anaesthesia.</p><p>In theatre fentanyl provides <b>intra-operative analgesia</b> and blunts the response to intubation, and is added to epidurals and spinals. <b>Fentanyl + droperidol + N₂O</b> is <b>neuroleptanaesthesia</b>. The danger is <b>chest wall rigidity</b> and respiratory depression, both reversed by <b>naloxone</b>. Remifentanil is broken down by esterases and wears off in minutes.</p>","hook":"Fentanyl: strong μ analgesia, rigid chest, naloxone reverses."},{"id":"25-10","ch":25,"front":"Propofol (fospropofol)","story":"<p>Propofol is the white milk of modern anaesthesia. It facilitates <b>GABA_A</b> inhibition, putting the patient to sleep rapidly. Its <b>clearance exceeds hepatic blood flow</b> (extra-hepatic elimination), so even after long infusions patients wake <b>quickly and clear-headed</b>.</p><p>That makes it the <b>most common IV induction agent</b> and the backbone of <b>TIVA</b>, day-case surgery and ICU or endoscopy sedation. It's also <b>antiemetic</b>, so PONV is lower. The trade-off is <b>hypotension</b> from reduced peripheral resistance. Fospropofol is a water-soluble prodrug.</p>","hook":"Propofol: fast sleep, clear waking, antiemetic, low BP."},{"id":"25-11","ch":25,"front":"Etomidate","story":"<p>Etomidate is the gentle inducer for fragile hearts. This imidazole facilitates <b>GABA_A</b> inhibition for rapid hypnosis but leaves <b>heart and breathing almost untouched</b>.</p><p>That's why it's chosen for patients with <b>poor cardiac or respiratory reserve</b>. It has <b>no analgesic</b> effect. Side effects include pain on injection, <b>myoclonus</b> and nausea, and it <b>suppresses adrenal steroid synthesis</b>, so it's given as a single induction dose rather than repeated.</p>","hook":"Etomidate: steady heart, no analgesia, suppressed adrenals."},{"id":"25-x4","ch":25,"front":"Remifentanil","story":"<p>Remifentanil is a <b>μ-opioid agonist</b> like fentanyl, with one decisive difference: it is broken down by <b>esterases in blood and tissues</b>, not by the liver. Its effect ends within minutes whatever the length of infusion, giving the <b>fastest recovery</b> of the opioids.</p><p>So anaesthetists run it as an infusion for <b>TIVA (with propofol)</b> and can titrate analgesia minute by minute. The flip side is that patients need other analgesia planned before it's switched off, because its effect vanishes so quickly.</p>","hook":"Remifentanil: esterase-cleared, gone in minutes."},{"id":"25-e0","ch":25,"front":"📌 Glycine receptors","story":"<p>Strychnine-sensitive <b>glycine receptors</b> are another site of action of inhaled anaesthetics (besides GABA_A, NMDA and nicotinic receptors).</p>","hook":""},{"id":"26-0","ch":26,"front":"Ester local anaesthetics (procaine, cocaine, tetracaine, benzocaine)","story":"<p>Local anaesthetics come in two families, and the esters carry a fragile <b>ester bond</b>. In the blood, <b>plasma butyrylcholinesterase</b> snaps it quickly; procaine's half-life is only <b>1–2 minutes</b> (tetracaine is much slower), so systemic toxicity is low. Spot them by name: esters have only one 'i'.</p><p>Their weakness is allergy: breakdown products resemble <b>PABA</b> and can trigger antibodies, so <b>allergy</b> is more common than with amides (still rare). In practice <b>benzocaine</b> is topical on mucosa, <b>tetracaine</b> is used topically and for spinals, <b>chloroprocaine</b> for short spinals or epidurals, and cocaine topically in ENT surgery.</p>","hook":"Esters: plasma cholinesterase, short, one 'i', allergy (PABA)."},{"id":"26-1","ch":26,"front":"Amide local anaesthetics (lidocaine, prilocaine, bupivacaine, ropivacaine)","story":"<p>Amides have a sturdy bond that plasma enzymes can't break, so they travel to the <b>liver (CYP450)</b>. That gives longer half-lives: lidocaine and prilocaine about <b>1.5 hours</b>, bupivacaine and ropivacaine <b>3.5–4.2 hours</b>. Liver disease leads to accumulation. Allergy is rare. Their names have two 'i's.</p><p>Like all local anaesthetics they are weak bases that block <b>voltage-gated Na⁺ channels</b> from inside the axon. In practice, <b>lidocaine</b> is used for infiltration, nerve blocks, topical airway and <b>IV regional anaesthesia (Bier block)</b>; <b>bupivacaine and ropivacaine</b> for spinals, epidurals (labour) and long blocks. Adding <b>adrenaline</b> prolongs the block, and IV <b>lipid emulsion</b> rescues severe toxicity.</p>","hook":"Amides: two 'i's, liver metabolism, rarely allergic."},{"id":"26-2","ch":26,"front":"Cocaine","story":"<p>Cocaine plays two roles. As a local anaesthetic it blocks <b>Na⁺ channels</b> like the others. It also <b>blocks noradrenaline reuptake</b> at sympathetic endings, so it causes its own <b>vasoconstriction</b>, the only local anaesthetic that does, and needs no added adrenaline.</p><p>In the brain it blocks <b>dopamine reuptake</b>, giving euphoria and abuse. Systemically it causes <b>hypertension</b>, stroke, arrhythmias and <b>myocardial infarction</b>. Clinically it survives as a <b>topical</b> anaesthetic in <b>nasal and ENT surgery</b>, where numbness plus vasoconstriction means less bleeding.</p>","hook":"Cocaine: numbs and constricts by itself; heart attack in excess."},{"id":"26-3","ch":26,"front":"Bupivacaine (levobupivacaine)","story":"<p>Bupivacaine is the long-acting, highly lipid-soluble amide. It binds cardiac Na⁺ channels <b>strongly and lets go slowly</b>, so once it reaches the heart in toxic amounts it causes stubborn <b>conduction block, arrhythmias and cardiovascular collapse</b>: <b>severe cardiotoxicity</b> that's very hard to treat.</p><p>Its pure S-isomer, <b>levobupivacaine</b>, is less cardiotoxic. In anaesthesia it is a workhorse for <b>spinal ('heavy' hyperbaric)</b> and <b>epidural</b> anaesthesia and long nerve blocks. The rule to remember: it is <b>never used for IV regional anaesthesia</b>. IV lipid emulsion treats severe toxicity.</p>","hook":"Bupivacaine: long-acting but cardiotoxic, never IV regional."},{"id":"26-4","ch":26,"front":"Prilocaine","story":"<p>Prilocaine is an amide whose metabolite causes trouble. The liver converts it to <b>o-toluidine</b>, which oxidises haemoglobin iron from Fe²⁺ to Fe³⁺, producing <b>methaemoglobin</b> that can't carry oxygen. The patient may look blue despite good ventilation: <b>methaemoglobinaemia</b>.</p><p>Clinically it is used for <b>IV regional anaesthesia (Bier block)</b>, and mixed with lidocaine in <b>EMLA cream</b> for painless cannulation, with an eye on methaemoglobinaemia.</p>","hook":"Prilocaine → o-toluidine → methaemoglobin (blue patient)."},{"id":"26-5","ch":26,"front":"Articaine","story":"<p>Articaine is an amide local anaesthetic with one standout feature: the <b>fastest onset of action</b> of the group.</p><p>That makes it popular in <b>dental anaesthesia</b>, where quick numbness matters. Like the others it blocks <b>voltage-gated Na⁺ channels</b>. Remember the other way to speed onset: adding <b>sodium bicarbonate</b> increases the non-ionised fraction that crosses the membrane.</p>","hook":"Articaine: fastest onset, dentists' favourite."},{"id":"26-6","ch":26,"front":"Chloroprocaine, lidocaine (neurotoxicity)","story":"<p>Most local anaesthetic toxicity is systemic, but this card is about local damage. At <b>high concentrations</b>, <b>chloroprocaine</b> and <b>lidocaine</b> can directly injure nerve fibres: <b>neurotoxicity</b>.</p><p>So the dose and concentration that reach the nerve matter, especially in spinal anaesthesia. Remember the full toxicity ladder: CNS effects first (dizziness, nystagmus, <b>convulsions</b>, treated with IV diazepam or thiopental plus oxygen), then cardiovascular depression (worst with bupivacaine), then special cases such as methaemoglobinaemia (prilocaine) and allergy (esters).</p>","hook":"High-concentration chloroprocaine or lidocaine can injure the nerve itself."},{"id":"26-x5","ch":26,"front":"Ropivacaine and levobupivacaine","story":"<p>Bupivacaine's cardiotoxicity pushed chemists to make safer long-acting amides. <b>Levobupivacaine</b> is bupivacaine's pure <b>(S) isomer</b> and is <b>less cardiotoxic</b>. <b>Ropivacaine</b> is a close relative with a similar long half-life (bupivacaine and ropivacaine about <b>3.5–4.2 hours</b>), generally regarded as a safer alternative to bupivacaine.</p><p>Both are popular for <b>epidurals in labour</b>, postoperative infusions and long nerve blocks, and like other long-acting agents they need less added vasoconstrictor. But 'safer' isn't 'safe': your notes warn that <b>ropivacaine can cause cardiotoxicity when used for peripheral nerve blocks</b>, so dose limits and careful injection still apply.</p>","hook":"Levobupivacaine = safer S-isomer; ropivacaine safer, but still cardiotoxic in nerve blocks."},{"id":"27-0","ch":27,"front":"Tubocurarine, pancuronium, pipecuronium","story":"<p>Picture the motor end plate as a door with a lock that only ACh can open. Tubocurarine, the old prototype, slips a fake key into the <b>nicotinic receptor</b> and just sits there – a <b>competitive antagonist</b>. No depolarisation, no muscle action potential, so the muscle goes completely <b>flaccid</b>. Being quaternary amines, these drugs never cross into the brain, and because they leave through the <b>kidney</b> they stay for a long time (≥35 min).</p><p>Give more ACh – with <b>neostigmine</b> or pyridostigmine – and the real key wins back the lock, so the block reverses. Each brother has a flaw: tubocurarine releases <b>histamine</b> and weakly blocks ganglia (so it is obsolete), while pancuronium blocks cardiac muscarinic receptors and makes the heart race (<b>tachycardia</b>). In anaesthesia pancuronium still serves for long operations.</p>","hook":"Long, renal, competitive – and pancuronium speeds the heart."},{"id":"27-1","ch":27,"front":"Mivacurium","story":"<p>Mivacurium is the sprinter of the non-depolarising family. It blocks the end-plate nicotinic receptor <b>competitively</b> just like tubocurarine, but the moment it enters the plasma, <b>plasma cholinesterase</b> starts chopping it up, so its whole act lasts only about <b>10–20 minutes</b>.</p><p>That makes it handy for <b>short procedures</b> that need only brief relaxation. Its weaknesses: it still triggers some <b>histamine release</b>, and if the patient has renal failure (or an abnormal cholinesterase) the drug lingers and the block is <b>prolonged</b>.</p>","hook":"Mini-vacation: short, broken down by plasma cholinesterase."},{"id":"27-2","ch":27,"front":"Vecuronium, rocuronium","story":"<p>These two are the clean workhorses of modern anaesthesia. They sit on the end-plate nicotinic receptor as <b>competitive antagonists</b> but bring no baggage: <b>no histamine release</b> and no autonomic effects. They leave mainly through the <b>bile</b>, so their action is of intermediate, short length.</p><p>Rocuronium is the speed champion – it has the <b>fastest onset</b> of the non-depolarising drugs. A high dose of rocuronium is therefore used for <b>rapid sequence induction</b> when succinylcholine can't be given. When surgery ends, the block is reversed with <b>neostigmine + atropine</b>, or very quickly with <b>sugammadex</b>, which wraps up the rocuronium molecule.</p>","hook":"Rocuronium = rapid onset, no histamine; reversed by sugammadex."},{"id":"27-3","ch":27,"front":"Atracurium / cisatracurium","story":"<p>Atracurium is the relaxant that destroys itself. After competitively blocking the end-plate receptor, it falls apart <b>spontaneously</b> at normal body pH and temperature – <b>Hofmann elimination</b> – without needing the liver or kidneys at all.</p><p>That is why it is the relaxant of choice in <b>renal or hepatic failure</b>. The catch is its breakdown product, <b>laudanosine</b>, which can cause <b>convulsions</b>. Its cleaner twin, cisatracurium, produces much less laudanosine. Atracurium can also release some histamine.</p>","hook":"Self-destructing relaxant: Hofmann → laudanosine → seizures."},{"id":"27-4","ch":27,"front":"Succinylcholine","story":"<p>Succinylcholine is two ACh molecules glued together, and it behaves like a stubborn ACh. It <b>activates</b> the end-plate nicotinic receptor and <b>depolarises</b> it – you see <b>fasciculations</b> – but acetylcholinesterase can't destroy it, so the membrane stays depolarised, Na⁺ channels inactivate and the muscle is paralysed: <b>phase I block</b>. With long exposure the membrane repolarises yet stays desensitised: phase II. Neostigmine makes phase I <b>worse</b> but reverses phase II.</p><p>Plasma <b>butyrylcholinesterase</b> ends its action within minutes, but in people with an <b>atypical enzyme (low dibucaine number)</b> paralysis lasts hours. Its dark side: muscle pain, <b>hyperkalaemia</b> in burns, spinal cord injury and dystrophy, raised intragastric pressure, and <b>malignant hyperthermia</b>. In anaesthesia it is the classic drug for <b>rapid sequence intubation</b>.</p>","hook":"Depolarising, fastest on and off – beware K⁺, burns and malignant hyperthermia."},{"id":"27-5","ch":27,"front":"Diazepam (spasmolytic)","story":"<p>In the spinal cord, motoneurons can fire too much in patients with spasticity. Diazepam arrives at their <b>GABA_A receptors</b> and turns up the volume of GABA, the inhibitory transmitter, so the motoneurons calm down and muscle tone falls.</p><p>It is used for <b>chronic spasticity</b>, for example in <b>cerebral palsy</b>. Its unwanted guest is <b>sedation</b>, although at the same degree of muscle relaxation it sedates less than other sedatives.</p>","hook":"Diazepam relaxes the spinal cord via GABA_A – at the cost of sleepiness."},{"id":"27-6","ch":27,"front":"Baclofen","story":"<p>Baclofen is a <b>GABA_B agonist</b> working in the spinal cord. On the sensory nerve terminal it reduces Ca²⁺ entry so less <b>glutamate</b> is released; on the motoneuron it opens K⁺ channels and hyperpolarises it. The spastic muscle finally relaxes.</p><p>It treats spasticity in <b>multiple sclerosis</b> and other conditions, with <b>less sedation than diazepam</b>, and for refractory cases it can be given <b>intrathecally</b> through a pump. Tolerance develops, so it must be <b>withdrawn gradually</b> – and an intrathecal pump must never be interrupted around surgery, because abrupt withdrawal brings rebound spasticity, fever and seizures.</p>","hook":"Baclofen = GABA_B, intrathecal pump, never stop suddenly."},{"id":"27-7","ch":27,"front":"Tizanidine","story":"<p>Tizanidine is clonidine's cousin – an <b>α2 agonist</b> (imidazoline) – but it works on the spinal cord's motor circuits. It strengthens <b>presynaptic inhibition</b> of motoneurons, so reflex muscle tone falls.</p><p>It is used for <b>spasticity</b>. Because it is clonidine-like, its side effects are predictable: <b>weakness, drowsiness, dry mouth</b> and <b>hypotension</b>.</p>","hook":"Tizanidine: clonidine for the spinal cord."},{"id":"27-8","ch":27,"front":"Dantrolene","story":"<p>Dantrolene is the only spasmolytic that ignores the nervous system and goes straight to the muscle. Inside skeletal muscle it blocks the <b>ryanodine receptor RyR1</b> – the Ca²⁺ release channel of the sarcoplasmic reticulum – so less Ca²⁺ is released and contraction weakens. The heart uses RyR2, so it is barely affected.</p><p>Its hero moment is <b>malignant hyperthermia</b>: when a volatile anaesthetic or succinylcholine triggers uncontrolled Ca²⁺ release, IV dantrolene stops it (also used in <b>neuroleptic malignant syndrome</b>). It also treats spasticity. Its main side effect is <b>muscle weakness</b>.</p>","hook":"Dantrolene damps RyR1 – the antidote for malignant hyperthermia."},{"id":"27-9","ch":27,"front":"Botulinum toxin; gabapentin, pregabalin","story":"<p>Botulinum toxin is injected straight into an overactive muscle. There it stops nerve terminals releasing <b>ACh</b>, producing a <b>local paralysis</b> that calms focal spasm, for example in <b>cerebral palsy</b>.</p><p>Gabapentin and pregabalin are really antiseizure drugs, but they have a second job: reducing <b>spasticity in multiple sclerosis</b>.</p>","hook":"Botox blocks ACh release locally; gabapentin/pregabalin help MS spasticity."},{"id":"27-10","ch":27,"front":"Cyclobenzaprine (methocarbamol, orphenadrine)","story":"<p>After an injury the back muscles lock up in painful spasm. Cyclobenzaprine works in the <b>brainstem</b>, probably interfering with the <b>polysynaptic reflexes</b> that keep muscle tone up, and so it relieves <b>acute muscle spasm</b>.</p><p>Structurally it is TCA-like, so it brings <b>sedation</b>, <b>antimuscarinic effects</b> and confusion. Methocarbamol and orphenadrine are similar. Key exam trap: these drugs are <b>useless in cerebral palsy or spinal cord injury</b> – they're for acute local spasm only.</p>","hook":"Cyclobenzaprine: acute spasm only, sedating and atropine-like."},{"id":"27-x0","ch":27,"front":"Neostigmine (reversal of neuromuscular block)","story":"<p>At the end of an operation the patient's muscles are still blocked by a non-depolarising relaxant. Neostigmine, a <b>cholinesterase inhibitor</b>, stops ACh from being destroyed, so ACh piles up at the end plate and <b>outcompetes</b> the relaxant: the block is reversed.</p><p>But the extra ACh also floods muscarinic receptors – causing <b>bradycardia</b> and secretions – so neostigmine is always given with <b>atropine</b> (or glycopyrrolate). Remember: it reverses <b>non-depolarising</b> block and phase II succinylcholine block, but it <b>deepens phase I</b> succinylcholine block.</p>","hook":"Neostigmine + atropine reverses non-depolarising block."},{"id":"27-e0","ch":27,"front":"📌 Doxacurium","story":"<p>Like vecuronium, cisatracurium, pipecuronium and rocuronium, <b>doxacurium</b> has no autonomic effects and doesn't release histamine. Large muscles (diaphragm) resist block more but recover first.</p>","hook":""},{"id":"28-0","ch":28,"front":"Levodopa + carbidopa","story":"<p>In Parkinson's disease the nigrostriatal neurons die and the striatum runs short of <b>dopamine</b>. Dopamine itself can't cross the blood–brain barrier, so we send its precursor, levodopa, which rides in on the <b>L-amino acid transporter (LAT)</b> and is converted to dopamine in the brain. Its bodyguard <b>carbidopa</b> blocks dopa decarboxylase only outside the brain, so more levodopa reaches its target and peripheral nausea and arrhythmias fall.</p><p>It is the mainstay and is best for <b>bradykinesia</b>. Over years the story darkens: <b>dyskinesias</b> in 80%, <b>wearing-off</b> and sudden <b>on–off</b> swings, nausea, orthostatic hypotension and hallucinations – it is contraindicated in <b>psychosis</b>. Around surgery it must be continued, because missed doses cause severe rigidity; avoid dopamine-blocking antiemetics.</p>","hook":"Levodopa enters via LAT; carbidopa guards it outside the brain."},{"id":"28-1","ch":28,"front":"Bromocriptine","story":"<p>Bromocriptine is an old <b>ergot derivative</b> that doesn't need the dying dopamine neurons at all – it directly stimulates (as a partial agonist) <b>D2 receptors</b> in the striatum.</p><p>It is now <b>rarely used</b> in Parkinson's because it causes nausea, dyskinesias, hypotension and <b>more confusion and hallucinations</b> than levodopa. (It is also used for hyperprolactinaemia and prolactinomas.)</p>","hook":"Bromocriptine: ergot D2 agonist, more psychiatric side effects."},{"id":"28-2","ch":28,"front":"Pramipexole","story":"<p>Pramipexole is a newer <b>non-ergot</b> dopamine agonist with a special liking for <b>D3 receptors</b>. It stimulates dopamine receptors directly and may even scavenge H₂O₂, so it is possibly <b>neuroprotective</b>. It leaves the body through the <b>kidneys</b>.</p><p>It can be used alone in <b>mild Parkinson's</b> or added to levodopa. Its notorious side effects: sudden <b>sleep attacks</b>, <b>impulsive behaviour</b> (gambling, shopping) and hallucinations.</p>","hook":"Pramipexole: D3, renal, sleep attacks and impulsivity."},{"id":"28-3","ch":28,"front":"Ropinirole","story":"<p>Ropinirole is pramipexole's sibling – a <b>non-ergot D2 agonist</b> that stimulates striatal dopamine receptors directly. Unlike pramipexole it is cleared by the liver via <b>CYP1A2</b>, so caffeine and warfarin can raise its levels.</p><p>It is used alone or with levodopa (there is a once-daily extended-release form), and it shares pramipexole's side effects: <b>sleep attacks</b>, impulsivity, hallucinations.</p>","hook":"Ropinirole: D2, CYP1A2 – otherwise a pramipexole twin."},{"id":"28-4","ch":28,"front":"Apomorphine","story":"<p>A Parkinson's patient suddenly freezes in an 'off' episode. Apomorphine, a very <b>potent direct dopamine agonist</b>, is injected <b>subcutaneously</b> and acts within minutes, unlocking movement – a <b>rescue for 'off' periods</b>.</p><p>It also stimulates the vomiting centre strongly, causing <b>severe nausea</b>, so patients are pretreated with the antiemetic <b>trimethobenzamide</b>.</p>","hook":"Apomorphine = SC rescue for 'off', pretreat nausea."},{"id":"28-5","ch":28,"front":"Selegiline, rasagiline","story":"<p>In the brain, the enzyme <b>MAO-B</b> breaks down dopamine. Selegiline and rasagiline irreversibly inhibit it, so dopamine lingers longer in the synapse and levodopa (or the remaining dopamine) works better. Because they are selective for B, tyramine is still broken down by MAO-A.</p><p>Selegiline is given <b>with levodopa</b>; rasagiline can also be used <b>alone</b>. Two dangerous combinations to remember: with <b>meperidine</b> → stupor, delirium, even death; selegiline with <b>SSRIs</b> → <b>serotonin syndrome</b>.</p>","hook":"MAO-B inhibitors: never with meperidine."},{"id":"28-6","ch":28,"front":"Entacapone, tolcapone","story":"<p>Levodopa has an enemy outside the brain: <b>COMT</b>, which turns it into 3-O-methyldopa, a molecule that then competes with levodopa for transport into the brain. Entacapone (only peripheral) and tolcapone <b>inhibit COMT</b>, so more levodopa arrives, more smoothly.</p><p>They are adjuncts that <b>reduce fluctuations</b> and prolong the 'on' periods. Side effects: dyskinesia, harmless <b>orange urine</b>, and for tolcapone, <b>hepatotoxicity</b>.</p>","hook":"COMT inhibitors smooth levodopa; tolcapone hurts the liver."},{"id":"28-7","ch":28,"front":"Amantadine","story":"<p>Amantadine started life as an antiviral, then turned out to help Parkinson's. It boosts dopamine – increasing its synthesis and <b>release</b> o
