ory period<br><b>③</b> Rate-dependent: affects neurons firing rapidly (seizure focus) much more than normal ones → stops repetitive firing and spread","Fosphenytoin IV for seizure prophylaxis/treatment around neurosurgery; chronic use induces enzymes (may increase requirements for some relaxants and opioids).","Neuro-anaesthesia"],["Carbamazepine","Na⁺ block","Seizures; bipolar (acute mania)","Diplopia, ataxia, drowsiness, BLOOD DYSCRASIAS; craniofacial anomalies & spina bifida; AUTOINDUCTION + inducer","<b>①</b> Same rate-dependent block of inactivated Na⁺ channels as phenytoin<br><b>②</b> Stops high-frequency repetitive firing in the epileptic focus"],["Lamotrigine","Na⁺ block; hepatic glucuronidation","Seizures; bipolar (depressive phase)","Dizziness, ataxia, rash → STEVENS–JOHNSON / TEN","<b>①</b> Blocks voltage-gated Na⁺ channels (rate-dependent)<br><b>②</b> Stabilises neuronal membranes and reduces glutamate release"],["Valproic acid","Na⁺ block, GABA-T inhibition, T-type Ca²⁺, K⁺ (hyperpolarisation)","Broad spectrum incl. absence; bipolar","HEPATOTOXICITY (children <2 y, polytherapy), NEURAL TUBE DEFECTS, hair loss, weight gain, tremor; enzyme INHIBITOR, displaces phenytoin","<b>①</b> Na⁺ channel block (at high doses)<br><b>②</b> Inhibits GABA transaminase (GABA-T) → GABA isn't broken down → more inhibitory GABA<br><b>③</b> Blocks T-type Ca²⁺ channels (like ethosuximide) → helps absence seizures<br><b>④</b> ↑ K⁺ permeability → hyperpolarisation. Multiple mechanisms = broad spectrum"],["Ethosuximide","T-type Ca²⁺ block in thalamus","ABSENCE seizures","GI upset, lethargy, headache, behaviour change","<b>①</b> Blocks T-type voltage-gated Ca²⁺ channels in thalamic neurons<br><b>②</b> These channels drive the rhythmic 3-Hz thalamo-cortical discharges of absence seizures<br><b>③</b> Blocking them stops the oscillation → works ONLY in absence seizures"],["Phenobarbital","GABA_A (↑ duration), Na⁺, glutamate antagonist","Seizures, status epilepticus","Sedation, cognitive impairment, hyperactivity in children, INDUCER","<b>①</b> Binds GABA_A (barbiturate site) → ↑ DURATION of Cl⁻ channel opening<br><b>②</b> Also blocks Na⁺ channels (high doses) and is a glutamate receptor antagonist"],["Benzodiazepines (clonazepam, diazepam, lorazepam)","GABA_A (↑ frequency)","Status epilepticus (IV)","Sedation, tolerance","<b>①</b> Bind the BZD site on GABA_A → ↑ FREQUENCY of Cl⁻ channel opening → stronger GABA inhibition<br><b>②</b> IV diazepam/lorazepam rapidly stop status epilepticus","IV lorazepam/midazolam/diazepam for seizures in theatre, including local anaesthetic toxicity.","Emergencies"],["Levetiracetam","—","Seizures","Dizziness, sedation, agitation, hallucinations. Renal unchanged → NO interactions","<b>①</b> Mechanism not described in the notes (binds synaptic vesicle protein SV2A, modulating transmitter release)<br><b>②</b> Excreted unchanged by the kidney → no interactions"],["Vigabatrin","IRREVERSIBLE GABA-T inhibitor","","","<b>①</b> Irreversibly inhibits GABA transaminase<br><b>②</b> GABA can't be degraded → GABA levels in the brain rise → more inhibition"],["Topiramate","Hepatic + renal unchanged","","","<b>①</b> Partly metabolised in the liver, partly excreted unchanged by the kidney<br><b>②</b> (Mechanism not described in the notes)"]],"traps":["INDUCERS: phenytoin, carbamazepine (incl. itself), phenobarbital, rifampicin → lower other antiseizure levels.","INHIBITOR: valproic acid (↑ carbamazepine, ethosuximide, phenytoin, phenobarbital, lamotrigine). Cimetidine & isoniazid ↑ phenytoin.","Protein-binding displacers of phenytoin: carbamazepine, valproate, sulfonamides.","Teratogens: valproate → spina bifida; carbamazepine → craniofacial + spina bifida; phenytoin → fetal hydantoin syndrome.","Always withdraw GRADUALLY; absence drugs are easier to withdraw."],"mem":["Phenytoin hits the body head-to-toe: <b>Eyes</b> (nystagmus, diplopia) · <b>Gums</b> (hyperplasia) · <b>Hair</b> (hirsutism) · <b>Blood</b> (anaemia) · <b>Nerves</b> (neuropathy) · <b>Bones</b> (osteoporosis) · <b>Liver</b> (enzyme induction).","<b>E</b>thosuximide → <b>E</b>xclusively absence (T-type Ca²⁺ in thalamus)."],"cards":[["Unique pharmacokinetic feature of phenytoin?","Non-linear: shifts from first- to zero-order elimination at moderate-high doses; 97–98% protein bound."],["Adverse effects of phenytoin?","Nystagmus, diplopia, sedation, gingival hyperplasia, hirsutism, anaemia, peripheral neuropathy, osteoporosis, enzyme induction, fetal hydantoin syndrome."],["What is carbamazepine autoinduction?","It induces the enzymes that metabolise itself (and other antiseizure drugs)."],["Serious idiosyncratic toxicity of carbamazepine?","Blood dyscrasias (plus diplopia, ataxia; teratogenic)."],["Life-threatening toxicity of valproic acid?","Fatal hepatotoxicity – children under 2 and patients on several antiseizure drugs. Also neural tube defects."],["Which antiseizure drug is an enzyme inhibitor?","Valproic acid."],["Life-threatening toxicity of lamotrigine?","Stevens–Johnson syndrome / toxic epidermal necrolysis."],["Mechanism and indication of ethosuximide?","T-type Ca²⁺ channel block in thalamic neurons – absence seizures."],["Which antiseizure drug has no drug interactions and why?","Levetiracetam – eliminated unchanged by the kidneys."],["Which drugs block Na⁺ channels at therapeutic concentrations?","Phenytoin, carbamazepine, lamotrigine (phenobarbital & valproate only at high doses)."],["What is vigabatrin?","Irreversible inhibitor of GABA aminotransferase."],["Teratogenic effects of valproate, carbamazepine, phenytoin?","Valproate: neural tube defects; carbamazepine: craniofacial + spina bifida; phenytoin: fetal hydantoin syndrome."]],"quiz":[["Drug of choice targeting T-type Ca²⁺ channels for absence seizures:",["Phenytoin","Ethosuximide","Carbamazepine","Lamotrigine"],1,"Thalamic T-type channels."],["Gingival hyperplasia and hirsutism suggest:",["Valproate","Phenytoin","Levetiracetam","Ethosuximide"],1,"Classic phenytoin toxicity."],["A 1-year-old on several antiseizure drugs develops liver failure. Most likely:",["Valproic acid","Levetiracetam","Ethosuximide","Clonazepam"],0,"Fatal hepatotoxicity <2 years & polytherapy."],["Which drug has zero-order kinetics at higher doses?",["Lamotrigine","Phenytoin","Levetiracetam","Topiramate"],1,"Non-linear metabolism."],["Stevens–Johnson syndrome is a key risk of:",["Lamotrigine","Valproate","Ethosuximide","Phenobarbital"],0,"Also toxic epidermal necrolysis."]],"kc":[{"t":"Status epilepticus","a":["status epilepticus"],"d":"Continuous seizure or repeated seizures without recovery between them – an emergency.","x":"IV lorazepam/diazepam, then (fos)phenytoin or phenobarbital."},{"t":"Rate-dependent block","a":["Rate-dependent","rate-dependent"],"d":"Na⁺ channel blockers act more on neurons firing at high frequency (the seizure focus).","x":""},{"t":"Zero-order kinetics","a":["ZERO-ORDER","zero-order"],"d":"Elimination saturated → constant amount eliminated per time; small dose increases cause big level rises.","x":"Phenytoin – monitor plasma levels."},{"t":"Autoinduction","a":["autoinduction","AUTOINDUCTION"],"d":"A drug induces the enzymes that metabolise itself, so its levels fall over the first weeks.","x":"Carbamazepine."},{"t":"Absence seizure","a":["absence","ABSENCE"],"d":"Brief lapses of consciousness with 3-Hz spike-and-wave discharges from thalamic T-type Ca²⁺ channels.","x":"Ethosuximide, valproate."}],"ex":[["Carbamazepine interactions","Carbamazepine induces the metabolism of itself and of clonazepam, lamotrigine and valproic acid. Its OWN metabolism is inhibited by <b>valproic acid, propoxyphene and troleandomycin</b>."]]},{"id":25,"t":"General Anaesthetics","p":71,"big":"General anaesthesia = unconsciousness, analgesia, amnesia, muscle relaxation, loss of reflexes. Typical protocol: <b>IV induction</b> → <b>inhaled maintenance</b> → <b>neuromuscular blocker</b>.<br><b>Stages:</b> 1 analgesia → 2 excitement → 3 surgical anaesthesia → 4 medullary depression.<br><b>Mechanism:</b> most ↑ GABA_A (inhaled, barbiturates, BZD, etomidate, propofol); <b>ketamine = NMDA antagonist</b>; also glycine & nicotinic receptors. Potency ∝ lipid solubility.","tbl":[["Nitrous oxide","Gas; LOW blood:gas coefficient → fast on/off","Analgesia, amnesia; adjunct","HIGH MAC (low potency); least CV & respiratory depression; prolonged → megaloblastic anaemia (↓ methionine synthase)","<b>①</b> Gas; very low blood:gas partition coefficient → blood saturates quickly → brain partial pressure rises fast<br><b>②</b> Acts on CNS receptors (e.g. ↓ NMDA, ↑ GABA_A) → strong analgesia and amnesia<br><b>③</b> But low potency (high MAC) → can't produce full anaesthesia alone","Carrier gas adjunct (analgesia, amnesia, lowers the volatile dose); Entonox (50% N₂O/O₂) for labour pain. Avoid with closed gas spaces (pneumothorax, bowel obstruction, middle ear) because it expands them.","Maintenance"],["Halothane","High blood solubility → slow","","Myocardial depression; sensitises heart to catecholamines; postoperative HEPATITIS","<b>①</b> Volatile halogenated hydrocarbon; facilitates GABA_A inhibition (also glycine receptors, inhibits nicotinic)<br><b>②</b> High blood solubility → slow induction and recovery<br><b>③</b> Metabolised in the liver to reactive metabolites (hepatitis); directly depresses the myocardium","Historically for inhalational induction (esp. children); now rarely used because of hepatitis and arrhythmias.","Induction"],["Isoflurane, sevoflurane","Peripheral vasodilation","Maintenance","Sevoflurane → fluoride (renal); isoflurane strongly potentiates NM blockers","<b>①</b> Facilitate GABA_A-mediated inhibition → unconsciousness<br><b>②</b> Relax vascular smooth muscle → peripheral vasodilation (↓ BP)<br><b>③</b> Sevoflurane is metabolised to fluoride ions","Isoflurane and sevoflurane are standard maintenance agents. Sevoflurane is non-pungent → inhalational induction (children, needle-phobic, difficult airway).","Maintenance"],["Desflurane","","","Airway irritation, bronchospasm","<b>①</b> Low blood solubility → fast induction and recovery<br><b>②</b> Pungent → irritates airways → coughing, bronchospasm","Maintenance when rapid wake-up is wanted (low solubility) – not used for induction because it irritates the airway.","Maintenance"],["Enflurane","","Not for induction (breath-holding)","Myocardial depression, spike-and-wave EEG, fluoride nephrotoxicity","<b>①</b> GABA_A facilitation; depresses myocardium<br><b>②</b> At high concentrations causes spike-and-wave EEG and muscle twitching; airway irritant → breath-holding","Obsolete (seizure activity, fluoride).","Maintenance"],["Methoxyflurane","Metabolised in liver","","Fluoride → renal damage","<b>①</b> Extensively metabolised in the liver → free fluoride ions → kidney damage","Only in low-dose inhaled form for short-term emergency analgesia.","Analgesia"],["Thiopental, methohexital","Very lipid-soluble, <1 min; ends by redistribution","Induction, short procedures","Respiratory & circulatory depression; ↓ cerebral blood flow → ↓ ICP","<b>①</b> Extremely lipid-soluble → reach the brain in one circulation time (<1 min)<br><b>②</b> Facilitate GABA_A (↑ duration of Cl⁻ opening) → unconsciousness<br><b>③</b> Then quickly REDISTRIBUTE from brain to muscle → patient wakes, though the drug is still in the body (liver eliminates it later)<br><b>④</b> ↓ cerebral metabolism and blood flow → ↓ ICP","Classic IV induction agent (rapid sequence induction, neuro-anaesthesia to ↓ ICP).","Induction"],["Midazolam","BZD; slower onset, longer than thiopental","With inhaled agents + opioids","Postoperative respiratory depression; reversed by flumazenil","<b>①</b> Benzodiazepine → ↑ frequency of GABA_A Cl⁻ channel opening<br><b>②</b> Slower onset and longer action than thiopental; strong amnesia<br><b>③</b> Reversed by flumazenil","Premedication, sedation, co-induction (reduces the induction dose of other agents).","Premedication"],["Ketamine","NMDA antagonist → DISSOCIATIVE anaesthesia (conscious, catatonic, analgesia, amnesia); related to PCP","","CV STIMULANT → ↑ ICP; EMERGENCE reactions (↓ by BZDs)","<b>①</b> Blocks the NMDA glutamate receptor (excitatory)<br><b>②</b> Dissociates the cortex from the limbic system → 'dissociative anaesthesia': eyes open, catatonic, but analgesia and amnesia<br><b>③</b> Stimulates the sympathetic system → ↑ HR, BP, ICP","Induction in shock/hypovolaemia (maintains BP) and asthma (bronchodilator); low-dose analgesia; field/battlefield anaesthesia. Avoid with raised ICP; benzodiazepines reduce emergence reactions.","Induction"],["Fentanyl, sufentanil (alfentanil, remifentanil)","Opioids","Patients who can't tolerate full GA; neuroleptanaesthesia = fentanyl + droperidol + N₂O","Chest wall rigidity; naloxone reverses. Remifentanil: esterases → fastest recovery","<b>①</b> μ-opioid agonists → powerful analgesia, blunt stress responses with little cardiac depression<br><b>②</b> Used with other CNS depressants (N₂O, BZDs) rather than alone<br><b>③</b> Remifentanil is broken down by blood/tissue esterases → ends in minutes","Intra-operative analgesia, blunts the intubation response, epidural/spinal additive; remifentanil infusion for TIVA with very rapid offset.","Analgesia"],["Propofol (fospropofol)","GABA_A; clearance > hepatic blood flow","Induction, TIVA, day-case surgery, ICU sedation","Marked HYPOTENSION; ANTIEMETIC; fast recovery even after long infusion","<b>①</b> Facilitates GABA_A-mediated inhibition → rapid unconsciousness<br><b>②</b> Very fast clearance (more than hepatic blood flow → extra-hepatic elimination) → quick, clear-headed recovery even after long infusions<br><b>③</b> Relaxes vessels → ↓ peripheral resistance → hypotension; has antiemetic action","Most common IV induction agent; total intravenous anaesthesia (TIVA); sedation in ICU/endoscopy; lowers PONV.","Induction"],["Etomidate","Imidazole; CV & respiratory stability; NOT analgesic","Patients with poor cardiac/respiratory reserve","Injection pain, myoclonus, nausea, ADRENAL SUPPRESSION","<b>①</b> Imidazole that facilitates GABA_A inhibition → rapid hypnosis<br><b>②</b> Hardly affects heart and breathing<br><b>③</b> Inhibits adrenal steroid synthesis (11β-hydroxylase) → adrenal suppression with prolonged use; no analgesia","Induction in haemodynamically unstable or cardiac patients (single dose – repeated doses suppress the adrenals).","Induction"]],"traps":["Speed of induction: LOW blood:gas coefficient = FAST (N₂O fast, halothane slow).","↑ inspired concentration and ↑ ventilation speed induction; ↑ pulmonary blood flow SLOWS induction (shock speeds it).","MAC = alveolar concentration abolishing response to a painful stimulus in 50% of patients. Low MAC = high potency. MAC lower in neonates & elderly; additive.","Inhaled agents ↑ cerebral blood flow (↑ ICP), ↑ RR but ↓ tidal & minute volume (↑ CO₂).","MALIGNANT HYPERTHERMIA (inhaled + succinylcholine): Ca²⁺ release from SR → treat with DANTROLENE."],"mem":["<b>Low</b> solubility = <b>Leaves</b> fast & <b>Lands</b> fast (N₂O).","<b>K</b>etamine = <b>K</b>eeps the heart going (CV stimulant) but <b>K</b>razy dreams (emergence).","<b>E</b>tomidate = <b>E</b>xcellent for weak hearts, but <b>E</b>xhausts the adrenals."],"cards":[["4 stages of anaesthesia?","1 analgesia, 2 excitement (delirium), 3 surgical anaesthesia, 4 medullary depression."],["Relationship between blood:gas partition coefficient and induction speed?","Low coefficient (N₂O) → fast equilibration → fast induction & recovery; high (halothane) → slow."],["Effect of ↑ pulmonary blood flow on induction?","Slows induction (blood partial pressure rises more slowly)."],["Define MAC.","Alveolar concentration that abolishes the response to a standard painful stimulus in 50% of patients."],["Which inhaled agent causes postoperative hepatitis?","Halothane."],["Which anaesthetics produce nephrotoxic fluoride?","Methoxyflurane, enflurane, sevoflurane."],["Nitrous oxide toxicity with prolonged exposure?","Megaloblastic anaemia (↓ methionine synthase)."],["Treatment of malignant hyperthermia?","Dantrolene + symptomatic treatment."],["How does ketamine work and what's special about it?","NMDA antagonist → dissociative anaesthesia; CV stimulant (↑ ICP); emergence reactions."],["Advantages of propofol?","Rapid induction, even faster recovery, antiemetic; TIVA, day-case, ICU sedation. Causes hypotension."],["When is etomidate preferred and its drawback?","Limited cardiac/respiratory reserve (CV stability). Not analgesic; myoclonus; adrenal suppression."],["What is neuroleptanaesthesia?","Fentanyl + droperidol + nitrous oxide → analgesia and amnesia."],["Why does remifentanil wear off quickly?","Metabolised by esterases in blood and muscle."]],"quiz":[["Which inhaled anaesthetic has the fastest induction?",["Halothane","Nitrous oxide","Methoxyflurane","Enflurane"],1,"Lowest blood:gas partition coefficient."],["Anaesthetic of choice for a patient with very poor cardiac reserve:",["Thiopental","Propofol","Etomidate","Halothane"],2,"Minimal change in cardiac function and respiration."],["Emergence hallucinations are typical of:",["Propofol","Ketamine","Midazolam","Etomidate"],1,"Reduced by preoperative BZDs."],["MAC values are:",["Higher in the elderly","Additive when agents are combined","Unaffected by age","A measure of speed of induction"],1,"MAC is lower in neonates/elderly and additive."],["Rigid jaw, hyperthermia and acidosis after halothane + succinylcholine – treatment:",["Naloxone","Dantrolene","Flumazenil","Neostigmine"],1,"Malignant hyperthermia."]],"kc":[{"t":"MAC","a":["MAC"],"d":"Minimum alveolar concentration: alveolar anaesthetic concentration that prevents movement to a standard painful stimulus (surgical incision) in 50% of patients.","x":"Measure of POTENCY – low MAC = potent. Lower in elderly/neonates; MACs of combined agents add up."},{"t":"Blood:gas partition coefficient","a":["blood:gas"],"d":"Ratio of anaesthetic concentration in blood vs gas at equilibrium = blood solubility.","x":"LOW coefficient (N₂O, desflurane, sevoflurane) → fast induction and recovery; HIGH (halothane) → slow."},{"t":"FA/FI ratio","a":["FA/FI"],"d":"Ratio of alveolar (FA) to inspired (FI) anaesthetic concentration. The faster it approaches 1, the faster induction.","x":"Rises fastest with low blood solubility, high inspired concentration, high ventilation and low cardiac output."},{"t":"Oil:gas coefficient","a":["lipid solubility","Potency ∝ lipid solubility"],"d":"Lipid solubility of an inhaled anaesthetic; potency is proportional to it (Meyer–Overton).","x":"High oil:gas → low MAC (potent)."},{"t":"Second gas & concentration effect","a":["second gas"],"d":"N₂O is taken up so fast that it concentrates the remaining alveolar gases and speeds uptake of a volatile agent given with it.","x":""},{"t":"Diffusion hypoxia","a":["diffusion hypoxia"],"d":"When N₂O is stopped it floods out into the alveoli and dilutes O₂ → hypoxia.","x":"Give 100% O₂ for a few minutes after N₂O."},{"t":"Stages of anaesthesia","a":["Stages"],"d":"Guedel: 1 analgesia → 2 excitement → 3 surgical anaesthesia → 4 medullary depression.","x":"Modern agents pass stage 2 quickly."},{"t":"Dissociative anaesthesia","a":["dissociative","DISSOCIATIVE"],"d":"Ketamine state: eyes open, catatonia, analgesia and amnesia, apparent detachment from surroundings.","x":""},{"t":"Malignant hyperthermia","a":["Malignant hyperthermia","MALIGNANT HYPERTHERMIA","malignant hyperthermia"],"d":"Genetic RyR1 disorder: volatile agents ± succinylcholine trigger massive SR Ca²⁺ release → rigidity, hyperthermia, acidosis, hyperkalaemia.","x":"Early sign: masseter rigidity, rising CO₂. Treat with dantrolene."},{"t":"TIVA","a":["TIVA","total intravenous anaesthesia"],"d":"Total intravenous anaesthesia – usually propofol + remifentanil infusions, no volatile agents.","x":"Less PONV; useful in malignant hyperthermia susceptibility."}],"ex":[["Glycine receptors","Strychnine-sensitive <b>glycine receptors</b> are another site of action of inhaled anaesthetics (besides GABA_A, NMDA and nicotinic receptors)."]]},{"id":26,"t":"Local Anaesthetics","p":75,"big":"Block <b>voltage-gated Na⁺ channels</b> from the inside of the axon. Two chemical groups: <b>esters</b> (benzocaine, procaine, cocaine, tetracaine) and <b>amides</b> (lidocaine, bupivacaine, prilocaine, ropivacaine). Weak bases, pKa 8–9.","tbl":[["Esters (procaine, cocaine, tetracaine, benzocaine)","Hydrolysed by plasma butyrylcholinesterase (procaine t½ 1–2 min, tetracaine very slow)","Benzocaine & cocaine – surface/topical","Metabolites → antibodies → ALLERGY (rare)","<b>①</b> Ester bond is hydrolysed by plasma butyrylcholinesterase (pseudocholinesterase)<br><b>②</b> Fast breakdown (procaine t½ 1–2 min) → short action, low systemic toxicity<br><b>③</b> Breakdown products (PABA-like) can trigger antibodies → allergy","Benzocaine – topical (mucosa); tetracaine – topical eye/airway and spinal; chloroprocaine – short spinal/epidural.","Regional anaesthesia"],["Amides (lidocaine, prilocaine, bupivacaine, ropivacaine)","Liver CYP450. Lidocaine/prilocaine t½ ~1.5 h; bupivacaine/ropivacaine 3.5–4.2 h","Most procedures","Liver dysfunction ↑ toxicity","<b>①</b> Amide bond is stable in plasma → metabolised in the liver (CYP450)<br><b>②</b> Longer half-lives; liver disease → accumulation and toxicity<br><b>③</b> Rarely cause allergy","Lidocaine – infiltration, nerve blocks, topical airway, IV regional (Bier block); bupivacaine/ropivacaine – spinal, epidural (labour, postoperative infusions), long nerve blocks. Add adrenaline to prolong; lipid emulsion IV treats severe LA toxicity.","Regional anaesthesia"],["Cocaine","Blocks NA reuptake → own vasoconstriction","Topical","HTN, stroke, arrhythmias, MI","<b>①</b> Blocks Na⁺ channels like other local anaesthetics<br><b>②</b> ALSO blocks NA reuptake at sympathetic endings → its own vasoconstriction (no adrenaline needed)<br><b>③</b> In the brain blocks dopamine reuptake → euphoria","Topical for nasal/ENT surgery – anaesthesia plus vasoconstriction (less bleeding).","Regional anaesthesia"],["Bupivacaine (levobupivacaine)","Long-acting racemate","","Severe CARDIOTOXICITY, hard to treat (levobupivacaine less)","<b>①</b> Long-acting, highly lipid-soluble amide<br><b>②</b> Binds cardiac Na⁺ channels strongly and dissociates slowly → severe conduction block and arrhythmias<br><b>③</b> Levobupivacaine (S-isomer) binds the heart less","Spinal ('heavy' hyperbaric) and epidural anaesthesia, long nerve blocks. NEVER for IV regional anaesthesia (cardiotoxic); levobupivacaine/ropivacaine are safer.","Regional anaesthesia"],["Prilocaine","→ o-toluidine","","METHAEMOGLOBINAEMIA","<b>①</b> Amide; its metabolite o-toluidine oxidises haemoglobin Fe²⁺ → Fe³⁺<br><b>②</b> → methaemoglobin, which can't carry O₂","IV regional anaesthesia (Bier block); with lidocaine in EMLA cream for painless cannulation; watch for methaemoglobinaemia.","Regional anaesthesia"],["Articaine","","FASTEST onset","","<b>①</b> Amide local anaesthetic with the fastest onset of action","Dental anaesthesia (fast onset).","Regional anaesthesia"],["Chloroprocaine, lidocaine","","","Neurotoxicity at high conc.","<b>①</b> At high concentrations directly damage nerve fibres (neurotoxicity)"]],"traps":["Non-ionised form crosses the membrane; IONISED form blocks the channel inside.","Infected tissue (pH ~6.4) → more ionised → poor penetration → weak block. Adding bicarbonate speeds onset.","Vasoconstrictor (adrenaline) prolongs action; cocaine and long-acting agents need it less.","Blocked first: small, myelinated, rapidly firing (pain) fibres, and fibres at the periphery of the bundle.","↑ extracellular K⁺ enhances block; ↑ Ca²⁺ reduces it.","Toxicity: CNS first (dizziness, nystagmus, convulsions → coma) → treat convulsions with IV diazepam/thiopental + O₂. All are vasodilators except cocaine."],"mem":["Am<b>i</b>des have two <b>i</b>'s: l<b>i</b>doca<b>i</b>ne, bup<b>i</b>vaca<b>i</b>ne, pr<b>i</b>loca<b>i</b>ne, rop<b>i</b>vaca<b>i</b>ne. Esters have one.","<b>P</b>rilocaine → <b>P</b>urple-blue blood (methaemoglobin)."],"cards":[["Mechanism of local anaesthetics?","Block voltage-gated Na⁺ channels (from the cytoplasmic side) → no depolarisation → no AP conduction."],["Which form crosses the membrane and which blocks the channel?","Non-ionised form crosses; ionised form is the effective blocker inside the axon."],["Why do local anaesthetics work poorly in infected tissue?","Low pH (~6.4) → more drug ionised → less crosses the membrane."],["How are esters vs amides metabolised?","Esters: plasma butyrylcholinesterase (pseudocholinesterase). Amides: liver CYP450."],["Why add adrenaline to a local anaesthetic?","Vasoconstriction ↓ absorption → prolongs local action (and ↓ systemic toxicity)."],["Order of nerve fibre sensitivity?","Small > large; myelinated > unmyelinated; rapidly firing (pain) fibres; peripheral fibres of a bundle first."],["Which local anaesthetic causes methaemoglobinaemia?","Prilocaine (via o-toluidine)."],["Which local anaesthetic is most cardiotoxic?","Bupivacaine (racemate); levobupivacaine is less cardiotoxic."],["Most important toxicity of local anaesthetics and its treatment?","CNS: dizziness, nystagmus, tonic-clonic convulsions → IV diazepam or thiopental, hyperventilation with O₂."],["How can onset be accelerated?","Add sodium bicarbonate (↑ non-ionised fraction). Articaine has the fastest onset."],["Which local anaesthetic is a vasoconstrictor?","Cocaine (blocks NA reuptake)."]],"quiz":[["Methaemoglobinaemia after a dental block – which drug?",["Lidocaine","Prilocaine","Bupivacaine","Procaine"],1,"Metabolised to o-toluidine."],["Which is an ester?",["Ropivacaine","Tetracaine","Lidocaine","Prilocaine"],1,"Esters have one 'i'."],["A patient allergic to procaine needs a local anaesthetic:",["Tetracaine","Benzocaine","Lidocaine","Cocaine"],2,"Use an amide; allergy relates to ester metabolites."],["The ionised form of a local anaesthetic:",["Crosses the membrane best","Is the effective blocker inside the axon","Is inactive","Predominates at alkaline pH"],1,"Both forms matter."],["Fibres blocked FIRST by local anaesthetics:",["Large unmyelinated","Small myelinated rapidly firing","Motor fibres in the core","All equally"],1,"Pain fibres are selectively blocked."]],"kc":[{"t":"Differential block","a":["Blocked first","selectively block pain fibres"],"d":"Small, myelinated, fast-firing fibres (pain, autonomic) are blocked before large motor fibres.","x":"Allows pain relief with preserved movement (e.g. labour epidurals)."},{"t":"Ionised vs non-ionised form","a":["ionised","non-ionised","Non-ionised"],"d":"LAs are weak bases (pKa 8–9): the non-ionised base crosses the membrane, the ionised cation blocks the channel inside.","x":"Acidic infected tissue → more ionised → poor block; bicarbonate speeds onset."},{"t":"Local anaesthetic systemic toxicity","a":["CNS first","systemic toxicity"],"d":"High blood levels → CNS (perioral numbness, tinnitus, convulsions, coma) then cardiovascular collapse.","x":"Treat seizures with BZD/thiopental, oxygen; IV lipid emulsion for severe toxicity (esp. bupivacaine)."},{"t":"Ester vs amide","a":["Esters","Amides","esters","amides"],"d":"Esters: hydrolysed by plasma cholinesterase, more allergenic. Amides: liver metabolism, rarely allergenic.","x":"Amides have two 'i's in the name."}]},{"id":27,"t":"Skeletal Muscle Relaxants","p":78,"big":"<b>Neuromuscular blockers</b> (at the end plate – for surgery/intubation): non-depolarising competitive antagonists (prototype <b>tubocurarine</b>) and the only depolarising agonist <b>succinylcholine</b>.<br><b>Spasmolytics</b> (mostly CNS – for spasticity): diazepam, baclofen, tizanidine, dantrolene; for acute spasm cyclobenzaprine.","tbl":[["Tubocurarine, pancuronium, pipecuronium","Non-depol; RENAL elimination → long (≥35 min)","Surgery","Tubocurarine: histamine release, weak ganglion block. Pancuronium: muscarinic block → TACHYCARDIA","<b>①</b> Quaternary amines (don't cross BBB) that compete with ACh for the nicotinic receptor at the motor end plate<br><b>②</b> No depolarisation → no muscle action potential → flaccid paralysis<br><b>③</b> Competitive → overcome by ↑ ACh (neostigmine)<br><b>④</b> Eliminated by the kidney → long action (≥35 min)","Pancuronium – long cases (long-acting, causes tachycardia); tubocurarine is obsolete (histamine release).","Muscle relaxation"],["Mivacurium","Plasma cholinesterase → short","","Histamine release; prolonged in renal failure","<b>①</b> Same competitive nicotinic block<br><b>②</b> Broken down by plasma cholinesterase → short action (10–20 min)","Short procedures needing brief relaxation.","Muscle relaxation"],["Vecuronium, rocuronium","Bile → short; ROCURONIUM fastest onset","","No autonomic effects, no histamine","<b>①</b> Same competitive nicotinic block; eliminated in bile → short action<br><b>②</b> Rocuronium has the fastest onset of the group","Most-used intubating relaxants; high-dose rocuronium for rapid sequence induction when succinylcholine is contraindicated (rocuronium/vecuronium can be reversed rapidly with sugammadex, or with neostigmine + atropine).","Muscle relaxation"],["Atracurium / cisatracurium","Hofmann (spontaneous) elimination → laudanosine","Renal/hepatic failure","Laudanosine → convulsions (cisatracurium much less)","<b>①</b> Same competitive block<br><b>②</b> Breaks down spontaneously at body pH/temperature (Hofmann elimination) – independent of liver and kidney<br><b>③</b> Breakdown product laudanosine can cause convulsions (much less from cisatracurium)","Relaxant of choice in renal or hepatic failure (Hofmann elimination).","Muscle relaxation"],["Succinylcholine","Depolarising nicotinic AGONIST; 2 ACh molecules; butyrylcholinesterase; few minutes. Phase I → phase II block","Rapid intubation","Fasciculations, muscle pain, HYPERKALAEMIA (burns, spinal cord injury, dystrophy), ↑ intragastric pressure, MALIGNANT HYPERTHERMIA, prolonged with atypical ChE (low dibucaine number)","<b>①</b> Two ACh molecules linked → acts as a nicotinic AGONIST at the end plate<br><b>②</b> Depolarises the end plate → fasciculations<br><b>③</b> Not broken down by acetylcholinesterase → stays bound → end plate STAYS depolarised → Na⁺ channels inactivate → muscle can't fire again → paralysis (phase I)<br><b>④</b> With prolonged exposure the end plate repolarises but stays desensitised (phase II). Short action because plasma butyrylcholinesterase destroys it","Rapid sequence intubation (fastest onset and offset) – e.g. full stomach, emergencies. Avoid in burns, crush/spinal injury, neuromuscular disease (hyperkalaemia) and malignant hyperthermia susceptibility.","Muscle relaxation"],["Diazepam","GABA_A (spinal cord)","Chronic spasticity (cerebral palsy)","Sedation (less than other sedatives at same relaxation)","<b>①</b> Acts on GABA_A receptors in the spinal cord<br><b>②</b> ↑ GABA-mediated inhibition → less tonic output of spinal motoneurons"],["Baclofen","GABA_B agonist → hyperpolarisation, ↓ glutamate release; INTRATHECAL for refractory spasticity","MS, spasticity","Less sedation than diazepam; tolerance – withdraw gradually","<b>①</b> GABA_B agonist in the spinal cord<br><b>②</b> Presynaptically ↓ Ca²⁺ influx → less glutamate released by sensory afferents<br><b>③</b> Postsynaptically opens K⁺ channels → hyperpolarisation of motoneurons → less spasm","Don't interrupt intrathecal baclofen pumps perioperatively – abrupt withdrawal causes rebound spasticity, fever and seizures.","Postoperative care"],["Tizanidine","α2 agonist (like clonidine)","Spasticity","Weakness, drowsiness, dry mouth, hypotension","<b>①</b> α2-agonist (imidazoline, like clonidine) in the spinal cord<br><b>②</b> Increases presynaptic inhibition of motoneurons → ↓ reflex muscle tone"],["Dantrolene","Blocks RyR1 Ca²⁺ release in skeletal muscle SR (heart has RyR2)","Spasticity; MALIGNANT HYPERTHERMIA (IV); NMS","Muscle weakness","<b>①</b> Acts directly on skeletal muscle, not the nervous system<br><b>②</b> Binds the ryanodine receptor (RyR1) Ca²⁺-release channel of the sarcoplasmic reticulum<br><b>③</b> Less Ca²⁺ released → weaker contraction; stops the uncontrolled Ca²⁺ release of malignant hyperthermia<br><b>④</b> Heart and smooth muscle have RyR2 → hardly affected","IV dantrolene is the specific treatment of malignant hyperthermia in theatre (stop volatile agents and succinylcholine).","Emergencies"],["Botulinum toxin; gabapentin, pregabalin","Local injection; anticonvulsants","Focal spasm, CP; MS spasticity","","<b>①</b> Botulinum toxin injected into a muscle blocks ACh release → local paralysis<br><b>②</b> Gabapentin/pregabalin: anticonvulsants that reduce spasticity in MS"],["Cyclobenzaprine (methocarbamol, orphenadrine)","Brainstem – polysynaptic reflexes","ACUTE muscle spasm after injury","Sedation, antimuscarinic, confusion; useless in CP/spinal injury","<b>①</b> Act in the brainstem, probably interfering with polysynaptic reflexes that maintain muscle tone<br><b>②</b> Also sedative and antimuscarinic"]],"traps":["Reversal: non-depolarising block is reversed by neostigmine/pyridostigmine. Succinylcholine phase I is WORSENED by them; phase II is reversed.","Non-depolarising: tetanic FADE, post-tetanic potentiation preserved. Small muscles (face, hand) paralysed first; large (diaphragm) recover first.","Potentiated by inhaled anaesthetics (isoflurane), aminoglycosides, antiarrhythmics.","More sensitive: elderly >75, myasthenia gravis. Less sensitive: burns, upper motor neuron disease (extrajunctional receptors).","Early sign of malignant hyperthermia: jaw rigidity (trismus)."],"mem":["<b>Suc</b>cinylcholine – \"<b>S</b>uper <b>U</b>nstable <b>K</b>⁺\": hyperkalaemia, short (minutes), dangerous with burns.","Dantrolene = '<b>D</b>amp<b>en</b>s' RyR1 – <b>D</b>rug for malignant hyperthermia."],"cards":[["Mechanism of non-depolarising neuromuscular blockers?","Competitive nicotinic antagonists at the motor end plate; overcome by ↑ ACh (cholinesterase inhibitors)."],["How are non-depolarising blockers reversed?","Cholinesterase inhibitors – neostigmine, pyridostigmine."],["What is Hofmann elimination and which drugs use it?","Spontaneous breakdown – atracurium (→ laudanosine, seizures) and cisatracurium (less laudanosine)."],["Fastest-onset non-depolarising blocker?","Rocuronium."],["Which blocker causes tachycardia and why?","Pancuronium – blocks cardiac muscarinic receptors."],["Which neuromuscular blockers release histamine?","Tubocurarine and mivacurium (also atracurium, metocurine, succinylcholine)."],["Mechanism of succinylcholine and its phases?","Nicotinic agonist → persistent depolarisation (phase I) → with prolonged infusion repolarisation with desensitisation (phase II)."],["What does a low dibucaine number mean?","Atypical butyrylcholinesterase → succinylcholine block is prolonged."],["Effect of neostigmine on succinylcholine block?","Phase I: intensifies it. Phase II: reverses it."],["Specific toxicities of succinylcholine?","Muscle pain, hyperkalaemia (burns, spinal cord injury, dystrophy), ↑ intragastric pressure (aspiration), malignant hyperthermia."],["Baclofen mechanism?","GABA_B agonist – ↓ Ca²⁺ influx & glutamate release presynaptically; hyperpolarisation postsynaptically."],["Dantrolene mechanism and key indication?","Blocks RyR1 Ca²⁺ release from skeletal SR – malignant hyperthermia (IV), spasticity."],["Tizanidine mechanism?","α2-agonist (clonidine-like) enhancing presynaptic inhibition in the spinal cord."]],"quiz":[["A burn patient gets succinylcholine and develops cardiac arrest. Most likely cause?",["Histamine release","Hyperkalaemia","Hypocalcaemia","Bradycardia from vagal block"],1,"Extrajunctional receptors → massive K⁺ release."],["Reversal of vecuronium blockade:",["Dantrolene","Neostigmine","Succinylcholine","Atropine alone"],1,"Cholinesterase inhibitor ↑ ACh."],["Which drug acts directly on skeletal muscle ryanodine receptors?",["Baclofen","Tizanidine","Dantrolene","Cyclobenzaprine"],2,"RyR1."],["Which antibiotic class potentiates neuromuscular blockade?",["Penicillins","Aminoglycosides","Macrolides","Cephalosporins"],1,"Also inhaled anaesthetics and antiarrhythmics."],["Laudanosine-induced seizures are associated with:",["Atracurium","Rocuronium","Pancuronium","Succinylcholine"],0,"Hofmann elimination product."]],"kc":[{"t":"Tetanic fade","a":["fade","FADE","tetanic"],"d":"Progressive decline of muscle twitches during high-frequency (tetanic) or train-of-four stimulation.","x":"Sign of NON-depolarising block (and phase II succinylcholine block)."},{"t":"Post-tetanic potentiation","a":["post-tetanic potentiation","Post-tetanic potentiation"],"d":"Temporarily stronger twitches after a tetanic stimulus, seen with non-depolarising block.","x":"Absent in phase I depolarising block."},{"t":"Phase I and phase II block","a":["phase I","phase II","Phase I","Phase II"],"d":"Succinylcholine: phase I = persistent depolarisation (fasciculations, no fade, worsened by neostigmine); phase II = desensitisation with fade (reversed by neostigmine).","x":""},{"t":"Dibucaine number","a":["dibucaine number","dibucaine"],"d":"% inhibition of plasma cholinesterase by dibucaine; LOW number = atypical enzyme → prolonged succinylcholine block.","x":""},{"t":"Hofmann elimination","a":["Hofmann"],"d":"Spontaneous, organ-independent breakdown of atracurium/cisatracurium at body pH and temperature.","x":"Relaxant of choice in liver or kidney failure."},{"t":"Rapid sequence induction","a":["Rapid sequence intubation","rapid sequence induction","rapid sequence"],"d":"Induction + fast-onset relaxant (succinylcholine or high-dose rocuronium) with cricoid pressure and no mask ventilation, to secure the airway quickly.","x":"Used when the stomach may be full."},{"t":"Malignant hyperthermia","a":["MALIGNANT HYPERTHERMIA","malignant hyperthermia","Malignant hyperthermia"],"d":"Uncontrolled SR Ca²⁺ release triggered by succinylcholine/volatile agents in susceptible patients.","x":"Early sign: jaw rigidity (trismus). Treat with IV dantrolene."}],"ex":[["Doxacurium","Like vecuronium, cisatracurium, pipecuronium and rocuronium, <b>doxacurium</b> has no autonomic effects and doesn't release histamine. Large muscles (diaphragm) resist block more but recover first."]]},{"id":28,"t":"Pharmacotherapy of Parkinsonism","p":81,"big":"Loss of nigrostriatal dopamine neurons → <b>dopamine ↓ / acetylcholine ↑</b> imbalance in the striatum. Signs: rigidity, bradykinesia, mask face, resting tremor.<br><b>Strategy:</b> ↑ dopamine activity (D2 matters) and/or ↓ muscarinic activity.<br>Drug-induced parkinsonism: antipsychotics, reserpine; <b>MPTP</b> (illicit meperidine by-product) → irreversible.","tbl":[["Levodopa + carbidopa","L-dopa crosses BBB via LAT → dopamine. Carbidopa blocks PERIPHERAL dopa decarboxylase (doesn't cross BBB)","Mainstay; best for bradykinesia; ↓ mortality","N/V (tolerance develops), orthostatic hypotension, arrhythmias, DYSKINESIAS (80%), psychosis (contraindicated in psychosis); wearing-off, ON–OFF","<b>①</b> Dopamine can't cross the BBB, but its precursor levodopa enters via the L-amino acid transporter (LAT)<br><b>②</b> In the brain dopa decarboxylase converts it to dopamine → replaces the missing striatal dopamine (D2 activation)<br><b>③</b> Carbidopa blocks dopa decarboxylase only OUTSIDE the brain (doesn't cross BBB) → more levodopa reaches the brain, lower dose, fewer peripheral side effects (nausea, arrhythmia)","Give right up to surgery and restart quickly – missed doses cause severe rigidity (can affect breathing). Avoid dopamine-blocking antiemetics (metoclopramide, droperidol).","Perioperative medication"],["Bromocriptine","Ergot, D2 partial agonist","Now rarely","N/V, dyskinesia, hypotension, more confusion/hallucinations","<b>①</b> Ergot derivative that directly stimulates (partial agonist) D2 receptors in the striatum<br><b>②</b> Doesn't need surviving dopamine neurons to work"],["Pramipexole","Non-ergot, D3; renal elimination","Monotherapy mild PD / with levodopa","SLEEP ATTACKS, impulsivity, hallucinations; possibly neuroprotective","<b>①</b> Non-ergot direct agonist with high D3 affinity<br><b>②</b> Stimulates dopamine receptors directly; may scavenge H₂O₂ (possibly neuroprotective)"],["Ropinirole","Non-ergot, D2; CYP1A2","Monotherapy / adjunct; once-daily ER","Like pramipexole; caffeine, warfarin ↓ its clearance","<b>①</b> Non-ergot direct D2 agonist<br><b>②</b> Stimulates striatal D2 receptors; metabolised by CYP1A2"],["Apomorphine","Potent DA agonist, SC","Rescue of 'OFF' episodes","Severe nausea → pretreat with trimethobenzamide","<b>①</b> Potent direct dopamine receptor agonist, given SC → acts in minutes<br><b>②</b> Rescues sudden 'off' episodes; also strongly stimulates the vomiting centre"],["Selegiline, rasagiline","MAO-B inhibitors","Selegiline with levodopa; rasagiline also monotherapy","With MEPERIDINE → stupor, death; selegiline + SSRI → serotonin syndrome","<b>①</b> Selectively and irreversibly inhibit MAO-B, the enzyme that breaks down dopamine in the brain<br><b>②</b> Dopamine lasts longer in the synapse → boosts levodopa or remaining dopamine<br><b>③</b> Selective for B → tyramine (MAO-A) is still metabolised","Avoid meperidine (pethidine) – risk of severe reactions.","Perioperative medication"],["Entacapone (peripheral), tolcapone","COMT inhibitors – ↓ 3-O-methyldopa","Adjuncts – ↓ fluctuations, prolong 'on'","Dyskinesia, ORANGE URINE; tolcapone HEPATOTOXIC","<b>①</b> Inhibit catechol-O-methyltransferase (COMT), which converts levodopa → 3-O-methyldopa<br><b>②</b> Less 3-O-methyldopa → it no longer competes with levodopa for transport into the brain<br><b>③</b> More levodopa reaches the brain, more smoothly → longer 'on' periods. Entacapone acts only peripherally"],["Amantadine","↑ DA release/↓ reuptake; antimuscarinic; antiviral","Short-term (weeks)","LIVEDO RETICULARIS, peripheral oedema, psychosis, urinary retention","<b>①</b> Increases dopamine synthesis and release and/or inhibits its reuptake<br><b>②</b> Also blocks muscarinic receptors<br><b>③</b> Effect fades within weeks; also an antiviral"],["Benztropine, biperiden, orphenadrine","Muscarinic block in striatum","TREMOR & RIGIDITY (not bradykinesia); antipsychotic EPS","Atropine-like; WORSEN tardive dyskinesia","<b>①</b> Block muscarinic receptors on striatal neurons<br><b>②</b> Reduce the relative excess of cholinergic excitation that results from dopamine loss<br><b>③</b> Restores DA/ACh balance → ↓ tremor and rigidity"]],"traps":["Dopamine itself doesn't cross the BBB → give precursor levodopa.","Drug holidays reduce toxicity but not fluctuations; COMT inhibitors reduce fluctuations.","Antimuscarinics help tremor/rigidity but not bradykinesia; levodopa best for bradykinesia."],"mem":["<b>C</b>arbidopa stays in the <b>C</b>irculation (periphery).","Tol<b>CAP</b>one → <b>CAP</b>sizes the liver.","Amanta<b>D</b>ine – <b>D</b>opamine release + flu virus + net-like skin (livedo)."],"cards":[["Pathophysiology of Parkinson's disease?","Degeneration of nigrostriatal dopaminergic neurons → ↓ striatal dopamine → relative excess of cholinergic activity."],["Why give levodopa instead of dopamine?","Dopamine has poor bioavailability and doesn't cross the BBB; levodopa enters via the L-amino acid transporter."],["Role of carbidopa?","Inhibits peripheral dopa decarboxylase (doesn't enter brain) → longer levodopa t½, lower dose, fewer peripheral AEs."],["What are 'wearing off' and 'on–off'?","Wearing off = end-of-dose akinesia; on–off = sudden swings between akinesia and mobility (with dyskinesias)."],["Main adverse effects of levodopa?","N/V, orthostatic hypotension, dyskinesias (80%), behavioural effects (hallucinations); contraindicated in psychosis."],["Pramipexole receptor and special AE?","Non-ergot D3 agonist; 'sleep attacks', impulsivity; renal elimination."],["Use of apomorphine?","SC rescue for 'off' periods; pretreat with antiemetic trimethobenzamide."],["Dangerous interactions of selegiline?","Meperidine (stupor, delirium, death); SSRIs (serotonin syndrome)."],["Role of COMT inhibitors?","Block conversion of levodopa → 3-O-methyldopa (competes for brain transport); reduce fluctuations. Orange urine; tolcapone hepatotoxic."],["Amantadine mechanism and typical skin AE?","↑ DA synthesis/release or ↓ reuptake, antimuscarinic. Livedo reticularis."],["Which PD symptoms respond to antimuscarinics?","Tremor and rigidity – little effect on bradykinesia."],["What is MPTP?","By-product of illicit meperidine synthesis; irreversibly destroys nigrostriatal neurons."]],"quiz":[["Carbidopa is given with levodopa to:",["Increase central decarboxylation","Inhibit peripheral decarboxylation","Block COMT","Stimulate D2 receptors"],1,"It doesn't cross the BBB."],["Orange urine and hepatotoxicity – which drug?",["Entacapone","Tolcapone","Selegiline","Ropinirole"],1,"Both COMT inhibitors colour urine; tolcapone is hepatotoxic."],["Antimuscarinic drugs in PD mainly improve:",["Bradykinesia","Tremor and rigidity","Dyskinesia","Psychosis"],1,"Little effect on bradykinesia."],["Livedo reticularis is a side effect of:",["Amantadine","Bromocriptine","Levodopa","Benztropine"],0,"Also peripheral oedema."],["A PD patient on selegiline gets meperidine. Risk?",["Hypoglycaemia","Stupor, delirium, death","Bradycardia","No interaction"],1,"MAO-B inhibitor + meperidine."]],"kc":[{"t":"Wearing-off","a":["wearing off","Wearing off"],"d":"Return of symptoms before the next levodopa dose (end-of-dose akinesia).","x":""},{"t":"On–off phenomenon","a":["on–off","ON–OFF","'on'","'off'"],"d":"Sudden, unpredictable swings between mobility ('on', often with dyskinesia) and akinesia ('off').","x":"COMT inhibitors and DA agonists smooth it; apomorphine rescues 'off'."},{"t":"Dyskinesia","a":["dyskinesias","DYSKINESIAS","dyskinesia"],"d":"Involuntary choreoathetoid movements – a dose-related effect of levodopa (80%).","x":""},{"t":"Drug holiday","a":["Drug holidays"],"d":"Temporary withdrawal of levodopa to reduce toxicity; doesn't reduce fluctuations.","x":""}]},{"id":29,"t":"Antipsychotics & Lithium","p":84,"big":"<b>Typical</b> (phenothiazines – chlorpromazine, fluphenazine, thioridazine; thioxanthenes; butyrophenones – haloperidol): high D2 affinity. <b>Atypical</b> (clozapine, olanzapine, risperidone, quetiapine, ziprasidone, aripiprazole, loxapine): high 5-HT2A affinity, fewer EPS, help negative symptoms.<br><br><b>4 dopamine pathways:</b> mesolimbic–mesocortical (THERAPEUTIC effect) · nigrostriatal (EPS) · tuberoinfundibular (prolactin ↑) · medullary-periventricular.","tbl":[["Haloperidol, fluphenazine","Strong D2 block","Positive symptoms","MOST EPS; least sedation; haloperidol weakest autonomic, no H1","<b>①</b> Potent D2 receptor blockers<br><b>②</b> Block in the mesolimbic–mesocortical pathway → ↓ positive symptoms<br><b>③</b> Block in the nigrostriatal pathway → extrapyramidal symptoms; in the pituitary → ↑ prolactin<br><b>④</b> Haloperidol barely blocks muscarinic, α or H1 receptors → little sedation/autonomic effects","Low-dose haloperidol/droperidol prevent PONV; droperidol + fentanyl + N₂O = neuroleptanaesthesia.","PONV & allergy"],["Chlorpromazine, thioridazine","D2 + strong muscarinic/α/H1","Psychosis","Sedation, antimuscarinic, orthostatic hypotension, failed ejaculation. Thioridazine: RETINAL deposits, fatal arrhythmias. Chlorpromazine: anterior eye deposits","<b>①</b> Block D2 (therapeutic) plus muscarinic, α1 and H1 receptors<br><b>②</b> Muscarinic block → atropine-like effects; α1 → orthostatic hypotension; H1 → sedation<br><b>③</b> The extra antimuscarinic action partly protects against EPS"],["Clozapine","D4 + 5-HT2, little D2","Refractory schizophrenia","AGRANULOCYTOSIS (1–2%), SEIZURES, weight gain/diabetes; rarely parkinsonism","<b>①</b> Blocks D4 and 5-HT2 receptors with LITTLE D2 affinity<br><b>②</b> Little D2 block in the striatum → very few EPS, no tardive dyskinesia worsening<br><b>③</b> 5-HT2 block may improve negative symptoms; works when other drugs fail"],["Olanzapine, quetiapine, risperidone","5-HT2A + D2","Schizophrenia, mania (olanzapine/quetiapine monotherapy)","Olanzapine: diabetogenic; risperidone: marked ↑ PROLACTIN; quetiapine: ↑ QT","<b>①</b> High-affinity 5-HT2A blockers that also block D2<br><b>②</b> 5-HT2A block in the striatum increases dopamine release there → fewer EPS ('serotonin hypothesis')<br><b>③</b> May improve negative symptoms"],["Ziprasidone","D2, 5-HT2A, 5-HT1D antagonist + 5-HT1A agonist","","↑ QT; little metabolic effect; no antimuscarinic","<b>①</b> Antagonist at D2, 5-HT2A and 5-HT1D; agonist at 5-HT1A<br><b>②</b> Balanced profile → few EPS and little metabolic effect"],["Aripiprazole","PARTIAL agonist D2 & 5-HT1A, 5-HT2A antagonist","Schizophrenia, bipolar maintenance","Little metabolic/endocrine effect, little sedation","<b>①</b> PARTIAL agonist at D2: where dopamine is excessive (mesolimbic) it acts as a blocker; where low it provides some stimulation<br><b>②</b> Partial agonist at 5-HT1A, potent 5-HT2A antagonist<br><b>③</b> → few EPS, little prolactin rise, little sedation"],["Prochlorperazine; promethazine","Phenothiazines","Antiemetic only; itch/sedation (H1)","","<b>①</b> Phenothiazines that block D2 in the chemoreceptor trigger zone → antiemetic (prochlorperazine)<br><b>②</b> Short-side-chain phenothiazines block H1 → antipruritic, sedative (promethazine)","Treats postoperative nausea and vomiting.","PONV & allergy"],["Lithium","Inhibits inositol recycling → ↓ PIP₂, IP₃, DAG. t½ 20 h; renal; clearance 20% of CrCl","Bipolar – acute mania & prophylaxis; ↓ suicide","Tremor, sedation, ataxia, aphasia, ↓ thyroid, NEPHROGENIC DI, oedema, acne, leukocytosis; Ebstein anomaly; contraindicated in breastfeeding","<b>①</b> Lithium inhibits enzymes that recycle inositol phosphates in neuronal membranes<br><b>②</b> PIP₂ (source of second messengers) becomes depleted<br><b>③</b> Less IP₃ and DAG → dampened signalling of overactive amine pathways (adrenergic, muscarinic)<br><b>④</b> Narrow therapeutic range; renally handled like Na⁺ → Na⁺/water loss (thiazides, dehydration) raises lithium","Can prolong neuromuscular block; check levels, avoid dehydration and NSAIDs perioperatively.","Perioperative medication"],["Valproate, carbamazepine, lamotrigine","Anticonvulsants","Mania (valproate = lithium efficacy); prophylaxis of depressive phase","","<b>①</b> Stabilise neuronal firing (Na⁺/Ca²⁺ channel block, ↑ GABA) – the same mechanisms as in epilepsy"]],"traps":["Lithium levels ↑ with dehydration, thiazides, NSAIDs, ACEI, loop diuretics; ↓ with caffeine & theophylline. Monitor plasma levels.","Tardive dyskinesia: after years; choreoathetoid lip/buccal movements; may be irreversible; antimuscarinics WORSEN it; no treatment; clozapine doesn't worsen it. Cause: DA receptor supersensitivity.","Neuroleptic malignant syndrome: rigidity, hyperpyrexia >41.5 °C, autonomic instability → dantrolene, diazepam, DA agonists.","Acute EPS (parkinsonism, akathisia, dystonia) → muscarinic blockers or diphenhydramine.","Antidepressant monotherapy can precipitate mania in bipolar patients."],"mem":["Clo<b>ZAP</b>ine <b>ZAP</b>s white cells (agranulocytosis) and causes seizures.","<b>LITH</b>ium side effects: <b>L</b>ethargy/tremor, <b>I</b>nsipidus (nephrogenic DI), <b>T</b>hyroid ↓, <b>H</b>eart anomaly (Ebstein)."],"cards":[["Dopamine hypothesis of schizophrenia – evidence?","Antipsychotics block D2; DA agonists (amphetamine, levodopa) worsen psychosis; ↑ D2 receptor density in untreated patients."],["Which dopamine pathway mediates the antipsychotic effect and which cause side effects?","Mesolimbic–mesocortical = therapeutic. Nigrostriatal = EPS; tuberoinfundibular = hyperprolactinaemia."],["Typical vs atypical antipsychotics?","Typical: high D2 affinity, more EPS, no effect on negative symptoms. Atypical: high 5-HT2A affinity, fewer EPS, may improve negative symptoms."],["Which antipsychotics cause the most EPS?","Haloperidol and piperazine phenothiazines (fluphenazine)."],["What is tardive dyskinesia?","Choreoathetoid lip/buccal movements after years of therapy; may be irreversible; worsened by antimuscarinics; DA receptor supersensitivity."],["Symptoms and treatment of neuroleptic malignant syndrome?","Rigidity, impaired sweating, hyperpyrexia >41.5 °C, autonomic instability → dantrolene, diazepam, dopamine agonists."],["Key toxicities of clozapine?","Agranulocytosis (1–2%), seizures at high doses, weight gain/hyperglycaemia."],["Which antipsychotic raises prolactin most?","Risperidone."],["Which antipsychotics have little metabolic/endocrine effect?","Aripiprazole and ziprasidone."],["Thioridazine-specific toxicity?","Retinal deposits; impaired cardiac conduction → fatal ventricular arrhythmias; strongest autonomic effects."],["Lithium mechanism?","Inhibits phosphoinositide recycling → depletion of PIP₂ → ↓ IP₃ and DAG."],["Drugs that raise lithium levels?","Thiazides, loop diuretics, NSAIDs, ACE inhibitors, dehydration."],["Lithium adverse effects?","Tremor, sedation, ataxia, aphasia, hypothyroidism, nephrogenic DI, oedema, acne, leukocytosis; Ebstein's anomaly."]],"quiz":[["A patient on clozapine needs regular monitoring of:",["Liver enzymes","White blood cell count","Serum K⁺","QT only"],1,"Agranulocytosis in 1–2%."],["A lithium patient starts hydrochlorothiazide. Expected?",["↓ lithium levels","↑ lithium levels → toxicity","No change","Hypothyroidism resolves"],1,"Thiazides, NSAIDs, ACEI raise lithium."],["Galactorrhoea on an antipsychotic results from D2 block in the:",["Nigrostriatal pathway","Mesolimbic pathway","Tuberoinfundibular pathway","Mesocortical pathway"],2,"Dopamine inhibits prolactin."],["Antimuscarinic drugs WORSEN which antipsychotic effect?",["Acute dystonia","Parkinsonism","Tardive dyskinesia","Akathisia"],2,"They treat acute EPS but worsen tardive dyskinesia."],["Polyuria and thirst in a bipolar patient on long-term therapy:",["Valproate","Lithium-induced nephrogenic DI","Olanzapine","Carbamazepine SIADH"],1,"Frequent at therapeutic doses, reversible."]],"kc":[{"t":"Extrapyramidal symptoms (EPS)","a":["EPS","extrapyramidal","Extrapyramidal"],"d":"Acute movement disorders from D2 block in the nigrostriatal pathway: parkinsonism, acute dystonia, akathisia (restlessness).","x":"Treated with antimuscarinics or diphenhydramine."},{"t":"Tardive dyskinesia","a":["Tardive dyskinesia","tardive dyskinesia"],"d":"Late, possibly irreversible choreoathetoid movements of lips/tongue after years of antipsychotics.","x":"Worsened by antimuscarinics; no specific drug treatment."},{"t":"Neuroleptic malignant syndrome","a":["Neuroleptic malignant syndrome","neuroleptic malignant","NMS"],"d":"Rigidity, hyperthermia >41.5 °C, autonomic instability, altered consciousness on antipsychotics.","x":"Dantrolene, diazepam, dopamine agonists."},{"t":"Positive vs negative symptoms","a":["positive symptoms","negative symptoms"],"d":"Positive: hallucinations, delusions, bizarre thinking. Negative: blunted emotion, social withdrawal, lack of motivation.","x":"Atypicals may help negative symptoms; typicals don't."},{"t":"Therapeutic drug monitoring","a":["Monitor plasma levels","monitored"],"d":"Measuring plasma levels to keep a narrow-therapeutic-index drug in range.","x":"Lithium, also phenytoin, digoxin, theophylline."}],"ex":[["Other uses of antipsychotics","Psychotic symptoms in <b>schizoaffective disorder</b>, <b>toxic psychosis</b> from CNS stimulants, <b>Tourette's syndrome</b>, behavioural disturbance in Alzheimer's disease and parkinsonism (newer agents). Aripiprazole and olanzapine for bipolar maintenance."],["Thioxanthenes","Third typical subgroup besides phenothiazines and butyrophenones: <b>thiothixene</b>."],["Antipsychotic overdose","Usually NOT fatal – except <b>thioridazine</b> (cardiotoxicity) and <b>mesoridazine</b>. Hypotension responds to fluids; seizures are treated with diazepam/phenytoin."]]},{"id":30,"t":"Antidepressants","p":88,"big":"<b>Amine hypothesis:</b> depression = ↓ NA & 5-HT activity. Against it: no ↓ amines post-mortem, weeks for effect despite fast amine changes, receptor down-regulation, bupropion barely affects NA/5-HT.<br><b>Classes:</b> TCAs · SSRIs · SNRIs · 5-HT2 antagonists · other heterocyclics · MAOIs.","tbl":[["TCAs: imipramine (→ desipramine), amitriptyline, clomipramine, doxepin","Block NA + 5-HT reuptake; also block muscarinic, α, H1","Depression with psychomotor retardation/insomnia/weight loss; enuresis, chronic pain, panic, ADHD; clomipramine OCD","Sedation, ATROPINE-LIKE, orthostatic hypotension, conduction defects, weight gain. Overdose: '3 Cs' COMA, CONVULSIONS, CARDIOTOXICITY. Block guanethidine","<b>①</b> Block reuptake transporters for noradrenaline (NET) and serotonin (SERT)<br><b>②</b> More NA and 5-HT stay in the synapse → stronger postsynaptic action<br><b>③</b> Over weeks receptors adapt (β-receptors down-regulate) – matches the delayed clinical effect<br><b>④</b> Also block muscarinic, α1 and H1 receptors → side effects; block NET peripherally → sympathomimetic effects","Exaggerated response to vasopressors (esp. indirect) and arrhythmia risk; use careful, low doses.","Perioperative medication"],["SSRIs: fluoxetine (→ norfluoxetine, days), citalopram, escitalopram, fluvoxamine, paroxetine, sertraline","Allosteric SERT inhibition","Depression, OCD, GAD, panic, social phobia, PTSD, bulimia, PMDD, alcohol dependence","Nausea, headache, anxiety, insomnia, SEXUAL DYSFUNCTION; withdrawal; CYP inhibition (fluoxetine & paroxetine 2D6, fluvoxamine 1A2); citalopram QT","<b>①</b> Selectively inhibit the serotonin transporter (SERT), binding an allosteric site (not the substrate site)<br><b>②</b> More 5-HT in the synapse<br><b>③</b> Minimal effect on NET or on muscarinic/adrenergic/histamine receptors → fewer side effects, safe in overdose"],["SNRIs: venlafaxine, desvenlafaxine, duloxetine","SERT + NET; no H1/M/α block","Depression, neuropathic pain, fibromyalgia, diabetic neuropathy (duloxetine)","Venlafaxine: ↑ BP, severe withdrawal (even 1 missed dose), cardiotoxic in overdose; duloxetine rare hepatotoxicity","<b>①</b> Inhibit BOTH SERT and NET → raise 5-HT and NA<br><b>②</b> Venlafaxine has weaker NET affinity than duloxetine/desvenlafaxine<br><b>③</b> Unlike TCAs, don't block H1, muscarinic or α receptors"],["Trazodone, nefazodone","5-HT2A antagonists; short t½ (2–3×/day)","Depression; sleep aid","SEDATION; trazodone weight gain; nefazodone CYP3A4 inhibitor + hepatotoxic","<b>①</b> Block 5-HT2A receptors (and weakly inhibit SERT)<br><b>②</b> 5-HT2A antagonism → antidepressant and anxiolytic effects<br><b>③</b> Also block H1/α1 → sedation (used as sleep aids)"],["Mirtazapine","α2 antagonist (↑ release) + 5-HT2 antagonist","Depression","Sedation, weight gain","<b>①</b> Blocks presynaptic α2 autoreceptors/heteroreceptors<br><b>②</b> These normally brake NA and 5-HT release → removing the brake ↑ release of both<br><b>③</b> Also blocks 5-HT2 (and H1 → sedation, weight gain)"],["Bupropion","Unknown","Depression, SMOKING CESSATION","Anxiety, agitation, SEIZURES at high doses","<b>①</b> Mechanism unknown (it has minimal effect on NA and 5-HT)<br><b>②</b> Stimulating; helps smoking cessation"],["Amoxapine, maprotiline","Heterocyclics","","Amoxapine: D2 block → parkinsonism, amenorrhoea-galactorrhoea. Both: seizures & cardiotoxicity in overdose","<b>①</b> Heterocyclics that inhibit NA reuptake (maprotiline) or NA/5-HT reuptake (amoxapine)<br><b>②</b> Amoxapine also blocks D2 receptors (EPS, ↑ prolactin)"],["MAOIs: phenelzine, tranylcypromine (selegiline patch)","Inhibit MAO-A (NA, 5-HT, tyramine) & MAO-B (DA)","Depression with anxiety, phobias, hypochondriasis","TYRAMINE → hypertensive crisis; with SSRIs → serotonin syndrome; hepatic enzyme inhibitors","<b>①</b> Inhibit monoamine oxidase in nerve endings (MAO-A breaks down NA, 5-HT, tyramine; MAO-B dopamine)<br><b>②</b> Amines aren't destroyed → more stored in vesicles → more released per impulse<br><b>③</b> Dietary tyramine is no longer broken down in gut/liver → reaches nerve endings → massive NA release → hypertensive crisis","Avoid meperidine (pethidine) and indirect sympathomimetics such as ephedrine → use direct-acting vasopressors (phenylephrine) in small doses.","Perioperative medication"]],"traps":["Serotonin syndrome: rigidity, myoclonus, hyperthermia, CV instability, seizures. Causes: MAOI + SSRI (first described fluoxetine + MAOI), TCAs, dextromethorphan, meperidine, MDMA. Treat: anticonvulsants, muscle relaxants, cyproheptadine.","Sedating: TCAs, mirtazapine, trazodone, nefazodone. Stimulating: MAOIs, SSRIs, bupropion.","SSRIs/SNRIs ↑ suicidality risk in children & adolescents.","Fluoxetine (CYP2D6) ↑ dextromethorphan, propranolol, tamoxifen, TCAs; citalopram has fewest interactions."],"mem":["TCA overdose = <b>3 C's</b>: Coma, Convulsions, Cardiotoxicity.","MAOI + <b>T</b>yramine (cheese, wine) → <b>T</b>hunderclap hypertensive crisis.","<b>Bup</b>ropion = <b>B</b>utt (cigarette) quitter, but <b>B</b>rain seizures."],"cards":[["Arguments against the amine hypothesis?","No ↓ NA/5-HT post-mortem; clinical effect takes weeks although amine changes take hours; receptors down-regulate; bupropion barely affects NA/5-HT."],["TCA mechanism and receptor side effects?","Block NA and 5-HT reuptake; also block muscarinic, α1 and H1 receptors → atropine-like effects, orthostatic hypotension, sedation."],["TCA overdose – the 3 Cs?","Coma, convulsions, cardiotoxicity (plus respiratory depression, hyperpyrexia)."],["SSRI mechanism?","Selective allosteric inhibition of the serotonin transporter (SERT)."],["Common SSRI side effects?","Nausea, headache, anxiety/agitation, insomnia, sexual dysfunction; withdrawal syndrome."],["Which SSRIs inhibit which CYP?","Fluoxetine – CYP2D6 (and 3A4); paroxetine – 2D6; fluvoxamine – 1A2. Citalopram fewest interactions."],["Serotonin syndrome – symptoms and treatment?","Rigidity, myoclonus, hyperthermia, CV instability, seizures. Anticonvulsants, muscle relaxants, cyproheptadine."],["How does mirtazapine work?","Blocks presynaptic α2 receptors (↑ amine release) + 5-HT2 antagonist; sedating, weight gain."],["Special uses of SNRIs?","Neuropathic pain, fibromyalgia; duloxetine for painful diabetic neuropathy."],["Specific problems with venlafaxine?","Dose-dependent ↑ BP, severe withdrawal even after one missed dose, cardiotoxic in overdose."],["Bupropion: use and dangerous AE?","Depression + smoking cessation; seizures at high doses."],["MAOI + tyramine-rich food?","Hypertensive crisis."],["Which antidepressants are sedating and used as sleep aids?","Trazodone, nefazodone (5-HT2 antagonists), mirtazapine, TCAs."]],"quiz":[["A patient on phenelzine eats aged cheese and develops severe headache and BP 220/120. Mechanism?",["Serotonin syndrome","Tyramine-induced NA release","Anticholinergic crisis","Lithium toxicity"],1,"MAO-A normally breaks down dietary tyramine."],["Which antidepressant is used for smoking cessation?",["Fluoxetine","Bupropion","Mirtazapine","Amitriptyline"],1,"Can cause seizures at high doses."],["Wide QRS, seizures and coma after an overdose suggests:",["SSRI","TCA","Bupropion","Trazodone"],1,"3 Cs."],["Fluoxetine raises TCA levels by inhibiting:",["CYP1A2","CYP2D6","CYP3A4 only","MAO"],1,"Fluoxetine inhibits CYP2D6."],["Painful diabetic neuropathy – which antidepressant?",["Duloxetine","Phenelzine","Trazodone","Fluvoxamine"],0,"SNRI."]],"kc":[{"t":"Amine hypothesis","a":["Amine hypothesis","amine hypothesis"],"d":"Depression = functional deficit of noradrenaline and serotonin; mania = excess.","x":"Doesn't explain the weeks-long delay in effect."},{"t":"Serotonin syndrome","a":["Serotonin syndrome","serotonin syndrome"],"d":"Life-threatening excess 5-HT: rigidity, myoclonus, hyperthermia, autonomic instability, seizures.","x":"MAOI + SSRI, meperidine, dextromethorphan, MDMA; treat with cyproheptadine."},{"t":"Cheese reaction","a":["TYRAMINE","tyramine"],"d":"Hypertensive crisis when someone on an MAOI eats tyramine-rich food (aged cheese, cured meats, wine).","x":""},{"t":"Discontinuation syndrome","a":["withdrawal syndrome","Withdrawal symptoms"],"d":"Nausea, dizziness, anxiety, palpitations when SSRIs/venlafaxine are stopped abruptly.","x":"Taper doses."}],"ex":[["Nefazodone interactions","Via CYP3A4 inhibition, nefazodone enhances <b>carbamazepine, clozapine, statins and TCAs</b>. Nefazodone and duloxetine rarely cause hepatotoxicity."]]},{"id":31,"t":"Opioid Analgesics & Antagonists","p":92,"big":"Opioids act on <b>μ, δ, κ</b> receptors (G-protein coupled). <b>Postsynaptically:</b> open K⁺ channels → hyperpolarisation. <b>Presynaptically:</b> close Ca²⁺ channels → ↓ release of ACh, NA, 5-HT, glutamate, substance P.<br>Endogenous: endorphins (μ), enkephalins (δ), dynorphins (κ).<br>μ → respiratory depression; μ+κ → ↓ GI motility; κ → sedation; δ → tolerance.","tbl":[["Strong agonists: morphine, methadone, meperidine, fentanyl, levorphanol, heroin","Full μ agonists","Severe pain, anaesthesia, acute pulmonary oedema (morphine), dependence (methadone)","Respiratory depression, constipation, miosis, N/V, histamine release (morphine)","<b>①</b> Full agonists at μ receptors (G-protein coupled)<br><b>②</b> Presynaptically: close voltage-gated Ca²⁺ channels → ↓ release of glutamate and substance P from pain fibres<br><b>③</b> Postsynaptically: open K⁺ channels → hyperpolarisation of pain-transmitting neurons<br><b>④</b> Act in the spinal cord, brainstem and limbic system → block both sensation and emotional response to pain","Morphine for intra- and postoperative analgesia (IV, PCA, epidural/spinal); high-dose opioids in cardiac anaesthesia; premedication.","Analgesia"],["Moderate (partial) agonists: codeine, hydrocodone, oxycodone","Often with paracetamol/NSAIDs; CYP2D6","Moderate pain; codeine – cough","Codeine → morphine via CYP2D6 (genetic variability)","<b>①</b> Partial (moderate) agonists at μ receptors → lower ceiling of analgesia<br><b>②</b> Codeine is a prodrug: CYP2D6 demethylates it to morphine (variable effect between people)"],["Meperidine","→ normeperidine","","Seizures; NO miosis (antimuscarinic); no biliary spasm; with MAOI → hyperpyrexic coma; with SSRI → serotonin syndrome","<b>①</b> μ agonist, but also blocks muscarinic receptors → no miosis, no biliary spasm<br><b>②</b> Metabolised to normeperidine, which excites the CNS → seizures<br><b>③</b> Inhibits serotonin reuptake → serotonin syndrome with MAOIs/SSRIs","Small IV dose treats postoperative shivering; avoid with MAOIs and in renal failure (normeperidine seizures).","Postoperative care"],["Fentanyl / remifentanil","Fentanyl 1–2 h; transdermal 72 h; remifentanil esterases","Anaesthesia, epidural, chronic pain","","<b>①</b> Very potent, highly lipid-soluble μ agonist → fast onset, short action IV<br><b>②</b> Lipid solubility allows a skin patch (72 h)","Most-used intra-operative opioid (also epidural/spinal and transdermal); remifentanil infusion for rapidly titratable TIVA.","Analgesia"],["Buprenorphine","PARTIAL μ agonist, weak κ/δ antagonist; long (strong binding)","Withdrawal & replacement therapy","Precipitates withdrawal with full agonists; respiratory depression RESISTANT to naloxone","<b>①</b> Partial agonist at μ with very high affinity and slow dissociation<br><b>②</b> Binds so tightly that it displaces full agonists → can precipitate withdrawal; naloxone can't displace it<br><b>③</b> Weak antagonist at κ and δ; long action"],["Nalbuphine, pentazocine","κ agonist, weak μ antagonist","Analgesia (pentazocine ≈ codeine)","Dysphoria, hallucinations; less dependence","<b>①</b> Agonist at κ receptors → analgesia (spinal) and sedation/dysphoria<br><b>②</b> Weak antagonist at μ → ceiling on respiratory depression; can precipitate withdrawal"],["Dextromethorphan; diphenoxylate, loperamide","Antitussive; antidiarrhoeal","Cough; diarrhoea","High-dose dextromethorphan: hallucinations, seizures","<b>①</b> Dextromethorphan suppresses the cough centre (unknown mechanism)<br><b>②</b> Diphenoxylate and loperamide act on μ receptors in the gut wall → ↓ peristalsis; barely enter the brain"],["Naloxone (IV), nalmefene, naltrexone (long, oral)","Pure antagonists, high μ affinity","Overdose (naloxone); naltrexone – maintenance, alcohol craving","Precipitate withdrawal in dependent users","<b>①</b> Pure competitive antagonists with high μ affinity<br><b>②</b> Displace agonists from μ receptors → rapidly reverse respiratory depression and coma<br><b>③</b> Naloxone short (IV); naltrexone long-acting (oral)","Reverses postoperative opioid respiratory depression – titrate small IV doses (sudden full reversal → severe pain, hypertension, pulmonary oedema); may need repeating because it is short-acting.","Reversal"],["Alvimopan, methylnaltrexone","Peripheral antagonists (no BBB)","Opioid constipation","No loss of analgesia","<b>①</b> μ antagonists that don't cross the blood–brain barrier<br><b>②</b> Block opioid receptors in the gut only → relieve constipation while brain analgesia remains"]],"traps":["Overdose triad: PINPOINT PUPILS + COMA + RESPIRATORY DEPRESSION → naloxone + ventilation.","NO tolerance to MIOSIS and CONSTIPATION.","Morphine-6-glucuronide is active (= morphine); morphine-3-glucuronide is neuroexcitatory.","↑ PCO₂ → cerebral vasodilation → ↑ ICP → caution in head injury.","Biliary spasm (except meperidine), ↑ sphincter tone (urinary retention), ↓ uterine tone (prolonged labour).","Withdrawal: rhinorrhoea, lacrimation, piloerection, yawning, diarrhoea, muscle aches, anxiety.","Incomplete cross-tolerance → opioid rotation. NMDA antagonists (ketamine) block tolerance."],"mem":["Overdose: \"<b>Pin</b>, <b>Com</b>a, <b>Res</b>p\" – pinpoint, coma, respiration ↓.","Ligands: <b>β-Endorphin → μ</b> (the 'morphine' one) · <b>Enkephalin → δ</b> (\"<b>D</b>elta <b>E</b>nkephalin\") · <b>Dynorphin → κ</b> (\"<b>D</b>yno-<b>K</b>appa\").","<b>Mep</b>eridine is the odd one: no miosis, seizures (normeperidine), MAOI danger."],"cards":[["Ionic mechanism of opioids?","Postsynaptic: open K⁺ channels → hyperpolarisation. Presynaptic: close voltage-gated Ca²⁺ channels → ↓ transmitter release."],["Which receptor mediates respiratory depression? sedation? tolerance?","μ – respiratory depression; κ – sedation; δ – tolerance; μ+κ – ↓ GI peristalsis."],["Endogenous ligands for μ, δ, κ?","β-endorphin (μ), enkephalins (δ), dynorphins (κ)."],["Effects to which NO tolerance develops?","Miosis and constipation."],["Classic triad of opioid overdose and treatment?","Pinpoint pupils, coma, respiratory depression → naloxone + ventilatory support."],["Why does codeine efficacy vary between patients?","It's activated to morphine by CYP2D6, which shows genetic polymorphism."],["What's special about meperidine?","No miosis (antimuscarinic), no biliary spasm; normeperidine → seizures; with MAOIs → hyperpyrexic coma; with SSRIs → serotonin syndrome."],["Buprenorphine pharmacology?","Partial μ agonist, weak κ/δ antagonist; long acting; precipitates withdrawal in full-agonist users; resp. depression resistant to naloxone."],["Why are opioids relatively contraindicated in head injury?","Respiratory depression ↑ PCO₂ → cerebral vasodilation → ↑ intracranial pressure."],["Symptoms of opioid withdrawal?","Rhinorrhoea, lacrimation, piloerection, muscle aches, diarrhoea, yawning, anxiety, hostility."],["Uses of naltrexone?","Long-acting antagonist – blocks heroin in maintenance programmes; reduces alcohol craving."],["Peripheral opioid antagonists and use?","Alvimopan, methylnaltrexone – opioid-induced constipation without loss of analgesia or withdrawal."],["Opioid antidiarrhoeals and antitussives?","Diarrhoea: diphenoxylate, loperamide. Cough: codeine, dextromethorphan."]],"quiz":[["Unconscious patient, pinpoint pupils, RR 6/min. First drug:",["Flumazenil","Naloxone","Atropine","Physostigmine"],1,"Opioid overdose triad."],["Which opioid does NOT cause miosis?",["Morphine","Fentanyl","Meperidine","Codeine"],2,"Meperidine blocks muscarinic receptors."],["Respiratory depression resistant to naloxone is typical of:",["Morphine","Buprenorphine","Heroin","Methadone"],1,"Tight μ binding."],["Tolerance does NOT develop to:",["Analgesia","Euphoria","Constipation","Respiratory depression"],2,"Nor to miosis."],["Codeine's analgesic effect depends on:",["CYP3A4","CYP2D6","MAO","Esterases"],1,"Demethylated to morphine."]],"kc":[{"t":"Overdose triad","a":["Overdose triad","pinpoint pupils","PINPOINT PUPILS"],"d":"Pinpoint pupils + coma + respiratory depression.","x":"Naloxone + ventilation."},{"t":"Partial agonist ceiling","a":["ceiling","Partial (moderate) agonists","PARTIAL"],"d":"Partial agonists have a maximum effect – more drug doesn't give more analgesia or respiratory depression.","x":"Can block full agonists and precipitate withdrawal."},{"t":"Precipitated withdrawal","a":["precipitate withdrawal","Precipitate withdrawal","Antagonist-precipitated withdrawal","precipitated"],"d":"Sudden withdrawal when an antagonist or partial agonist is given to someone dependent on full agonists.","x":""},{"t":"Opioid rotation","a":["opioid rotation","Incomplete cross-tolerance"],"d":"Switching to another opioid in chronic pain because cross-tolerance is incomplete.","x":""},{"t":"Tolerance","a":["tolerance","Tolerance"],"d":"Need for higher doses for the same effect. Develops to analgesia, euphoria, respiratory depression – NOT to miosis or constipation.","x":""}],"ex":[["Opioid endocrine & skin effects","Morphine releases histamine → <b>flushing and itching</b>. Opioids ↑ <b>ADH and prolactin</b> but ↓ <b>LH</b>. Exaggerated response in <b>adrenal insufficiency and hypothyroidism</b>."],["First-pass opioids","<b>Morphine, hydromorphone and oxymorphone</b> undergo extensive first-pass metabolism → usually parenteral or sustained-release oral forms."]]},{"id":32,"t":"Drugs of Abuse","p":96,"big":"<b>Dopamine hypothesis of addiction:</b> mesolimbic dopamine = reward; excessive stimulation → compulsive use. Most addictive drugs enhance dopamine. Exceptions (no DA action): <b>PCP/ketamine</b> and classic hallucinogens (<b>LSD, mescaline, psilocybin</b> – not addictive).<br>Terminology: physiological dependence → <b>dependence</b>; psychological dependence → <b>addiction</b>.","tbl":[["Sedative-hypnotics (ethanol, barbiturates, BZDs; flunitrazepam, GHB, chloral hydrate)","GABA facilitation (+ DA)","Date-rape: flunitrazepam, GHB","Overdose → medullary depression (airway, ventilation; flumazenil for BZD). WITHDRAWAL CAN BE FATAL (seizures) → long-acting BZD + taper; clonidine/propranolol","<b>①</b> Facilitate GABA_A inhibition → relaxation, ↓ anxiety and inhibitions<br><b>②</b> Also disinhibit dopaminergic reward pathways<br><b>③</b> Chronic use → adaptation; stopping removes the brake → CNS overexcitation (withdrawal, seizures)"],["Opioids (heroin, morphine, oxycodone; meperidine/fentanyl in health workers)","μ, κ, δ; disinhibit DA","IV 'rush'","Overdose → naloxone. Withdrawal unpleasant but RARELY FATAL → methadone/buprenorphine taper","<b>①</b> Activate μ, κ, δ receptors<br><b>②</b> Inhibit GABA interneurons in the VTA → disinhibit dopamine neurons → reward<br><b>③</b> IV use = fast brain entry → 'rush' and rapid tolerance/addiction"],["Caffeine, nicotine","Stimulants","Smoking cessation: VARENICLINE (α4β2 partial agonist)","Withdrawal: caffeine – lethargy, headache; nicotine – anxiety. Nicotine overdose → respiratory paralysis","<b>①</b> Caffeine: blocks adenosine receptors → CNS stimulation<br><b>②</b> Nicotine: activates nicotinic receptors (incl. α4β2) → dopamine release<br><b>③</b> Varenicline is a partial α4β2 agonist → mild stimulation, blocks nicotine's reward"],["Amphetamines (dextroamphetamine, methamphetamine/'ice')","Inhibit amine transporters + release DA, NA, 5-HT","—","Psychosis like schizophrenia; overdose: agitation, hyperthermia, seizures, no antidote; necrotising arteritis. Withdrawal: depression, sleepiness, hunger","<b>①</b> Taken up into nerve endings, they inhibit amine transporters AND reverse them<br><b>②</b> Release dopamine, NA and 5-HT from vesicles into the synapse<br><b>③</b> Massive dopamine in reward pathways → euphoria; NA → sympathetic overdrive"],["MDMA (ecstasy), MDA, DOM","Selective on SERT","—","Hyperthermia, serotonin syndrome, seizures; loss of 5-HT neurons; weeks of depression","<b>①</b> Acts more selectively on the serotonin transporter → large 5-HT release<br><b>②</b> → empathy/intimacy, hyperthermia; serotonergic neurons are damaged with repeated use"],["Cocaine ('crack')","Blocks DA, NA, 5-HT transporters + local anaesthetic + vasoconstrictor","—","Death from arrhythmias, seizures, resp. depression; MI, stroke; NO antidote; severe depression on withdrawal","<b>①</b> Blocks dopamine, NA and 5-HT transporters (reuptake), without releasing them<br><b>②</b> Dopamine builds up → intense short euphoria<br><b>③</b> NA reuptake block → vasoconstriction, arrhythmias; Na⁺ channel block (local anaesthetic) → seizures"],["PCP, ketamine","NMDA antagonists (no DA)","—","PCP most dangerous: psychosis, horizontal + vertical NYSTAGMUS, HTN, seizures → parenteral BZDs","<b>①</b> Block the NMDA glutamate receptor channel<br><b>②</b> Disrupt cortical glutamate signalling → dissociation, psychosis; no direct dopamine action"],["LSD, mescaline, psilocybin (+ scopolamine)","Hallucinogens, no DA","—","Not addictive, tachyphylaxis; bad trips","<b>①</b> LSD, mescaline, psilocybin act mainly on serotonin (5-HT2) receptors in the cortex → altered perception<br><b>②</b> No action on dopamine reward → not addictive; rapid tachyphylaxis"],["Marijuana (THC, CBD, CBN)","Cannabinoid receptors (endogenous anandamide, 2-AG – retrograde messengers)","Dronabinol for nausea; ↓ IOP","Red conjunctivae, tachycardia, impaired judgement; mild withdrawal. Rimonabant = CB1 antagonist (obesity)","<b>①</b> THC activates cannabinoid CB1 receptors<br><b>②</b> Normally anandamide/2-AG are released from postsynaptic cells and travel backwards to inhibit presynaptic transmitter release (retrograde messengers)<br><b>③</b> THC mimics this → altered release of dopamine and other transmitters"],["Inhalants: N₂O, ether, chloroform; solvents (toluene, benzene, hexane)","—","Children/adolescents","Asphyxia (pure N₂O); liver, kidney, lung, nerve toxicity","<b>①</b> Volatile substances dissolve in neuronal membranes → CNS depression like anaesthetics<br><b>②</b> Pure N₂O displaces oxygen → asphyxia"]],"traps":["Sedative withdrawal can KILL (seizures); opioid withdrawal rarely does.","Withdrawal is worst with drugs with t½ < 24 h (ethanol, secobarbital).","Naloxone in a dependent (not overdosed) person → severe precipitated withdrawal.","Cocaine cardiotoxicity = NA reuptake block; seizures partly from local anaesthetic action."],"mem":["P<b>CP</b> → '<b>C</b>razy <b>P</b>upils': nystagmus in all directions.","Va<b>REN</b>icline = '<b>R</b>enounce' nicotine."],"cards":[["Dopamine hypothesis of addiction?","Mesolimbic dopamine mediates reward; excessive DA stimulation → pathological reinforcement → compulsive use."],["Which drugs of abuse do NOT act on dopamine pathways?","PCP, ketamine (NMDA antagonists), LSD, mescaline, psilocybin."],["Treatment of sedative-hypnotic withdrawal?","Long-acting sedative-hypnotic (diazepam, chlordiazepoxide) with gradual taper; clonidine or propranolol for sympathetic overactivity."],["Which withdrawal can be fatal – sedative or opioid?","Sedative-hypnotic withdrawal (seizures). Opioid withdrawal is rarely fatal."],["Treatment of opioid withdrawal/dependence?","Replace with methadone then taper; buprenorphine (partial μ agonist, t½ ~40 h)."],["What is varenicline?","Partial agonist at α4β2 nicotinic receptors – smoking cessation."],["Mechanism of amphetamines?","Inhibit CNS amine transporters and release DA, NA and 5-HT."],["How does MD
